# Reviewed (reader): 26 of 26 towns agree with 04-13 (median 1.1 px); sides differ from 04-13 for 12E 51N (now own, Zeitz corridor, correct on the map) and 12E 53N (now own by run 2, the open end of the Elbe line at Wittenberge: an artefact).
# Reviewed: 24 of 26 towns on 13 April's side; 12E 51N (own) is at the Zeitz tip beside the US 76, 12E 53N (own) an artefact of the line's open end at Wittenberge (the Elbe south of it is past the towns' spread). Runs 99-100 (the Coburg lozenge) and 19 (Celle) left unsure.
# Reviewed: `area: [470, 100, 4900, 2950]` (one box, so it spans both gaps) now takes in the Ruhr pocket's west side along the Rhine (Duisburg to Koln, with the Rhine up to about 565,2270) and the ticked Elbe line from Wittenberge to Tangermunde (about 4650-4900, 350-950): 12 stretches added, front 2,242 -> 2,435 km (about 193 km); ticks on the map's ticks on overlay crops 380,2200 and 4300,0. The Elbe line runs under the title block's lettering, so the title box now starts at x 4930 (was 4700); it still holds the lettering clear of the line. 12E 53N changed from own (US) to enemy, as the Elbe line closes the end it was an artefact of. Boxed: the Rhine north of Duisburg (no ticks) and a small hook of heavy ink in the bridgehead list's frame. Still missing: about 90 px of the Elbe line under the letters TO and SITUATION (about 4880-4900, 560-640).
