# Reader: title agrees with the catalogue (1200 HRS 23 NOVEMBER 1944; SECRET underlined; no report number).
# Reader: towns: --gcps-from 12ag-1944-11-22 accepted on the one run; 50 of 81 agree (offset about -28,-25 px, varying across the sheet since the scan is 6637x5976 against 11-22's 6646x6004); 31 placed through the transform (matches 4-44 px off: today's overprint). I piped that run's output through tail, so its offset and median line was lost; 50 comes from counting "matched" rows in the gcps CSV. Fit over all 81: rms 0.8 km (leave-one-out 0.9, worst Beauvais 2.1 km).
# Reader: dark: left at the default 70. At 70 the front runs whole (47 stretches, 0 unsure after the boxes); 80/90 not tried since nothing came out in pieces.
# Reader: boxes: 11-22's, shifted by a linear fit of the matched towns' offsets (about -28,-25). Each tried out in turn at 70. Kept: title (106 stretches, 54 unsure without it), legend (75, 26), Twenty One/Twelfth (52, 1), SW of Dombasle (50, 2), the 104 outline (49, 0: it adds a ticked stretch). New today (each the one unsure run, or two, it removes, all looked at: heavy boundary with no ticks): First/Third's last stretch beside the front north of Arlon (4012,3558 and 3994,3640), where it joins the front (4046,3485 and 4058,3492), Twelfth/Sixth along the canal near Nancy (4249,4733), Seventh/First end near Gerardmer (4293,5553), the Twenty One/Twelfth and Ninth/First ends at the Roer (3793,1688; 3900,1876), and the Canadian/British boundary at Turnhout-Mol (2963,1198; a short blue run on railway ticks, which with the shifted 11-22 box off turned Turnhout enemy). Dropped as catching nothing (shifted boxes landed off the line): NE of Eindhoven, Cuijk end, Ninth/First end (11-22 position), First/Third angle (11-22 position), Nancy canal (11-22 position), Gerardmer (11-22 position), Turnhout-Mol (11-22 position; replaced by the one above).
# Reader: flips: none. Walcheren, Beveland and Tholen arcs traced whole at 70, with the red ticks on the map's teeth inside every leg (crops 1450,640 800x300 and 1450,820 500x240).
# Reader: checked: (4465,5621), the front's southern end at La Bresse, no ticks counted; map's ticks west of it on a crop, continuing the ticked front.
# Reader: reaches on crops: Roer (3450,1500 650x600: continuous, ticked, the boundary ends boxed), Metz (3800,3950 700x450: line passes just east of the city, Metz behind it), Saverne/Sarrebourg salient (4300,4450 800x750: ticked, whole; the sheet still draws the front at Saverne with Strasbourg beyond the line, no advance to Strasbourg drawn), Saint-Die (4250,5100 450x350: the line runs through the town's ring), La Bresse/Gerardmer (4250,5350 500x400).
# Reader: front: 47 stretches (34 ticks, 12 line, 1 checked, 0 unsure); 881 km by my own sum of the GeoJSON legs; southmost 47.99N.
# Reader: sides: see the report: 81 of 81 as 11-22 once Turnhout's boundary is boxed. Strasbourg enemy (ring far east of the line, east of the Saverne salient; the map hasn't drawn its capture), Saint-Die enemy (line through the ring: weak), Ostend own (open-arc artefact, not chased).
# Reviewed: whole-sheet overlay looked at: one continuous ticked front from the Scheldt arcs (whole, ticks inside) to La Bresse; the Saverne salient is drawn with its head at Saverne and Strasbourg east of the line, so Strasbourg enemy is the sheet's own reading (the 2nd Armored entered the city that morning; the noon sheet does not draw it). The reader piped the --gcps-from run and lost its summary line; the towns file was written and the fit is 0.8 km rms. The Turnhout-Mol box rightly re-placed on the boundary (its railway ticks had turned Turnhout). 81 of 81 towns as 11-22; about 881 km.
