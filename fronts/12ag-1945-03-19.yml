# 12ag-1945-03-19: the sheet as read on its title, and the hand decisions its trace needed (tools/trace_front.py;
# fronts/README.md). The towns are <map>-gcps.csv, the symbols <map>-units.csv; the GeoJSON is generated.
# Reader: title as printed: "TO ACCOMPANY G-3 REPORT NO. 287 / SITUATION AS OF 191200 MAR. 1945", signed C. T. Schmidt for A. Franklin Kibler; the stamp (top right) reads "Date: 19 March 1945". It agrees with the catalogue (sitmaps.csv: ict21288, 1945-03-19, B11). Report 287 follows 286 on 18 March. The scan is 6632 x 5965 px (18 March 6596 x 5972).
# Reader: gcps_from 12ag-1945-03-18 (the 81 towns; sheet offset +24,+8; 79 of 81 agree, median 0.7 px; 2 placed through the transform: Zweibruecken 6 px off it, Pirmasens 5). Fit conic, rms 0.8 km, leave-one-out 0.9 km, worst 2.4 km (Baden-Baden; then Darmstadt 2.1, Turnhout 1.7, Epinal 1.5, Sedan 1.4).
# Reader: radius 5, dark default 70, as 15-18 March. Radius 4 and darker cutoffs not tried: at 5 the stretches come out whole where the map's line is whole and nothing merged that shouldn't (the Scheldt arcs, the Moselle's meanders, the Moder's zigzag, the Zweibruecken V all separate). The gaps left of 20 px or more are the map's own breaks (the Scheldt arcs of Walcheren, Noord-Beveland and Tholen) and the heavy black masses where boundaries and the West Wall band meet the front (Saarlautern, the Birkenfeld corridor's head).
# Reader: boxes: the 139 of 18 March copied, each moved by the median offset of its five nearest towns (+19 to +24 across, +3 to +7 down; not re-centred), then run once with no boxes (41 stretches, 0 unsure) and compared by geometry with the run with all 139 (38 stretches): the boxes took away exactly three stretches of five points each: the title block's lettering (about 3.12 E 52.02 N), the legend's FRONT LINE sample (about 2.79 E 48.09 N), and a 5-point run at 4441,3959 on the Saar (49.28 N 6.86 E) that is FRONT, between ticked runs on the Forbach road, caught by a stale box from 4 March (a loop on the outline of the 778 symbol near Perl, [4440,3958,4480,3998] as moved): that box is dropped (the 18 March box list had it, holding no front then). Two boxes added: (1) [4020,2500,4095,2555], a 5-point stub where the First/Third army boundary meets the West Wall band by Dahlem (run at 4055,2532, heavy black, no ticks; unboxed it put Gemuend, Marche and Verviers on the German side), and (2) [4757,3436,4790,3478], a 6-point hook (5 km) hanging south-west off the front along the heavy black army-group boundary where it ends by the 94 symbol at the head of the Birkenfeld corridor. Both looked (--look, overlay crops 3700,2250 and 4150,2850). 138 + 2 = 140 boxes. The map's list of divisions facing the bridgehead (lettering and symbols, x 4900 and east, y 1980 to 2260) is not front and needs no box; no other box holds a point of today's front (re-run and compared point for point: only the hook was removed by the second addition). 136 of the boxes hold no heavy ink today and are kept for the days after.
# Reader: flips: none. Checked: none. Nothing is unsure (37 runs: 32 ticks, 5 line, the line ones chained between ticked neighbours: run 8 by Grevenbroich, 15 by Prum, 20 the long run from the Birkenfeld corridor's head round to Kastel, 24 on the Saar at 6.86 E 49.28 N, 30 by Saarbruecken). Tick direction read on overlay crops of 800 px (Scheldt arcs, Maas, Wesel and the lower Rhine, Cologne and Bonn, the bridgehead, Andernach to Boppard, Bacharach to Bingen and Bad Kreuznach, the Moselle at Trarbach and Trier, the Birkenfeld corridor, the Saar, Zweibruecken, Haguenau) and on 4x looks at 5400,3130 (Bingen to the Bad Kreuznach loop), 5230,3330 and 5000,3300 (the Nahe and Kirn bends), 4850,4075 (the Zweibruecken V), 5150,4300 (the Moder) and 4772,3452 (the corridor head): the red ticks fall on the map's own, on the US side (west, south, and inside the Hunsrueck's salients), throughout.
# Reader: the front is 37 runs, about 1107 km (18 March: 39 runs, 1073 km, same measure). 221 km of today's lies more than 3 km from 18 March's, all of it in the Hunsrueck and Nahe (about 60 km, 50.0 N 7.5 to 8.0 E) and on the Saar and Palatinate (about 160 km, 49.0 to 49.5 N 7.0 to 8.0 E); the Scheldt arcs, Maas, Wesel, the lower Rhine to Cologne and Bonn and the Rhine from Remagen to Koblenz agree with 18 March. At Remagen the line follows the Rhine's west bank from Bonn to Koenigswinter (about 4690,2060), bends east round the bridgehead to about x 4850 (y 2100 to 2300), ticks inside (west), hooks back to the river at Linz (about 4790,2325) and runs on by Andernach and Neuwied to Koblenz and Boppard (5037,2723) as on 18 March; the BRIDGEHEAD N.-S. box and its list are not front. Rhine bank on past Bacharach to the heights above Bingen (about 5290,3100), then south-east to a point about 5465,3150 and back south-west in a wide loop round Bad Kreuznach and the 4(+) and 5 symbols to a bend about 5230,3340 (south of Bad Kreuznach; the loop is larger and farther east than 18 March's), west along the Nahe's south side by Kirn (the 11 symbol, bend about 5000,3320), then north-west up to 4880,3110 east of Kirchberg and Trarbach (the 89, 246, 79 and 256 symbols inside), where the line meets the Moselle (about 4700,3045) and follows it in its meanders by Bernkastel to Trier's side (about 4430,3295), then south-east to the head of the Birkenfeld corridor (the 94 and 12 symbols; tip about 4780,3430) and back south-west by Kastel (the 10 symbol) to Saarlautern (4324,3835 to 4372,3923). On the Saar the line runs east along the Forbach road past Saarbruecken's west side (the 63 and 45 symbols), turns in the V round the 3 near Zweibruecken (about 4780 to 4890, 4000 to 4090) and south by Bitche (the 100 and 71) and the Moder's zigzag (about 5100 to 5300, 4200 to 4400) to the Rhine at about 5540,4435 north-east of Haguenau, then down the Rhine's west bank past Strasbourg to the sheet's southern end. Zweibruecken, Kaiserslautern, Pirmasens and Landau stay on the German side; the Palatinate is not entered by the line, which stops at the West Wall's hatched band.
# Reader: sides (--sides on 18 and 19 March, all 81 towns): 80 unchanged; one changed: "Haguenau         enemy     by run 39 enemy at 5261,4868" (18 March) became "Haguenau         own (US)  by run 36 own at 5358,4732, run 34 own at 5235,4357, run 35 own at 5445,4453, run 33 own at 5178,4257" (the tool's lines). Haguenau has been behind the Seventh Army's line on the Moder since 22 January (fronts/README.md), and today's line (overlay crop 4900,4150) runs well north of its ring, which stands on the US side, so "own" agrees with the map; 18 March's "enemy" came from one run far to the south. Bad Godesberg and Koenigswinter read own as on 18 March (rings on the line, in the bridgehead). Neuwied stays on the German side (run 11 at 4871,2386). No town on land on the wrong side. Gemuend, Marche and Verviers read enemy while the stub at Dahlem was unboxed; boxed, they are own as on 18 March.
