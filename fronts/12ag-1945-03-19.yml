# Reviewed (8 Nov 2026): traced on the whole sheet from 18 March, radius 5. Overlay crop 4300,3000 looked at: the Bad Kreuznach loop is wider (the 4th Armored and 5th inside), the line runs along the Nahe and back to the Moselle; the Birkenfeld corridor has become a broad salient south-east past Kusel to above Kaiserslautern (the 12, 10 and 80 inside), and the line comes back by Ottweiler to the Saar; on to Saarbrücken, round the Zweibrücken V, down by Bitche and along the Moder to the Rhine, ticks on the US side throughout. A short break (about 60 px) is left where the army-group boundary crosses the line west of Ottweiler. The box dropped on the Saar (a stale 4 March box) held today's front. Haguenau, behind the Moder line, now reads own. About 1107 km.
