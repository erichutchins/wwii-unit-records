# Reader: title read 7 Nov 2026: report 257, situation as of 171200 Feb. 1945 (agrees with the catalogue, ict21258). Towns matched to 12ag-1945-02-16 in one run, accepted: offset +0,-16 px; 76 of 81 agree, median 0.8 px; 5 placed through the transform (Gemund, Nijmegen, Kleve, Trier, Prum). The 63 boxes of 02-16 were copied, each moved by the median offset of its five nearest towns (whole sheet -1,-15). Signature and title boxes end above/west of the Walcheren/Tholen arcs: the arcs TRACE (crop 200,500, ticked south), the signature's last line is caught by the moved box; nothing of the lettering traced. Helmond, Deurne, Turnhout, Moll and Twenty One/Twelfth boundaries stay boxed, no magenta on the sheet. Final: 39 stretches (28 ticks, 11 line), 0 unsure, 0 flips, 0 checks, about 845 km. --sides: 02-16 geojson backed up (scratchpad q-0217/02-16.geojson.bak, unchanged by the run); all 81 towns diffed with 02-16: the side of every town agrees (only the deciding run numbers and positions changed, since the runs merged). Gemund and Adenau enemy. Verviers enemy ("Verviers         enemy     by run 18 enemy at 3856,1911, run 20 own at 4083,2177, run 19 own at 4099,2087"), WRONG, Allied-held: the front's open west end at Aachen, as on 02-16. Haguenau enemy ("Haguenau         enemy     by run 36 enemy at 5273,4514"), WRONG, American-held: ring on the corner at the Moder, one run, weak. Prum own ("Prüm             own (US)  by run 25 own at 4071,2714"), German-held, wrong, weak: ring on a bend. Kleve own (weak), Veritable's ticks on the west.
# Reviewed: all 81 towns on 16 February's side. As on 16 February, Verviers enemy (WRONG; beyond the front's open west end at Aachen, "by run 18 enemy at 3856,1911, ..."), Haguenau enemy (WRONG; its ring on the Moder line's corner, "by run 36 enemy at 5273,4514") and Prüm own (weak; its ring on a bend): artefacts of where the rings sit, not wrong stretches. Gemünd, Adenau enemy; Kleve own. 39 stretches, about 845 km, unbroken from the Scheldt to the Rhine in Alsace, 0 unsure, no turns; the Scheldt arcs trace, ticked south; 16 February's boxes moved by the local offset of the nearest towns.
