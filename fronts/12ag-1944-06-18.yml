# Reader: title SITUATION - 2400 HRS 18 JUNE 1944 / HQ FUSAG / COPY NO. ___ (blank); "12 AG OUTLINE MAPS 1:500,000" top left margin; no report number. Agrees with the catalogue (ict21013, 1944-06-18). Legend (bottom left: U.S., BRITISH, ENEMY keys and a FRONT LINE sample) and SECRET (top right) left out with boxes as on 17 June, off the traced area; not re-looked at beyond the layout.
# Reader: towns matched to 12ag-1944-06-17, sheets offset +16,+0 px: 31 of 34 agree (median 0.5 px); 1.5W 49.5N (24 px off), 1W 49N (44 px) and 1.5W 48.5N (30 px) are placed through the transform. (06-17 was the first match asked; not refused.)
# Reader: drawn as the front: one ticked line, enemy on the left, ticks on the Allied side. The Orne pocket's east leg (top 3848,2183), round Colombelles, west along the Caen reach, down the V's east arm to its foot at the army boundary (2850,2702), NW up the Vire side past Carentan (round the 352 and 30/27 boxes), west by St-Sauveur (the 17 box over its top at 2025-2060) and then the SOUTH line of the Cotentin: NW to (1600,1930), west to x 1460, and SW down to the west coast south of Barneville (1283,2107), ticks on the NW side. Not a corridor closed at the west end as on 17 June: on 18 June the sheet draws two lines. The NORTH line, facing Cherbourg, runs from the coast at Barneville (1170,1927) up and east along y about 1785 (the bump at 1260,1785 by the 243 box), up round the 90 box's foot (1600,1780 to 1700,1745) and, past that box, round Valognes (1785,1687 to 1860,1590) and east to the top at (1982,1535), ticks inside (south and east). Between the two ends at the west coast (1170,1927 and 1283,2107) the sheet draws no line. Not the front: heavy untoothed boundaries and corps lines (x 2100 vertical through the 17 box, the diagonal from 1850,2133 up NE, the diagonal 2330,2700 to 2540,2400 and its continuation to 2650,2627, x about 2845 army boundary through the V's foot, x about 3275, x about 3540), the thin leader from the end of the line to the 3 box at 2000,1480, dashed British boundaries and boxes (Colombelles, Tilly, the V's inside), the grey railways and roads, arrows, unit boxes, circles, and the hatched 91, 265 (ELEMENTS) boxes ahead of the south line.
# Reader: METHOD: hand waypoints (`runs:`), radius 2, dark 110 as on 17 June, read by eye on gridded 3x crops of the bare scan (50 px grid, labelled every 100), 8 Nov 2026, on today's ink: crops from 1000,1700 500x450; 1200,1500 700x450; 1300,1750 700x450; 1350,1650 500x220 (the north line); 1650,1400 450x380 (Valognes); 1450,1880 500x330; 1850,2050 600x400; 1850,2120 300x180 at 4x; 2100,2120 300x220 at 4x; 2250,2300 450x450; 2650,2400 450x350; 2950,2350 450x200; 3350,2250 450x220; 3650,2100 300x380; 3730,2330 170x110 at 6x (Colombelles tip). Today's waypoints were not copied from 17 June's: the Orne east leg sits 15-20 px east of 17 June's, the Colombelles tip about 20 px higher (bottom y about 2396, 17 June 2422). THREE RUNS, in the order the enemy is on the left: run 1 (main line, 190 points ... top of the Orne pocket to the coast south of Barneville), run 2 (the north line from the Barneville coast east to the foot of the 90 box at 1700,1745), run 3 (from the box's top right, 1785,1687, to the top at 1982,1535). Run 2 ends and run 3 begins either side of the 90 box (division symbol 1707-1790 x 1683-1740 drawn over the line), about 100 px apart, more than the tool bridges. Run 1 is ONE run across the V's foot (the army boundary's heavy line 20 px wide and the lettering U.S. below it did not stop the trace, unlike 17 June, when two runs were needed), across the 352 box (the line runs along the box's top edge), the 30/27 blob and the 17 box.
# Reader: result: 3 runs, 190.2 km from the GeoJSON by the sum of its legs (17 June 179.3 km by the same: longer by the separate north line's run to the coast and the south line's, and the Orne leg). Overlay crops (1100,1750 800x400; 1650,1500 400x300; 1550,1900 800x350; 2000,2100 800x350; 2300,2250 800x300; 2750,2350 700x400; and 4x enlargements of 3050,2380 300x110, 2300,2460 200x110, 3750,2300 150x120) looked at: the trace follows the heavy line end to end, the red ticks fall on the map's teeth on the Allied side everywhere; no "no ink between". Untraced: the 100 px under the 90 box (between runs 2 and 3), and the ~190 px of open coast between the two lines' west ends (nothing drawn there). Small doubts: the little hump at x 3100-3125, y 2410-2450 on the Caen reach (the trace follows ink there, the ticks stand on it); at the 352 box (2330-2405, 2490-2513) the line merges with the box's top edge and the trace runs along it; where the line passes under the 17 box (2025-2060, 2194) likewise. Nothing flipped, nothing checked.
# Reader: sides: 17 June's GeoJSON backed up (cmp: unchanged after --sides); 34 towns diffed between 17 and 18 June: the same side for all 34. 0.5E 49.5N reads own and 1E 49.5N enemy as on 17 June: open-end artefact east of the Seine mouth. 1W 50N and 0.5W 50N read own, 2W 49.5N and 1.5W 49.5N enemy (at sea off the Cotentin, either way; 1W 50N and 0.5W 50N have two runs saying enemy against the Vire side's own, run 1 at 2641,2612, as on 17 June). 1W 49.5N own (by run 3 own and run 1 own).
# Reviewed (8 Nov 2026): hand waypoints at radius 2, dark 110. Overlay crop 1050,1450 looked at: VII Corps has reached the west coast and the sheet draws two lines, a south line from St-Sauveur to the coast below Barneville (ticked on its north-west side) and a north line facing Cherbourg from the Barneville coast east to Montebourg (ticked south and east), both on the ink, the open coast between their ends not drawn. The north line breaks for about 100 px under the 90 box, drawn over it. One run across the V's foot. WRONG side: 0.5E 49.5N reads own, the open-end artefact east of the Seine mouth. About 190 km.
