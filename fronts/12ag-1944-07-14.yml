# Reader: title SITUATION 2400 HRS 14 JULY 1944, "COPY NO." left blank, no report number, SECRET struck through at top right; no "HQ FUSAG" line is on this sheet's title block (15 July's was headed HQ FUSAG; 16 July's HQ Twelfth Army Group). Agrees with the catalogue's day (ict21039). The hour is 2400. Towns matched to 12ag-1944-07-15's: 34 of 34 agreed (median 0.6 px, sheet offset +0, +16 px), none placed through the transform.
# Reader: boxes re-tested by tracing with and without each. Title box: without it 76 stretches (55 unsure); SECRET box: without it 44 (23 unsure); legend box: without it 81 (48 unsure). All three kept. 07-15's First US/Second British boundary box (x 2820-2910, y 2010-2540) catches nothing here (same 24 stretches, same 3 unsure with and without), so it is dropped. Two new boxes for the boundaries' last stretches that trace as unsure stray stretches: the II Canadian/I corps boundary down to the front at Colombelles (x 3540-3645, y 2250-2378; without it 23 stretches, 2 unsure) and the stub where the First US/Second British boundary meets the front (x 2840-2882, y 2560-2595; without it 22, 1 unsure). With all five: 21 stretches (18 ticks, 3 line), 0 unsure. The boxes sit off the front: crops 3300,2100 and 2650,2400 show each ending where it meets the ticked line; no ticked stretch is boxed.
# Reader: 21 stretches, 0 unsure, 0 turned, 0 checked by hand, from the Passage de la Deroute coast (about 1322,2213) to the Orne mouth (about 3854,2176). Length about 160 km from the GeoJSON (summed great-circle), against 15 July's about 150 and 16 July's 142: I did not find why; the crop 1300,2100 shows the line continuous and ticked on the outer (north/west) side, with the wiggles at x 1800 and the loop round Saint-Lo (tongue x 2050-2100, y 2270-2440), and no run is doubled. Gaps over 20 px between stretches: my end-to-end check (a local fit from the gcps, a few px error) found none between joined stretches, and the one near-miss, about 59 px between run 9's start and run 15's end at about 3420,2533-3447,2585, is a fork where the crop 3250,2450 shows the map's line continuous. The tool does not print gaps.
# Reader: --sides run on 07-15 and today (07-15's GeoJSON backed up and unchanged by the run). 32 of 34 towns agree town by town. Two change from 07-15's enemy to own (US), both in the Bay of the Seine off the open east end at the Orne mouth. 07-15: '0.5E 49.5N       enemy     by run 2 enemy at 3815,2363, run 11 enemy at 3536,2455, run 16 own at 3424,2614, run 15 own at 3310,2583' -> 07-14: '0.5E 49.5N       own (US)  by run 2 enemy at 3817,2244, run 8 enemy at 3814,2368, run 12 own at 3768,2390, run 11 own at 3707,2383'; 07-15: '1E 49.5N         enemy     by run 2 enemy at 3815,2363, run 11 enemy at 3536,2455, run 16 enemy at 3424,2614, run 15 own at 3310,2583' -> 07-14: '1E 49.5N         own (US)  by run 2 enemy at 3817,2244, run 8 enemy at 3814,2368, run 12 own at 3768,2390, run 11 own at 3707,2383'. Reason: they are in the sea, off the line's end, two runs each way, so they read either way; today's front has the little runs 11 and 12 round Colombelles (own) among the four nearest and 07-15's had one more far run, so the tie falls the other way. No town on the wrong side. Others in the sea: 2W 50N and 1.5W 50N (Passage de la Deroute, west end) own, three runs to one (1.5W: run 3 enemy at 1830,2224, the loop's far side); 0.5W, 0E, 0.5E and 1E 50N own ('1E 50N own by run 2 enemy, run 8 enemy, run 12 own, run 11 own': two each way, reads either way, as on 07-15). Eleven own on 07-15, thirteen today (the two above), 21 enemy.
# Reviewed: situation at 2400 hrs 14 July; no HQ line read in the title crop (15 July's says HQ FUSAG). 21 stretches, about 160 km, the same extent as 15-17 July (1.66W to 0.19W) and no more doubled line than those days (about 15 km of near-parallel runs against 10-13): the line is more convoluted before Saint-Lô, the lengths falling 160, 151, 142, 136 km from 14 to 17 July. 0 unsure, no turns; the line loops round Saint-Lô. 32 of 34 towns on 15 July's side; 0.5E and 1E 49.5N read own and are WRONG (on land north of the Seine, German-held): they lie beyond the line's open east end at the Orne, two runs each way, an artefact. 15 July's boundary box caught nothing and is dropped; two added (the II CDN/I corps boundary to Colombelles, the First US/Second British boundary's stub at the front).
