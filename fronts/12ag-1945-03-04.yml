# Reader: 4 March, report 272; title read on the Library image (041200 MAR. 1945, signed C. T. Schmidt for A. Franklin Kibler); agrees with the catalogue.
# Reader: gcps_from 12ag-1945-03-03 (sheet offset +48,-24; 76 of 81 agree, median 1.2 px; 5 placed through the transform: Ostend, Trier, Prum, Zweibruecken, Pirmasens). 03-03s 115 boxes copied, each moved by the median offset of the five nearest towns (+48..+55, -25..-21; towns off the global offset by more than 6 px left out). Signature box right edge 1622, left of the Walcheren arc west end (about 1635).
# Reader: this sheet is a paler print (darkest 1% of the Walcheren arcs about 52 grey against 40 on 03-03), so dark: 90 (default 70 gave pieces: 78 stretches, 722 km; 75: 83, 742 km, 2 unsure; 80: 92, 786 km, 6 unsure; 85: 102, 807 km, 12 unsure; 90: 121, 846 km, 21 unsure, all before boxing strays). 90 traces the Walcheren, Beveland and Tholen arcs and the Hollandsch Diep/Volkerak whole, the red ticks on the map's own small ticks (south). 85 left a gap at the Volkerak. The Duiveland arc (about 2070-2200,830) is still not traced.
# Reader: boxes tested against a run with none (at 70): 28 stretches removed, all lettering, boundaries or hooks. At 90 a further 22 stretches were strays, each boxed on its own middle and each tested with and without: 14 far from the front (Antwerp/Belgium, northern France, Paris, the German side east of the Rhine and Koblenz), two hooks on symbol outlines (4315,1106; 3844,1186), the Roermond boundary's last stretch and stub (4094,1009; 3966,1074), the hooks at 4240,2415 (the 26 symbol), 4285,3014 (Wittlich) and 4519,3972 (Perl), and the Neuss/Grevenbroich boundary stretch (4205,1520-4262,1560). Box 106 widened to x 4205 (run 28 boundary, at 70). A first Neuss box that also took in 4310,1445 and 4271,1489 cut the ticked Rhine front (24 km) and was narrowed. At 90 the boundary's first 70 px (run at 4266,1499) is still traced with the loop; it only reads Grevenbroich and Julich own.
# Reader: flips: none needed. At dark 90 the Hollandsch Diep, Volkerak, Tholen arc and Zaltbommel (the five flips of the first reading) trace by their own ticks, red ticks on the map's south ticks (overlay crop 2250,450). Two flips, on the Siegfried band south of Heimbach: runs at 4116,2476 and 4134,2424, ticks lost in the black mass and drawn east; turned to put the US side (divisions 69, 106) west, as at dark 70. Three checked: the Neuss piece 4321,1380, the hook at the band's head 4171,2399 and the Moselle gap piece 4278,3636, red ticks west. 0 unsure.
# Reader: sides against 03-03: 79 of 81 agree. Gemund enemy -> own: 03-03 'Gemünd           enemy     by run 29 enemy at 4121,2258'; today 'Gemünd           own (US)  by run 47 own at 4195,2228'. The heavy line passes over the ring (4177,2225), 18 px east of it, ticks west (weak test; expected enemy, unchanged by dark). Trier enemy -> own: 03-03 'Trier            enemy'; today 'Trier            own (US)  by run 61 own at 4370,3309, run 60 own at 4341,3254, run 62 own at 4385,3372' (American since 2 March; its ring was on the line on 03-03). Prum, Julich, Bitburg, Grevenbroich, Strasbourg, Kleve own; Adenau, Offenburg enemy; Haguenau enemy (weak). Rhine above Strasbourg: red ticks west of the heavy line, Siegfried hatching east. Length 763 km (03-03: 900 km): the Wesel pocket closed, the Rhine straight; and the Duiveland arc and the Neuss gap (about 4320,1365-1435, 70 px, the heavy line untraced between a ticked piece and the loop) missing.
