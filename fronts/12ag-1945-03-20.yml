# 12ag-1945-03-20: the sheet as read on its title, and the hand decisions its trace needed (tools/trace_front.py;
# fronts/README.md). The towns are <map>-gcps.csv, the symbols <map>-units.csv; the GeoJSON is generated.
# Reader: title as printed: "TO ACCOMPANY G-3 REPORT NO. 288 / SITUATION AS OF 201200 MAR. 1945", signed C. T. Schmidt for A. Franklin Kibler; the stamp (top right) reads "Date: 20 March 1945". It agrees with the catalogue (sitmaps.csv: ict21289, 1945-03-20, B11). Report 288 follows 287 on 19 March and precedes 289 on 21 March. The scan is 6630 x 5984 px (19 March 6632 x 5965).
# Reader: gcps_from 12ag-1945-03-19 (the 81 towns; sheet offset +16,+8; 74 of 81 agree, median 0.8 px; 7 placed through the transform: Daaden 6 px off it, Kleve 4, Siegen 6, Trier 8, Pruem 6, Zweibruecken 10, Pirmasens 10). Fit conic, rms 0.8 km, leave-one-out 0.9 km, worst 2.3 km (Baden-Baden; then Darmstadt 2.2, Turnhout 1.7, Epinal 1.4, Sedan 1.4).
# Reader: radius 5, dark default 70, as 15-19 March. Radius 4 and darker cutoffs not tried: at 5 the stretches come out whole where the map's line is whole and nothing merged that shouldn't (the Scheldt arcs, the Moselle's meanders, the Moder's zigzag, the Zweibruecken V and the pocket's outline all separate). The gaps of 20 px or more are the map's own breaks (the Scheldt arcs of Walcheren, Noord-Beveland and Tholen) and the heavy black crossings of boundaries (Saarlautern; the pocket's south-west corner).
# Reader: boxes: the 140 of 19 March copied, each moved by the median offset of its five nearest towns (+11 to +13 across, +10 to +11 down; not re-centred), then run once with no boxes (58 stretches, 9 unsure) and compared by geometry with the run with all 140 (53 stretches): the boxes took away exactly five stretches, none of them front: the Twenty One/Twelfth boundary from Aachen toward Dueren (a ticks run of 34 points at about 3912,1939, held by three boxes), its stretch west of Liege (two unsure runs, about 3607,2020 and 3500,2041), the legend's FRONT LINE sample (about 870,5512) and 3 of the 4 points of a short hook at Lauterbourg (about 5622,4348, the 5 March box). No box holds a point of today's ticked front, so none is dropped (136 or so hold no heavy ink today and are kept for the days after; the title block's lettering made no stretch on this sheet). The 53 stretches still had six unsure runs, all heavy black boundaries with no map ticks (looked, --look 5226,3262, 5330,3160 and overlay crops 3900,1400, 4400,3300, 4200,3750): the Twenty One/Twelfth boundary's last stretch from Dueren to the front at Worringen (two runs, about 4263,1675 and 4182,1740), the Third/Seventh army boundary from Bingen down past Bad Kreuznach and west along the Nahe (run of 43 points, middle 5226,3262) with its end at the REMNANTS pocket's corner (middle 4906,3360), and the Twelfth/Sixth boundary from Birkenfeld toward Saarlautern (two runs, 4640,3704 and 4521,3807, the last meeting the front west of Ottweiler). Five boxes added for them (each holds the run's middle only, off the front's own blue), and two more for 5- to 8-point hooks hanging off the front along a boundary where it crosses it: Worringen (run 11, 4385,1585) and the head of the pocket's southern side (run 23, 4783,3501; the 19 March box there, moved by +11,+10, is about 40 px too far north to hold it). 140 + 7 = 147 boxes. Re-run and compared point for point: each addition took away exactly its run and nothing else. The map's list of divisions facing the bridgehead (lettering and symbols, x 4900 and east, y 1980 to 2260) is not front and needs no box.
# Reader: flips: none. Checked: none. Nothing is unsure (45 runs: 37 ticks, 8 line, the line ones chained between ticked neighbours). Tick direction read on overlay crops of 800 px (Scheldt arcs, Maas and Waal, Wesel and the lower Rhine, Cologne, Bonn and Remagen, Andernach to Boppard, Boppard to Bingen, Bingen and the Palatinate loop, the Moselle and the REMNANTS pocket, Birkenfeld to Saarlautern, the Saar and Zweibruecken, the Moder, Lauterbourg to Strasbourg) and on 4x looks at 4380,1590, 4800,3480, 5400,3095, 5590,3290 and 5250,3705: the red ticks fall on the map's own, on the US side (west and south on the Rhine, inside the Palatinate loop, outside the pocket), throughout. The boundaries' diagonals carry no ticks of their own.
# Reader: the front is 45 runs, about 1147 km (19 March: 37 runs, 1107 km; 21 March, on base B12: 34 runs, 1188 km, same measure). About 207 km of today's lies more than 3 km from 19 March's (175 km of 19 March's from today's): the Remagen bridgehead, the Palatinate and the Saar (the Bad Kreuznach loop and the salient toward Kaiserslautern), the pocket, and the Lauter. The Scheldt arcs of Walcheren, Noord-Beveland and Tholen (three arcs, gaps between), the Maas and Waal, Wesel and the lower Rhine, Cologne and the Rhine to Bonn agree with 19 March. At Remagen the line follows the Rhine's west bank from Bonn to Koenigswinter (about 4650,2040), then east round the bridgehead (about 4690 to 4770 along y 2075 to 2095) to its east side at about x 4870 to 4890 (y 2150 to 2330), ticks inside (west), and runs south-east by Neuwied (on the German side, ring on the line) to Andernach and Koblenz (5090,2635) and Boppard as before; the BRIDGEHEAD N.-S. box and its list are not front. Rhine bank on past Bacharach to Bingen (about 5350,3085), where the Rhine's ink and the front part: the front turns east along the heights above the Nahe's mouth by Algesheim, over to about 5600,3100 and 5600,3250, ticked inside, round the 90, 5 and 4 symbols (the loop is closed by the Rhine side at about 5290,3300 and back south by 5330,3550), then runs south-west in the Palatinate salient: south along x 5000 to 5330, 3550 to 3700 on the Lauterecken side (the 11, 12 and 10 symbols inside), along Kaiserslautern's northern edge (ring on the line, by about 5240,3700), and west again by Landstuhl's north and Homburg's to Neunkirchen and Ottweiler's south (the 80, 26 and 416 near; 4850,3760 to 4556,3830) and down to the Saar at Saarlautern (4324,3835 to 4372,3923). West of Bingen the Nahe is no longer the line: the heavy black Third/Seventh army boundary follows it and is boxed out. The Hunsrueck's REMNANTS pocket (the 246, 9, 79 and 256 hatched boxes, the enemy's) is a closed outline from the Moselle by Bernkastel and Trarbach round Kirchberg to Idar-Oberstein and back west by Birkenfeld, ticked outward (the 89 (-) just outside, on its east edge), joined to the Moselle line by the meanders at Trier's side (about 4480,3245). On the Saar the line runs east along the Forbach road past Saarbruecken (the 63 and 45 symbols), round the V by Zweibruecken (4770 to 4920, 4010 to 4075, Zweibruecken and Pirmasens on the German side), by Bitche and the Moder's zigzag (5100 to 5300, 4200 to 4400) to the Lauter at about 5620,4335, at the Rhine by Lauterbourg and Wissembourg (Landau on the German side), and down the Rhine's west bank past Strasbourg to the sheet's southern end. The break of about 60 px west of Ottweiler, where the Twelfth/Sixth boundary crosses the line, is closed today: the line (runs 26 to 29) is whole there at about 4530,3850, and the boundary's two stretches to it are boxed out.
# Reader: sides (--sides on 19 and 20 March, all 81 towns): none changed. Kaiserslautern reads enemy as on 19 March, "by run 23 enemy at 5037,3729, run 22 own at 5221,3604": its ring stands on the line, which passes along its north edge, and the enemy's 2 MTN box is south of it, so the map draws the town on the German side at the hour (not a wrong stretch). Zweibruecken, Pirmasens and Landau stay enemy; Haguenau own; Neuwied enemy (run 12 at 4888,2322); Bad Godesberg and Koenigswinter own as before. No town on land on the wrong side.
