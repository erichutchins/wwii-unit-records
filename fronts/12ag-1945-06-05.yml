# Reader: the only ticks on the sheet are in Carinthia (overlay crop 4050,5550): one closed outline running south from the Twelfth/Fifteenth boundary at Heiligenblut (about 4410,5640) in a band to about 4680,5900 (the Moelltal) and west to a loop beside Lienz (about 4180,5860), black outline with black ticks on its inner side, as on 6 June. The sheet does not say what it marks. Boxed (6 June's first box moved, with the area) and not traced: from the first sheet with no ticked line of contact, the day is an empty front (owner's decision, 8 Nov 2026).
# Reader: towns from 12ag-1945-06-06: sheet offset about +1,+7 px (dx -4..+6, dy +3..+12 across the sheet); 33 of 58 agree, 25 placed through the transform (4 to 9 px off: the day's overprint); conic fit rms 0.9 km, worst 2.4 km (15E 47N). 6 June's 71 boxes were moved to this sheet by a quadratic fit of 6 June's towns to today's (58 towns, rms 1.1 px, worst 3.3 px), and the area likewise ([4059, 5691, 4808, 6043] to [4064, 5695, 4813, 6048]). Checked against a run with no boxes at all (330 runs, 28 ticked-looking, 263 unsure): all but 2 run middles fall inside a moved box (my own estimate of the middles, by a fit of the towns), and with the moved boxes alone a run still left 6 chains (1 ticked-looking, 5 unsure): the boundary by the Brunswick/Anhalt state outline (mid 3141,1233), the Mulde chain from Zwickau to Grimma (the one counted as ticked; mid about 4143,2200), Karlsbad (4237,2920), Budweis (5154,3907), the Inn by Wegscheid (4633,4344) and the Tauern (4910,5704): each looked at 4x, bare or border, and boxed. 25 of the 77 moved boxes hold no run middle by that estimate (6 June's separate boxes for border stubs, now covered by others); kept, since they cost nothing and a different print could bring them back.
