# Reader: title read 7 Nov 2026: 1200 hrs 26 November 1944, no report number; agrees with the catalogue (ict21175, 1944-11-26). Towns matched to 11-28 (offset 0,0 px; 11-28's towns, themselves matched to 11-29 and so on to the base's by-eye ones): 60 of 81 agree, median 0.5 px, 21 placed through the transform (Saint-Dié 52 px, Jülich 27, Pirmasens 24, Landau 25, Offenburg 25, Strasbourg 24 ...). Same offset, so 11-28's boxes were not shifted. Title box reset to this sheet's lettering (SECRET starts y ~304, GROUP ends y ~716). Each of 11-28's other eleven boxes tried alone: dropped the Twelfth/Sixth along-canal box 4260-4560 x 4556-4776 and the Ninth/First stub 3368-3528 x 1984-2094, the First/Third's two boxes (3218-3968 and 3950-4005) as each catches nothing here; the canal boxes 4260-4560 and 3984-4384 are a redundant pair (with both out, run 38 at 4270,4712 comes through and Toul reads enemy), the second kept. Three boxes for boundary fragments left unsure (3915,1865; 3621,1977; 3445,5215), each looked at. One flip, the Walcheren arc's west hook (1574,944). One checked, the corner piece at 4540,4468. The Saar and Vosges front traced here (no gap on the overlay sheet).
# Reviewed: all 81 towns on 28 November's side (27 November is held: its light-printed Saar and Vosges front did not trace). Here the Saar and Vosges front traces whole from Faulquemont to the sheet's south end. Jülich, Haguenau, Kleve, Landau, Darmstadt enemy; Strasbourg own (one run, weak). 46 stretches, about 1009 km (28 Nov 960; not run down), 0 unsure. One flip, the Walcheren arc's west hook (the map's ticks on its concave side, at 5x); one corner beside the 26 symbol checked. Of two overlapping canal boxes, either alone suffices (both out put Toul enemy); one kept. Three boundary fragments boxed (Ninth/First near Namur and by the 30 and 104 symbols, the Twelfth/Sixth junction).
