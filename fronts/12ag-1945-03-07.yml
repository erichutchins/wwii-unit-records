# 12ag-1945-03-07: the sheet as read on its title, and the hand decisions its trace needed (tools/trace_front.py;
# fronts/README.md). The towns are <map>-gcps.csv, the symbols <map>-units.csv; the GeoJSON is generated.
# Reader: the earlier reading of this day (5-6 Nov 2026, for the Remagen engagement only) is replaced. It took about 20 towns by eye round Remagen (gcps_read) and drew the front as one run of hand waypoints (runs:) from Grevenbroich's latitude down the Rhine past Cologne to Remagen and back south through the Eifel to about 50.05 N, 266 km. This reading traces the whole sheet by the stretch method, as 1-6 March.
# Reader: gcps_from 12ag-1945-03-06 (sheet offset +8,-16; 80 of 81 agree, median 0.9 px; 1 placed through the transform: Munster, 5 px off). Fit conic, rms 0.9 km, leave-one-out 0.9 km, worst 2.2 km (Baden-Baden). Against the old 20 hand-read rings the new towns stand 4-9 px away (median 6 px): a steady shift of the ring centres, no town misplaced.
# Reader: the 143 boxes of 03-06 copied, each moved by the median offset of its five nearest towns (+8..+12, -13..-16 px). Added four boxes for strays that today's darker Rhine blue made (none on 6 March): the First Cdn/Ninth U.S. boundary pointer at Breyell (3850,1195,3930,1275) and three bits of the Rhine's dark blue at St. Goar, Mainz-Wiesbaden and Oppenheim (5100,2700,5210,2790; 5530,2870,5745,3060; 5730,3170,5830,3280). Tested the boxes near the front (63, 129, 139, 11, 141 of 03-06's list: Rhine ink and symbol hooks at Wesel, Lauterbourg, Pruem, Bonn) without: the front is the same 100 stretches either way, so all kept; none holds today's ticked front.
# Reader: dark: default 70 kept. Walcheren, Beveland, Tholen and the Hollandsch Diep/Volkerak arcs trace whole at 70 with their own ticks. At 80 the trace had 138 stretches with 23 unsure (strays on the Rhine blue and the legend); at 90, 372 with 214 unsure.
# Reader: flips: eight, the Rhine front from Rhinau to Neuf-Brisach (stretches 93-100 of the first trace, one chain): the tool's votes turned it the wrong way (red ticks on the east, enemy side, over the Rhine and the enemy band's hatching), the map's own ticks stand on the heavy line's west side; with them Colmar and Saint-Die read own, as on 6 March (unflipped they read enemy, the sides check's only change). Checked: one, the curl at Rees (4018,687), no ticks, joins stretches 4 and 8 the way they run. 03-05's and 03-06's other flips and checks not needed.
# Reader: what is drawn at Remagen (sheet as of 071200): the front reaches the Rhine's west bank in a pointed salient whose tip is at about 4685,2215 (about 7.13 E, 50.58 N), about 7 km short of the Rhine, west of Remagen; no bridgehead and no front east of the Rhine is drawn (the bridge was taken at 1550, after the sheet's hour). South of the tip the front falls back west and on south through the Eifel, round Third Army's narrow salient to Kaisersesch (tip about 4660,2655), which has not reached the Rhine at Andernach.
# Reader: sides (81 towns against 03-06's): all 81 the same side, none changed; no town on the wrong side. Front 100 stretches (69 by ticks, 22 by their line, 8 by hand, 1 checked by eye, 0 unsure), 840 km (03-06: 70 stretches, 817 km by the same count; the Rhine from Neuss past Cologne to Remagen and the Eifel salient add the length).
