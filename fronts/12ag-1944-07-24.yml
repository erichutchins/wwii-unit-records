# Reviewed: a 1200 hrs sheet (as_of 1200 HRS 24 JULY 1944; the 25th was 2400 hrs). No stretch turned; one checked (2411,2586). Every ticked stretch's red ticks looked at 4x against the hatching from the west coast (1345,2320) to the Orne mouth (3771,2194): all on the hatching (north and west, the US and British side).
# Reviewed: excludes taken from 12ag-1944-07-25 and re-tested here at radius 3 (each removed in turn, 35 stretches kept either way). Kept, moved: the title block (box widened left to x 900: this sheet's SITUATION lettering starts at x 1053 and traced as magenta runs 1-9) and the legend (07-25's box, now x 1100-2500, y 4100-5100: the legend ink stands at y 4200-4800 and the FRONT LINE sample near 4950; without it, 78 more stretches). Dropped as catching nothing today: SECRET's box (the strike-through sits inside the title box), and all 17 symbol and flag stroke boxes (the symbols were not traced as front with them removed). No box cuts the front.
