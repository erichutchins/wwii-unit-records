# Reader: title agrees with the catalogue (1200 HRS 6 NOVEMBER 1944, no report number, SECRET struck through).
# Reader: towns: --gcps-from 12ag-1944-11-05 accepted (one run): offset +16,+8 against 11-05, 54 of 81 agree, median 0.7 px, 27 placed through the transform (Julich, Altenkirchen, Gemund, Saint-Die, Colmar, Kleve, Bocholt, Munster, Bitburg, Prum 61-69 px; Trier 48; Zweibrucken 41, Pirmasens 39, Landau 36, Karlsruhe 35; Bergen op Zoom 30; Chaumont 17, Epinal 12, Toul 6, Tournai, Mechelen, Turnhout, Breda, Eindhoven, 's-Hertogenbosch, Nijmegen, Arnhem 6-9). Weaker than 11-05's own 72 of 81 against towns-B11.csv (the match was not refused, so towns-B11.csv was not tried).
# Reader: boxes: 11-05's title, legend and two boundary ends shifted +16,+8, each tried alone (176 stretches with none; title 138, legend 154, each boundary box 175). The title box had to start at x 420, not 468: the S of SITUATION (x ~450) traced magenta. Without any boundary box the Twenty One/Twelfth boundary, heavy black with no ticks from Louvain to Tournai, traced in five stretches with red ticks on the railways beside it, the Twelfth/Sixth one toward Sarrebourg in one, the Seventh/First French's in two (one just short of the front at x ~4260-4400, y ~5550-5605); each boxed alone, each took one run off. With all boxes: 106 runs, 0 unsure. The 11-05 count was 24 runs; today the same front comes out in 106 shorter runs (overlay continuous, 0 unsure, no town differs), and its summed length is 731 km against 784 for 11-05 by the same count: the difference is gaps between the short runs, not a missing reach (same latitude and longitude extent).
# Reader: flips: none. Beveland north shore, its west-end hook and Walcheren's west and east arcs read on enlarged crops (1400,760 800x450 and 2000,700 800x400): the red ticks fall against the map's (south of the north shore, inside the hook, outside on Walcheren's west arc). Walcheren's assault is under way; its ring is still drawn. The dashed reach of the Beveland/Tholen north shore (x ~2000-2100, y ~890-900) does not trace: left untraced, as on 11-05.
# Reader: sides: 81 of 81 as on 11-05 (diffed town by town on the tool's side column) once the last boundary box was in; Arnhem "Arnhem           enemy     by run 1 enemy at 3600,449", Metz "Metz             enemy     by run 82 enemy at 3844,4136, run 83 enemy at 3809,4210, run 84 enemy at 3812,4249". Before the box at x 4255-4395, y 5545-5610, Epinal changed: "Epinal           enemy     by run 106 enemy at 4331,5568, run 103 own at 4424,5427, run 104 own at 4414,5482, run 105 own at 4413,5517" (11-05: "Epinal           own (US)  by run 22 own at 4414,5412, run 23 own at 4414,5482, run 24 own at 4462,5598, run 21 own at 4465,5354"). Run 106 was the Seventh/First boundary's last stretch (no map ticks), not the front; boxed, Epinal reads own (US) by runs 103-106.
# Reviewed: 54 of 81 towns matched to 5 November, the rest placed through the transform; the fit over all 81 is 0.7 km rms. All 81 towns on 5 November's side; Arnhem and Metz enemy; Épinal own once the Seventh/First French boundary's last stretch to the front (heavy, no ticks) was boxed. 106 stretches, about 731 km (5 Nov 784): the same front in many more short runs, the overlay continuous, the extent the same; 0 unsure, no flips; the Beveland/Tholen shore's dashed reach untraced as on 5 November; Walcheren's ring still drawn. Twelve boxes: title, legend, and the Twenty One/Twelfth, Twelfth/Sixth and Seventh/First French boundaries (railway ticks beside the Twenty One/Twelfth had made it read ticked).
