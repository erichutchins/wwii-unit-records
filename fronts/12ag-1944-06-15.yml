# Reader: title SITUATION - 2400 HRS 15 JUNE 1944 / HQ FUSAG / COPY No. ___ (blank); "12 AG OUTLINE MAPS 1:500,000" top left margin; no report number; SECRET struck through at the top right. Agrees with the catalogue (ict21010, 1944-06-15). Legend (bottom left): U.S., BRITISH and ENEMY boxes and a FRONT LINE sample (heavy toothed line); the box [1300,4750,2100,5300] is left out.
# Reader: towns matched to 12ag-1944-06-14, sheets offset +0,-8 px: 33 of 34 agree (median 0.6 px); 1.5W 48.5N (15 px off) is placed through the transform.
# Reader: drawn as the front: one ticked line, enemy on the left, as on 14 June: Orne pocket's east leg (top now 3850,2170, 25 px higher and 25 px east of 14 June), round Colombelles, west along the Caen reach (Tilly dip), SW down the V's east side to the foot (2890,2707), NW up the Vire side to the Carentan hook, west along the south of Utah, north up its west side and east along the top to (1995,1582). The Utah west side has pushed out: x about 1677 at y 1850 and 1675 at 1900 (1725-1750 on 14 June), with a notch at (1677-1720, 1930-1945) and the south reach lower-left of 14 June's by 40 px at x 1750. Not the front: the heavy untoothed boundaries and corps lines with their dot ends (x about 2900 down to the foot, 3280, 3500, the diagonals through the bridgehead), the dashed British boundaries and arrows, unit boxes, circles. No other change drawn: V, Tilly and Caen reaches as on 14 June.
# Reader: METHOD: hand waypoints (`runs:`), 119 points read by eye on gridded 2x crops (50 px grid labelled every 100; crops from 1450,1550 600x700 for Utah; 1900,2050 700x600; 2550,2200 700x600; 3200,2150 700x450; 3600,1950 600x500), 7 Nov 2026, all afresh on today's ink (the sheet sits 8 px higher than 14 June). RADIUS 4, dark 110; no "no ink between".
# Reader: result: 1 run, 158.3 km from the GeoJSON by the sum of its legs (14 June 148.8 km by the same sum: longer by the pushed-out Utah west side). Overlay crops (1600,1500 1000x750; 2400,2100 1000x700; 3200,2100 750x450) looked at: the trace follows the heavy line end to end, the red ticks fall on the map's teeth on the Allied side; nothing off the ink or untraced; nothing flipped.
# Reader: sides: 14 June's GeoJSON backed up (cmp: unchanged after --sides); 34 towns diffed, one changes: 1.5W 50N (14 June `1.5W 50N         enemy     by run 1 enemy at 2558,2597`; today `1.5W 50N         own (US)  by run 1 own at 2584,2601`). Reason: the town lies in the Channel off the north Cotentin, beyond the line's open end at Utah's top, and the reference point is the V's foot; nothing drawn near it changed. Cherbourg and the north Cotentin are German-held on 15 June, so enemy is right and own is the open-end artefact. 0.5E 49.5N reads own and 1E 49.5N enemy, as on 14 June: open-end artefact east of the Seine mouth. All other 32 agree.
# Reviewed: hand waypoints at radius 4, dark 110; overlay crop 1600,1550 looked at: the Utah lodgement's pushed-out west side (VII Corps' drive west) and south reach follow the ink with the ticks inside on the map's teeth; the rest as on the reader's crops. 1.5W 50N own is the open-end test (German-held north Cotentin). WRONG side: 0.5E 49.5N reads own, the open-end artefact east of the Seine mouth. About 158 km.
