# Reader: title SITUATION - 2400 HRS 14 JUNE 1944 / HQ FUSAG / COPY No. ___ (blank); "12 AG OUTLINE MAPS 1:500,000" top left margin; no report number; SECRET struck through at the top right. Agrees with the catalogue (ict21009, 1944-06-14). Legend (bottom left, read on overview-sheet): U.S., BRITISH and ENEMY boxes and a FRONT LINE sample (a heavy toothed line); the box [1300,4750,2100,5300] is left out.
# Reader: towns matched to 12ag-1944-06-13, sheets offset -16,+0 px: 32 of 34 agree (median 1.3 px); 1.5W 49.5N (42 px) and 1.5W 48.5N (39 px) are placed through the transform.
# Reader: drawn as the front: one ticked line, enemy on the left: from the top of the Orne pocket's east leg (3825,2190) down the leg, round Colombelles, west along the Caen reach (Tilly dip at about 3000,2482, a step up to 2950,2452), SW down the V's east side to the foot (2815,2715), NW up the Vire side to the Carentan hook (2250,2190), west along the south of Utah, north up its west side (x about 1720 at y 1950) and east along the top to (1990,1583). Not the front: the heavy untoothed boundaries (x about 2870 down to the foot, 3280, 3500, the diagonal VII/V corps line through Carentan, thin), the dashed British boundaries and arrows, unit boxes, circles and the thin black corps diagonal. No Villers-Bocage withdrawal and no Caumont change is drawn: the V is as on 13 June, its foot a little further east (2815,2715 against 2700,2700); Utah's south reach lies a little lower than on 13 June.
# Reader: METHOD: hand waypoints (`runs:`), 95 points read by eye on 2x crops with a 50 px grid labelled every 100 (crops from 1700,1550 700x650; 1900,2050 700x600; 2550,2200 700x600; 3200,2150 700x450; 3600,1950 600x500; 1750,1350 700x300 for the Utah top), 7 Nov 2026. RADIUS 4, dark 110 (no "no ink between"). A few waypoints on the Utah south reach (1900,2165 and 1950,2160) sit 15-20 px off the ink; the trace snaps to the ink there.
# Reader: result: 1 run, 148.8 km from the GeoJSON (13 June 154.4 km by the same sum: shorter by the Utah reach and the shorter V). Overlay crops (1650,1500 1000x700; 1900,2050 1000x700; 2500,2250 1000x550; 3200,2150 750x400) looked at: the trace follows the heavy line end to end, the red ticks fall on the map's teeth (Allied side: north of the Caen reach, east of the pocket leg, inside the V, inside Utah); nothing off the ink or untraced; nothing flipped.
# Reader: sides: 13 June's GeoJSON backed up (cmp: unchanged after --sides); 34 towns diffed, one changes: 1.5W 50N (13 June `1.5W 50N         own (US)  by run 1 own at 2645,2636`; today `1.5W 50N         enemy     by run 1 enemy at 2558,2597`). Reason: the town (Cotentin, on the west coast north of the sheet's Utah line) lies by the open end of the line at Utah's west; the test's reference point moved with the changed run (2645,2636 to 2558,2597), not any change drawn near it (Cherbourg and the north Cotentin are German-held on 14 June, so enemy is the right answer). 0.5E 49.5N reads own and 1E 49.5N enemy, as on 13 June: open-end artefacts east of the Seine mouth. All other 32 agree.
# Reviewed: hand waypoints at radius 4, dark 110; overlay crop 1750,1500 looked at: one line from Utah round Carentan, down the Vire side, round the V toward Caumont, past Tilly and along the Caen reach to the Orne pocket, on the ink with ticks on the Allied side. 1.5W 50N enemy is right (German-held north Cotentin; its own on 13 June was the open-end test). WRONG side: 0.5E 49.5N reads own, the open-end artefact east of the Seine mouth. About 149 km.
