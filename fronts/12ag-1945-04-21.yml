# Reviewed: 59 of 60 towns on 19 April's side; 8E 53N (own) sits on the line at the Canadian front's corner south of
# Oldenburg. The Rhine and Main reaches boxed here are US-held both banks, with railway ticks only.
# Reviewed: 59 of 60 towns on 20 April's side; 12E 50N (own) is the advance past Plauen. The Harz pocket is gone (it surrendered on 21 April), so the front is shorter. One stretch turned at 1993,5370 to the map's ticks.
# Reviewed later (from 14 May): an area added for the north-west (100,820 to 1000,2200): the ticked Friesland coast, the line round the IJsselmeer's north-east shore by the Noordoostpolder and Kampen, and the front facing western Holland from Harderwijk by Apeldoorn to the Rhine (crop 150,1100 on 19 April read by the reviewer) lay outside the towns' spread and were dropped; now traced, no town changes side.
