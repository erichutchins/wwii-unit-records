# Namur-Huy-Liege, Metz and Nancy on the Moselle, the Saar, the Rhine to Karlsruhe). Only plain black army, army-group and corps
# boundaries, unit symbols and grey ticked railways. New on this sheet: a hand-drawn heavy line lettered SIEGFRIED LINE from the
# Dutch border by Aachen, Schleiden and Saarbrucken to Karlsruhe, with filled wedges near Saarbrucken-Zweibrucken, the letters I, L, N,
# E and a symbol's "L"; it has no ticks, so it is not the front, and the tool traced 12 fragments of it (red ticks on the overlay
# were the tool's, not the map's). Each box was tested by tracing without it: every one adds stretches back (title 10 stretches,
# legend 10, the seven Siegfried boxes 1, 1, 2, 1, 1, 5 and 1). Title is at y 140-200 here, so its box starts at y 100 (the
# 7 September box, from y 200, would leave the SECRET underline); the legend is at x 4560-5000, y 4950-5450 on this sheet, not
