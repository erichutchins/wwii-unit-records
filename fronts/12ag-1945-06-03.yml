# Reader: report no. 363, situation as of 031200 JUNE 1945 (the catalogue says 1945-06-03: agrees; title read with --title 4100 150 1900 1000). Legend (bottom left, overlay crops 100,5300 and 100,5900): the "U.S." box, the dashed "BRITISH" box and a "FRONT LINE" sample (ticked line, looked at 4x at 264,6172); no ENEMY sample. 4 June's note says only U.S. and BRITISH; the same FRONT LINE sample is on 4 June's sheet at 280,6140 (looked at 4x), so that note was incomplete, and the sample does not make a ticked line on the map.
# Reader: the line of contact with the Soviet armies (the Elbe, the Mulde, Chemnitz, Graslitz, Karlsbad, the Pilsen diagonal, Budweis, the Enns, the Salzach, the Tauern) is a heavy black line with NO ticks, lettered as the east boundary of the Twelfth A.G., as on 4-7 June: looked at 4x at 3644,812 3834,1322 4074,2032 4134,2115 4164,2772 4205,2400 4205,2500 4404,3092 5084,3912 5214,4832 5134,5182 4944,5592 4764,5732 (3 June's coordinates). Unlike 26 May, nothing on the line of contact is ticked. The only ticks on the sheet are the black outlines with ticks in Carinthia (the Moelltal south from Heiligenblut and a loop by Lienz; overlay crop 4034,5582), identical to 4 June's (looked at 4x beside 4 June's at 4450,5800), which the sheet does not explain; boxed and not traced. Empty front (owner's decision, 8 Nov 2026).
# Reader: towns from 12ag-1945-06-04: sheets offset -16,+32 px; 49 of 58 towns agree (median 1.6 px), 9 placed through the transform; conic fit rms 0.9 km, leave-one-out 1.0 km, worst 2.6 km (15E 47N). 4 June's 77 boxes, its 3 later ones and its area were moved here by a quadratic fit of 4 June's towns to today's (58 towns, rms 1.8 px, worst 3.9 px). A run with no boxes (344 runs: 40 ticked-looking, 42 chained, 262 unsure) was compared: the moved boxes left 8 runs, all non-front (two red state outlines at Luechow, a boundary by the Brunswick/Anhalt outline, the Mulde at Grimma, the Chemnitz-Annaberg line which the tool counted ticks on, three on the bare Enns/Tauern line), each given a box. A run with all the boxes traces 0 runs.
