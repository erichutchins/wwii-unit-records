# Reader: after 8 May the ticked line is the line of contact with the Soviet armies (the Elbe, Dessau, the Mulde, Chemnitz,
# Bohemia, the Enns, the Tauern to the Gross Venediger), not a front against the enemy. Stretches turned by hand: none.
# Not traced: state borders in red, hatched mountain borders, army and army-group boundaries, occupation boundaries, the title,
# legend and unit tables (the Second British Army table at the top, the Twenty-first table), arrows. Report 351 (20 and 21 May
# print 349). All 58 towns on the same side as 21 May; about 1220 km (21 May about 1149).

# Reviewed (8 Nov 2026): the line of contact with the Soviet armies, ticked. Overlay crop 3700,2000 (Saxony to the Enns) looked at beside 21 May's: the sheet now also draws a heavy straight line lettered EAST BOUNDARY TWELFTH A.G. from Annaberg to Karlsbad, the diagonal to Pilsen and Strakonitz, and from there by Budweis, Kaplitz and Freistadt to Prägarten. Only its ticked parts are traced (Chemnitz to Annaberg, and the diagonal from the Tepl hills through Pilsen to Strakonitz, ticked west); the stretches drawn with x marks or bare are the army group's boundary, boxed. The wavy ticked line of 21 May west of it (Crimmitschau, Graslitz, the Kaiserwald) is drawn and traced as before. Whether the bare stretches are the line with its ticks left off cannot be told from the sheet; the reading keeps to the ticks. Report no. 351. All 58 towns on the same side as 21 May. About 1220 km.
