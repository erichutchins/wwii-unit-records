# Reader: 21 May's 17 boxes moved by the sheet offset (+0, +8 px; 22 May is 5938 x 6682), each tested by dropping it alone from
# a run with all boxes in (new runs set against 21 May's line). Five held nothing today and are left out (Bad Aussee army
# boundary, Meerane, Bad Ischl kink, the two Gross Venediger stubs); twelve kept. Box 4 (provincial outlines west of the
# Elbe-Mulde) held the 4 km ticked left leg of the Dessau hook at about 12.22E 51.84N (3835,1430), so its east edge is cut from
# x 3840 to 3828: the line is whole there. The Bavaria box's foot stays at y 5308 (the Salzach line, St. Johann to Schladming,
# is outside it, whole). No other moved box holds today's ticked line.
# Reader: 22 May draws a different line from 21 May's, and the sheet's own boundary lines with it. The ticked line now runs
# Elbe, Dessau, Mulde, Chemnitz south to Annaberg (where the 'x' marks of the East Boundary of the Twelfth Army Group begin),
# with the pocket west of Chemnitz (Crimmitschau, Graslitz, Karlsbad), the line across Bohemia to Pilsen and Strakonitz, the
# Prachatitz-Haslach-Linz arc, the Enns, the Salzach and Radstadt/Hohe Tauern fingers, the Tauern to the Gross Venediger. The
# East Boundary (Annaberg, Karlsbad, Pilsen diagonal, Strakonitz to Budweis, Kaplitz, Freistadt, Pregarten, Windischgarsten)
# and the Twelfth/Fifteenth boundary (the Tauern, over the red state borders) are drawn heavy with no ticks: 21 boxes of 50 px
# round the first pass's unsure runs leave them out, each looked at (4x) or seen on the overlay crops. One unticked piece is
# kept by continuity (checked). 21 May had none of these runs (its sheet did not draw the boundary there).
