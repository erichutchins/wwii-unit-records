# Boxes: 04-10's, each retested on a bare run (only Auth, title, legend boxed) listing every run's middle; kept those catching a heavy unticked boundary run, dropped the rest (catch nothing today), added boxes for the boundary runs the bare run showed (each looked at on the overlay or --look). Checked entries of 04-10 at (888,3272) and (3856,3788) match no run today and are dropped.
# Reviewed: every town on 10 April's side; the Lingen-area crossings keep their distance to the front (7E 53N 23 -> 24 km). The thick Lingen V carries the map's ticks (seen at 5x on 13 April) and is front: its two boxes were taken out on review; the thin plain line SW to Nordhorn stays boxed as the boundary. The sheet does not yet show the Ninth Army on the Elbe.
