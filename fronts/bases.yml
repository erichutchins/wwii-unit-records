  to: 1944-08-10
  days: 6
  scan: 6700 x 6000
  heading: 12 AG outline maps 1:500,000 (as read on the overview)
  shows: Brittany, the Gulf of St Malo at top-centre, Brest at the left edge
  towns: towns-B02.csv
  towns_on: 12ag-1944-08-05
  towns_check: 31 half-degree graticule crossings read on gridded crops of 5 August 1944 (6 November 2026; the conic 0.22 km rms, 0.6 km at worst), seeded by the margins (the right neat line is the Greenwich meridian)
