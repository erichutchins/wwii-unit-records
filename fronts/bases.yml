# The base sheets under the daily overprint: which printed map each day of HQ Twelfth Army Group's situation maps
# (SOURCES.yml loc-12ag) is drawn on. The days were grouped by their overviews on 6 November 2026 (tools/sitmap_bases.py
# group: each day, in date order, joins the earlier day whose line work its own matches best by phase correlation, or
# starts a new base when none matches above the threshold), each group checked on a contact sheet of its first, middle
# and last day, and the catalogue (sitmaps.csv, column `base`) carries each day's base. Hand-written from that check:
#   from, to, days   the group's run; a base can recur (none does)
#   scan             the scans' size, pixels, as most of the group has it (the trims vary)
#   heading          the series name printed on the sheet, as read on it; "not read" where it wasn't
#   shows            what the overview shows (the ground, not the situation)
#   towns            the towns, read by eye, that fit this base: a day's twenty (records/fronts/<day>-gcps.csv) or a
#                    whole sheet's (towns-<base>.csv, tools/sheet_towns.py: the rings read on gridded crops of one day's
#                    scan, `towns_on`, round where a conic fit to the first twenty put each); `towns_check` says how it was
#                    checked that the base is the same plate as the towns' day (the rings matched on the group's first
#                    day, trace_front.py's matching, no records written). A base without `towns` needs its own read by
#                    eye before a day of it is traced (the skill, step 2), forty or so spread over the sheet.
# The groups are printings, not plates: B09, B11 and B12 are one 1:1,000,000 plate placed differently on the paper (the
# March towns register on all three); B14 and B15 are very likely one 1:1,400,000 plate, B15 with a red overprint of
# boundaries and names, unchecked.
- base: B01
  from: 1944-06-06
  to: 1944-08-04
  days: 60
  scan: 6700 x 6000
  heading: 12 AG outline maps 1:500,000, sheet 3; "Projection - Europe (Air) Conical Orthomorphic" in the foot
  shows: Normandy, the Cotentin to the Seine bay; the title top-middle ("SITUATION - 2400 HRS 6 JUNE 1944, HQ FUSAG" on the first day)
  towns: towns-B01.csv
  towns_on: 12ag-1944-06-06
  towns_check: 34 half-degree graticule crossings read on gridded crops of 6 June 1944 (6 November 2026; the conic 0.14 km rms, 0.3 km at worst), seeded by the degrees printed on the sheet's margins (the top and bottom neat lines are the 50N and 48N parallels)
