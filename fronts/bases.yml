  towns: towns-B03.csv
  towns_on: 12ag-1944-08-11
  towns_check: 10 half-degree graticule crossings read on gridded crops of 11 August 1944 (6 November 2026; the conic 0.60 km rms, 1.7 km at worst), seeded by the margins; the sheet's kilometre grid passed for the graticule in a first pass and two readings were left out of the second, so a third pass would tighten it if these two days are wanted
