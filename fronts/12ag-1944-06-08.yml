# Reader: title SITUATION - 2400 HRS 8 JUNE 1944 / HQ. FUSAG / COPY No. ___ (blank); "12 AG OUTLINE MAPS 1:500,000" at the top left margin; SECRET struck through at the top right; no report number. Agrees with the catalogue (ict21003, 1944-06-08).
# Reader: towns: matched to 12ag-1944-06-07, offset +40,+8 px: 30 of 34 agree (median 0.5 px); four placed through the transform: 1.5W, 1W and 0.5W 49.5N (58-64 px off; at sea or on the bay) and 1.5W 48.5N (66).
# Reader: legend: U.S., BRITISH, ENEMY keys and a dashed BOMBLINE key; no FRONT LINE sample. The sheet draws a toothed line, much longer than 7 June: the Utah lodgement (an arc from the 1058 box at Ste-Mere-Eglise down past 191 to Carentan, a toothed diagonal from Carentan NE to about 2190,1940, and a continuation NE of the 1058 box to about 2090,1665), and Omaha joined to Gold, from about 2570,1885 round the Omaha arc and the Bayeux salient along Gold and Juno, over a bump at Courseulles-Juno, to the 125 box at about 3885,2440 (Sword). Not toothed: arrows, the 1st US/2nd BR and I Corps boundaries, the bombline, unit boxes, the tank circle, the Orne mouth. The two lodgements are not joined on the sheet between Carentan and the Omaha arc (about 2200-2570, no toothed line).
# Reader: TEETH DIRECTION: looked at 2750,2070; 3250,2400; 3480,2290; 2620,1950 on the scan: the teeth hang on the seaward (north/east) side at Omaha, Gold and Juno and inside (east) the Utah arc: the July convention, the reverse of 7 June (teeth on the south). Nothing is flipped; the waypoint runs are ordered with the inland enemy on the left, and the tool's red ticks fall on the drawn teeth on the right.
# Reader: METHOD: the stretch method (radius 5, dark 115, boxes) traced only about 45 of roughly 100 km (23 stretches): the sheet's line is thin and its teeth run into it, so radius 5 opened it away and ticks were found on part only. Kept: hand waypoints (`runs:`), read by eye on overlay crops (scan 1850,1600 1300x900 for run 1; 1850,1600 and 2500,1850 1450x650 for run 2), enemy on the left. Run 1 runs from the Carentan diagonal's NE end down to Carentan and north up the Ste-Mere-Eglise arc and NE past the 1058 box; run 2 is walked from the Sword end west (so the inland enemy is on the left) along Juno and Gold, the Bayeux salient and the Omaha arc to its north tip. Radius 5 failed with runs ("no ink between": the mask held only blobs), so radius 4, dark 115 (min area 2000 px keeps heavy pieces only): r4 d115 117.8 km, r3 d115 118.4 km (same course); radius 4 kept. The old stretch result is backed up in the scratchpad (q-0608/bak.yml, bak.geojson).
# Reader: result: 2 runs, 117.8 km from the GeoJSON, following the drawn line on the overlay crops from the Utah arc's north end, round Carentan, the whole Omaha arc and Bayeux salient, Gold and Juno to the Sword end. Off the ink or doubtful: at the Juno bump's east foot and the 191 box (about 3600-3660,2340-2400) the path dips onto the box edge for about 50 px, because the line runs behind the box top there; the two ends (2090,1665 and 3885,2440) end where the teeth end by eye. Nothing else is untraced on the toothed line.
# Reader: boxes: with waypoints the exclude boxes are not used; only the title, SECRET and legend boxes remain (the 17 stray boxes of the stretch trace were dropped).
# Reader: sides: 50N own except 2W 50N (enemy: sea west of the Utah arc's open end; run 1 enemy at 1933,2004, run 2 own at 3080,2340); 49N and south enemy except 1E 49N, which reads own by run 2 at 3080,2340 (east of the Orne mouth, beyond the line's end at Sword: the open-end artefact, as on 7 June; the town is German-held); 0.5E, 1E 49.5N read own by run 2 (inland on the coast east of the Seine's mouth, German-held, the same artefact, no line between them and the sea). 2W and 1.5W 49.5N read enemy (right: west of Utah); 1W, 0.5W 49.5N own (bay, right).
