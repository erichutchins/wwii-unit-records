# Reviewed: --sides diffed with 8 February: 80 of 81 agree. Haguenau now reads own ("Haguenau         own (US)  by run 81 own at 5120,4518"; 8 Feb "enemy by run 67 enemy at 5314,4573", a far run at Karlsruhe): the town stands on the Moder line, held by the Americans after Nordwind, so own is right and the test is weak. Prüm and Adenau enemy (Adenau mixed: run 52 own). Six new boxes (right-edge symbol, the "21" stub, the Seraing end of the Twenty One/Twelfth boundary, the signature "C", the 14 symbol's leader, the Saint-Vincent boundary) each with its reason; one 12 px stub at 3643,712 left unsure, sides unaffected.

# Reader: 225 symbols (118 de, 77 us, 17 uk, 7 fr, 5 ca, 1 pl): 158 from --boxes, 67 read by eye (the British and Canadian boxes, most corps and armies, the Nijmegen column, the 15/53/51 stack, the Eifel and Roer boxes, the out-of-contact column, the C IN C pair, the Upper Rhine list, SHAEF and the FIFTEENTH). Lists: 14 out-of-contact (box "OUT OF CONTACT"), 2 unlocated ("UNLOCATED"), 9 upper-rhine-area ("UPPER RHINE AREA"), 3 dieppe-rouen ("VICINITY DIEPPE - ROUEN"), 1 lorient-st-nazaire ("LORIENT - ST. NAZAIRE SECTOR", read as the sector box); 6 arrow (the 43, CDN 2, 15, 53 and 51 by Nijmegen, whose labels run to arrows or a line off the sheet to the east, and the ?2 east of Pruem, whose free arrow starts beside its label). The 9th Armored is where it was on the 8th (3917,3975; 11 px off 8 Feb). Unsure: the dashed uk box at 3534,1416 (read 11(-), armored, its inside lettering unclear); the 278 at 4435,3776 (8 Feb read 778); the "7?" at 3866,3041 and the ?2 at 4028,3160 (a digit hidden by ink); the unlabelled hatched box at 5456,4594 (label hidden, "?"); the 3 at 4182,2096 (arm hidden, unread); 106 and 16 in the Upper Rhine box (16 may be 716 with the 7 lost). The XXX at Nijmegen is a British corps box; 8 Feb has an XXX far south at 2996,2543 that is not drawn here. II CDN has a dashed leader to a dot (a location mark), not recorded as an arrow.
# Reviewed (8 Nov 2026): the symbols. The column south of Nijmegen (43, CDN 2, 15, 53, 51, the divisions of Veritable): each
