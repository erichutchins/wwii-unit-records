# they are placed symbols, not `arrow`: the tags taken off, the joining line noted here. The "?2" east of Prüm keeps its
# `arrow`. The UPPER RHINE AREA box holds nine (a "16" among them, perhaps the 716 with its 7 lost). The 9th Armored's
# oval where it was on the 8th.
