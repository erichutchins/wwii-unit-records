# Reader: title SITUATION 2400 HRS 25 JUNE 1944, HQ FUSAG, COPY NO. blank. Agrees with the catalogue's day (ict21020).
# Reader: towns matched to 12ag-1944-06-26's (base B01), sheets offset +32, -8 px: 31 of 34 agreed (median 1.1 px); 2W 50N (6 px), 1.5W 49.5N (21 px) and 0.5W 49N (13 px) placed through the transform. No refusal; 27 June and towns-B01.csv not needed.
# Reader: METHOD: hand waypoints read afresh on 3x crops of the bare scan with a 50 px grid (labelled every 100 px): crops 900,1100 600x300; 1300,1050 600x300; 1750,1250 600x300 (the Cherbourg line, west to east); 3350,2120 600x300; 3150,2250 500x300; 2850,2400 500x300; 2500,2600 500x300; 2250,2400 500x300; 2200,2200 500x300; 1900,2050 500x300; 1550,1950 500x300; 1250,1850 500x300 (the main line, read east to west). Run 1 has 135 waypoints (Orne tip to the lake), run 2 has 51 (the Hague end to the thin place at Quettehou), run 3 has 5 (past it to the marsh). None kept from 26 June. Radius 3, dark 110 as on 26 June.
# Reader: run 2 is split into runs 2 and 3 at one thin place (about 1823,1377 to 1847,1416, east of Quettehou): the line is drawn there but the ink is broken into specks, and the tool found no path across (46 px, past its bridge). The GeoJSON leaves that 46 px (about 3 km at this scale) open; run 2 ends (1823,1377) and run 3 begins (1847,1416).
# Reader: TODAY'S SHEET differs from 26 June: the Odon head is drawn as a narrow tongue (east side x 3380-3375 from y 2290 to 2410, bottom (3350,2410) to (3283,2413), west side up x 3273 to (3273,2358)), then the line turns west along y 2358-2365 to (3203,2365) and runs south down x 3203 (ticks on its west) to the V at (3127,2530), where on 26 June it was one broad arc. The Cherbourg line is one ticked line from the Hague end (1007,1178) over Flottemanville, the tongue (peak 1320,1142) and the arsenal (79 box), a loop at (1462-1480,1173-1232) east of the tongue, east past the 243 and 709 boxes to the peak (1660,1138) by St-Pierre-Eglise, south by Quettehou and on south-east to the marsh edge at (1953,1442). Run 1's west half (Caen reach, St-Lo, Vire, loop under the 29 box, the V under the 101 box, to the lake) matches 26 June's shape.
# Reader: ticks: on every stretch the map's ticks hang to the right of the order the waypoints go (enemy on the left): north of the Caen reach, inside the Odon tongue, west of x 3203, north of the St-Lo stretch, inside the loop under the 29 box, west of the Vire, inside the V under the 101 box, north of the Carentan stretch; the Cherbourg line's ticks on its south and west. The overlay's red ticks fall on the map's ticks on all of them (crops 950,1050 1000x450; 1250,1850 1000x450; 2000,2000 800x450; 2300,2400 900x400; 2750,2250 1200x500; 3650,2100 300x300).
# Reader: untraced, on purpose: heavy lines with no ticks (the First U.S./Second Br. army boundary near x 3170-3280 going up from the tongue, the one NE from the 101 box V at (2090,2130), the one down x 2480-2600 to the front near (2440,2520), the one down x 2880-2930 to (2930,2680) with an arrow, the thin line with xxx west of Carteret at (1160-1280,1865-1890)); the dashed xxx boundaries inside the British area. Nothing else off the ink on the overlay; no stretch flipped or checked.
# Reader: --sides on 26 June (its GeoJSON and gcps backed up in the scratchpad q-0625/, unchanged after) and today, 34 towns diffed: one change, 0.5E 49.5N: 26 June "0.5E 49.5N enemy by run 1 enemy at 2475,2596", today "0.5E 49.5N own (US)  by run 1 own at 2600,2593". It lies 1300 px beyond the Orne arc's open north end, where the nearest legs are the tip's short ones and their votes are a hair apart; not a stretch turned wrong (the ticks check on the overlay). 1E 49.5N reads enemy. 2W, 1.5W, 1W 50N enemy; 0.5W 50N and 0E-1E 50N own (at sea, either way). Length from the GeoJSON about 213 km (3 runs: 157, 51 and 5 km).
# Reviewed: hand waypoints at radius 3, dark 110. Overlay crop 3100,2250 looked at: the Odon tongue toward Carpiquet is ticked inside and the stretch west of it (along y 2360 and down x 3203) is ticked on its north and west, the Allied side: front, not the boundary 26 June left out there. The Cherbourg line is traced from the Hague to the Montebourg marsh with one break of about 3 km east of Quettehou, where the drawn ink breaks into specks. WRONG side: 0.5E 49.5N reads own (German-held), an open-end artefact beyond the Orne arc. About 213 km.
