# Reviewed: all 34 towns on 19 July's side (33 of 34 agreed on the transform, 1W 50N placed through it). 27 stretches, about 136 km, from the Passage de la Déroute coast to the Orne mouth; the east end has not moved from 19 July: no Goodwood advance east of the Orne is drawn on this 1200 hrs sheet. Hatching and red ticks on the north and west side throughout; two stretches confirmed by eye at 4x, no turns. Title and legend boxes re-tested; a new box over the hatched 353 symbol in the shallows (130 px south of the front). Gaps of 46 and 47 px under the 4/265 symbols on the west reach. Towns in the sea off the Orne end read either way.
