# Reader: title read 1200 HRS 6 OCTOBER 1944, no report number (agrees with the catalogue, 1944-10-06). gcps matched to 12ag-1944-10-07 (offset +24,-8 px; 45 of 81 agree, median 1.1 px, 36 placed through the transform); conic fit 1.1 km rms over 81, leave-one-out 1.1 km, worst Beauvais 3.4 km. NO ticked front is drawn on this sheet: at Aachen/Geilenkirchen, Monschau, the Moselle near Metz and Nancy, and at Nijmegen/Venlo only plain heavy boundaries and the Siegfried Line's hatched band (looked at with --look: no ticks). Every stretch the trace found is boundary, hatching or lettering and is boxed out; the front is empty.
# Reader: boxes: 10-07's shifted (+24,-8) kept where they caught a stretch (9), 22 small boxes added on the unsure stretches, and 15 boxes on the 15 ticked/line runs that remained (one per run, at the run's middle; each looked at with --look: boundaries, Siegfried hatching, unit symbols, the G5701 stamp, none with ticks). Final trace: 0 stretches, front empty = none drawn. --sides reads "?" for every town. 10-08's sides not diffed (no front). 10-07's GeoJSON backed up in the scratchpad q-1006/. Not looked at closely: the thin sheet-edge north (Nijmegen/Arnhem) beyond the Venlo loop, where only boundaries and symbols show on the overlay.
# Reviewed: as on 7 October, no ticked front is drawn: the front is empty, no front drawn, not no front. The sheet does draw heavy plain lines near Aachen, round a loop west of the Maas at Venlo and toward Metz (the reviewer's crop at 3900,1100 against 8 October's shows them without ticks); they are not taken as front, and are boxed with the boundaries and the Siegfried band. 45 of 81 towns matched to 7 October; fit 1.1 km rms.
