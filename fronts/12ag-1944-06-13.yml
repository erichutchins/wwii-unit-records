# Reader: drawn as the front: one ticked line, enemy on the left: from the top of the Orne pocket's east leg (3877,2167) down the leg, round Colombelles, west along the Caen reach and the dip at Tilly (3050,2500), then NOT as on 12 June: the line now turns south-west down the V's east side (2930,2452 to 2805,2692) to a foot at about (2700,2700) (the 1st and 2nd Division boxes inside it, the heavy untoothed First/Second army boundary beside it at x about 2900), back north-west along (2550,2584) and up the Vire side to the Carentan hook (2247,2170), west along the south of Utah, north up its west side and east along the top to (2015,1580). Not the front: the heavy untoothed boundaries (verticals at x about 2900, 3280, 3500, 3700, the diagonal VII/V corps line through Carentan), the dashed British boundaries and arrows, unit boxes and circles, the dashed lines. No Villers-Bocage salient or Caumont advance is drawn: the line near Tilly (3050,2500) is a smooth dip as on 12 June.
# Reader: METHOD: hand waypoints (`runs:`), 98 points read by eye on 2x crops with a 50 px grid labelled every 100 (crops from 1700,1550 700x650; 1900,2050 700x600; 2550,2200 700x600; 3200,2150 700x450; 3600,1950 600x500), 7 Nov 2026. 12 June's line was not simply shifted: the V's foot is lower and further south-east than on 12 June (foot (2700,2700) against (2550,2522)), so the run was drawn on today's ink. RADIUS 4, dark 110 (no "no ink between"). Teeth looked on every crop: they hang on the Allied side (north of the Caen reach, east of the pocket leg, inside the V, inside Utah); nothing flipped.
