# Reader: title read 1200 HRS 13 OCTOBER 1944, no report number (agrees with the catalogue). gcps matched to 12ag-1944-10-14 (accepted: offset +16,-8 px; 46 of 81 agree, median 1.7 px, 35 placed through the transform). Boxes: 10-14's 24 moved (+16,-8) and each tried by leaving it out: 11 dropped (no stretch caught today), 12 kept; 10-14's box on the Marne-Rhine canal's last stretch dropped (it cut ticked front). Kept the blue-pencil underline box (not front: the tool's ticks there are its own). 11 boxes added for boundaries and Siegfried hatching the moved boxes missed (Twenty One/Twelfth from Arras to the Somme and from Cambrai to Maastricht and Geilenkirchen; First/Ninth at the Aisne; Twelfth/Sixth from the canal south-west and north-east of the Moder; four Siegfried hatched bits; a hatching bar in the Geilenkirchen corridor head). 10-14's checks: the arc's top re-centred (4306,1287); its other seven drop (blue by themselves today); 16 more stretches checked by eye on crops (Maastricht loop, east face of the Aachen salient, Schmidt/Dahlem, Luxembourg line, Metz). Gap: the first ~100 px of the Geilenkirchen arc (4160-4270, 1210-1290, ticks hanging south) is not traced, its line fused with the boundary above it; so Nijmegen, Arnhem and Eindhoven read enemy here (10-14 traced it and read them own); nothing forced. No ticked front is drawn round Nijmegen, on the Antwerp-Breda line or in the Vosges: nothing traced there; Arnhem, Breda, 's-Hertogenbosch, Bergen op Zoom, Saint-Dié, Colmar are beyond the open ends. Metz enemy.
# Reviewed: like 14 October, this sheet draws a ticked front only from Geilenkirchen and the Maastricht loop by Aachen, Monschau and the Luxembourg line past Metz to the Marne-Rhine canal; none round Nijmegen, on the Antwerp-Breda line or in the Vosges (no front drawn, not no front). 75 stretches, about 284 km, 17 short pieces of the fused Aachen-Monschau reach checked by eye on the map's west ticks; the first ~100 px of the Geilenkirchen arc (ticks south) is fused with the boundary above it and not traced. 78 of 81 towns on 14 October's side; Nijmegen, Arnhem and Eindhoven read enemy today and own on 14 October: all three lie beyond the line's open north end and are artefacts either way (Nijmegen and Eindhoven were Allied, Arnhem German). Colmar, Saint-Dié, Épinal beyond the south end, likewise. Metz enemy. 11 empty boxes dropped, one that cut the canal stretch dropped, 11 added (boundaries, Siegfried strips, a hatching bar), each tried by leaving it out.
