he US 8 (3590,1866, solid box with oval, read as the US 8th Armored, as 02-11); AB boxes read arm unread with the label as written (AB 82), ALG 3 French; the Seraing "TWENTY ONE / TWELFTH" boundary lettering and other boundary labels (II CDN xxx / XXX, VIII xxx XII, XV xxx VI, XIII xxx XIX, XVIII xxx V) not recorded. No 331, 15, 25, 21 or 116-at-Cologne as on 02-11: looked, not on today's sheet.
