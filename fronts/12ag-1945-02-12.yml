# Reader: towns matched to 02-11 (sheet prints +0, +0 px; 72 of 81 agree, median 0.9 px; nine placed through the transform: Gemünd, Colmar, Verviers, Münster, Trier, Bitburg, Prüm, Zweibrücken, Darmstadt). All 02-11 boxes copied unshifted (offset 0) and the overlay looked at whole: the title box ends above the Walcheren/Tholen arcs (traced, blue), both Twenty One/Twelfth ends (3290,2125 and 3570,2127) stay boxed, Verviers own. No flips. 02-11's two checks below Erstein dropped (they come out right by themselves); one new check at 4041,2441 (the Siegfried line SW of the 246 symbol: ticks west). 63 stretches, 785 km against 777, no unsure. --sides diffed with 02-11, three towns changed: "Haguenau         own (US)  by run 53 own at 5297,4537" (02-11 enemy; ring on the Moder line, weak test); "Kleve            own (US)  by run 5 own at 3798,614" (02-11 enemy; the line on this sheet loops east round Kleve and its ring sits on it, looked, crops 3650,500); "Prüm             own (US)  by run 37 own at 4067,2685" (02-11 enemy; unsure: the line is correctly ticked on its west, the ring (4078,2718) lies 30 px south of a bend and east of the line, so a corner reading of the nearest-point test, not a stretch turned; left as traced). Gemünd, Adenau enemy.
# Reviewed: --sides diffed with 11 February: 78 of 81 agree. Haguenau own (right; ring on the Moder line, weak). Kleve own ("Kleve            own (US)  by run 5 own at 3798,614"): the line loops east round the town, taken by the British in these days. Prüm own ("Prüm             own (US)  by run 37 own at 4067,2685"; 11 Feb enemy): the ring lies about 30 px south of a bend in the west-ticked line, a corner reading; Prüm fell to the Americans about this date, so not marked wrong, but the test is weak. Gemünd and Adenau enemy. 63 stretches, 785 km, Walcheren to Colmar, 0 unsure; both Twenty One/Twelfth boundary ends boxed (Verviers own).
