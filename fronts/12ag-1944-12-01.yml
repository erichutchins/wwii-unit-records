# Reader: towns matched to 12-02 (offset +16, +8 px): 56 of 81 agree, median 0.6 px, 25 placed through the transform. 12-02's ten boxes shifted by that offset and each tried alone (GeoJSON with and without): kept where they change it (title, legend, Twenty One/Twelfth boundary, Twelfth/Sixth south-west of Dombasle, Twelfth/Sixth along the Marne-Rhine canal). Dropped as catching nothing here: the enemy 18's squiggle, the Rhine reach north of Karlsruhe (nothing traces there on this day, so no box is needed), the Rhine stub at 5631,4418, the Twelfth/Sixth stub down to Sarrebourg (4456-4666), the stub by 3 (ELMS). One new box: a blunt unticked boundary stub at 4670,4444, just east of where 12-02's boundary box ends. Title box stops above the Scheldt arcs and west of the Hollandsch Diep arc; the arcs trace with red ticks south, as the map's (overlay crop 1000,450): no flip. Saar and Vosges front whole.
# Reviewed: all 81 towns on 2 December's side. Strasbourg reads enemy and is WRONG (liberated 23 November; "Strasbourg       enemy     by run 69 enemy at 5241,4827, run 70 enemy at 5217,4918"): its ring, placed through the transform, sits by the ticked Rhine front, the ring-under-the-line case of 2 and 4 December. Jülich, Haguenau, Kleve, Landau (one run of four own, at the Lauter-Rhine corner) and Darmstadt enemy. 84 stretches, about 893 km, 0 unsure, no turns; Scheldt arcs ticked south as the map's; the Saar and Vosges front whole. Five of 2 December's boxes caught nothing here and are dropped; one added on a blunt unticked boundary stub at 4670,4444 (looked at).
