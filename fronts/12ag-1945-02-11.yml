# Reader: towns matched to 02-10 (sheet prints 0 px right, 8 px up; 76 of 81 agree, median 0.8 px; five placed through the transform: Gemünd, Trier, Prüm, Zweibrücken, Pirmasens). All boxes copied from 02-10 and shifted 8 px up, checked on the overlay; the title box ends above the Walcheren/Tholen arcs and the Twenty One/Twelfth eastern piece (3570,2127,3665,2172) stays boxed. One new box: the boundary's west end at Seraing (run 23 at 3310,2146; it read Verviers enemy). 02-10's check (4009,3185) dropped: that stretch comes out right by itself. Two new checks on the Rhine line below Erstein (runs 51/52, 5236,5084 and 5238,5118), ticks west. No flips. --sides diffed with 02-10: 80 of 81 agree; Haguenau changed ("Haguenau         own (US)  by run 65 own at 5235,4535" on 02-10; "Haguenau         enemy     by run 43 enemy at 5146,4513" today): ring (5275,4527) sits about 8 px north of the Moder line, ticks south (looked, overlay crop 5050,4400); the line, not a wrong stretch, and a weak test. Gemünd enemy ("Gemünd           enemy     by run 25 enemy at 4100,2219, run 26 enemy at 4080,2289"), Prüm and Adenau enemy. 58 stretches (02-10's 84 runs merged more), 777 km against 786, one unbroken line Walcheren to Colmar.
# Reviewed: --sides diffed with 10 February: 80 of 81 agree. Haguenau reads enemy and is WRONG ("Haguenau         enemy     by run 43 enemy at 5146,4513"; 10 Feb "own (US)  by run 65 own at 5235,4535"): the town was held by the Americans on the Moder; its ring sits about 8 px north of the Moder line, ticked on its south, so this is the ring on the line, a weak test, not a wrong stretch. Prüm, Adenau and Gemünd enemy. 58 stretches, 777 km, one unbroken line Walcheren to Colmar; none unsure. A new box at the Seraing end of the Twenty One/Twelfth boundary (it had put Verviers enemy); two checks on the Rhine below Erstein, red ticks west as the map's.
# Reader (symbols): 226 symbols, read from 8x7 crops of the scan at full size and magnified, then every one checked on units.jpg: 121 enemy, 76 US, 16 British, 5 Canadian, 1 Polish, 7 French; 65 from --boxes (of its 85 boxes, 20 are the title's lettering, the legend and a duplicate), 161 by eye. Lists: 15 out-of-contact (the box headed OUT OF CONTACT, as 28 Jan, now six divisions and three SS corps in the left columns, six in the right), 2 unlocated (49 and XII SS; 28 Jan had 8? and 49 and three more), 4 dieppe-rouen (65, 71, 89, 13), 1 lorient-st-nazaire (66), 9 upper-alsace-pocket. The last is PROVISIONAL: today's box is headed "UPPER RHINE AREA" (189, 159, 198, 2 MTN, 338, 716, 708, 16 and the brigade 106), not "IN UPPER ALSACE POCKET"; I used the existing word and the reviewer should decide whether it needs its own. Drawn, not placed: the British XXX Corps is a solid-lined "XXX" box inside a larger dashed outline at Nijmegen, so `uk`, not an open box (4 Feb put it as `us` far south); the "CDN 3" and "CDN 2" boxes and "AB 6" and "AB 82/101/17" (letters in the box, no mark: `unread` for the Canadian and British, `airborne` for the US, as 28 Jan) and "ALG 3" (French, dashed, `unread`) are as written; the boundary labels (II CDN / I, II CDN / XXX by Oss, V / XVIII, XIII / XIX, XII / XX, VIII / III, III / XII, XV / XXI and the army-group lines) are left out. Unsure: 8 (de, 3775,1347: hatched with a curved mark, read `airborne`, 28 Jan's unlocated "8?" is airborne); the box at 3915,3055 (label hidden under the printed 535: `?`); 11 (de armored, 4132,3512: two strokes cut by the Kyll, "11"); 6 SS (MTN) (the SS runes sit under the 6; written "6 SS (MTN)"); 1 FR, 2 FR (small, beside the box); H read as the letter, not 14; 106 as an armored brigade (x). Five divisions west of Duren (363, 85, 62, 12, 277) were first dropped and added after the overlay check; 4 Feb has symbols not on today's sheet (GDS, 604 zbV, 606 zbV, 553, 328, 28, 75) which I did not find.
# Reviewed (8 Nov 2026, the symbols): 226 unit symbols read across the whole sheet (121 enemy, 76 US, 16 British, 7 French, 5 Canadian, 1 Polish; 65 by the box finder, 161 by eye on gridded crops); the front is unchanged. Overlay crops 3300,1900 and 5900,5100 looked at: dots on their boxes; the corps-boundary labels (V xxx XVIII, XIII xxx XIX and the rest) left out. Lists: OUT OF CONTACT (15), UNLOCATED (49, XII SS), the 65, 71, 89 and 13 in the Dieppe-Rouen inset, the 66 at Lorient and St-Nazaire, and nine enemy symbols in a box now headed "UPPER RHINE AREA" (`upper-rhine-area`, a new word in the README; on 4 February the same place was "IN UPPER ALSACE POCKET"). The XXX Corps is drawn by Nijmegen as a British box this time (uk). The reader found five divisions west of Düren and the 257 only on a second look, so a symbol in a tile read as empty may still be missing (the north-east and the southern left edge most likely).
