# Reader: title SITUATION 2400 HRS 24 JUNE 1944, HQ FUSAG, COPY NO. blank (no report number). Agrees with the catalogue's day (ict21019).
# Reader: towns matched to 12ag-1944-06-25's (base B01), sheets offset +0, +8 px: 33 of 34 agreed (median 0.5 px); 1W 49N (9 px off) placed through the transform. No refusal; 26 June and towns-B01.csv not needed.
# Reader: METHOD: hand waypoints read afresh on gridded 3x-5x crops of the bare scan (50 px grid, labelled every 100 px; crops 900,1050 700x350; 1000,1130 400x200; 1380,1100 500x250; 1750,1290 300x200 (the Cherbourg line, west to east); 3350,2100 600x350; 3150,2250 350x250; 2850,2450 450x300; 2430,2450 470x300; 2200,2350 350x280; 2150,2100 300x270; 1850,2050 400x250; 1550,1880 350x250; 1250,1850 350x250 (the main line, east to west)). Run 1 has 162 waypoints (Orne tip to the lake), run 2 has 53 (Hague coast to Quettehou, 1829,1374), run 3 has 5 (1862,1445 to the marsh edge, 1960,1455). None kept from 25 June.
# Reader: SETTING: radius 2, dark 170 (not 3 and 110 as 25-27 June): on this printing the line is finer, and at radius 3 / dark 110 the heavy-ink mask (opened, then pieces under 2000 px dropped) lost the Cherbourg line and half of the main line (waypoints 100-500 px from any skeleton, no path). At radius 2 / dark 170 every waypoint falls on the mask but run 3's first four (1824,1430 to 1862,1445).
# Reader: run 3 starts at (1862,1445), not the 1824,1430 of 25 June: the ink east of Quettehou is specks and the mask drops the piece west of 1862. Open in the GeoJSON: run 2's end (1829,1374) to run 3's start (1862,1445), about 80 px (about 6 km) on the scan, where the drawn line is broken into specks (1828,1384 to 1824,1430) and then runs on east to the marsh.
# Reader: TODAY'S SHEET differs from 25 June: (1) the Cherbourg line's west end starts at the coast (1024,1209), goes east over a peak (1135-1147,1172-1176) near Querqueville, down x 1155 to the junction at the 9 box's corner (1200,1282), then up and round a loop (peak 1282,1212; its west side up x 1205-1220, east side down x 1300) and east along y 1270-1277 under the 243 and 79 boxes: the Hague stretch is one line with the loop east of it, joined at the 9 box where the line passes under its xx marks; 25 June drew the tongue and Flottemanville stretch otherwise (peak 1320,1142). (2) the line east of the loop runs y 1277 to 1260 to (1600,1260) and up the peak by St-Pierre-Eglise (1660,1167, 709 box beside it), then down x 1700-1713, south-east to Quettehou (1832,1336) and on, as 25 June. (3) the Odon tongue is lower and wider: its bottom is (3350,2429) to (3295,2440) (25 June 2410), its sides x 3377 and x 3267-3272; the line then turns west along y 2377-2385 to (3210,2385) and runs south down x 3204 (ticks on its west) to the V. (4) the Orne arc's bottom is (3753,2395) (25 June 2373) and its north tip (3863,2180). Run 1's west half (St-Lo, Vire, loop under the 29 box, the V under the 101 box, to the lake) matches 25 June's shape within 10-30 px.
# Reader: ticks: on every stretch the map's ticks hang to the right of the order the waypoints go (enemy on the left): east side of the Orne arc (ticks west), north of the Caen reach, inside the Odon tongue, north of the y 2380 stretch, west of x 3204, north of the St-Lo stretch, inside the loop under the 29 box, west of the Vire, inside the V under the 101 box, north of the Carentan stretch; the Cherbourg line's ticks on its south and west, inside the two loops and the peak by St-Pierre-Eglise. The overlay's red ticks fall on the map's ticks along the whole line (overlay crops 1000,1100 700x260; 1650,1100 350x400; 3350,2150 560x300; 3150,2300 400x280; 2850,2450 400x300; 2400,2480 500x270; 2200,2200 400x450; 1850,2050 420x220; 1500,1880 450x250; 1280,1880 300x200; each seen at 2x). Nothing off the ink.
