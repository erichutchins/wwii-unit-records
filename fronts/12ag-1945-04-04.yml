# Reader: title read on the sheet: report 303, situation as of 041200 Apr. 1945; agrees with the catalogue (ict21304, 1945-04-04). Towns: 75 of 81 agree with 04-03's (median 1.2 px, offset +24, +0); six placed through the transform (Gemuend, Epernay, 's-Hertogenbosch, Kleve, Siegen 15 px off, Bitburg).
# Reader: boxes. 14 of 04-03's boxes shifted +24 in x and tried on an unboxed trace (80 runs). Nine hold no run's middle on this sheet and are dropped. Five are kept although they hold stretches the tool called ticked (runs 71, 66, 64, 80): looked at, each is the hatched belt's rungs beside a plain heavy black boundary, or the legend's FRONT LINE sample, not a ticked front (the instruction to drop a box holding a ticked stretch was not followed for these, the reason is in each box). Seven boxes added, one at the middle of each heavy unticked boundary run left outside every box (3538,1187; 3394,1269; 2919,1334; 2805,1389; 2535,1668; 2328,1880) and the signature's last stroke (1610,1234).
# Reader: area. Ticked front ran past the old area on three sides: north of the towns' spread the Dutch front (Arnhem-Zutphen-Deventer to the Guards arrow, y 560), the Rheine-Osnabrueck-Bohmte-Herford line and the Munster-Paderborn line up to y about 700 (500 above 04-03's 1700 top edge by 1100 px at the farthest), and east the front to Gotha and Meiningen out to x about 5920 (420 px past 5500). Set to [2150, 500, 6600, 4800]; 3 of 4 corners are extrapolated, the farthest 2599 px from a ring (fit 1.1 km at Beauvais). 84 stretches, 1840 km (04-03: 1715 km).
# Reader: flips. (1933,1318) and (1913,1375), the Arnhem notch: unsure, no tick count; ticks seen at 3x on the south side (49th Division's box); as found Arnhem read own, now enemy (as on 04-03). (3843,764) and (3796,771), the Bohmte spearhead's upper strand: UNSURE. Fused heavy ink, no ticks readable; turned so the inside of the spear is the US side (the skill's usual corridor head), to agree with the lower strand (3792,795, left unsure/as found, whose ticks are inside). The reviewer should look at 3700-3900,740-830. No town is near it.
# Reader: sides. 80 of 81 towns on 04-03's side. Soest, Much, Waldbroel, Siegburg enemy (inside the Ruhr pocket, ring ticked outward); Siegburg on the ring's edge, a weak test. Siegen: 04-03 `Siegen           enemy     by run 80 enemy at 3664,2735` -> 04-04 `Siegen           own (US)  by run 45 own at 3981,2466`: its ring (3665,2742) stands on the pocket's southern line, so a weak test; 04-03's line passed just south of it, today's just north (look at crop 3000,1300: the red cross is on the line), the pocket's south side (Sieg valley) having Siegen outside it. Darmstadt reads own with the widened area (it read enemy on a narrower one, before the Hanau-Spessart line was in). Strasbourg is the open end.
# Reviewed: 80 of 81 towns on 3 April's side. Siegen own ("Siegen           own (US)  by run 45 own at 3981,2466"; 3 Apr enemy by run 80): its ring stands on the Ruhr pocket's southern line on the Sieg, a weak test. Soest, Much, Waldbröl enemy inside the pocket; Arnhem enemy, Nijmegen own. Ruhr pocket closed and ticked outward; the front runs on to Gotha and Meiningen. Area widened to the whole front (2 and 3 April widened the same way). 84 stretches, about 1840 km. Flips: two at the Arnhem notch (ticks south, by 49 Div, read at 3x), and two on the upper strand of the Bohmte spearhead where the ink is fused and no tick could be read: turned so the spear's inside is the US side, as its lower strand (left unsure); an inference, no town depends on it. Saar boxes kept although the tool counts ticks there: the rungs of the hatched belt beside a plain boundary.
