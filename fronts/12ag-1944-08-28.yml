# Reviewed: one ticked front, the lower Seine line, but longer than 27 August: from the Honfleur tip (west end, outside the towns' spread, taken in by area) round the Rouen loops and the Elbeuf hook to Meulan, where the Twenty One/Twelfth boundary (boxed) leaves it. Title, legend, Sucy boundary and stamp boxes as on 27 August (positions checked).
# Reviewed: the lower Seine line from the Honfleur tip round the Rouen and Elbeuf loops to Meulan (about 98 km against 165 on 27 August: the pocket south of the river shrinking as the Germans crossed); one stretch turned at the Elbeuf hook (6x). The stretch east of Mantes to the boundary at about 3650,1930 is only partly traced (thick blunt ink).
