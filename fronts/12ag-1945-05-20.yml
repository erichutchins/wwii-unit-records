# Reviewed: after 8 May the ticked line is the line of contact with the Soviet armies (the Elbe, the Mulde, the line
# across Bohemia, the Enns, then the Tauern to the Brenner), not a front against the enemy: the side frontSide calls
# "enemy" is the Soviets'. A page must say so and not shade it as the enemy's. The three Rosslau runs are accepted by
# continuity (heavy, unticked, between the ticked Elbe and Mulde). B15's 68 days (20 May to 26 July) are all like this.
# Reviewed again (8 Nov 2026): the Bavaria box is cut at its foot (y 5400 to 5316): it held about 18 km of the ticked line along the Salzach from St. Johann to Schladming, found on 21 May. A stub of the border hatching by Garmisch that the cut uncovered is boxed. The line is now whole there; all 58 towns on the same side as before. About 1182 km (was 1150).
