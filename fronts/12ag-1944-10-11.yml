# Reader: title read 1200 HRS 11 OCTOBER 1944, no report number, SECRET struck through (agrees with the catalogue). gcps: matched to 12ag-1944-10-12 (accepted: sheets offset +0,+24 px; 28 of 81 agree, median 1.9 px, 53 placed through the transform, so a town's place is mostly the transform's); conic fit 1.1 km rms, leave-one-out 1.2 km, worst Beauvais 3.6 km. Boxes: 10-12's 21 excludes moved by (0,+24), each tried alone: 9 caught a stretch. Kept (as moved, reasons carried): title, the three boundary boxes (Arras-Albert, Somme, Louvain-Geilenkirchen) and the Twelfth/Sixth south-west boundary. Dropped as catching nothing: the other twelve (the offset varies across the sheet: today's boundary stubs and Siegfried features lie 10-40 px from 10-12's, so those were re-found by looking at each unsure stretch and boxed afresh: the 226 unit box at 1177,1187; the First/Ninth stub at 4407,2141; eight Siegfried hatched features 5207,3177 to 6105,3692). 10-12's box for the canal boundary (4318..4703, 4380..4650) was dropped: it cuts the ticked stretch at 4581,4409 (the ticked front runs south-west to about 4560,4428 and the boundary then continues plain, untraced). The title box takes 68 lettering stretches including three 'ticks' and some 'line' ones (the letters), none front. Checks: 10-12's eight; only one is needed (4211,1467, 10-12's 4226,1432 re-centred 15,35 px; ticks north, seen on --look and on the red ticks); the seven other loop checks and 4265,2519 come out right by themselves today and are dropped. Two unsure fragments, 4286,1591 and 4255,1622, lie on the heavy edge of the hatched ring east of Heerlen where the map's ticks can't be told from the hatching bars: left out with a box (could be front; the reviewer should look at crop 4150,1520 330x180). Sides: 81 of 81 towns agree with 10-12, Metz enemy; no town changes side. No ticked front is drawn round Nijmegen, on the Antwerp-Breda line (only a thin line, not traced) or in the Vosges: nothing traced there; Nijmegen, Arnhem, Eindhoven, Breda, 's-Hertogenbosch, Bergen op Zoom, Saint-Dié, Colmar are beyond the open ends and are artefacts either way (their sides are the nearest stretch's). The ticked front runs from the Geilenkirchen arc (traced from x 4187; its west end, x 4120-4187 at y about 1210-1260, ~60 px, is not traced) and the Maastricht loop to the Marne-Rhine canal; 65 stretches, 0 unsure, 1 checked, no flips, about 326 km (10-12: 304 km, the extra mostly in the Aachen-Monschau reach where today's fragments trace more of the line). The fused Aachen-Monschau reach traces in about 15 ticked or line pieces (all but the two ring fragments above); its fused hatching parts are not distinguishable from the front by ticks.
# Reviewed: 28 of 81 towns matched to 12 October, the rest placed through the transform; the fit is 1.1 km rms over all 81. All 81 towns on 12 October's side; Metz enemy. As on 12-14 October, a ticked front only from Geilenkirchen and the Maastricht loop to the Marne-Rhine canal; none round Nijmegen, on the Antwerp-Breda line (a thin line, untraced) or in the Vosges, and towns beyond the open ends are artefacts. 65 stretches, about 326 km, 0 unsure, no flips; one Maastricht-loop stretch checked (the map's ticks north); the Geilenkirchen arc's west end (~60 px) untraced. Two fragments on the heavy edge of the hatched ring east of Heerlen are boxed as Siegfried hatching (the ticks there cannot be told from the bars; they may be front). Eight Siegfried features, a unit box and boundary pieces boxed.
