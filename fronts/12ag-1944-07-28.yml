# Reviewed: sides and the one hand-turned arc (1794,2531, the Marigny lobe's west side) are right, but the trace is thin: about 84 km of a line about 130 km long. The largest gaps are the southern arc past Coutances (1739-1955, y 2686-2750, 225 px), the ridge between the lobes (165 px), the St-Lô corner (151 px) and west of Colombelles (132 px). Radius 3 is the B01 setting; this day's ink breaks more under it than its neighbours'.
