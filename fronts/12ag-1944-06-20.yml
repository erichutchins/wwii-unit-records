# Reader: sides: 19 June's GeoJSON backed up (cmp: unchanged after --sides); 34 towns diffed between 19 and 20 June: 32 the same side, two changed, both towns at sea off the Cotentin: 1W 50N own on 19 June, enemy today (run 2 enemy at 1438,1434, with run 1 own at 2624,2647: north of the new north line, at sea, the two runs weigh it against each other, as 0.5W 50N and 1W 50N read either way on 19 June); 2W 49.5N enemy on 19 June, own today ("own (US) by run 2 own at 1438,1434"): at sea off the west coast, by run 2's open west end, as 1.5W 49.5N on 19 June. Not a stretch turned (run 2's ticks were seen on the map's, on its south side; run 1's on its NW outside). 0.5E 49.5N reads own (by run 1 own at 2624,2647), as on 19 June: an open-end artefact east of the Seine mouth. 1E 49.5N enemy, 2W 50N and 1.5W 50N enemy, 1.5W 49.5N and 1W 49.5N own (as on 19 June). No town is on land on the wrong side.
# Reviewed (8 Nov 2026): hand waypoints at radius 3, dark 170, as 19 June. Overlay crop 950,1200 looked at: the line facing Cherbourg has moved some 15 km north, from the west coast by Flottemanville over the rise south of Octeville and east north of Valognes to the marsh by Quettehou, ticked south, on the ink; the south line from St-Sauveur to the coast below Barneville stays. The 18 June lines are drawn unticked and are not front. The open coast between the two lines, and the east end past the marsh, are not drawn. 1W 50N and 2W 49.5N, at sea, read differently from 19 June (open ends). WRONG side: 0.5E 49.5N reads own, the open-end artefact east of the Seine mouth. About 216 km.
