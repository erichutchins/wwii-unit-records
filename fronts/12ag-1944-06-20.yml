# Reader: drawn as the front: a ticked line, ticks on the Allied side, enemy on the left, in two runs. Run 1 is the main line, as on 19 June: the Orne pocket's east leg (top 3853,2163, ticks west), round Colombelles (among the dashed British 3, 6 and 51 boxes), west along the Caen reach (the hump at 3153-3235, 2376-2449), down the V's east arm (x about 2915), west along the V's foot (hook at 2656-2701, 2694-2714 under the 2 box's marks), NW to the 352 box, north up the Vire past the 29 box (x 2300 to 2243, ticks east), the loop at 2360-2400, 2493-2510, NW past the 30 box (2203-2300, 2237-2347), the dip round the 101 box (2040-2063, 2165-2173 and 1937-1957, 2220-2227), west past St-Lo and the 82 box (x 1630-1880, y 1950-2130), and round the arc by St-Sauveur (top 1597,1916; dip 1440,1960) down to the west coast at 1300,2173, ticks outside (NW). Run 2 is the Cherbourg line, drawn from the west coast at 1010,1301 east over the rise at 1200,1279, down x 1217-1263 (y 1293-1400) to the row at y 1430, east under the 243 and 79 boxes (dip 1452-1600, 1442-1468), under the 709, 4 and 319 boxes to the marsh at 1920,1431; ticks south. The 9 box and the 243 box stand north of it, the 79 and 4 south. NOT the front: the unticked heavy lines of 18 June (from the 82 box east with its xx marks to the VII/VIII boxes; the curve from the 90 box round Montebourg to the VII box), the corps and army boundaries (the diagonal xxx from the 101 box NE to the VIII box, x 2300 north from the 29 box, x 2840 through the V's foot, x 3243 through the hump, x 3525 and the boundaries by the 3, 6 and 51 boxes), the dashed British boxes, the leaders from the 82 box's list ((SMALL ELEMENTS) arrows), the 'Believed on the way' box, the grey railways and roads, arrows, unit boxes, circles, and the hatched 77, 91, 265, 1755, 215, 352, 353 boxes.
