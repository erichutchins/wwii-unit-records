# Reviewed: the Falaise pocket is closed on this sheet: the front runs from the Dives mouth by the Touques and Lisieux to Trun, then out to the salient tip at Gacé/L'Aigle and back toward Le Merlerault; map ticks and red ticks agree on every stretch at 4x, no flips (22 August's Chambois ring is gone). 27 stretches, 111.5 km traced, with gaps up to 128 px on the south arc; the chaining at the Pont-l'Évêque hook and the Lisieux loop is the reader's. All 16 towns are margin ticks far from the front, so the side test tests nothing here. Two enemy symbols (the 17 south-east of Paris, the 11 at the Touques mouth) and the neat line boxed.
