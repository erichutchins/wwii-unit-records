# Reader: 3 March, report 271 (title read on the Library image: 031200 MAR. 1945; agrees with the catalogue). gcps_from 12ag-1945-03-02 (sheet offset -40,+24; 69 of 81 agree, median 1.0 px; 12 placed through the transform: Gemund, Soissons, Ostend, Nijmegen, Kleve, Soest, Marburg, Trier, Bitburg, Prum, Zweibruecken, Pirmasens). 03-02s 115 boxes moved by the median offset of the five towns nearest each (about -41..-44, +19..+21; towns off the global offset by more than 6 px left out of the medians). Signature box right edge 1568, left of the Walcheren arc west end (about 1590); the Walcheren, Schouwen-Duiveland and Tholen arcs trace, red ticks on the south on the map small ticks; the short black Duiveland arc at about 2020-2150,810 is not traced (as on 03-02, not looked into). No flips, no checks: 0 unsure.
# Reader: boxes tested against a run with no boxes (76 stretches, 6 unsure, against 54 now): every stretch the boxes remove is lettering, the stamp, the legend, a boundary or a symbol stub; the Twenty One/Twelfth boundary (Aachen end, Julich boxes), Helmond, Deurne, Turnhout, Moll, and the Second Br./Ninth US boundary end at Roermond all stay boxed. One box added: 4150,1630,4200,1725, the army boundary first stretch below Grevenbroich, which as a blue stub (run 23 at 4168,1676, no ticks) turned Julich enemy. One box dropped: the Rhine ink box at Neuss/Dusseldorf (moved to 4265-4351,1366-1456), because today front runs through that ground (run 22 at 4244,1404 and its neighbour ticked on the west) and its reason (front far west on the Roer) no longer holds; with it or without it the GeoJSON is identical. The Wittlich hook box (4228,3050,4303,3100) is also identical with or without it; kept.
# Reader: sides against 03-02: 80 of 81 agree. Grevenbroich enemy -> own: 03-02 Grevenbroich enemy by run 19 enemy at 4217,1472; 03-03 Grevenbroich     own (US)  by run 22 own at 4247,1600, run 21 own at 4264,1485. Its ring (4188,1564) sits on the old line, which has moved east (weak test; the front now runs 60 px east of the ring on the overlay crop 3900,1400, ticks on the west). Prum, Julich, Bitburg, Strasbourg own; Gemund, Adenau, Offenburg enemy; Trier enemy, Haguenau enemy (as 03-02, ring on the line, weak). Kleve own, Verviers own. Rhine above Strasbourg: one run, red ticks west of the heavy line on the map small ticks, Siegfried hatching east. Length 902 km (03-02: 942 km by the same count): shorter, the Veritable pocket gone from the line and the Rhine reach straight. Left unsure: the Goch stub is gone; 4255,3415-4237,3664 near Trier and the 25-36 px gaps in the Moselle and Saar reaches are symbol overlays between ticked runs (as 03-02).
