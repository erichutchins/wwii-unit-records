# Reader: title read 1200 HRS 9 OCTOBER 1944, no report number, SECRET struck through (agrees with the catalogue). gcps: matched to 12ag-1944-10-10 (offset -16,+0 px; 33 of 81 towns agree, median 1.6 px, 48 placed through the transform, so a town's place is partly the transform's; accepted on the first run, 10-11 and towns-B11 not needed); conic fit 1.1 km rms over 81, leave-one-out 1.1 km, worst Beauvais 3.4 km. Boxes: 10-10's 24 excludes moved by (-16,0) and each tried alone. Only three catch a stretch and are kept: the title (14 stretches of lettering; it takes one run that traced as ticked, the SECRET underline or lettering, far from the front which starts east of x 4100), the Louvain-Geilenkirchen boundary (1 stretch) and the Siegfried feature at 5354,3395 (1). The other 21 catch nothing today (no stretch traces there; the offset varies by a few px across the sheet and today's heavy ink there is not kept) and are dropped; none cut a ticked stretch. Three new boxes for stretches today's trace kept as unsure, each looked at with --look: the Twenty One/Twelfth boundary at 2550,1371 (plain heavy line) and two Siegfried hatched features at 5078,3117 and 5194,3181. 10-10 has no flips or checks to copy (the two unsure fragments there, 4254,1463 and 4443,1646, are not traced today). No ticked front is drawn round Nijmegen, on the Antwerp-Breda line or in the Vosges: nothing traced there, and the Siegfried hatching is not taken for front. The ticked front runs from the Geilenkirchen arc (from about x 4187, y 1243) and the Maastricht loop, round Aachen and Monschau and down the Ardennes edge and Luxembourg to the Marne-Rhine canal at about 4595,4395: 22 stretches, 15 ticks, 7 line, 0 unsure, no flips, about 444 km by the GeoJSON's own points (48.64-51.12N). The fused Aachen-Monschau reach traces on its east edge round the 3 and 9 boxes' arcs, with one gap of about 60 px (4390..4440, 1590..1625) in the hatched strip between them: about two thirds of it traces. Sides: 81 of 81 towns agree with 10-10 (--sides run on both, diffed town by town), Metz enemy; no town changes side.
# Reviewed: 33 of 81 towns matched to 10 October, the rest placed through the transform; fit 1.1 km rms. All 81 towns on 10 October's side; Metz enemy. As on 10-14 October, a ticked front only from the Geilenkirchen arc and the Maastricht loop by Aachen, Monschau and the Luxembourg edge to the Marne-Rhine canal (48.64-51.12N); none round Nijmegen, on the Antwerp-Breda line or in the Vosges. 22 stretches, about 444 km, 0 unsure, no turns; about 60 px of the fused Aachen-Monschau strip untraced. 21 of 10 October's boxes catch nothing and are dropped; three added (the Twenty One/Twelfth boundary and two Siegfried features).
