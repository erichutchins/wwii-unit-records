# Reviewed: towns from 02-04 (76 of 81 agree, median 0.6 px; sheet offset +8,+8 px; Verviers, Trier, Bitburg, Zweibrucken, Pirmasens placed through the transform); the 02-04 excludes copied, none moved (all still catch their ink or nothing); two new boxes (Rhine ink at Neuwied, boundary stub east of the V Corps symbol) and the Tholen arc flipped.
# Reviewed: 80 of 81 towns on 02-04's side; Prum changes (enemy to own) by run 43 at 3965,2635, the S-bend in the front west of the enemy band, a weak test (Prum lies east of the line); looked, --look 3965,2635.
# Reviewed: 80 of 81 towns on 4 February's side. Prüm reads own and is WRONG (German-held until about 12 February): its ring lies east of the line, and the test weighs the S-bend west of it (run 43, ticks on its west as the map's) over the nearer run; the trace is right, the side test misled. The Tholen west arc turned to the map's faint ticks (south).
