# Reviewed: 76 of 78 towns on 6 February's side; Gemünd and Haguenau (enemy) sit on the line. Prüm and Adenau enemy, Colmar own (the pocket's south hook turned to the map's ticks). The Tholen arc and its hook turned; 6 February's Eifel and Breda flips not needed today. Two dead-end hooks on the enemy band's outline boxed.
# Reader: 223 symbols (symbols only; the front untouched, the GeoJSON's front identical to before). By nation: 117 enemy, 76 US, 17 British, 7 French (2 FR, 5 FR, 1 FR, 10 FR, II FR, FIRST FR, ALG 3), 5 CDN, 1 POL. 166 from the box finder, 57 by eye. Lists (32): "OUT OF CONTACT" 18 (out-of-contact, incl. SIXTH and 25 read by eye), "UNLOCATED" 2 (unlocated: 49, XII SS), "VICINITY DIEPPE - ROUEN" 3 (65, 89, 13), "LORIENT - ST. NAZAIRE SECTOR" 1 (66), "IN UPPER ALSACE POCKET" 7, and 1 arrow (the enemy symbol by "?" east of Prum, label 2 with its first figure under the black arrow, read as ?2). The 9th Armored where it was on the 6th (oval 9 at about 3923,3983; 6 Feb 3951,3976). Not settled: US "1" at 3763,2407 drawn with xxx (three x) and tied to 1st-division, the 1st not drawn near 3973,2502 as on the 6th; SHAEF x marks (6 counted, 7 on the 6th); 606 zbV (6th: 3770,1405) not drawn today; the dashed XXX by Dinant read British (uk), the 6th has it US; label of box 117 "7?" and 123 "?" under black ink; arm of the 3 at 4264,2376 (airborne) and 17 SS (armored-infantry) hard to see.
