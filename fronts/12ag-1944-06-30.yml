# Reader: title SITUATION 2400 HRS 30 JUNE 1944, HQ FUSAG, COPY No. blank, no report number. Agrees with the catalogue's day (ict21025).
# Reader: towns matched to 12ag-1944-07-02's (base B01), sheets offset +0, -16 px: 34 of 34 agreed (median 1.1 px), none placed through the transform.
# Reader: METHOD: hand waypoints (`runs:`), read by eye on gridded 2x crops of the scan (grid every 50 px, labelled every 100; crops from 1150,1850 / 1550,1850 / 1950,2050 / 2150,2200 / 2400,2450 / 2650,2450 / 2900,2400 / 3250,2250 / 3400,2230 / 3620,2120 / 950,1000), 7 Nov 2026, every 50-100 px and at every bend. The stretch method failed on this thin, pale line: its ticks, closer than the tool's 25 px minimum stretch, cut the line into pieces, so that at best (radius 5, dark 120, 15 boxes) 82.7 km of some 160 traced, about half, and the Orne arc's east side was lost (0.5E and 1E 49.5N read own). Its trial (stretches, unsure, km): radius 4 dark 85 43, 6, 77; dark 100 40, 12, 56; dark 115 48, 30, 68; radius 5 dark 115 29, 1, 69; dark 120 36, 4, 82.7; dark 125 47, 10, 92; dark 130 81, 38, 154 (strays through symbols). The first reading's boxes for symbols are not used here.
# Reader: runs, each with the enemy on the left (the map's teeth are on the Allied side, looked at 3-4x: north and east on the Cotentin and the Carentan diagonal, inside the loop under the 83 box, inside the Odon salient and its east head, inside the Orne-mouth arc on its east side and bottom, east on the Vire, north on the Caen reach; the first reading's note of ticks on the south of the Cotentin line and outside the Odon head was wrong). Run 1: Orne-mouth arc's north tip (3845,2158) south down its east side, west along the Caen reach, then south down the Odon east head to the British 43 symbol (3338,2400). Run 2: from below the 43 symbol (3327,2455), down the east head, round the salient's bottom, NW up its west side, west and south to the foot of the 1 symbol, west along it, then north up the Vire past St-Lo, NW along the Carentan diagonal, round the loop under the 83 box and on west and north-west over the Cotentin ridge to the west tip at the lake (1300,2036). Run 3: the Hague stub below the 709 box, from its SW end (957,1137) up and east to (1085,1072); a separate ticked piece, about 2 km, ticks on its south, the 709 symbol north of it.
# Reader: the one break: the Odon east head runs behind the British 43 symbol between about 3338,2400 and 3327,2450 (about 45 px, 2 km): the symbol is drawn over the line and the ink is not there, and the tool bridges 40 px at most, so runs 1 and 2 stand end to end. Anything else untraced: nothing seen; the west tip stops where the drawn line meets the lake.
# Reader: settings and fit: with runs the course is the same at radius 4 and 3, dark 100, 110 or 120 (162.0 to 163.9 km, 3 runs each); radius 5 is not tried (on 8 June it left no ink between waypoints, and here the first waypoint test at radius 5 dark 120 found the line away from the waypoints). Kept radius 4, dark 110, boxes the title, SECRET and legend only. On the overlay crops (1250,1850 800x350; 1900,2050 750x600; 2600,2250 800x500; 3250,2100 700x560; 920,1020 220x150) the trace follows the drawn heavy line from end to end and its red ticks fall on the map's ticks on every run (stub included); a few waypoints sit 8-13 px off the ink (at 2065,2110 and 2015,2160 on the loop under the 83 box, 3565,2305 and 3340,2603) and the path snaps to the ink. Nothing is off the ink that I saw. No stretch flipped or checked (no stretch method).
# Reader: --sides, 07-02's GeoJSON backed up and unchanged after, run on 07-02 and today, diffed town by town: 32 of 34 the same side. Changes: "2W 50N enemy by run 3 enemy at 1007,1083" and "1.5W 50N enemy by run 3 enemy at 1007,1083" (own on 07-02): both lie at sea north-west of the open west end, and only the Hague stub (run 3) reaches them; beyond the line's end, either way. "0.5E 49.5N enemy by run 1 enemy at 3607,2309, run 2 own at 2309,2415" and "1E 49.5N enemy by run 1 enemy at 3607,2309, run 2 own at 2309,2415" are enemy, as on 07-02 (German-held). No town on the wrong side.
# Reviewed: the stretch method left about 65 km untraced at every setting; hand waypoints (radius 4, dark 110) trace the whole ticked line, about 163 km: overlay crop 1200,1850 looked at, from the west coast over the Cotentin ridge and the 83 loop, down the Vire past St-Lo, round the Odon salient, along the Caen reach and the Orne arc; one break of about 2 km where the British 43 symbol is drawn over the Odon east head. Ticks on the Allied side throughout (the first reading's 'south' and 'outside' were wrong). No town on the wrong side; 0.5E and 1E 49.5N enemy again (the Orne arc's east side now traced).
