# Reviewed: 05-02's boxes shifted by the sheets' offset +8,-32, each measured against an unboxed trace (183 runs). Box 111 (05-02's Waal stub at Nijmegen) is dropped:
# shifted it held run 110, the Dutch front itself (23 px at 440,2084, map ticks drawn). Boxes 0, 1, 85 hold only title/stamp letters (runs 9, 10, 12, 22, 25, 45...), box 5 the
# unticked Twenty One / Twelfth boundary (run 109, its 'ticks' are the grey railways'); no other box holds a run the tool found ticked. One new box (the Saarbruecken-Speyer line).
# area widened from 05-02's [382,1279,3750,6250] to x1 4300: the Bavarian wedge's ticked arc (Glonn, Wasserburg, about 3800-4150,5560-5740, lat below 48N, past the towns' spread
# and past x 3750) was dropped otherwise; looked, overlay crop 3600 5350 700 600: heavy black, map ticks on the Allied (north-west) side, the hatched enemy inside.
area: [382, 1279, 4300, 6250]
