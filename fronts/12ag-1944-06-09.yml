# Reader: title SITUATION - 2400 HRS 9 JUNE 1944 / HQ FUSAG / COPY NO. ___ (blank); "12 AG OUTLINE MAPS 1:500,000" at the top left margin; SECRET struck through at the top right; no report number. Agrees with the catalogue (ict21004, 1944-06-09).
# Reader: towns: matched to 12ag-1944-06-08, offset -8,+8 px: 31 of 34 agree (median 0.7 px); three placed through the transform: 1.5W 49.5N (62 px off), 1W 49.5N (79) and 1.5W 48.5N (24).
# Reader: legend: U.S., BRITISH, ENEMY keys and a dashed BOMB LINE key; no FRONT LINE sample. Toothed: the Utah lodgement's arc (from beside the VII/V Corps boundary north of Carentan, round Carentan's north, up the west side past the 4th Division box to about 1919,1678), and one line from the Omaha arc's hook at Isigny along the Omaha arc, over the 1st US/2nd British boundary, along Gold and Juno to Courseulles, over the arch of the Bayeux salient (about 3330-3480,2200-2350, "PZ?" inside), and east along the Sword coast to the pocket east of the Orne (6 AB boxes). Not toothed: arrows, the VII/V Corps, 1st US/2nd BR, and the British corps boundaries (heavy black, no teeth), the bomb line, unit boxes, the tank circle, the PZ LEHR arrow. The Utah arc and the Omaha line are not joined on the sheet (no toothed line between about 2230,1890 and 2297,2047; the heavy diagonal there is the corps boundary).
# Reader: TEETH DIRECTION: looked on enlarged crops of the scan (1850,1500 600x650; 2250,1950 700x330; 2850,2050 750x500; 3350,2000 900x600): the teeth hang seaward/friendly: inside (east) the Utah arc, on the north side of the Omaha-Gold-Juno-Sword line, outside the Bayeux arch (west of its left leg, east of its right leg: the arch's inside is the enemy's "PZ?"), inside the 6 AB pocket. As on 8 June (the July convention), the reverse of 7 June. Nothing is flipped; every run is ordered with the enemy on the left (the Utah arc from its NE end south, west and north; the long line from the Sword pocket west).
# Reader: METHOD: hand waypoints (`runs:`), read by eye on the crops above, started from 8 June's waypoints shifted -8,+8 and then redrawn on today's ink (the sheet differs much from 8 June: the line is now one long line from Sword to Isigny, the Omaha arc has pushed to the Aure at Isigny, the Utah arc is closed at Carentan). Radius 4, dark 115 as on 8 June. A third run, the toothed stub north-east of the 4th Division box (about 1995,1640 to 2060,1570, teeth on its lower right), has no heavy ink the mask keeps (pieces under 2000 px are dropped) and the tool snapped it 50-70 px away, so it is left out; the upper east leg of the Sword pocket (about 3826-3867,2183-2297) is likewise too thin for radius 4 (radius 3 and 2 either left no path or snapped to the box's edge), so run 2 starts at 3826,2297.
# Reader: result: 2 runs, about 129.5 km from the GeoJSON (33 km the Utah arc, 96 km the long line; the same sum gives 117.5 km for 8 June's file). Off the ink or untraced: the stub NE of the Utah arc and the pocket's upper east leg (above); at the Isigny hook the path's last 50 px run on the line's thick end; elsewhere the red ticks fall on the drawn teeth (overlay crops 1800,1500 1500x700 and 2850,2000 1100x450).
# Reader: boxes: with waypoints only the title, SECRET and legend boxes are kept.
# Reader: sides: 50N own (US); 2W 49.5N and 1.5W 49.5N enemy (west of Utah, right); 1W, 0.5W 49.5N own (the bay); 0.5E and 1E 49.5N own by run 2 (inland on the coast east of the Seine's mouth, German-held: the open-end artefact, no line between them and the sea, as on 8 June); 49N and south enemy. Against 8 June two towns changed: 2W 50N (enemy then, own now: sea west of the Utah arc's open end, where the town sits off the arc's line; today run 1 reads it own at 1963,2016 where 8 June's read it enemy at 1933,2004: an open-end reading, no town on land is affected) and 1E 49N (own then by the open end at Sword, enemy now: run 2 now ends at the pocket east of the Orne).
# Reviewed: hand waypoints at radius 4, dark 115, as 8 June; overlay crop 1800,1450 looked at: the Utah arc from north of Carentan round to the 4th Division and the long line from the Isigny hook along Omaha, Gold and Juno over the Bayeux arch to the 6th Airborne's pocket east of the Orne follow the toothed ink, teeth seaward (the Allied side). Untraced: a short stub north-east of the 4th Division box and the pocket's upper east leg (too thin for the mask), a few km. WRONG sides, open-end artefacts east of the Seine mouth: 0.5E and 1E 49.5N read own (German-held). About 130 km.
