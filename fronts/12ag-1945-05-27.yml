# Reader: report no. 356, situation as of 271200 MAY 1945 (title read at 4100,150, 1900x1000; the signature is hard to read, "C. T. Schmidt (?)", for A. Franklin Kibler). Agrees with the catalogue (27 May). The legend (bottom left, overlay crops 0,5500 and 600,5900) still has its U.S., BRITISH, ENEMY and FRONT LINE samples, as on 26 May.
# Reader: the sheet draws the line of contact with the Soviet armies as the ticked line (US ticks on the west side): small black ticks seen at 4x on the Elbe at Schnackenburg (3400,340), at Sandau (3700,560), on the Kaplitz connector (5154,4223) and on the Strakonitz stretch (4870,3570, 4920,3610). The heavy EAST BOUNDARY TWELFTH A.G. is bare or x-marked (x marks at 4250,2400-ish and 4850,3540; lettering at 4400,2480 and 4560,3510) and is boxed; the bare straight diagonal Karlsbad to the Pilsen road and Strakonitz to Budweis to Kaplitz (4x at 4290,2900, 4380,3020, 5066,3723, 5176,3863, 5201,3973, 5201,4113) are boundary, boxed.
# Reader: towns matched to 26 May's: 56 of 58 agree, sheet offset +0,+8 px (median 0.6 px); two placed through the transform (15E 53N, 13E 50N); conic fit rms 0.7 km, worst 1.6 km (11E 47N).
# Reader: 26 May's 61 boxes were moved by an affine fit of the 56 agreeing towns (rms 0.7 px, max 1.6; in effect a shift of about 0,+8; large boxes by corners, small by centre). Each was checked against a run with no boxes at all (350 stretches): none held a ticked stretch of today's line (the few holding a stretch the tool called 'ticks' were looked at 4x: Annaberg 4248,2636, Tyrol border 3688,5325, Gross Venediger 4096,5564 (x marks), Asch 3927,2857, Bavaria-Bohemia 4052,3288, Thuringia-Bavaria 3620,2710 and 3759,2759, Saxony 4982,1629: all bare boundary or hatched border, no ticks). About 30 of the 61 moved boxes hold no stretch middle today (cut differently, or covered by the added ones); kept as on 5 June, they cost nothing.
# Reader: 14 boxes added (75 in all) (reason and place in each), all from 4x looks: the Strakonitz-Budweis diagonal and Budweis-Kaplitz (26 May's box there no longer held the stretches), Karlsbad to the junction at 4454,3142 and the boundary into Karlsbad (4225,2700), the Thuringia-Bavaria border at Rodach (3115,2726), the Chemnitz fork's boundary (4252,2295), the hatched border above the Kaplitz connector (5092,4231), the Enns upper line (4932,5204), two Radstadt tangle pieces (4738,5281 and 4725,5317), the Tauern double band's upper line (4848,5470), the boundary west of Heiligenblut (4345,5566) and the boundary east of Heiligenblut to the Katschberg tip in two pieces (about 4640,5590 and 4880,5680; 26 May's box at 4753,5571 sat above its middle). A box I put at 4840,3540 on the bare-looking run beyond the x marks was REMOVED: the run from the x marks to the Strakonitz junction (4960,3640) carries small black ticks on its lower-left side (4x at 4870,3570 and 4920,3610) and is traced (ticked, as on 26 May).
# Reader: nothing is unsure, no flips, no checks needed (46 stretches: 26 ticks, 20 line, 0 unsure). Compared with 26 May: the traced line is the same to within 4 km everywhere except the Radstadt finger and the Carinthia bands (13.0-13.8E, 46.8-47.4N: 26 May's two short Radstadt heavy-line pieces and 5 km of the band's edge not here, today's band edges cut a little differently); 1146 km against 1165 km on 26 May (19 km shorter, all at those bands). Not traced, as on 26 May: the Lienz loop in Carinthia lies outside the traced area.
# Reader: sides: 57 of 58 towns as on 26 May. One changed: 26 May "9E 47N           own (US)  by run 51 own at 3970,5447, run 50 enemy at 4188,5402, run 48 enemy at 4369,5388, run 55 enemy at 4467,5519", today "9E 47N           enemy     by run 39 own at 4010,5458, run 40 enemy at 4188,5430, run 38 enemy at 4287,5429, run 37 enemy at 4437,5484". 9E 47N is in Switzerland, 500 px beyond the Salzach/Tyrol line's open west end; the one run near it (39, the line's end at 4010,5458) is own as before, and the tool's weighing flips because today's chains are cut differently (run 37 now at 4437,5484 where 26 May's run 55 lay at 4467,5519). The line there is the same ticked Salzach line, checked on the overlay (crop 4000,5300); an open-end artefact, not a stretch turned. 14E 47N enemy and 14E 49N own as on 26 May.
