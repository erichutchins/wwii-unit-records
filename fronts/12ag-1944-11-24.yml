# Reader: title read 7 Nov 2026: 1200 hrs 24 November 1944, no report number; agrees with the catalogue (ict21173, 1944-11-24). Towns matched to 11-25 (offset +8,-8 px): 72 of 81 agree, median 0.8 px, 9 placed through the transform (Saint-Die 22 px, Landau 9, Pirmasens 8, Karlsruhe 8, Juelich, Nijmegen, Kleve 7, Zweibruecken 6, Bitburg 4). 11-25's boxes and check shifted by +8,-8, then each dropped alone and in combination: dropped as catching nothing even together: the Canadian/British box, the Seventh/First stub 4320-4420 x 5530-5585 and the ALG 3 stub box 4486-4516 x 5552-5568 (alone and together nothing changes; the 4160 stub box and the Marne-Rhine canal box each let one boundary stretch through, kept). The Ninth/First tail box (3428-3498 x 2062-2107) catches nothing alone or with the dropped ones here, but kept as the brief orders. Added: the Ninth/First middle (3540-3860 x 1950-2070; without it Verviers enemy and one unsure fragment), the First/Third box lengthened east to 4045 (its end at the front, at 4026,3715 unsure otherwise), and three small boxes on the First/Third strand beside the front north of Arlon (five unsure fragments; a wide box cut the front). The 11-25 check (3939,2217) matched nothing here (0 checked by eye, nothing unsure): dropped. No flips. The Saar and Vosges front traces whole. Strasbourg: this sheet draws no front round it (see sides line), reads enemy: not compensated.
# Reviewed: all 81 towns on 25 November's side. Strasbourg reads enemy and is WRONG (liberated 23 November; "Strasbourg       enemy     by run 56 enemy at 4953,4598, ..."): as on 25 November the sheet draws no front round the city, only the 2 FR symbol in the open. Jülich, Haguenau, Kleve, Landau, Darmstadt enemy; Namur, Huy, Verviers, Toul own. 66 stretches, about 861 km, 0 unsure, no turns; the Saar and Vosges front traces whole. Boxes added on the Ninth/First boundary's middle (it had put Verviers enemy) and three small ones on a First/Third boundary strand doubling the front north of Arlon (a wider box cut the front); three empty boxes dropped.
