# Reviewed: towns from 02-03 (75 of 81 agree, median 0.6 px; sheet offset -8,-16 px); excludes and the two Walcheren/Tholen flips copied from 02-03 and checked on the overlay; the Rhine (Bonn to Bingen) and the 65 symbol outline are new boxes.
# Reviewed: the Tholen and Beveland arcs: with no flip, today they are ticked stretches whose red ticks fall on the map ticks south of the arcs (the Allied side); a flip copied at 02-03 coordinates would miss (tool tolerance 8 px) and one placed at today's would turn them wrong.
# Reviewed: 80 of 81 towns on 3 February's side; Haguenau on the Moder line a weak test. The Scheldt arcs come out ticked south by themselves today, so 3 February's two flips are not carried. This darker scan shows the Rhine's own ink at Bonn, Linz, Koblenz and Bingen: boxed.
# Reader: the unit symbols read 7 Nov 2026 across the whole sheet, 225 (de 119, us 77, uk 16, fr 7, ca 5, pl 1; 21 listed: 17 out-of-contact, 3 unlocated, 1 lorient-st-nazaire); 165 from --boxes, 60 found by eye on the overview tiles. Not settled: the arm of the enemy 15 (read armored) and 17 SS (read armored-infantry) in dark hatching; the label of the enemy box at 3912,3050 (hidden by the front band: ?) and of the one at 4125,3229 (?12, 212 on 28 Jan); "5 ELMS" at 3865,2935 (the first character S or 5); XXX at 2993,2518 drawn as an open US box (28 Jan: British); the Dieppe-Rouen inset (65, 89) and the "IN UPPER ALSACE POCKET" box (189, 198, 338, 159, 2 MTN, 716, 106; 7 symbols) are captioned boxes with no word in README's list, so left unlisted pending one; an arrow to "?" at about 4290,3170 beside the 352 symbol is not attached to a symbol and is not recorded.
# Reviewed (8 Nov 2026, the symbols): 225 unit symbols read across the whole sheet (119 enemy, 77 US, 16 British, 7 French, 5 Canadian, 1 Polish; 165 by the box finder, 60 by eye); the front is unchanged. Overlay crops 380,1850 and 5900,5100 looked at. Lists: UNLOCATED (49, 8?, XII SS), OUT OF CONTACT (17, the SS panzer divisions and corps, SIXTH among them), the 66 at Lorient and St-Nazaire, the 65th and 89th in the inset "VICINITY DIEPPE - ROUEN" (`dieppe-rouen`, a new word in the README, also given to 28 January's three), and seven enemy symbols in the new box "IN UPPER ALSACE POCKET" (`upper-alsace-pocket`). The corps lettered XXX (the British XXX Corps) is drawn as a plain open box and recorded as drawn (us). Labels under the front band read `?` (3912,3050) and `?12` (4125,3229, 212 on 28 January); "5 ELMS" may be "S ELMS". The enemy 15's and 17 SS's arms are uncertain in the hatching.
