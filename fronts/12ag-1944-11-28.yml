# Reader: title read 7 Nov 2026: 1200 hrs 28 November 1944, no report number; agrees with the catalogue (ict21177, 1944-11-28). Towns matched to 11-29 (offset -32, -16 px; 11-29's own towns, which were matched to 11-30): 60 of 81 agree, median 0.6 px, 21 placed through the transform (Grevenbroich 20 px, Eindhoven 19, Adenau 19, Jülich 19, Gemünd, Haguenau, Colmar 17, Nijmegen 15, Landau 13 ...). 11-29's ten boxes shifted -32,-16 and each tried alone (trace with and without it). The title box was lettered differently on this sheet: SECRET at y 330-385 (above the shifted box, 33 unsure fragments without a correct box) and the lines to y ~730, so box 1 is [250, 300, 2350, 760], not the shifted one; it stops above the Walcheren/Beveland/Tholen arcs (highest y ~860) and west of the Hollandsch Diep arc (x ~2130+, y ~810+, and the front at x 2350 is at y ~776). Kept the other eight shifted boxes: each catches only unsure fragments, legend sample or boundary lines (the Twenty One/Twelfth box releases 3 'line' stretches, the railway-ticked boundary; none cuts the ticked front). Dropped the Twelfth/Sixth boundary's last-stretch box (shifted 4484-4624, 4442-4558): trace identical without it. Three new boxes for the fragments left unsure, each looked at (--look and overlay crops): the First/Third boundary's last bit curving onto the front's corner at 3991,3695, and the two stubs of the Seventh/First French boundary at 4334,5515 and 4152,5613 (11-29's box there caught nothing; here the boundary sits further left). 11-29's checked entry at Gerardmer dropped: its stretch comes out right alone. Rhine north of Karlsruhe: nothing traces there, no box. No flips; Scheldt arcs ticked south as the map's. 53 stretches, about 960 km, one line, 0 unsure.
