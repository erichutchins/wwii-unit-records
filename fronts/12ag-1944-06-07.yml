# Reader: title SITUATION - 2400 HRS. 7 JUNE 1944 / HQ. FUSAG ("12 AG OUTLINE MAPS 1:500,000" at the top left margin), SECRET struck through at the top right; no report number. Agrees with the catalogue (ict21002, 1944-06-07). The brief's "6 June" wording was 6 June's; this sheet says 7 June.
# Reader: towns: matched to 12ag-1944-06-06, offset -16,-16 px: 30 of 34 agree (median 1.1 px); four placed through the transform: 2W 50N (6 px off), 1.5W 50N (5), 1W 49.5N (44), 1.5W 48.5N (80).
# Reader: legend: U.S., BRITISH, ENEMY keys, no FRONT LINE sample. The sheet DOES draw a ticked line, unlike 6 June: hand-drawn with short teeth, in three parts on the scan, from the 18 box at Omaha/Port-en-Bessin (about 2880,2085) east through Arromanches-Courseulles (the arcs at 2900-3250,2090-2250 and 3290-3750,2150-2250) to the Sword/Ouistreham end (about 3700,2310). Not drawn ticked: Utah and the airborne area (the loop round 82/101 at Ste-Mere-Eglise is a plain heavy line, looked at on four crops), and no ticked Orne bridgehead arc east of the Orne (the heavy marks there are arrows and boxes). Everything else heavy is plain overprint: attack arrows, the 1st U.S./2nd BR army and I Corps boundaries, the dashed lines, AIR RCN LINE, the tank circles.
# Reader: re-read 7 Nov 2026 with the tool's dark key. Setting kept: radius 5, dark 115 (the line here is thin and pale). On the first boxes (arrow box to y 2150): r5 d70 (old) 25 km/7 stretches; r5 d85 24.3 km (7: 1 ticks, 1 unsure); r5 d100 28.1 (9, 3 unsure); r5 d115 30.4 (11); r4 d85 33.3 (13, 5 unsure); r4 d100 41.3 (22, 10 unsure); r4 d115 47.6 (26, 18 unsure: strays through the CON lettering, the legend and box marks). After the arrow box was cut to y 2000 with the shafts boxed singly: r4 d100 36.2 km, 21 stretches, the Gold arc's middle (3130-3290) still missing; r4 d115 41.5 (25, 18 unsure, strays); r4 d130 75.9 (37, junk); r5 d115 36.3 km before its strays were boxed, 28.0 km after. Radius 5 breaks the line least at dark 115; radius 4 breaks the arc in the middle at 100 and 115 both.
# Reader: boxes (30, all on the scan): the first reading's 14 kept, the big arrow box [3000,1000,4400,...] cut to y 2000 (its lower part replaced by small boxes round single shafts: 3000-3030, 3080-3135, 3255-3330 above y 2112; 3470-3570, 3500-3570 down to 2185, 3570-4000 to y 2150, 3425-3500 the two arrow heads north of Douvres, 3568-3610 an arrow tip) so the toothed arc below is never cut; plus the plain line south from the 18 box (2875,2100-2190), the plain boundary south from the arc at Douvres (3490,2212-2262), the arrow feet and the SS-box mark at the Orne mouth (3770,2180; 3860,2140), the CON lettering far south (2440,3690-3790) and a 25 px stub of the 191 box under the arc's lowest bend (3598,2318-2352; the one box that might touch a tooth, it is below the arc: looked at on crop 3610,2330, say if wrong). The reviewer's I Corps box [3222,2195,3282,2310] kept.
# Reader: result: 7 stretches, 6 of them the ticked arcs (flipped) and 1 unsure (the arc's western start, 2880,2084, a short piece without recognised teeth, left unflipped; its side reads right: north own, south enemy). 28.0 km from the GeoJSON, 0.72W to 0.285W. The overlay (crop 2820,1950 940x430) follows the drawn teeth from the 18 box to the Sword end except four short gaps of about 60-70 px each (about 2-3 km each, 8-10 km of the roughly 38 km line): the dip of the Gold arc at about 3075-3150,2190-2200; the junction at about 3220-3290,2130-2170 where the corps boundary meets the arc and the traced piece hooks; the Douvres bend at about 3465-3535,2190-2200 where the boundary runs south from the arc; and the last bend into the Sword end after 3650-3700,2300-2320 (the tool traced up to the end bend on both sides). The line is continuous on the map through all of them.
# Reader: FLIPPED ALL SIX RUNS: the map's teeth hang on the south (inland) side of the arcs, and the Allied arrows come from the sea to the north, so unflipped --sides put every inland town on the US side. Reverse of the July sheets, where ticks fall on the Allied side. The flips are now at 3002,2133; 3193,2173; 3376,2160; 3537,2208; 3572,2269; 3658,2308. --sides now: 50N towns own; 49N and south enemy except 0.5E 49N and 1E 49N, which read own (by runs 5 and 6, the diagonal Douvres-Sword stretches, which they sit beside, not across; towns east of the Orne mouth have no line between them and the sea, and 49N there is south of the line, so this is the side test's geometry, not a flipped stretch; unresolved); 2W 49.5N reads enemy and 1.5W 49.5N, 1W 49.5N own (sea-side towns on the west end of an arc that does not run there; not evidence). The reviewer should still decide whether the ticks are the draughtsman's convention (toward the enemy).
# Reviewed: the first sheet with a front: a hand-drawn toothed line from Port-en-Bessin round Gold, Juno and Sword to Ouistreham (no FRONT LINE sample; Utah, the airborne area and the Orne are not toothed). The teeth hang on the inland (enemy) side, the reverse of July (scan crop 2820,1950), so all six stretches are flipped rightly. Radius 5, dark 115. Overlay crop looked at: about 28 km of a line of about 38 traced; untraced, four bends of 2-3 km (the Gold dip, the Courseulles junction, the Douvres bend, the last bend at Sword). WRONG sides: 0.5E 49N and 1E 49N read own, east of the Orne mouth where no line separates them from the sea (an open-end artefact; both German-held).
