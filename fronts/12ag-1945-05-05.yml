date: '1945-05-05'
as_of: 051200 MAY 1945
report: 334
title: '12 Army Group Outline Map 1:1,400,000. Top right, lettered by hand: SECRET, HQ 12TH ARMY GROUP, SITUATION MAP, TO ACCOMPANY G-3 REPORT NO 334, SITUATION AS OF 051200 MAY 1945, signed C. T. Schmidt for A. FRANKLIN KIBLER, Brigadier General, G.S.C., A.C. of S., G-3. Top left, the stamp: Auth: CG, Twelfth Army Group / Initials: C.T.S. / Date: 5 MAY 1945'
read: the title on the sheet (title.jpg via --title 3900 200 1700 1000), 7 Nov 2026
gcps_from: 12ag-1945-05-04
# Reader: 05-04's boxes shifted by the sheets' offset -48,-32 (--gcps-from 12ag-1945-05-04: 51 of 60 towns agree, median 1.5 px; 05-04's own were 05-03's shifted +48,+72), each measured against an unboxed trace (263 runs, 106 in boxes). No box dropped: the only ticked runs inside boxes are the title/stamp letters (boxes 0, 1, 85, 141: runs at 1031,560, 1238,665, 820,6148 looked) and the unticked Twenty One / Twelfth boundary in box 5 (run at 1357,2161 looked, grey railway ticks only); the long runs at 2095,3964, 2858,4064 and 1646,4547 (boxes 21, 79, 123/137) are the Twelfth / Sixth boundary, heavy, no ticks (looked). A uniform shift left five boundary stretches a few px outside their boxes (the middle of a long run moves with the skeleton), so each is boxed anew at its middle (the last five boxes). The Inn-corridor stubs sit at 4522,5358 and 4591,5372 today (05-04's flips, shifted, fell 21-29 px off): one flip, one checked.
# Unsure, left as found (not turned or checked, for the reviewer): the chord across the Schonberg salient (three stretches at 3426,481, 3466,477, 3494,472): its red ticks fall north, the map's own ticks on it hang south, but the sheet draws a new front line round the salient's head north of it (05-04's front ran along the chord's place), so it may be the old line left in heavy black; sides unaffected (looked, overlay crop 3300 380 300 200). The salient's head near Elsfleth (2010,996, 40 px, the tip by the '481 NR' symbol): ticks too few to tell (overlay crop 1880 900 250 200).
