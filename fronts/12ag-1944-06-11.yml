# Reader: title SITUATION - 2400 HRS 11 JUNE 1944 / HQ. FUSAG / COPY No. ___ (blank); "12 AG OUTLINE MAPS 1:500,000" at the top left margin; no report number. Agrees with the catalogue (ict21006, 1944-06-11). Legend read on the sheet: U.S., BRITISH, ENEMY keys, a dashed BOMB LINE and, new today, a FRONT LINE sample (a hatched stroke), bottom left (the legend box is excluded).
# Reader: towns matched to 12ag-1944-06-10, sheets offset +0,+8 px: 34 of 34 agree (median 0.5 px); none placed through the transform.
# Reader: toothed: one line, the whole front now joined: from the top of the Orne pocket's east leg (below the SS box; the thin arrow from the SS box to it is not toothed) down the leg, west along the Caen reach, round a foot at Tilly (3095,2481), north-west to the Aure (2900,2302), the V of the American/British junction with its foot at about (2550,2501) (the 2nd and 29th Divisions inside it), up to Isigny (2250,2092), round the Carentan loop (2125,2107-2165,2045) to the Utah arc, west along the south, north up the west side and round the top (a short second run beyond the 4th Division box). The sheet differs much from 10 June: the front is no longer along Omaha but runs inland from Isigny through the V to Tilly; Utah and Omaha are joined at Carentan. Not toothed: arrows (the thin one to the SS box), the corps and army boundaries (heavy black, no teeth: the diagonal at (2150-2200,1950-2010), the verticals at x about 2900, 3300, 3500), the bomb line, unit boxes and circles, the dashed lines.
# Reader: METHOD: hand waypoints (`runs:`), read by eye on gridded 2x crops of the scan (grid every 50 px, labelled every 100; crops from 1750,1550 650x650; 2050,1950 650x300; 1600,1550 450x550; 2300,2200 650x450; 2850,2150 650x450; 3350,2150 650x400; 3700,1950 500x350), 7 Nov 2026, every 50-100 px and at every bend, started from 10 June's waypoints shifted +0,+8 and then redrawn wholly on today's ink (the old Omaha course no longer fits). RADIUS 3, not 4: at radius 4 the heavy mask drops the east half of the line (the Caen reach east of about 3195,2437 and the pocket's leg, about 8 px wide) and the trace stops with "no ink between"; at radius 3 every waypoint lands within 6 px of one connected skeleton. Dark 110. Teeth: looked on the crops and the overlay: they hang on the Allied side (inside Utah, inside the V, north of the Caen reach, west of the pocket leg); nothing flipped; the run goes pocket-top, west and round to Utah's top, so the enemy is on the left throughout.
# Reader: result: 2 runs, about 147.1 km from the GeoJSON (135.9 km run 1, 11.2 km run 2; 10 June 123.3 km). Overlay crops (1700,1580 700x520; 2900,2150 1000x450; 2100,2000 700x550) looked at: the trace follows the drawn heavy line end to end and the red ticks fall on the map's teeth. Off the ink or untraced: behind the 4th Division box (1770,1657 to 1832,1640) the line is hidden and bridged by the tool (about 60 px); at the pocket's top the path starts at 3851,2152 where the thick line ends under the arrow; nothing else seen.
# Reader: boxes: with waypoints only the title, SECRET and legend boxes are kept.
# Reader: sides: 10 June's GeoJSON backed up and unchanged after (cmp), --sides run on 10 June and today and diffed town by town: one change. Tool's line today: `2W 50N           enemy     by run 1 own at 2658,2441, run 2 enemy at 1937,1623` (10 June: own). 2W 50N lies at sea off the Cotentin's north-west, outside the front's spread: the two runs disagree (run 2 is now only the Utah top and its middle at 1937,1623 weighs against run 1's far middle), an open-end artefact, not a stretch turned wrong; 2W 49.5N and 1.5W 49.5N enemy, 1W..0.5E 49.5N own as before. 0.5E and 1E 49.5N still read own (inland east of the Seine mouth, German-held: open-end artefacts as on 8-10 June, no line between them and the sea). All other 33 towns unchanged.
# Reviewed: the first June sheet whose legend has a FRONT LINE sample. Hand waypoints at radius 3, dark 110 (at radius 4 the thin east half of the line drops out of the mask); overlay crop 1750,1550 looked at: one line from the Utah lodgement round Carentan (Utah and Omaha joined), south through the V with the 29th and 2nd Divisions inside, past Tilly and along the Caen reach to the Orne pocket, ticks on the Allied side; the Utah top is a second run past the 4th Division's box. WRONG sides, open-end artefacts east of the Seine mouth: 0.5E and 1E 49.5N read own (German-held). About 147 km.
