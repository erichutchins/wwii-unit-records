# Reviewed: towns from 02-05 (74 of 81 agree, median 0.7 px; sheet offset +0,-8 px; Gemund, Nijmegen, Munster, Trier, Prum, Zweibrucken, Pirmasens placed through the transform); the 02-05 excludes and the Tholen flip copied; the old Rhine-ink, 65-symbol and boundary boxes kept where they still catch ink (the Houffalize stub, the Prum hook and the 5170,3872 hook box catch nothing today, kept in place); 19 new boxes (Rhine, Mohne lake, Gouda/Rotterdam/Dordrecht ink, Turnhout and Houffalize/Ourthe boundaries, Helmond boundary, symbol outlines) and the heavy-ink check on each.
# Reviewed: flips: Tholen arc (two points, one stretch, still needed: without it the arc is magenta with red ticks north), the front east of Breda (2751,725, red ticks north, Breda read enemy) and five runs of the Eifel front from 4119,2344 to 4057,2609 (ticks east, Adenau and Prum read own); two Eifel pieces and the Strasbourg piece checked; two unsure left, at Colmar's south hook (5129,5581 and 5057,5602), a heavy hook at the pocket's end, Colmar own agrees, not looked at closely.
# Reviewed: 79 of 81 towns on 02-05's side. Pruem reads enemy (right: German-held until about 12 February; runs 52, 49, 53 all enemy; 02-05 read own by its S-bend run, which the Eifel flips now turn right). Gemuend reads own (02-05 enemy): its ring (4135,2221) lies on the heavy line, which can read either way.
# Reviewed: 79 of 81 towns on 5 February's side; Prüm (enemy) is right again; Gemünd (own) sits on the line. The five Eifel runs turned by hand are right: their red ticks now stand west with the US 9, 2, 99, 1, 87 and 4, the enemy's 89, 246, 18 and 326 east (reviewer's crop 3950,2200). 19 boxes added: Rhine, lake and Dutch river ink, boundaries at Turnhout, Houffalize, the Ourthe and Helmond, two symbol bases.
# Reader (units, 8 Nov 2026): 224 symbols, read from the sheet and not from another day's file: 117 enemy, 78 US, 16 British, 7 French, 5 Canadian, 1 Polish; 171 from the box finder's numbers and 53 found by eye (the British, Canadian and Polish boxes, most corps and armies, the Eifel's 8, 78(+), 277, 89, 99(+), 87, 18 and XIII, the pocket's 159, 2 MTN, 716 and UPPER RHINE, the 25 in the out-of-contact box, C IN C ADV, XC, TWELFTH, FIFTEENTH (US) and the 65, 89 and 66 in their boxes). Lists: OUT OF CONTACT 18 (out-of-contact), UNLOCATED 2 (unlocated: 49 and XII SS), IN UPPER ALSACE POCKET 7 (upper-alsace-pocket), VICINITY DIEPPE - ROUEN 2 (dieppe-rouen: 65 and 89), LORIENT - ST. NAZAIRE SECTOR 1 (lorient-st-nazaire: the 66, a box with an arrow off the sheet to the west), arrow 4 (the 331 and 604 zbV with an arrow stub drawn up from their x marks toward N.W. AMSTERDAM; the unreadable "?" symbol by Waxweiler whose label has an arrow to a "?"; the US 3(+) by Colmar with an arrow drawn down from its label); unsure of the arrow word on the first two and the last. The 9th Armored where it was on the 5th (3951,3976 on this sheet, 3938,3979 on that, by Moyeuvre). Unsure: 41 (US "35", figure after the 5 under the front's band); 56 ("272?", scribbled over); 115 ("7?", second figure under the band); 123 (label "?" under the front's ink); 167 (de, under the band, arm unread); 15 and 25 in the out-of-contact box drawn with a cross over an oval (armored-infantry; 5 February's file reads armored); the 83 labelled "FE" (5 February: FR); 176 (FR, its figure not read); SHAEF drawn with seven x; 80(±) and 4(±) as drawn; TWELFTH xxxxx tied to the 12th Army Group; the 14(-) oval is at Seille and the 42(-) cross by Sarrebourg (5 February's file has them the other way).
