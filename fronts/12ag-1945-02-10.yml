# Reader: towns matched to 02-09 (sheet prints 16 px right of it; 72 of 81 agree, median 0.7 px; nine placed through the transform, Pruem 50 px off). --sides diffed with 9 February: 80 of 81 agree; Gemuend now reads enemy ("Gemünd           enemy     by run 41 enemy at 4091,2298, run 40 enemy at 4074,2194"; 9 Feb "own (US)  by run 46 own at 4113,2245"): its ring (4128,2230) stands 15 px east of the Heimbach line, which runs at about 4110 there, ticks west (looked, overlay crop 4000,2130); on 02-09 ring and line were within a pixel, so it is the line, not a wrong stretch. Pruem and Adenau enemy; Haguenau own ("Haguenau         own (US)  by run 65 own at 5235,4535"): on the Moder line, a weak test. All 02-09 flip/checked entries dropped (each stretch comes out right by itself; looked at the Veritable south reach, Moselle bend at 4211,3672, Eifel pieces, Rhine below Strasbourg); one new check (4009,3185) and one new boundary box (3570,2135,3665,2180). The Seraing box is kept from 02-09 but traces nothing today with or without it.
# Reviewed: --sides diffed with 9 February: 80 of 81 agree. Gemünd now reads enemy ("Gemünd           enemy     by run 41 enemy at 4091,2298, run 40 enemy at 4074,2194"; 9 Feb "own (US)  by run 46 own at 4113,2245"): its ring sits about 15 px east of the Heimbach line, ticked west; Gemünd was still German until March, so enemy is likely right and 9 February's own a ring on the line. Prüm and Adenau enemy; Haguenau own (on the Moder line, weak). 84 stretches, 790 km, one unbroken line Walcheren to Colmar; 9 Feb's flip and checks dropped (those stretches read right by themselves), one check added at 4009,3185 from its neighbours' ticks; one boundary box added at the Twenty One/Twelfth boundary's eastern piece.
# Reader (symbols): 224 symbols (117 de, 78 us, 17 uk, 6 fr, 5 ca, 1 pl; 150 xx, 46 xxx, 15 xxxx, 7 xxxxx, 3 xxxxxx, 3 x): 159 from --boxes, 65 read by eye (the British and Canadian boxes, most corps and armies, the Nijmegen column, the Eifel and Roer-Huertgen boxes, the out-of-contact column, the Upper Rhine list, the 65/89/13/71 inset). Read from gridded 1.6x tiles and magnified crops of the scan, every dot checked on 21 overlay crops. Lists: 15 out-of-contact (box "OUT OF CONTACT"), 2 unlocated ("UNLOCATED": 49, XII SS), 9 upper-rhine-area ("UPPER RHINE AREA"), 4 dieppe-rouen ("VICINITY DIEPPE - ROUEN": 65, 89, 13, 71), 1 lorient-st-nazaire ("LORIENT - ST. NAZAIRE SECTOR": 66), 1 arrow (the 43 at Nijmegen, which has an arrowhead line; 51, 53, 15 and CDN 2 are joined by a plain line to the Veritable vertical, no arrowhead, so placed). The 9th Armored where it was on the 9th (3937,3977; 20 px right of 9 Feb, the sheet prints 16 px right). Unsure: the 3 at 4207,2103 (read infantry from crossing strokes; 9 Feb unread, 11 Feb airborne); the 7? at 3888,3045, the ?2 at 4050,3162 and ?12 at 4144,3225 (digits under ink; 9 Feb read 212 there, 11 Feb 312/52(-)); the ?5 at 5474,4598 (label hidden; 11 Feb 257); the oval box at 3763,2887 labelled ? (label under the front line; 9 Feb 6, 11 Feb 6); the 52 (?) at 3734,1172 (qualifier unclear); 6 SS (MTN) and 2 (MTN) read as written; 106 in the Upper Rhine box as x armored. The boundary labels (XIII/XIX, VIII/XII, V/XVIII, III/XII, XII/XX, XXI/XII, II CDN/XXX etc.) and the stub arrows are left out. The echelon cells have no "-" (none was written).
