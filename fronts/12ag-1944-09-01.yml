# Reviewed: the sheet draws one ticked front, a heavy line from the Seine below Le Havre (the Le Havre pocket, ENEMY 49 inside it) round the Mailleraye, Elbeuf and Rouen bends, up the Andelle side by Cailly to a hook at about scan (2880-2970, 730-820), then north-east by Poix and Abbeville to the Somme and off the sheet's top at about scan (4400-4540, 270). No Paris, Aisne or Gournay-Beauvais piece today. The thin boundary lines (Northern Central, Andelle, First/Third) are not heavy and are not found; no boundary box needed. The short heavy arc at the top (about scan 4500-4540, y 265-440) is not found either. Ten runs found (about 55 km), all along the Seine bends and the Cailly side; all ten had their red ticks on the map's own ticks at 4x, so no turn and nothing 'checked'. UNDERCOUNT: the heavy line and its ticks fuse and the skeleton breaks into pieces under the tool's 25 px minimum; about 250 km of perhaps 310 km drawn is missing (the pocket's top and west side at y about 1000-1100, the Mailleraye-Rouen east side, the hook, and the whole line from Cailly north-east to the Somme). Raising area's top from 850 to 200 found nothing more. A tool fault, not a reading; no other radius tried, as told. Sides: weak; 49.5N enemy and 49N own, where 31 August had both enemy (49N differs because the runs are few and all at the Seine; the margin ticks lie far off the line).
