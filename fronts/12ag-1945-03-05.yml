# Reader: 5 March, report 273 (the 3 is struck over a 2 or similar, read 273); title read on the Library image (051200 MAR. 1945, signed C. T. Schmidt for A. Franklin Kibler); agrees with the catalogue.
# Reader: gcps_from 12ag-1945-03-04 (sheet offset -24,+8; 78 of 81 agree, median 0.7 px; 3 placed through the transform: Trier, Prum, Zweibruecken). 03-04s 137 boxes copied, each moved by the median offset of its five nearest towns; the 22 dark-90 stray boxes kept (catch nothing at 70 or harmless). Signature box right edge 1595, left of the Walcheren arc (traced whole). Boxes added today: the middle of the Ninth/First boundary at Grevenbroich (4195,1430-4275,1523) and 111 widened up to y 1796 (the boundary ran whole between the 03-04 end boxes and put Julich and Grevenbroich on its road ticks); the Lauterbourg hook (5648,4298); three strays at 4505,1635, 4475,1760 and the Rhine blue above Bonn 4675,2041.
# Reader: dark: default 70 kept. This is a darker print than 03-04 (the arcs trace whole at 70: Walcheren, Beveland, Tholen, Hollandsch Diep/Volkerak with their own ticks); at 90 the same boxes left 645 stretches and 2570 km (the grey roads and lettering pass as front), at 70 106 stretches, 776 km.
# Reader: turns: 2 flips, the Tholen arc (2125,868 and 2073,891): the map ticks hang south, the tool red ticks stood north. 03-04 flips on the Siegfried band south of Heimbach not needed at 70 (matched nothing; dropped). Checked (5): Neuss piece 4294,1384 (still needed; its short wiggles at 4260-4310,1290-1380 follow the heavy S-bend and the Rhine blue, ticks hard to read, kept as on 03-04), the Siegfried band piece 4085,2448 (red ticks west, US 69/106 west), and the Wesel bridgehead south side in three pieces 4082,960, 4194,1016, 4238,1030 (map ticks lost in the black mass, hang south; US 35, 84, 53 south, German bridgehead north). The 03-04 checks at 4144,2403 and 4251,3640 matched no unsure stretch and were dropped.
# Reader: sides against 03-04: 81 of 81 agree. The first run (before the boundary box) had Julich enemy and Landau, Karlsruhe, Heidelberg own (the Lauterbourg hook, run 94); both boxed. Grevenbroich own by runs 45 and 46 (runs 43 and 44, the Neuss wiggles, read it enemy: a weak echo of the unreadable Neuss pieces); Gemund own (under the heavy line, weak); Haguenau enemy, Verviers own (weak tests). Prum, Julich, Bitburg, Grevenbroich, Trier, Strasbourg, Kleve own; Adenau, Offenburg enemy. Length 776 km from the GeoJSON (106 runs, 0 unsure).
