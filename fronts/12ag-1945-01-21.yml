# Reader: symbols read 8 Nov 2026 (12ag-1945-01-21-units.csv): 221 as drawn, 118 enemy, 74 US, 17 British, 6 French, 5 Canadian, 1 Polish; 140 from the box finder (of 148 numbered, 8 being the title's letters, the lake at Dieuze and the legend's BRITISH lettering), 81 found by eye on the overview tiles. Listed: 76 (le-havre), 49 and 344 (unlocated), 66 (quimper-auxerre). Unsure: the Ardennes US "12" (cross, label read as "12"), the enemy label by Rhinau (reads "19" and a figure hidden under the front's hatching, left "?"), the 826 and "1 SS" boxes by Schleiden/Marmagen (echelons and arms read small), TETTAU's arm (cross under hatching), the 560 (netted mark, read infantry), the enemy FB's two marks.
# Reviewed (8 Nov 2026, the symbols): 221 unit symbols read across the whole sheet (118 enemy, 74 US, 17 British, 6 French, 5 Canadian, 1 Polish; 140 found by the box finder, 81 by eye); the front is unchanged. Overlay crop 3400,2500 (the Ardennes) looked at: every dot on its box. Lists: the 76 "vicinity of Le Havre" (le-havre), the enemy 49 and 344 under UNLOCATED (unlocated), the 66 with lines to Quimper and Auxerre (quimper-auxerre). An open box lettered 12 stands east of the front by St. Vith (about 6.07E 50.21N) among the enemy's 15, 3 and 2 SS; no US division bore that number, so it is recorded as drawn (us, untied) and is most likely an enemy division drawn without its hatching: not to be shown as a US unit without a check against the days either side. The enemy label by Rhinau is read "19?" in part and written `?`. The US 9 with the oval by the Moselle is the 9th Armored; the 9 with the cross by Eupen the 9th Infantry.
