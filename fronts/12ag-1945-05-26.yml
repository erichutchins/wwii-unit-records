# Reader: the sheet draws the line of contact with the Soviet armies as the ticked line (US ticks on the west side), as on 25 May; the legend (bottom left)
# still has its U.S., BRITISH, ENEMY and FRONT LINE samples (looked at on the overlay crop 0,5700; the front line's sample is a short ticked bar). Report no. 355,
# as of 261200 May 1945 (title read at 4200,150, 1800x900; the signature above Kibler's is hard to read, "C. T. Schmidt (?)"). Agrees with the catalogue (26 May).
# Reader: ticks seen at 4x on the Elbe (3400,340 and 3700,560) and on the Kaplitz connector (5154,4223, 5100,4230): the line is ticked, not bare. The EAST BOUNDARY
# TWELFTH A.G. is bare or x-marked as on 25 May (x marks at Annaberg 4240,2400 and short of Strakonitz 4730,3470; lettering at 4400,2480 and 4560,3510) and is boxed.
# Reader: towns matched to 25 May's: 55 of 58 agree, sheet offset +0,-40 px (median 0.6 px); three placed through the transform (15E 53N, 13E 50N, 12E 48N).
# 25 May's 41 boxes were moved by an affine fit of the 55 agreeing towns (rms 0.6 px, max 1.6; in effect a shift of 0,-40; small boxes by their centre, large by corners).
# Each moved box was checked against the run with no boxes at all (460 stretches): one held nothing and was dropped (Linz-Urfahr stub, 25 May's box at 5137,4504 moved
# to 5136,4468: no stretch there today); the other 40 all still hold bare boundary, border, lettering or the Radstadt tangle, so kept. With the 41 moved boxes (before the drop) the trace
# had 78 stretches; 21 boxes were added (61 in all) (reason and place in each), all from runs looked at at 3x: the Saxony-Bohemia and Bavaria-Bohemia borders (red hatched, black
# at Winterberg), Austria-Italy borders in Tyrol, two unit-symbol outlines (3976,2222 and 5104,4605), a grey letter at Torgau (4282,1654), the straight heavy boundary
# at Annaberg, the bare Waidhofen/Windischgarsten/Liezen boundary and the Enns band's bare upper line (their middles shifted off the moved boxes), the Gross Venediger
# boundary, and the Tauern tip tangle at 5016,5539 (boxed as on 25 May). Dropping the two Radstadt boxes (4743,5323 and 4714,5344) was tried: it added two stretches, the
# heavy line west of the ticked finger by the (TEMP) lettering (about 4740,5300-5400) with no clear ticks at 3x, so the boxes stay as on 25 May.
# Reader: the traced line is the same as 25 May's to within 4 km everywhere (4.8 km of 25 May's not in today's, 7.5 km of today's not in 25 May's, all at the Radstadt finger
# and Tauern bands, 13.5E 47-47.5N). It is 40 km shorter (1165 against 1209 km on 25 May as the tool wrote it), nearly all between 47.0 and 47.5N: today's finger, bands
# and Salzach end have fewer separate pieces (the Radstadt finger's upper heavy line, 9 km, stays boxed) and the Elbe's start is 4 km shorter (53.10N against 53.13N).
# Reader: unsure and kept: the Elbe at Wittenberge, a small loop (3563,403 and 3560,425) where the heavy ink of the river widens (ticks on its west side at 3x; the loop is the
# skeleton of the wide ink, 25 May had no unsure here); the Salzach line's last bit by the (TEMP) lettering (4660,5308, ticks on its upper side at 3x, ends at hatched symbols);
# the Kaplitz connector (5154,4223) checked by eye (see checked). The Tauern tip tangle and the Radstadt finger's heavy lines are boxed, not settled (as on 25 May).
# Reader: sides: 58 of 58 as on 25 May (tools/trace_front.py --sides on both, the lists of towns' sides identical): 14E 47N enemy, 14E 49N own (by run 32 at 5080,4017),
# 9E 47N (Switzerland) own, as on 25 May (the line's open end near the Gross Venediger corner; the deciding run 51 own at 3970,5447 is the Salzach/Tyrol line's end).
# Setting: radius 4, dark 70 as on 25 May; 57 runs, about 1165 km. Report 355.
# Reviewed (8 Nov 2026): the line of contact with the Soviet armies, ticked, as on 25 May; report no. 355; the legend still has its FRONT LINE and ENEMY samples. Overlay crop 4250,5150 (the Salzach and the Tauern) looked at: the Salzach line, the Radstadt band's lower edge and the band south from Heiligenblut into Carinthia are on the ink with their ticks; the Radstadt band's second heavy line and the tangle at its tip are boxed and unsettled, as on 25 May. Two short unsure stretches kept (the Elbe at Wittenberge, the Salzach end by the TEMP lettering). All 58 towns on the same side as 25 May. About 1165 km.
