# Reviewed: no stretch turned. Every ticked stretch's red ticks looked at 3-4x against the hatching (west coast to Lessay, the Marigny lobe, the Cerisy lobe, St-Lo, Caumont, Evrecy, Fleury, the Orne to Colombelles): all on the hatching, which stands on the US/British side. The trace is thin (radius 3): about 72 km of heavy ink in 31 runs, with gaps of 130-210 px. Excludes copied from 07-28 where today's sheet has the same line (the army boundary north of Bayeux, the Caumont boundary), moved to where they sit here; 07-28's boxes for the Coutances/Percy corps boundaries, the Cahagnes arm and the 30 symbol's diagonal catch nothing today and were dropped; added today: the VIII corps flag's bar, the 90 symbol's stroke, and run 19 at St-Lo.
# Reviewed: sides and ticks right (none turned, three checked); thin: about 72 km traced of a line about 155 km long at radius 3, the largest gaps the Marigny lobe's west side (212 px), Caumont east (210 px) and the Cerisy foot (135 px); the Orne end stops about 130 px short of the coast. Radius 2, which traced B02's 1:500,000 sheet whole, is to be tried on the next B01 days.
