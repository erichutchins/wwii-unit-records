# Reader: gcps matched to 12ag-1944-10-16 (10-15 refused: 36 of 81 within 4 px); 47 of 81 agree (median 1.5 px), 34 placed through the transform. Boxes are 10-15's moved (+19,-12) (10-14 = 10-15 + (19,-12)), keeping the 22 that catch a stretch here and dropping the zero-hit ones; three of 10-15's boxes dropped for cutting ticked front (the Maastricht loop at 4078,1520; the front's last stretch to the Marne-Rhine canal at 4557,4302; the front by the Siegfried strip north of Trier at 4612,2904); two boxes added or moved (the boundary's first stretch to the front at 4745,4325; the Siegfried feature where it crosses the army boundary at 5790,3715). All eleven of 10-15's flips match no stretch today: on 14 Oct the Nijmegen east flank and the Antwerp-Breda-Turnhout arc (scan about 3700,700 to 4050,200) carry no ticks and are not traced (looked at 3800,450 and 3980,250), so nothing was flipped or forced; the Breskens end is not traced either. Arnhem reads own, wrong: the ticked arc along the scan's top edge is missing. No ticked front south of the Marne-Rhine canal (the heavy lines there are boundaries: looked at 4880,5140, 4650,5280, 5150,4980), so Saint-Dié and Colmar read own (should be enemy): beyond the line's open end, not a wrong stretch. The Geilenkirchen-Aachen-Monschau reach is traced in several fragments with gaps, its red ticks on the map's own west ticks; eight stretches checked by eye. Front 291 km (10-15: 585).
# Reviewed: this sheet draws a ticked front only from north of Maastricht to the Marne-Rhine canal (whole-sheet overlay read by the reviewer): no ticked line round the Nijmegen salient, on the Antwerp-Breda-Turnhout line (a plain heavy line today) or in the Vosges south of the canal; no front drawn there, not no front. 66 stretches, 291 km; the Geilenkirchen-Aachen-Monschau reach traced in fragments (fused ticks), eight stretches checked by eye on the map's west ticks. Towns beyond the open ends read own and are artefacts, not wrong stretches: Arnhem, Breda, 's-Hertogenbosch, Bergen op Zoom (north), Saint-Dié and Colmar (south). Nijmegen own, Metz enemy. 15 October's flips match nothing here; three boxes that cut ticked stretches dropped; one added on the Siegfried strip at the army boundary.
