# fronts/README.md). The towns are <map>-gcps.csv; the GeoJSON is generated.
# B13 pilot notes (6 Nov 2026), read on the overlay and --look, for the days that follow on this base:
# - The title block is at TOP RIGHT on this sheet (x 4700-6300, y 80-1010), not top left; top left carries the base's own
#   heading and an Auth/Initials/Date box (x 400-1520, y 150-480). The legend is at BOTTOM RIGHT (x 5650-6520, y 5000-5640).
#   Both are lettering inside the sheet, and no front lies near them; hand-lettered, so check them each day.
# - Boundaries drawn heavy with no ticks (the grey ticks beside them are railways; the blue beside them streams):
#   Twenty One / Twelfth army group (Westerberg to Minden), Ninth / First (Paderborn), First / Third (Lahn at
#   Ehrenbreitstein, Runkel, Giessen, Kassel, then east to Witzenhausen), Twelfth / Sixth (Saarbrucken, Neunkirchen, Worms
#   side, Frankfurt, to the front near Fulda), Seventh / First French (Speyer stub), and the boundary into Lingen.
#   Thin black lines (corps boundaries, Karlstadt, Eisenach, Schmalkalden) are not traced at all.
# - Dark rivers: the Lahn and the Saar-side streams read blue beside the boundaries and passed for ticked runs; the Rhine
#   north of Dusseldorf is heavy black but lies outside the trace's extent (west of the 7E crossings), so is not traced.
# - The Ruhr pocket: its traced ring is the Lippe/Hamm line on the north (ticks to the north, US), the Sauerland east side
#   to Brilon and Warstein, the Sieg on the south to Bonn and the east bank of the Rhine back to Dusseldorf (ticks outside,
#   US); the enemy is inside. Its west side north of Dusseldorf (Duisburg, Oberhausen) is off the traced extent.
# - A heavy black closed loop west of the Fulda corridor (about 2780-2930, 3770-4000) is not traced (no ticks, no blue).
