# Reviewed notes: the sheet draws the Ruhr ring closed (traced as front, enemy inside, ticks outside). Unsure left: (399,1735) the blunt west end at Tholen, (2707,1960) a short piece on the Oberhausen stretch between ticked runs. Front east of x 4600 (heavy ticked line in the Spessart / Paderborn-Fulda) is past the towns spread and untraced.
# Reviewed: 78 of 81 towns on 31 March's side; Paderborn (own, taken 1 April) and Heidelberg (own, at the Hockenheim bridgehead's corner) are the advance, Siegburg (own) a weak test under the Ruhr ring. The sheet draws the Ruhr ring closed. The Frankfurt-Hanau line, front on 31 March, is boxed as the Third/Seventh boundary now that the front is in the Spessart, past the towns' spread.
# Reviewed (area): `area: [4450, 1740, 5560, 4800]` takes in the Paderborn-Kassel salient's head, the Kassel and Fulda salients, the Vogelsberg-Büdingen-Gelnhausen line, the Spessart, the Würzburg salient and the Odenwald to Mosbach: 67 stretches added, front 1047 to 1569 km; ticks checked on crops 4300,1650, 4500,1950, 4500,2750, 4550,3550 and 4300,4550; two boxes (a symbol-edge scrap by the 6th Armored's box, and the thin Vogelsberg boundary). No town changed side (Heidelberg own, by runs 216/217 now). Still missing: the heavy line from 4690,3640 to 4720,3980 (the Frankfurt bridgehead's old east side, fused, drawn too heavy) and the heavy Heidelberg-Mosbach line from 4300,4780 to 4700,4750 (too heavy to trace); the small gap at 4940,2380 where the Fulda salient's blob fuses with the symbol.
