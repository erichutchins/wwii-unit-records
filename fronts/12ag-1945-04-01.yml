# Reader: 7 Nov 2026, redone at radius 4, dark 45 (radius 8 dropped). 128 stretches, about 1460 km, 0 unsure. The area is the whole sheet: the ticked front north of the towns' spread (Rheine, Muenster, the Zutphen bulge) and east of it (Paderborn bulge, Kassel flank, the Hersfeld-Eisenach corridor, Hanau-Aschaffenburg-Wertheim) is real front.
# Reader: turning. The tool turned three whole reaches wrong, each seen on a crop of the scan's own ticks, and flipped by hand (20 flips, reasons above): the Ruhr ring's east and south-east side (Paderborn-Geseke arm, the Brilon line x about 4080, to Siegen), the Kassel flank (Naumburg to Rotenburg) and the Aschaffenburg flank (Hanau to Woerth). In each the map's ticks are on the US side (outside the ring, west of the flank) and the traced red ticks fell on the other. Nothing confirmed by `checked`.
# Reader: the 'AB' (airborne) outline at Westerholt/Muenster, boxed out on 30 March and at radius 8, is ticked front (a notch: ticks on the outer sides, the AB box on the US side; looked, crops 3050,1130 and 2920,1320) and is traced. Boxes kept or added are the army group boundaries (Conflans-Saarlautern, Neuss, Rheydt, Frankfurt-Hanau, Zweibruecken end) and the title's lettering; the Rhine gorge, Nahe and other boxes copied from 30 March catch nothing at dark 45.
# Reader: sides at the end: 13 of the 78 town lines I could read on the enemy side (three of the 81 wrap in the output), all of them where the map puts the enemy (the Ruhr pocket, the Sieg line, across the Rhine). Against 31 March: Strasbourg own to enemy, and Paderborn enemy (its ring at the tip of the bulge, on the line; the US took it 1-2 April) (Strasbourg: its ring is 15 px past the Rhine line's end at the neat line y 5785, the weak test, the line there carries its ticks on the west); Heidelberg enemy to own (its ring sits at the corner of two runs, 121 own and 122 enemy; US took it 30 March); Daaden, Siegen, Marburg, Nastaetten, Zweibruecken and Darmstadt unchanged or restored after the flips and boxes above (31 March's Darmstadt and Nastaetten read own only through the Frankfurt-Hanau boundary arc, which is not front).
# Reader: untraced or doubtful. The line ends at the neat line at y 5785 (the Rhine at Strasbourg), the map's front south of it is off the sheet. Nothing is traced east of the Hersfeld-Eisenach corridor's head (x 5300) because the map draws none there. Small gaps: between run 55 and 63 on the Kassel flank (about 40 px, a blob), and the Hanau-Gelnhausen hook (run 107, 4655-4714, 3614-3693) is a short heavy hook left as traced. The Rheine-Lingen part of the Rheine bulge was seen on the overview only, not on a close crop. Compared with 02 April the line agrees within 10 km over 92 per cent; they part where 2 April has advanced (Kassel-Fulda-Wuerzburg).
# Reviewed (7 Nov 2026): held earlier (a heavy print traced at radius 8). Re-read at radius 4 with a lower cutoff, dark 45 (the sheet's ink under 50 matches 30 March's under 70), over the whole sheet (area), which takes in the front past the towns' spread (Rheine, the Zutphen bulge, the Paderborn bulge, the Kassel flank, the Main). Overlay crop 3500,1500 looked at: the Ruhr ring's east side from Geseke by Brilon and Winterberg to Siegen has its red ticks east, toward the US 3rd Armored and the divisions drawn there, and the Kassel flank west, toward the US 7th Armored, with the Germans east: the 20 flips (the tool had turned these reaches the wrong way) stand; Marburg (US since 28 March) reads own only with them. Strasbourg enemy is past the sheet's neat line (weak). About 1458 km.
