# 12ag-1945-04-16: the sheet as read on its title (G-3 report 315, 161200 Apr 1945; agrees with the catalogue); B13, towns matched to 04-15 (26 of 26 agree, median 0.5 px; offset +0,+16 px).
# Reader: 04-15's area and its ten lettering/list/boundary boxes that still hold something kept, shifted by y+16 (title, Auth box, legend, the Muenster and Lahn boundary boxes, Ahr/Neuwied/Third-Fifteenth, Hanau and Frankfurt-Darmstadt); the 28 that hold nothing today dropped. Boxes 2, 3, 4 (Auth, title, legend) each hold a "ticked" run that is lettering or the legend's hatched box (looked), kept; the Hanau and Frankfurt-Darmstadt boxes hold 'line' runs that are plain heavy boundaries (looked), kept.
# Reader: a first trace with those boxes left 162 stretches; the long boundaries it left in were boxed at the middle of their runs (looked on overlay crops 2900,500; 450,950; 2200,3200; 400,4300): the Twenty One/Twelfth line Celle to Muenster (run 24 at Celle, run 29 and five of its pieces; the ticked front round Celle, run 13, stays traced), the Hanau-Meiningen-Bayreuth line (five runs), the Twelfth/Sixth line Bad Kreuznach to Saarbruecken (three runs), and 20 unsure runs that are lake edges, river blue, corps lettering or boundary strokes (looked). Left unsure and kept as front: the three stubs on the Ruhr's north side at Hagen (1324,2403; 1020,2430; 1176,2464), the pocket's ring where its halves meet, as on 04-15.
# Reader: area widened? no: 04-15's box (shifted) and a test with x0 250 add nothing. Ruhr pocket cut at Hagen, ticked outward; Harz, Koethen/Barby, Zeitz-Altenburg-Chemnitz salient and Emmen drawn as rings with ticks outward; the Elbe Salzwedel-Havelberg. 93 stretches, 1,931 km (04-15: 2,079).
# Reader: sides: 25 of 26 as 04-15. 13E 51N enemy -> own: "13E 51N          own (US)  by run 69 own at 5726,3078"; its ring (5767,2976) lies about 15 px from the Zschopau line, which has the map's ticks on its west and the US symbols (4, 6, 76, 80) inside: under the line, a weak test.
