# Reviewed: 25 of 26 towns on 15 April's side; 13E 51N own ("13E 51N          own (US)  by run 69 own at 5726,3078"; 15 Apr enemy): its ring sits about 15 px from the Zschopau line, ticked on its west with US symbols inside, a weak test. Pockets ringed and ticked outward on the whole-sheet overlay (regenerated and read by the reviewer): the Ruhr (cut at Hagen), the Harz, Köthen/Barby, Emmen; the Zeitz-Altenburg-Chemnitz salient closed and ticked west; the Elbe Salzwedel-Havelberg. 93 stretches, 1931 km; three unsure stubs where the Ruhr pocket's halves meet at Hagen. 28 empty boxes dropped; 36 added on boundary runs (Celle-Münster, Hanau-Bayreuth, Bad Kreuznach-Saarbrücken) and looked-at strays (lake edges, river blue, lettering); the ticked front at Celle stays traced.
