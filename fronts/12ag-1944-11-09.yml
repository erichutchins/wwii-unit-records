# Reader: title agrees with the catalogue (1200 HRS 9 NOVEMBER 1944, no report number, SECRET struck through).
# Reader: towns: --gcps-from 12ag-1944-11-08 accepted (one run): offset +8,+8 against 11-08, 58 of 81 agree, median 0.9 px, 23 placed through the transform (Jülich, Euskirchen, Gemünd, Verdun, Épinal, Saint-Dié 62 px, Metz, Sedan, Chaumont, Colmar, Tournai, Namur, Dinant, Marche 37 px, Verviers, Leuven, Eindhoven, 's-Hertogenbosch, Nijmegen, Arnhem, Kleve, Bocholt, Prüm). Fit over all 81: rms 0.8 km (leave-one-out 0.9, worst Beauvais 2.4 km).
# Reader: boxes: 11-08's eleven shifted +8,+8 and each tried alone (none: 50 stretches; the sheet is lighter than 11-08's, which gave 133 with none). Kept: the title (50 to 49), the Twelfth/Sixth last stretch near Nancy (takes an unsure run at 4098,4815 out). Dropped because each catches nothing today (count stays 50): the legend, the Brussels box at 2322-2512, the Twelfth/Sixth toward the front, the Seventh/First French, both halves of the Brussels-Aachen boundary, the Tournai stub, the Twelfth/Sixth south-west end and the MARSEILLES arrow head. Added one: a magenta unsure piece at 2191,2094 on the Twenty One/Twelfth boundary (the rest of that heavy black line does not trace today). Title box ends at x 2408 and y 768, clear of the Scheldt north-shore run. Result 47 stretches, 0 unsure.
# Reader: Walcheren: today it is not a ring. The three arcs are the north coast of Walcheren (x ~1610-1810), the Noord-Beveland north shore with its west-end hook (x ~1790-2020) and the Tholen west-end hook (x ~2100-2200); the map's ticks stand south of each (inside), and the red ticks fall on them (enlarged crops 1580,860 280x160 and 1850,860 330x120). 11-08's three Walcheren flips are therefore not carried over: none matches today's stretches, and flipping any would put the red ticks against the map's. Ostend own, with run 11 (the hook) enemy at 1795,925 as the tool prints it; the Beveland shore and hook read right.
# Reader: flips: (1) 2998,725, a short unsure piece of the Bergsche Maas run, its red ticks north against the map's south ticks. (2) 3562,401, the Nijmegen island's north arc (run 1): its ticks fell on the wrong side and put Arnhem and Nijmegen on the wrong side until turned.
# Reader: GAP, unsure: the Nijmegen island's front is drawn very thick today and traces only in two short pieces (x ~3500-3595, y ~395-410, and a stretch at 3200-3340); the ring of the island's west and north arc (x ~3240-3500, y ~410-600) and its east side (x ~3590-3700, y ~410-700) stay untraced (overlay crop 3150,150 650x750). radius 3, 5 and 6 were tried: worse (105, 39, 48 stretches, 16 or 6 unsure). Arnhem and Nijmegen are decided by run 1 alone. Front 675 km, against 761 km on 11-08: about 85 km short, mostly this island (the rest is the Third Army's advance, which moved the line, and other short breaks); not checked stretch by stretch.
# Reader: sides: 81 of 81 agree with 11-08 town by town; no town changes side. Arnhem enemy by run 1 (after the flip), Metz enemy by runs 38 and 37, Épinal own, Ostend own. Third Army's reach (Moselle, Seille) traces ticked on the US side; no untraced heavy boundary there on this sheet's overlay.
# Reviewed: a thin day. All 81 towns on 8 November's side; Arnhem, Metz enemy; Épinal, Ostend own. The Walcheren ring is gone (Walcheren fell on 8 November), so 8 November's three flips are dropped; the Scheldt arcs read right as traced. Two flips: a short piece of the Bergsche Maas run and the north arc of the Nijmegen island (unflipped it put Arnhem and Nijmegen on the wrong side). The sheet prints lighter, and the Nijmegen island's heavy front traces only in pieces (its west, north and east sides largely untraced; no radius helped): 47 stretches, about 675 km against 761 on 8 November. Most of 8 November's boxes catch nothing on this lighter print and are dropped; one added on the Twenty One/Twelfth boundary.
