# Reader: report no. 367, situation as of 071200 June 1945 (the catalogue says 1945-06-07). The legend (bottom left) shows only the boxes "U.S." and "BRITISH"; no sample of the front line.
# Reader: the sheet draws the line of contact with the Soviet armies (the Elbe from Schnackenburg, Dessau, the Mulde, Saxony, the Pilsen diagonal, Budweis, Kaplitz, Freistadt, the Enns, the Salzach and Tauern, Gross Venediger) as a heavy black line with NO ticks: looked at 4x at the Elbe (3300,420 to 3660,780), the Mulde (3850,1290 to 4090,2000), the Pilsen diagonal (4640,3350 to 4400,3600), Kaplitz and Freistadt (5200,4450), the Enns (5160,4820, 5260,5100), the Salzach and Tauern (4770,5330, 4870,5530, 4650,5700, 4350,5640). It is lettered EAST BOUNDARY OF TWELFTH A.G. (Chemnitz and Karlsbad reaches, x marks) and TWELFTH XXXXX FIFTEENTH (Tauern). So on this sheet it is the army group's boundary (22 May drew ticks on parts of it, 23 May on most, today on none), and it is boxed whole. Nothing else drawn on the sheet is ticked except the Carinthia bands.
# Reader: the only ticked line is the two grey-filled double bands running south from the Twelfth/Fifteenth boundary at Heiligenblut (4410,5660) into Carinthia, ticks inside the bands (black ticks seen at 4x at 4440,5720, 4540,5800, 4640,5860 and in the Lienz loop at 4200,5860): the eastern band (Mölltal) to about 4670,5900, and the western band, a closed loop west to about 4180,5860 beside Lienz, which the towns' box had cut (area box added). 5 runs, about 188 km. What the bands mark against the British zone is not told by the sheet. The line of contact with the Soviet armies is therefore NOT traced today: it is a bare boundary (where 23 May traced about 1265 km), and the front is a small ticked salient, not the line of 23 May. A reviewer who wants the bare line as the line can take it from 23 May's reading, but the sheet's ticks were not drawn.
# Reader: 23 May's 56 boxes were moved by a quadratic fit to the towns (23 May's 58 to today's, rms 1.2 px; shift -50..-59, +82..+95 px, varying across the sheet), then checked against a run with no boxes at all (338 runs, 36 ticked-looking). 24 held something not front and were kept (the west box, title block, the Bavarian and Bohemian border boxes and the single border stubs); 32 held nothing today and were dropped (Chemnitz-Annaberg and the bare boundary boxes of 23 May, now covered by the new ones). 27 added (26 for the bare line and border stubs, one for the Italian border), each round a run's middle on the no-box run and looked at: the Elbe to Dessau and the Mulde (one box, 3440,740 to 4160,2110, bare, not 23 May's ticked line), the Pilsen diagonal, the Budweis/Kaplitz/Freistadt/Enns boundary, the Tauern boundary, and border stubs. The Bohemian Forest box was widened upward (y 3940) after the first run (unsure run mid 4656,3973), and a box added at 4030,5985 for the Italian border the area box took in.
# Reader: no flips, no checks needed: the three ticked runs' red ticks fall on the map's black ticks, inside the bands (own inside); 0 unsure. Sides: 16 of 58 towns changed from 23 May and the check means nothing today, since the line (a salient at 47N) lies outside the towns' spread: 12E to 15E 50N-53N now read own because the Elbe line is not traced, 12E 47N and 14E 47N read enemy (outside the bands). Setting: radius 4, dark 70, area [4050, 5700, 4800, 6050]; 5 runs, 188.5 km.
# Reviewed (8 Nov 2026): an empty front: no front drawn, not no front. The line of contact with the Soviet armies (the Elbe, Dessau, the Mulde, Saxony, the Pilsen diagonal, Budweis, Freistadt, the Enns, the Salzach and the Tauern) is drawn as a heavy bare line lettered as the Twelfth Army Group's east boundary (and TWELFTH XXXXX FIFTEENTH), with no ticks anywhere along it (overlay crop 3300,1200 looked at), and the legend has lost its enemy sample (it keeps a FRONT LINE sample, looked at 4x at 280,6140; the reader missed it): the sheet draws nothing in that style on the line of contact. The only ticks are on two grey-filled double bands running south from Heiligenblut into Carinthia (overlay crop 4050,5550), which the sheet does not explain; they are boxed and recorded here, not traced as front. Eric's decision, 8 Nov 2026: from the first sheet with no ticked line of contact, the post-war days are empty fronts, with what is drawn written in the notes. The reader's trace of the bands (5 runs, 188 km) and its sides list are replaced by this.
