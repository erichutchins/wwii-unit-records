# Reader: drawn as the front: one ticked line, enemy on the left, the ticks inside on the Allied side: the Orne pocket's east leg (top 3852,2182), round Colombelles, west along the Caen reach, SW to the foot of the V (2848,2702), NW up the Vire side past Carentan, and then the Utah lodgement as a CORRIDOR to the west coast, one line round it: west along its south face (1850,2135 to 1500,1982), up the coast side (x about 1370 at y 1875, the west end at 1352,1830 by Barneville), east along the north face (y about 1805) and up its east side (x about 1757) round Montebourg to the top at 1982,1552. Not two lines: the south and north faces are joined round the west end (the sheet draws the coast end closed, ticked inside). Not the front: heavy untoothed boundaries and corps lines (the verticals at x 1545 and 2095, the diagonals through the bridgehead, x about 2840-2900, 3280, 3500), the dashed British boundaries and boxes, arrows, unit boxes, circles.
# Reader: METHOD: hand waypoints (`runs:`), read by eye on gridded 2x crops of the bare scan (50 px grid labelled every 100), 7 Nov 2026, on today's ink: crops from 1300,1700 600x450; 1300,1450 700x400; 1750,1450 600x400; 1800,2050 600x450; 2300,2400 600x400; 2800,2300 600x450; 3350,2250 600x400; 3600,2050 400x450. RADIUS 2, dark 110 (not 3): the north face of the corridor (x 1400 to 1650 at y about 1805) is drawn finer than the rest and is lost at radius 3 ("no ink between"); at radius 2 the whole line is one skeleton. TWO RUNS, ended and begun at the foot of the V, 2848,2702 and 2796,2712: the front line from the west stops at the army boundary's lettering (US) and the V's east side begins on the other side of the boundary's heavy line, 50 px apart; the tool bridges only about 40.
# Reader: result: 2 runs (71 and 127 points), 179.3 km from the GeoJSON by the sum of its legs (16 June 163.7 km by the same: longer by the corridor's run to the coast and the north face). Overlay crops (1300,1750 800x400; 1700,1500 400x350; 1800,2050 800x450; 2300,2250 800x500; 2800,2350 700x400; 3250,2250 800x300; 3650,2150 300x300) looked at: the trace follows the heavy line end to end, the red ticks fall on the map's teeth on the Allied side everywhere; nothing off the ink; the only untraced stretch is the 50 px at the V's foot between the two runs (the line's meeting with the army boundary and its lettering). Nothing flipped.
# Reader: sides: 16 June's GeoJSON backed up (cmp: unchanged after --sides); 34 towns diffed, none changes (1.5W 50N enemy as on 16 June, by the Utah corridor's run). 0.5E 49.5N reads own and 1E 49.5N enemy as on 16 June: open-end artefact east of the Seine mouth. 1W 50N and 0.5W 50N read own, 2W 49.5N and 1.5W 49.5N enemy (at sea off the Cotentin, either way).
