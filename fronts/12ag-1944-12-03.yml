# Reader: copied from 12-04 and each tried (the box taken out, the stretches counted): kept where it changes the trace (title, legend, the Twenty One/Twelfth boundary, the Canadian/British boundary, the Twelfth/Sixth boundary's four, the Seventh/First French stub at 4520-4900); dropped where it hid nothing on this sheet (the enemy 36 and 245 boxes and the blob under 36, the wedge 3770,1725, the Giessen army box, the Seventh/First French box 4540,4990). NOT carried: 12-04's stub box [5100,4950,5260,5020]: on this sheet it sits on the ticked Rhine front north of Rhinau (overlay crop 4950,4800: the heavy ticked line from Strasbourg to the boundary's crossing at 5190,5075, ticks west); without it the Rhine front is whole and the boundary's crossing is no stretch. Saar crop 4300,3900: the box [4520,4430,4900,4660] takes only the Twelfth/Sixth boundary's end at the front (heavy stub x 4680-4730, y ~4440, a gap of about 50 px in the blue where the boundary meets the front); the ticked Saar front east of Saarlautern is clear.
# Reader: Scheldt arcs (Walcheren, Beveland, Tholen): map ticks hang south, red ticks south: no flip. Boundaries boxed after a look (3921,2188 hook confirmed, not boxed). 62 stretches, 0 unsure.
# Reader: --sides diffed with 12-04, town by town: 80 of 81 agree. Strasbourg (03: "Strasbourg       own (US)  by run 52 own at 5242,4860"; 04: "Strasbourg       enemy     by run 38 enemy at 5237,4839"): its ring (5249,4868) lies under the Rhine line; here the Rhine front is whole (the stub box 12-04 carried is left out) and the town reads US, which is right (liberated 23 November); 04's enemy is the ring-under-the-line artefact, so 03 is the better reading. Jülich ("Jülich           enemy     by run 21 enemy at 3930,1757") and Haguenau ("Haguenau         enemy     by run 50 enemy at 5136,4521") enemy as required. Zweibrücken first read own (run 42 at 4761,4077, the German First army box's top edge, boxed above) and now reads enemy like 04.
# Reviewed: 80 of 81 towns on 4 December's side. Strasbourg own ("Strasbourg       own (US)  by run 52 own at 5242,4860"), right: here the Rhine front south of the city is traced whole, ticked west; on 4 December it was cut by a copied stub box, now removed there and on 14-15 December. Jülich and Haguenau enemy. 62 stretches, about 958 km, 0 unsure, no flips. Boundaries re-tested one by one; seven boundary and symbol-edge boxes added (the First/Third boundary Longwy-Sierck among them, the front clear of it), six old boxes that caught nothing dropped. A 50 px gap at the Twelfth/Sixth boundary's end on the Saar is inherited.
