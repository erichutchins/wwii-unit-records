# 12ag-1945-03-12: the sheet as read on its title, and the hand decisions its trace needed (tools/trace_front.py;
# fronts/README.md). The towns are <map>-gcps.csv, the symbols <map>-units.csv; the GeoJSON is generated.
# Reader: the earlier reading of this day (6 Nov 2026, for the Remagen engagement only) is replaced. It matched its towns to 7 March's old 20 hand-read rings, traced only within their spread (18 runs, about 191 km), kept one exclude box (the 21st/12th Army Group boundary, 3700,1420,4280,2000) and checked one stretch (by Remagen, 4683,2127). This reading traces the whole sheet by the stretch method, as 7 to 11 March (records/fronts/12ag-1945-03-11.yml).
# Reader: gcps_from 12ag-1945-03-11 (the 81 towns; sheet offset -40,-16; 77 of 81 agree, median 1.4 px; 4 placed through the transform, 5-15 px off: Siegburg, Cochem, Kleve, Munster). Fit conic, rms 0.8 km, leave-one-out 0.9 km, worst 1.9 km (Baden-Baden). Against the earlier reading's 20 rings the new towns stand 0-10 px away (median 5 px; largest Gemund 10, Mayen 9, Grevenbroich 9, Cochem 9, Konigswinter 7).
# Reader: boxes: the 138 boxes of 11 March copied, each moved by the median offset of its five nearest towns (about -39,-14 px), 137 kept, 3 added. Tested with no box at all (106 stretches, 20 unsure); the boxes took out the title block, the legend, the Seine and Paris-side lettering and hooks, the boundaries and the stamp, and no run of today's front but one. Dropped one, the Neuwied Rhine-ink box (copied as 4929,2361,5045,2442): without it two short ticked runs (7.50E and 7.54E, 50.41N) join the front by Neuwied and Koblenz, on the heavy line with the map's black ticks west of it, looked, overlay crop 4850,2330; with it the front broke there. Added three: a 15 px blue stub where the Rhine's ink runs into the 78 (+) symbol below Bad Godesberg (4672,2118,4700,2145), and two pieces of the TWELFTH / SIXTH boundary west of Pagny and at Teterchen (3695,4058,3775,4118 and 4053,3995,4133,4055), each heavy black with no ticks (--look). The bracketed list of divisions facing the bridgehead (right of Neuwied, about 5000-5100,2100-2400) traces nothing at 70, so it needs no box.
# Reader: dark: default 70 kept. Walcheren, Beveland, Tholen and the Volkerak arcs trace whole (overlay crop 1300,450); 80 and 90 not tried.
# Reader: flips: none. The arc north of Tholen that 11 March flipped now comes out the right way by itself: the red ticks hang south of it, as on the arcs either side (overlay crop 1300,450). Checked: three runs with no ticks of their own, each the heavy front with the map's black ticks west and the red ticks on them: the Rhine at Duisburg-Hamborn (4199,1165) and the Rhine above Strasbourg (5272,4878 and 5270,4926). The 11 March check at Linz is not needed: the line there has ticks. 0 unsure.
# Reader: the front is 83 runs, about 809 km (11 March: 87 runs, 800 km, same measure). At Remagen the heavy line lies along the river's east edge from Bonn to Linz and on by Andernach and Neuwied (a small jog east at Konigswinter, about 7.2E, 50.63N), no bulge east of the river. Against the earlier reading in 6.6-7.6E, 50.0-51.0N the new trace covers it (99% of its points within 1 km, largest 2.7 km at 7.20E, 50.63N, the Konigswinter jog); the new trace goes on beyond the old one's end to the south-west (7.0E, 50.0N, the Moselle). Sides against 11 March: 80 of 81 towns the same; Cochem own to enemy (its ring sits on the line where it turns at the Moselle). Units: the same 64 symbols (7 listed, as before), none moved more than 1.4 km.
