# Reader: towns matched to 12ag-1944-06-28's (base B01), sheets offset -8, +16 px: 30 of 34 agreed (median 0.5 px); 1W 49N (12 px off), 0.5W 49N (23), 0.5W 48.5N (16) and 0E 48.5N (18) placed through the transform. No refusal; 29 June and towns-B01.csv not needed.
# Reader: METHOD: hand waypoints read by eye on 2x-4x crops of the bare scan with a 50 px grid (labelled every 100 px), starting from 28 June's runs shifted (-8, +16): crops 3250,2050 700x500; 2750,2150 700x600 (the Odon head and the V under the Lehr box); 3280,2290 200x260 at 4x; 2200,2050 700x600; 1450,1900 750x450; 2540,2560 330x180 at 3x; 1250,1860 450x210 at 3x; 940,1030 400x220 at 3x; 1250,1000 700x400; 1500,1050 900x1000; 1260,1100, 1620,1100 and 1860,1380 at 4x (the three line ends); 1730,1255 200x200 at 4x. Every waypoint of run 1 was read again on today's ink (none kept as shifted): round the Odon head, the Caen reach and the Orne arc the shifted ones stood 10-25 px off the ink, along the Vire and the Carentan diagonal 10-15 px; run 1 has 120 waypoints, every 20-60 px, at every bend.
# Reader: RADIUS 3, not 4. At radius 4 the trace stops with "no ink between" (run 1): on this sheet the line north of the Cotentin ridge is thinner, so the opened heavy ink there falls into pieces under the tool's 2000 px minimum, which are dropped (checked in a scratch script: the Hague line in pieces of 1114, 905, 874 px; the Barfleur line 1545 and 1800 px; the ridge's diagonal from x 1580 to 1700 gone, 2004 and 1635 px left). At radius 3 each is whole (2825 px; 6320 px; the ridge joined to the main line in one piece of 60,365 px) and the overlay follows the drawn line everywhere. Dark 110. Radius 5 not tried.
# Reader: today's front: run 1 is 28 June's line from the Orne arc to the west tip (ink ends at about x 1298, y 2037, at the lake): the Orne arc, the Caen reach, the Odon head, the salient with the V under the Lehr box, the Vire past St-Lo, the Carentan diagonal, the loop under the 83 box, the ridge. Run 2 is the Hague line, from its west end (1012,1185) over Beaumont, down to (1127,1207) and east along Cherbourg's western shore to the harbour at (1327,1145) (28 June's ran NE up to the 709 symbol; the line is longer and runs east today). Run 3 is NEW against 28 June: the Barfleur peninsula's line, from its tip at St-Pierre-Eglise (1636,1138) down (1690,1200), south-east by Quettehou (1835,1340) to the east coast at Quineville (1960,1449); Cherbourg itself is a US symbol (79) and has no line round it. Enemy on the left in each run's order; the map's ticks hang to the right of every run: south on the Hague line, south-west on the Barfleur line, north on the Caen reach, east of the Orne arc, inside the Odon head and the salient, east of the Vire line, north on the Carentan diagonal and inside the 83 loop, north of the ridge. The overlay's red ticks fall on the map's ticks on all three runs (crops A-F: 1250,1850 950x400; 2150,2050 800x700; 2850,2250 650x450; 3300,2100 600x350; 950,1050 1050x450; 1600,1100 450x400).
# Reader: untraced, on purpose: the Odon head is a narrow tongue; its right arc (from the Caen reach join at about (3380,2318) down to (3322,2465)) is traced; the left arc, a heavy spur with no ticks that rises from (3322,2465) and ends blunt at about (3333,2342), is left out (it is the head's other side or a boundary; the right arc carries the map's ticks inside). The heavy boundaries with no ticks (the thin lines with xxx and arrows from the Cotentin's west coast, the one down from (2600,2050) to the front at (2440,2530), the one down x 3200-3330 to the V at (3210,2625), the one to the junction at (2065,2140)) are not traced: waypoints stand on the ticked line. Nothing off the ink after the overlay; no stretch flipped or checked (no stretch method). The Odon head's two arcs are the one place to look at first.
