# Reader: report no. 357, situation as of 281200 MAY 1945 (title read with --title 4100 150 1900 1000; signature C. T. Schmidt for A. Franklin Kibler). Agrees with the catalogue (28 May). The legend (bottom left, overlay crop 0,6000) still has its ENEMY and FRONT LINE samples (the ticked sample under FRONT, seen at 400-510,6245), as on 27 May; the sheet sits about 72 px lower than 27 May's.
