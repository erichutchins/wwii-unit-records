# Reader: symbols read 8 Nov 2026 (12ag-1945-01-27-units.csv): 228 as drawn, 123 enemy, 76 US, 17 British, 6 French, 5 Canadian, 1 Polish (by echelon: 157 divisions and brigades, 3 of them single-x (the enemy F.G., F.E. and 106), 46 corps, 16 armies, 6 army groups, 3 C in C / C in C ADV / SHAEF); 140 from the box finder (of 165 numbered: 24 being the title's and stamp's letters and 1 the legend's BRITISH), 88 found by eye (tile by tile, the British boxes, the corps and army column of the Eifel, the Netherlands, the OUT OF CONTACT box's F.G. and II SS, the enemy 340 and the unread box at 3963,3150 among them). The Ardennes and Eifel cluster and the Netherlands were read twice. Listed: 24 (box "UNLOCATED": 49 and 8?, `unlocated`; box "OUT OF CONTACT": 1 SS, F.G., 2 SS, 2, 12 SS, 116, 12, 3, 167, 245, the SIXTH SS army and the I SS and II SS corps, all thirteen `out-of-contact`; the box "VICINITY DIEPPE - ROUEN" (an arrow to the west off the sheet) with the US 65, 69 and 89, `dieppe-rouen`; the US 66 in the box "LORIENT - ST. NAZAIRE SECTORS" with an arrow to the west, `lorient-st-nazaire`; the 9 SS (arrow east toward Prum from its label), 361 (arrow to a "?" by Bergzabern), 2 MTN, 159 and 716 (short arrows south, by Colmar), five `arrow`). Ties: the corps, armies and army groups named in the brief, 1, 45(+), 79(+), 11 armored, 2(-) FR and the 9th Armored (the oval 9 by the Moselle at 3922,3981: the 9th Armored where it was on the 26th); the 9 with the cross (3791,2303) untied. No CCA, CCB, CCR or task force is drawn as its own symbol. Differs from the 26th: the 167 now stands in the OUT OF CONTACT box (a second symbol in its right column, under the 3) and no longer by Neuerburg; the enemy 246 is drawn twice, "246 (ELTS)" at 3961,2294 and "246(-)" at 3894,2568; the enemy 26 stands at 3813,2821 (3969,2809 on the 26th), the 560 at 3848,2740, the 9 SS at 3960,2696, the 18 at 3877,2612, the 85, 353 and 363 about 90 px further north; the 340 is drawn at 3807,2868 with its first figure under the front line ("?40"); the second unread 3 of the 26th (3955,3143) is a box at 3963,3150 whose label is under the Westwall band ("?"); the 14 armored is "14(-)", the French 2 and 1 carry "(-)" and "(+)" (2(-) FR, 1(+) FR); the British 15 stands at 2825,1042 (3509,1255 on the 26th), the 11 at 3544,1490, the US VIII corps at 3494,2922, the US 87 at 3667,2765 (3897,3317), the 6 armored at 3683,2908, the 101 at 5071,4559, the 12 armored at 5146,4823, the 75 at 3665,2661 and the 84 at 3590,2615 (swapped), the US XVIII corps at 3644,2378. Unsure: the 340's and the "?" box's labels (hidden under the front and the Westwall band); the arm of CDN 2 and 3, ALG 3 and the OUT OF CONTACT 3 (unread); the two 246 labels; a free arrow with a heavy head by the 560 (from about 3810,2738 to the north-west, its tail 30 px from the 560's box and near the 15's x marks) left unlisted as a free arrow; the arrow under the 159 starts below the end of the 338's label and may belong to the 338; the 361 arrow starts about 60 px from its label (as on the 26th).
