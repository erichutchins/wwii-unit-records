# Reader: flip not needed today: without it run 27 (the Walcheren arc, middle 1673,858) reads own, its red ticks on the south on the map's small ticks (look.jpg of 1650,850 and 1900,830); with 02-28's flip (re-centred) Ostend turned enemy. 02-28's three checks (4172,2374; 2148,863; 2867,715) are no longer needed: the runs they covered now read by their ticks.
# Reader: run left unsure: 4014,779 (a short stub in the black mass at Goch, as 02-28's 4054,813; Kleve and Bocholt decided by other runs). Gaps in the heavy smudged line as on 02-28 not checked here.
# Reader: 1 March, report 269. gcps_from 12ag-1945-02-28 (sheet offset -72,-32; 64 of 81 agree, median 1.4 px, 17 placed through the transform). 02-28's 118 boxes, 1 flip and 3 checks moved by the median offset of the five towns nearest each.
# Reader: six of 02-28's boxes dropped because they held today's ticked front (the box edge cut it; with them the Zulpich, Mayen/Kempenich and Nastatten/Trier links broke into stubs, 83 runs against 86 now): the hooks at 4040,725 (Xanten), 4250,2035 (Zulpich), 4088,2585, 4183,3259, 4267,3660 and 5336,4721 (moved positions). The signature box's right edge pulled in to x 1585 so it stays left of the Walcheren arc's west end (about 1597,912). One box added by hand at 4040,1790 (the Twenty One/Twelfth boundary near Julich).
# Reader: sides against 02-28: 78 of 81 agree. Bitburg enemy -> own (the front now runs about 15 px east of the ring, 'by run 54 own at 4241,3071, run 53 own at 4154,2892'), Strasbourg own -> enemy -> own after the Rhine flips (02-28's own was a stray run), Offenburg enemy -> own -> enemy after them; so only Bitburg differs from 02-28 in the end. Grevenbroich stays enemy (the line passes about 30 px west of its ring). Haguenau enemy (weak test).
# Reviewed: Rhine flips (runs 77-82) confirmed on an overlay crop 5120,4700: the map's small ticks stand west of the heavy line, the Siegfried hatching east, so Strasbourg own and Offenburg enemy. Bitburg own fits its capture about 1 March. The Goch stub (4014,779) stays unsure and decides no town. Length up from about 757 to 874 km, mostly links that now join (Zulpich, Mayen, Nastatten) and the Rhine above Strasbourg.
