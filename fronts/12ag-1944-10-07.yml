# Reader: title read 1200 HRS 7 OCTOBER 1944, no report number, SECRET struck through (agrees with the catalogue, 1944-10-07). gcps matched to 12ag-1944-10-08 (offset +0,-8 px; 57 of 81 agree, median 1.1 px, 24 placed through the transform, Bergen op Zoom 19 px, Tournai 16, Bocholt 16 off); conic fit 1.1 km rms over 81, leave-one-out 1.1 km, worst Beauvais 3.4 km. Boxes: 10-08's shifted (0,-8), keeping only the six that catch a stretch (title; Geilenkirchen boundary; Somme blob; west of Brussels; two Siegfried), plus one box per remaining stretch (each +-45 px about its middle), because this sheet's boundaries run elsewhere than 10-08's: with no boxes the trace holds 107 stretches, with the six 67, with all boxes none. Every stretch left was looked at (--look on 40 of the 67, the overlay on the rest): all are plain heavy boundaries (army group, army, corps) with no ticks, the Siegfried Line's hatched double line, or lettering (the stamp G5701s at 6129-6222,4858-4906). No ticked front is drawn on 7 October: none from Geilenkirchen round Aachen and Monschau (there the sheet draws only the Siegfried Line's hatched band, ladder rungs and no ticks on either edge, fused through Aachen and Monschau, which skeletonises into no stretches: 0 of it traces), none round Nijmegen, on the Antwerp-Breda line or in the Vosges. So the GeoJSON holds 0 front runs; the 10-08 sheet's ticked front first appears on 8 October. Every town is therefore on one side of nothing; --sides output not meaningful for this day.
# Reviewed: this sheet draws no ticked front (the scan at Aachen, 3900,1100, set beside 8 October's by the reviewer: on 7 October only the Siegfried Line's hatched band and the boundaries, on 8 October a heavy ticked front drawn over it). So the front is empty here: no front drawn, not no front; the sides test has nothing to read (Metz "?"). Six of 8 October's boxes kept, 67 small boxes added on lettering, boundaries, Siegfried hatching and the catalogue stamp; with them the trace is empty. 57 of 81 towns matched to 8 October; fit 1.1 km rms.
