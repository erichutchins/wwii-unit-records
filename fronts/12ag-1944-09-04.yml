# Reader: unlike 3 Sept, the sheet draws one long ticked front, ticks on the Allied side, about 287 km: the Somme (Le Crotoy, Abbeville) and its fingers round Doullens and Auxi-le-Chateau, St Pol, Bethune, round Lille and north-east to Brussels (ends at the Twenty One/Twelfth boundary, x 5390, y 300), and a short ticked stub east of Le Havre (Montivilliers/Harfleur, ticks to the east, facing the German 711 and 346 boxes). The 3 Sept estuary line is not drawn. No front is drawn elsewhere (Paris to the Meuse, Belgium east of Brussels, the Meuse): every other heavy black line is an unticked boundary and is not traced (the radius-3 trace finds none of them). `area` takes in the Lille-Brussels reach above the towns' top margin tick (y 848), which the towns' spread cut off. The legend stands lower and wider than on 3 Sept, so its box is moved. Two unsure stretches had the map's ticks on the other side from the tool's red ticks (3 times-enlarged overlay crops) and are flipped; the other three unsure (Bethune corner, the Auxi finger, Abbeville) were looked at and the tool had them right.
