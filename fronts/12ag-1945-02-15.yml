# Reader: title read 7 Nov 2026: report 255, situation as of 151200 Feb. 1945 (agrees with the catalogue, ict21256). Towns matched to 02-14 (accepted, no refusal): sheets offset -16, -8 px; 63 of 81 agree, median 0.8 px; 18 placed through the transform (Julich, Euskirchen, Gemund, Mayen, Kaisersesch, Strasbourg, Ostend, 's-Hertogenbosch, Nijmegen, Arnhem, Kleve, Munster, Trier, Bitburg, Prum, Zweibrucken, Pirmasens, Offenburg). The 51 boxes of 02-14 were copied and each moved by the median shift of the five towns nearest it (whole-sheet median -13,-10; it varies), then looked at on the overlay. The title box ends at y 858 and the signature box at y 1158, above the Walcheren/Tholen arcs (tops about y 880), which TRACE on this sheet, as does the Krammer-Volkerak arc (crop 1300,700: all ticked on the south, US side). The Seraing end and the eastern piece of the Twenty One/Twelfth boundary stay boxed, but the sheet prints 15 px up-left of 02-14 and the moved boxes missed the middle: two boxes added today (3340,2040,3645,2190 and 3685,1990,3758,2032: unsure runs 3460,2053 and 3717,2014, heavy black, no map ticks, ending at the front's west end near 3760,2005; looked, crop 3300,1800 before and after). No flips, no checks; 61 stretches, 0 unsure. Kleve is ticked on its west (crop of the loop, runs 3 and 5), Veritable. --sides: 02-14's geojson backed up (scratchpad q-0215, unchanged by the run), both days parsed, all 81 towns; 79 agree, 2 changed: "Verviers         enemy     by run 22 enemy at 3798,1993, run 21 enemy at 3946,1927" (02-14: "Verviers         own (US)  by run 20 own at 4058,2181, ..."; Verviers is Allied: WRONG today. The front's west end, at the boundary near Aachen (run 22), is ticked north (looked: its ticks and the US symbols are north), and Verviers lies south-west of that end, beyond it, where the test has only the two nearest runs; on 02-14 this end was boxed away and the south Siegfried runs decided. An open-end artefact, not a turned stretch, but it fails the 'Verviers must read own' rule and I left it) and "Prum             own (US)  by run 34 own at 4082,2761" (02-14: "Prum             enemy     by run 28 enemy at 4107,2745"; Prum is German-held: wrong today; its ring, placed through the transform, sits on a bend of the line, a weak corner test). Haguenau own ("Haguenau         own (US)  by run 51 own at 5344,4595", American-held, right, weak). Gemund and Adenau enemy. Kleve own, weak.
# Reviewed: all 81 towns diffed with 14 February: 79 agree. Verviers reads enemy and is WRONG ("Verviers         enemy     by run 22 enemy at 3798,1993, run 21 enemy at 3946,1927"): the town lies beyond the traced front's west end at Aachen, where the Twenty One/Twelfth boundary meets it; an open-end artefact, the stretch itself right. Prüm own ("by run 34 own at 4082,2761"): its ring on a bend of the line, one run deciding, weak as on 12-14 February. Gemünd, Adenau enemy; Haguenau, Kleve own (weak). 61 stretches, about 835 km, 0 unsure, no turns; the Walcheren/Tholen and Krammer-Volkerak arcs trace, ticked south. Two boxes added on the Twenty One/Twelfth boundary where the moved boxes missed its middle.
