# Reader: the sheet draws the line of contact with the Soviet armies as the ticked line (US divisions on the ticked, west, side): the
# Elbe, Dessau, the Mulde, Chemnitz, the wavy pocket Zwickau-Graslitz-Karlsbad, the Pilsen diagonal from the Pilsen road to Strakonitz, the
# arc by Prachatitz, Haslach and Linz, the Enns, the Salzach and the Radstadt/Tauern fingers (now also the two fingers south to Carinthia,
# not on 22 May's trace), the Tauern to the Gross Venediger. Not drawn as ticks, so not traced: the heavy straight EAST BOUNDARY TWELFTH A.G.
# (Chemnitz fork to Annaberg, x marks at Annaberg, bare to Karlsbad and the diagonal to the Pilsen road, x marks Strakonitz-Budweis, bare
# by Budweis and Kaplitz to Freistadt and Pregarten, Weyer to Windischgarsten), the Twelfth/Fifteenth boundary over the Tauern, x marks on the
# Elbe south of Seehausen (about y 560-730) and at Bitterfeld (about 3940-3990, 1575-1610, 9 km, no run).
# Reader: 22 May's 33 boxes moved by the fit of the towns (the content moved +14..+23, -21..-30 px, not the sheet-size difference
# +7, +9) gave 42 unsure runs, so 13 boxes were dropped (held nothing, or only runs not in their reach today) and 36 added, each
# round a run's middle on the no-box run and looked at on 4x. One real change from 22 May: the straight line from the Chemnitz fork to
# Annaberg (27 km, mid 4251,2344) is bare today (22 May traced it ticked); boxed. The Karlsbad-Pilsen road diagonal, 22 May's bare
# stretch, is boxed now (70 km chain with the Annaberg line, mid 4305,2893) so it does not chain into the ticked line.
# Reader: five checked by continuity with the ticks seen either side (Elbe 3719,539 and 3699,838; Mulde 4115,1789 and 4147,1859; Enns
# near Steyr 5215,4729), one at Kaplitz. No flips. Unticked ends: the Annaberg x-mark stretch is left out.
# Reader: 22 May's trace and today's differ also where the Prachatitz-Haslach arc runs about 12 km east (22 run at 13.87E 49.13N to
# 14.10E 48.76N, 23 May 14.04E 49.12N to 14.21E 48.88N); 14E 49N sits on the arc (ring under the line) and reads own today, enemy on 22 May;
# 14E 47N sits south of the east Tauern finger's tip and reads own today (three runs disagree), enemy on 22 May. Report 352.
# Setting: radius 4, dark 70 as on 22 May; 70 runs, about 1265 km (22 May 1220).
# Reviewed (8 Nov 2026): the line of contact with the Soviet armies, ticked; report no. 352. Overlay crops 3900,2050 and 4300,5100 looked at: Chemnitz to Annaberg, ticked on 22 May, is drawn bare today beside the EAST BOUNDARY lettering and is boxed with the rest of the bare boundary. In the Tauern the sheet draws grey-filled double bands with ticks running south from the Salzach and from Schladming into Carinthia (about 80 km more than 22 May); they are traced as ticked line, as 22 May took their northern ends, but what they mark against the British zone there is not settled from this sheet. 14E 47N, south of the eastern band's open end, reads own (three runs disagree there: an open-end artefact); 14E 49N sits on the Prachatitz arc. The towns' shift from 22 May varies across the sheet (12 of 58 placed through the transform; fit rms 0.7 km), so the boxes were moved by a fit to the towns, not one offset. About 1265 km.
