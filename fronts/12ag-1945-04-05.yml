# Reader: title read on the sheet: report 304, situation as of 051200 Apr. 1945; agrees with the catalogue (ict21305, 1945-04-05). Towns: 69 of 81 agree with 04-04's (median 1.6 px, offset +24,+8); twelve placed through the transform (Epernay, Chalons-sur-Marne, Toul, Metz, Rethel, Saint-Dizier, Colmar, Ypres, Arlon, Mechelen, Ostend, Bergen op Zoom), none further than 6 px.
# Reader: boxes. 04-04's 12 boxes shifted +24,+8 and tried on an unboxed trace (185 stretches). Kept: the title signature (holds the handwriting's runs), the two Saar boundary boxes (hold runs the tool called ticked or line: the hatched belt's rungs beside a plain boundary), the legend, the Third/Seventh boundary box. Dropped, holding no stretch's middle: the signature's last stroke (1610,1234) and the six boundary boxes of 04-04 at 3538,1187; 3394,1269; 2919,1334; 2805,1389; 2535,1668; 2328,1880 (those boundaries now come as longer runs, boxed below). Added at the middle of each heavy unticked boundary run left outside every box, each looked at with --look: 3734,1096 (the Twenty One/Twelfth boundary, 1112 px, Muenster to the spearhead's tip); 2679,1593 (the army boundary Muenster to the Rhine, 927 px); 2250,1485 (arc at Emmerich/Cleve); 3336,3470 and 3470,3473 (the Lahn boundary); 3823,4224 and 3521,4291; 4574,3625 (long straight diagonal); 4843,3375; 3988,4078. 15 boxes. No stretch left unsure.
# Reader: area kept at 04-04's [2150, 500, 6600, 4800]; no ticked line runs past it (the spearhead closes at y about 565, the east front stops near x 6000). 149 stretches, 1975 km (04-04: 84 stretches, 1840 km: the heavy ink breaks into more, shorter stretches on this sheet; no stray stretch seen on the overlay sheet).
# Reader: sides. 80 of 81 towns on 04-04's side; Strasbourg only: 04-04 `Strasbourg       enemy     by run 84 enemy at 3646,5561` -> 05 `Strasbourg       own (US)  by run 149 own at 3595,5669`. Its ring stands at the open southern end of the line (the sheet's bottom edge, crop 3300,5150), where the Rhine front ends at the neat line; today the line runs on a little further to the ring and the town reads own, which is the true side (Strasbourg was held); 04-04's was the open end's artefact. Colmar and Offenburg read enemy as before, also the open end. Arnhem enemy ("Arnhem           enemy     by run 37 enemy at 1993,1309"), Nijmegen own. Ruhr pocket ticked outward: Soest, Much, Waldbroel enemy; Siegburg enemy on the ring's edge (weak test, one run); Siegen own by run 107 own at 3691,2721, as on 04-04 (weak, on the pocket's southern line).
# Reviewed: 80 of 81 towns on 4 April's side. Strasbourg own ("Strasbourg       own (US)  by run 149 own at 3595,5669"; 4 Apr enemy off the Rhine line's open end): today the line runs on to its ring at the sheet's foot; own is right, a weak test. Arnhem enemy, Nijmegen own; Soest, Much, Waldbröl enemy inside the Ruhr pocket; Siegen and Siegburg on its edge (weak). 149 stretches, about 1975 km (check_fronts over 3-7 April finds nothing on this day). No flips: 4 April's Arnhem-notch and Bohmte flips come out right by themselves today (red ticks on the map's own at 3x). Six of 4 April's boundary boxes now catch nothing (the boundaries trace as longer runs) and ten are boxed at their middles, each looked at. Area unchanged, whole front.
