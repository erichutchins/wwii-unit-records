# Reader: title read 1200 HRS 12 OCTOBER 1944, no report number, SECRET struck through (agrees with the catalogue). gcps: matching to 12ag-1944-10-13 was refused ("the matches don't agree on one transform (49 within 4 px)"), so matched to 12ag-1944-10-14 (accepted: offset -8,0 px; only 15 of 81 agree, median 1.7 px, 66 placed through the transform; the matches are thin, so a town's place here is mostly the transform's). Boxes: 13 Oct's 24 shifted by about (-22,+6) (the towns' offset 13 -> 12 runs -19..-25 in x, 3..9 in y), each tried by leaving it out: 8 catch a stretch and are kept (title, the legend-side boxes, the Somme-Arras and Cambrai-Maastricht boundary pieces etc.), 16 catch nothing and are dropped; none cuts a ticked stretch. 13's Marne-Rhine canal box was dropped on 13 as cutting ticked front and stays out; 13's boundary box at the canal's last stretch, shifted, missed the stretch by 5 px, so a new tight box was drawn on it (4640,4335 to 4715,4365). New boxes for what 13's shifted boxes missed or the sheet draws differently: the First Canadian/Second British boundary (three bits west of Lille, 690..1720,1530..2015) and its stretch north of Eindhoven (3909,387, which put Arnhem own), the Twenty One/Twelfth boundary at 3241,1145, a boundary stub at 3794,2288, Siegfried hatching at 5356,3372, 6114,3670 and 6161,3875, the Twelfth/Sixth boundary NE of the Moder at 5543,3974, and the hatching bar in the Geilenkirchen corridor head (4240,1266). 13's checks: none of its 17 comes out right by itself here; 8 stretches are unsure on their own and are checked by eye, re-centred on today's (seven in the Maastricht loop, one at 4265,2519 east of Sierck/Luxembourg: ticks west, seen on --look). The loop checks (4368,1397 4272,1409 4346,1441 4226,1432 4263,1460 4307,1470 4312,1488) were judged on a 4x enlargement of the overlay and are the least certain: the map's ticks are hard to see in the fused loop; the red ticks all fall inside (the US side) as on 13. 13's area box (4540,5080..) not copied: nothing of today's front is down there. Gap: the Geilenkirchen arc's west end (x 4120-4180, y about 1210-1260, ticks hanging south on the map) is not traced today either, about 60 px; the rest of the arc from 4180 is traced (today's sheet keeps it apart from the boundary above). Aachen is under siege (fell 21 Oct): the reach round it traces in 60 stretches overall, ticked stretches with the checked pieces; the Aachen-Monschau reach has fused fragments, checked by the overlay only in part. No ticked front is drawn round Nijmegen, on the Antwerp-Breda line or in the Vosges: nothing traced there; Nijmegen, Arnhem, Eindhoven, Breda, 's-Hertogenbosch, Bergen op Zoom, Saint-Dié, Colmar are beyond the open ends, artefacts either way. Metz enemy. Sides: 75 of 78 towns agree with 13 Oct's; Saint-Dié and Colmar (own on 13, enemy here) lie off the south end, the hook at the canal's end (runs 58-60) now counts; Eindhoven (enemy on 13, own here) off the north end.
# Reviewed: towns matched to 14 October (13 October refused); only 15 of 81 agreed on the match, the rest placed through the sheets' transform, but the conic fit over all 81 is 1.1 km rms (worst Beauvais 3.2 km), as on the neighbouring days. As on 13-14 October, a ticked front only from Geilenkirchen and the Maastricht loop to the Marne-Rhine canal; none round Nijmegen, on the Antwerp-Breda line or in the Vosges. 60 stretches, about 304 km, 0 unsure, no flips; seven Maastricht-loop pieces and one east of Sierck checked by eye; the Geilenkirchen arc's west end (~60 px) and fragments of the Aachen-Monschau reach untraced (fused ticks). 75 of 78 towns on 13 October's side; the three that change (Saint-Dié, Colmar, Eindhoven) lie beyond the open ends and are artefacts either way. Metz enemy. 16 empty boxes dropped, 13 added, each looked at.
