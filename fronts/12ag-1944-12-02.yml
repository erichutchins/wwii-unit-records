# Reader: towns matched to 12-03 (offset +8, -16 px): 56 of 81 agree, median 0.9 px, 25 placed through the transform. The 12-03 boxes shifted by that offset and each tried alone by the trace's GeoJSON (same file with and without): kept where they change it (title, legend, Twenty One/Twelfth boundary, Twelfth/Sixth boundary south-west of Dombasle, Twelfth/Sixth along the Marne-Rhine canal at 4268). Dropped as catching nothing here (all ten out together gave the identical GeoJSON): the Canadian/British boundary's two boxes, the Twelfth/Sixth boxes at 4528 and 3848, the Ninth/First boundary's two, the First/Third boundary's, the Seventh/First French, the squiggle at 4638 and the German First army box's edge at 4738. None of the kept boxes cuts a ticked stretch: the title box stops above the Scheldt arcs and west of the Hollandsch Diep arc (arcs traced; map ticks hang south, red ticks south: no flip); the Seventh/First French boundary is left unboxed and the Saar and Vosges front is whole. Boxes new on this day: the enemy 18's cross near Dueren (4054,2461), the Rhine reach north of Karlsruhe (three short runs and a loop, no ticks of the map's own, ticks seen were the grey railway's; runs disagreed), a one-tick stub at 5631,4418, the stub of ink by 3 (ELMS) at 3861,557, and the boundary from the Saar stub down to Sarrebourg (4440-4650, 4440-4600; here the boundary meets the front at about x 4640, not 4690 as on 12-03). 53 stretches, 0 unsure, 0 flips.
# Reader: --sides diffed with 12-03, town by town: 80 of 81 agree. Strasbourg: 03 "Strasbourg       own (US)  by run 52 own at 5242,4860"; 02 "Strasbourg       enemy     by run 42 enemy at 5118,4505". Its ring (5232,4850, placed through the transform) lies about 30 px east of the ticked front, which is whole along it (overlay crop 4900,4100): the ring-under-the-line artefact the tool's test shows on 12-04 too; it was liberated 23 November, so own is right and the sheet's test cannot say. Jülich ("Jülich           enemy     by run 22 enemy at 3911,1729") and Haguenau ("Haguenau         enemy     by run 42 enemy at 5118,4505") enemy as required.
# Reviewed: 80 of 81 towns on 3 December's side. Strasbourg reads enemy and is WRONG (liberated 23 November; "Strasbourg       enemy     by run 42 enemy at 5118,4505"): its ring, placed through the transform, sits about 30 px east of the whole, ticked Rhine front, the ring-under-the-line case of 4 December. Jülich and Haguenau enemy. 53 stretches, about 938 km, 0 unsure, no turns; Scheldt arcs ticked south as the map's. Ten of 3 December's boxes caught nothing here and are dropped; six added (two on the Rhine north of Karlsruhe, where both banks were German and the heavy river line has only railway ticks; the 18 symbol's squiggle; a stub by the 3 (ELMS) label that had put Kleve own; the Twelfth/Sixth boundary to Sarrebourg). 4 December's Rhine stub box not carried.
