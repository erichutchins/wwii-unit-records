# Reader: title SITUATION 2400 HRS 9 JULY 1944, HQ FUSAG on the line below, COPY NO. blank, no report number, SECRET struck through at top right. Agrees with the catalogue's day (ict21034). Towns matched to 12ag-1944-07-10's (base B01): 33 of 34 agreed (median 0.5 px, sheet offset +16, +0 px); 0.5W 49N (18 px off) placed through the transform.
# Reader: boxes. Title block, SECRET and legend re-tested by removal: without the title block 111 stretches (61 unsure), without SECRET 59 (13 unsure), without the legend 106 (52 unsure); all kept. The table of units on the way (86 Corps...) is new today: it traced one stretch (48 without the box, 47 with). Boundary ends at the 29 box and at the 53 box each traced one unsure magenta run (48 without each box); boxed, no ticked stretch touched. Symbol strokes boxed: the hatched boxes 353, 255, 91, 343, 266, 352, 6, 16 GAF, 21, the II Prcht XXX, the SS XXX south of Caen, the VII Corps box north of Isigny, and the lone 5 box far south-west (64 stretches before these, 42 after). 07-10's flip by the 265 box is NOT kept: today no stretch lies within 8 px of (1867,2176) (the vertical there, x about 1900, y 2130-2270, is not traced at all), and the run with the flip in place is byte-identical to the run without.
# Reader: checked: three magenta front stretches (west tip at 1425,2207; the bend's bottom at 2817,2701 and 2840,2692): map's ticks and the red ticks agree on the north side (--look and overlay crops).
# Reader: radius 3 as directed gives 42 stretches (31 ticks, 8 line, 3 checked, 0 unsure) and only 87.1 km from the GeoJSON against 134.1 km on 10 July: the heavy line is not traced where it is thickest (the corridor's vertical at x about 1900, the Caen north-west reach 3400-3700,2350-2500, parts west of Saint-Lo). Scratch trials: radius 4 gives 44 stretches, 141.1 km, 2 unsure; radius 2 gives 106 stretches, 57 unsure. Radius 4 is probably the right setting for this sheet; left at 3 as directed.
# Reader: --sides on 07-10 (its GeoJSON backed up, unchanged by the run) and today, town by town: 33 of 34 the same. One changes: "1E 49.5N         own (US)" today against "1E 49.5N         enemy" on 07-10. It is beyond the open east end (about 100 km east of the Orne mouth, on land north of the Seine, German-held, so enemy is right); the runs listed are the same three enemy to one own, but the test weights by angle and nearness, and today's tip leg and the hook round the 51 box are cut into different runs, so the sign falls the other way. 0.5E 49.5N reads enemy. An end artefact, not a wrong stretch: the Orne-mouth stretches' red ticks fall on the map's ticks (west side, crop 3650,2050). Towns beyond the open ends read either way: 0E, 0.5E and 1E 50N (sea off the east end, own) and 2W and 1.5W 50N (Passage de la Deroute off the west end, own). Two earlier changes (1W 49.5N, 1.5W 49N) were stray symbol strokes (VII Corps box, 343 box) found by the runs named and boxed.
# Reader: gaps over 20 px between run ends (nearest ends, about 23.5 px/km): many, as the radius leaves the thick line out: 89 px at 1.418W 49.305N (runs 1-3, the corridor head); 83 at 1.445W; 43 at 1.346W; 60 at 0.188W 49.288N and 66 at 0.216W 49.239N (the Orne-mouth reach); 41 at 1.203W; 46 at 1.248W; 40 at 1.542W; 78 and 152 at 1.588W/1.631W 49.265N (the west reach); 35 and 57 at 1.32W 49.24N; 35 at 1.259W; 21 at 1.151W; 38 at 1.142W; 44 at 0.214W 49.213N; 53 at 0.285W; 33 at 1.093W; 52 at 1.112W; 89 at 1.058W 49.150N; 44 at 0.631W 49.161N; 26 at 0.669W; 32 at 0.712W; 37 at 0.596W; 55 at 0.457W 49.147N (Caen, north-west); 40 at 0.753W; 30 at 0.778W; 21 at 0.894W; 42 at 0.924W; 64 at 0.961W; 44 at 0.765W; 59 at 0.867W; 28 at 0.804W. The line is continuous on the map across all of them.
# Reviewed: headed HQ FUSAG, situation at 2400 hrs 9 July. Traced at radius 4, not B01's 3: on this sheet the line is drawn heavier, and radius 3 lost its thickest reaches (the corridor vertical near x 1900, Caen's north-west reach), giving 87 km against about 134 on 10 July. At radius 4: 40 stretches, about 137 km, 0 unsure, no turns; three enemy symbol strokes that trace at radius 4 boxed (the 17 SS, 275 and 352 boxes; crop 1850,2330); the whole-sheet overlay shows one line from the Passage de la Déroute round Caen and up the Orne to its mouth, nothing stray. All 34 towns on 10 July's side (0.5E and 1E 49.5N enemy, right). A new table of units believed on the way is boxed.
# Reader: symbols read afresh on all nine tiles and magnified (--look): 76 symbols, 8 listed (US 20, German 35, British 18, Canadian 3), written from sources/fronts-work/12ag-1944-07-09/reading.txt; 37 finder boxes (4 of them title letters, skipped) and 43 read off the overview (VII, FIRST, XIX, 82, 35, 353, 91, 265, 6, 17 SS, 266, 275, 3 armored, 352, 29, 2, 3, 2, 10 SS, 21, II SS, XLVII and the British and Canadian symbols). Nothing in the east beyond 17 GAF (Fecamp) and 84 (Bolbec); the airborne 5 by Rennes is there; the legend (US, BRITISH, ENEMY, FRONT LINE) is not read. No `unit` ties beyond the tool's (corps, First Army, the 1st); the divisions' ties are left to the reviewer.
# Reader: the 79th Division's crossed "79" (xx, infantry) stands at 1397,2137 (finder box 9), at the north edge of the front near La Haye-du-Puits (the sheet's "du P." / Gorges lettering, the front's hachured line about 50 px south of it). On 7 July it stood at 1350,2090: moved about 47 px east and 47 px south (about 2 km), still north of the line. Its neighbours today: 8 at 1584,2147 (7 July 1499,1932), 90 at 1740,2129 (1739,2098), 82 airborne at 1592,2072 (1633,2051), 4 at 1944,2165 (2024,2047), 83 at 1972,2232 (1999,2132: the 8 of "83" is merged with the front line's blob, so the figure is a reading, not certain), 9 at 2215,2228 (2050,1894: far south-east of 7 July), 30 at 2335,2326 (2368,2244), 29 at 2410,2464, 3 armored at 2218,2330 (2368,2157), 35 crossed "35" at 2357,1904 (new: in the Carentan estuary at the sheet's edge of the sea), 101 airborne at 1406,1323 (1399,1313, Cherbourg, same), VII flag at 2020,1818 with three x's (two on 7 July), VIII flag at 1644,1730 (7 July 1869,1542: moved west and south), FIRST at 2462,2017, XIX at 2490,2090, V at 2635,2115.
# Reader: differences from 7 July that are not small shifts. (1) 2 SS: the hatched armored-infantry "2 SS" now stands at 1540,2298 by the west coast, beside the 243 and 91 (on 7 July it stood at 3054,2585 east of Caen's south; no "2 SS" elsewhere today). (2) New: "35" (US), the 277 inf div (de, hatched cross, 3066,2933, listed unlocated), the regimental airborne "15" (de, three bars, 1706,2385; 7 July had only the "6"), the German "(ELMS) 265" and "77 (ELMS)" (caption "(ELMS)" under the 77 with arrowheads to the 77 and the 265, replacing 7 July's "ELMENTS"), "(ELMS) 266" (caption left of the box, no "Battle Grp. Only" today), "275" with no qualifier today, "352 (REMNANTS)", "343 (ELMS)" no longer listed unlocated (no "UNLOCATED" by it today); "I SS" and "II SS" are corps boxes with the numeral inside and only "SS" beside (no "PZ" beside them; "1 SS Pz" is lettered on the army-corps boundary line). (3) 21 moved to 3695,2585 (3537,2366), 1 SS to 3408,2628 (3481,2537), 10 SS to 3308,2650 (3402,2620), 17 SS to 1958,2407 (1989,2330: 77 px south). (4) British, Canadian: "CDN 2" (ca xx infantry, 3182,2110) is new; "CDN 3" is at 3466,2428 and "59" at 3479,2330 (7 July 3438,2250 and 3460,2175: about 100-150 px south); the airborne "6" has no arrow today (3754,2223); the "3" at 3586,2367. (5) The "3" and "2" armored etc. otherwise the same set. Gone from 7 July: nothing else; the count is 76 against 72.
# Reader: arrows. A long arrow runs from the British 15's label (3155,2276) down past the 11 and 43 to a head at about 3342,2480 by the front: flagged `list:arrow` on 15, 11 and 43 as on 7 July (the reviewer should look at 3150-3350,2250-2500: whether it starts at the 15 and merely passes the other two). On the German side two arrows: a curved one from the 91's top bar up beside the 2 SS to the front at about 1635,2240, and a line from the airborne 15's bars up to the "(ELMS)" hook under the 77; both boxes `list:arrow`. The British infantry boxes (59, 3, CDN 3, CDN 2, 15, 43, 49, 50, 53, 51) are drawn with arrow-tipped cross strokes: read as the infantry cross, not as arrows leaving the box.
# Reader: "UNLOCATED" today is lettered under 716 and LEHR with arrows up to them, and an arrow into the 277: all three `list:unlocated`. No "LOCATION DOUBTFUL" and no allied label in a US box today. Boundary lettering (not symbols, not entered): "VIII | VII" by Ste-Mere-Eglise (1450-1500,1900), "VII | XIX" (about 2060,2050), "XIX | V" (about 2540,2230), "XXX | VIII | I" (3200-3470,2250), "LXXXIV | II PRCHT" (1900-2100,2690), "XLVII | 1 SS Pz" (3000-3200,2800), "II PRCHT | XLVII" (2450,2830), "1 SS Pz | ?" (3380,2720), "FIRST U.S. | SECOND BR" (2800-3050,2000); the small "oo" marks are boundary/bridge marks. Unsure: 83 (1972,2232), the "I SS" and "II SS" labels (numeral inside the box, SS beside), the 5 airborne's and 15's arm (curved mark read as airborne), arrows on 15/11/43.
