# Reader (symbols): THE 79th: its crossed "79" (open, xx, infantry) stands at about 1395,1327, by the "Octeville" lettering just south-west of Cherbourg (the town's lettering is "Cherbourg" over "Octeville"). On 27 June it was at 1411,1323 (the sheets differ by a few px): not moved. Neighbours at Cherbourg: the 9th at 1193,1242 (27 June 1240,1276: about 47 px left and 34 up of the day before, by "Flottemanville", west of Cherbourg; read from the tile and the magnified crop, the "9" and the box sit just left of Flotteman... lettering); the 4th at 1575,1192 (27 June 1620,1262: 45 left, 70 up, by Maupertus / Tourlaville); a hatched enemy 709 (xx, infantry) at 1428,1089, north of the Cherbourg docks by Pelée (27 June 1409,1108: small shift). So the 79, 9 and 4 are still drawn round Cherbourg (the 9 and 4 pulled slightly north-west of the day before). VII CORPS box (open, xxx, flag pole) at 1672,1456 on the peninsula's north-east (27 June 1635,1618: 160 px north, by Valognes/Brix, which the day before stood by Valognes); VIII CORPS box with a flag at 1667,1710 (27 June 2046,1896 by Carentan: about 380 px west and 190 north, now beside the Cotentin ridge; the 27 June "VIII" may have been a boundary-line lettering, a VIII/XIX label "VIII xxx XIX" with crossed lines stands at about 2200,1915 on today's sheet, and a "VII xxx VIII" at about 1763,1790 on the VII/VIII boundary: neither read as a symbol, both are corps-boundary lettering). 82d Airborne (xx, airborne) 1667,1871 (27 June 1671,1871: same place). 101st Airborne at 1522,1864, west of the 82d, by Barneville/St-Sauveur-le-Vicomte on the west coast road (27 June 1964,2117: a large move, 440 px east and 250 south; the 27 June place is today's 83 box (see below), so the day before may have read the 83 or 101 at the wrong place; check 27 June). 83d (open, xx, infantry) at 1948,2113, south-west of Carentan beside the 90th (27 June 2084,1992; the 90th at 1863,2032 today, 1876,2032 the day before: same place). 
