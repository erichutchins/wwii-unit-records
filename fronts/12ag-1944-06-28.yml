# Reader: title SITUATION 2400 HRS 28 JUNE 1944, HQ FUSAG, COPY NO. blank. Agrees with the catalogue's day (ict21023).
# Reader: towns matched to 12ag-1944-06-29's (base B01), sheets offset +0, -16 px: 32 of 34 agreed (median 0.6 px); 0.5W 48.5N (46 px off) and 0E 48.5N (31 px off) placed through the transform (a --gcps-from run to 29 June, accepted, no refusal).
# Reader: METHOD: hand waypoints. Started from 29 June's runs shifted -16 px in y (the sheets' offset) and checked on overlay crops (3250,2100 700x560; 2200,2000 1100x700; 1250,1850 1000x400; 900,1000 350x300; 1150,1960 300x160). The shifted waypoints sat on the ink everywhere, so none was moved; these were read on the overlay crops, not on separate gridded 2x crops of the bare scan. Radius 4, dark 110.
# Reader: today's line is as 29 June's: from the west tip at the lake (ink ends about x 1285) over the Cotentin ridge, the Carentan diagonal, the loop under the 83 box, down the Vire past St-Lo, the Odon salient drawn unbroken, the Caen reach and the Orne arc to the coast at (3845,2158); run 2, the Hague arch from (995,1174) over Beaumont, down to (1130,1187) and NE to the 709 symbol (1198,1084): about the same length as on 29 June, so the Hague line did not differ visibly. Ticks hang on the Allied side throughout (north and east on the Cotentin, inside the 83 loop and the Odon salient, north of the Caen reach, east of the Orne arc, south of the Hague arch); the overlay's red ticks fall on the map's ticks on both runs. Nothing seen off the ink or untraced. No stretch flipped or checked.
# Reader: --sides on 29 June (its GeoJSON and gcps backed up, unchanged after) and today, 34 towns diffed: no town changes side; the only line that differs is 0.5W 50N, own (US) on both days, whose run 2 witness reads "own at 1119,1204" on 29 June and "enemy at 1121,1194" today (the town sits under the Hague arch's east end; its run 1 witness says own both days). 0.5E and 1E 49.5N enemy; 2W and 1.5W 50N enemy (at sea past the open end, reached only by the Hague run, either way). No town on the wrong side. Length from the GeoJSON about 170 km (2 runs, 184 and 14 points; 167 km on 29 June by the same sum).
# Reviewed: hand waypoints (29 June's, shifted -16 px, none moved); overlay crop 2900,2050 looked at: round the Odon salient several waypoints stand 20-40 px off today's ink, but the traced path snaps to the drawn ticked line and follows it, ticks on the Allied side, from the Odon salient along the Caen reach to the Orne arc; the rest checked on the reader's crops. No town on the wrong side; about 170 km.
