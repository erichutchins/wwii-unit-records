# Reader: title SITUATION - 2400 HRS 12 JUNE 1944 / HQ FUSAG / COPY No. ___ (blank); "12 AG OUTLINE MAPS 1:500,000" top left margin; no report number. Agrees with the catalogue (ict21007, 1944-06-12). Legend read on the sheet (bottom left): U.S., BRITISH and ENEMY box keys and a FRONT LINE sample (a heavy stroke with ticks); no bomb line in the legend today. The legend box is excluded.
# Reader: towns matched to 12ag-1944-06-11, sheets offset -16,-16 px: 33 of 34 agree (median 1.5 px); 1W 49.5N was 58 px off the transform and is placed through it.
# Reader: drawn as the front: one ticked line, enemy on the left, from the top of the Orne pocket's east leg (3825,2170, below the SS box) down the leg, round its foot at Colombelles, west along the Caen reach (Cheux-Tilly rise), the dip at Tilly (3070,2502), over the rise at (2800,2431), south-west to the V's foot about (2550,2522) (the 2nd and 29th Divisions behind it), up the Vire side NW to the Carentan hook (2200,2130), west along the south of Utah, north up the west side past the 82nd/90th boxes and east along the top to (2013,1612). Utah and Omaha stay joined; the front now runs from Carentan down the Vire to the foot at about (2550,2522), 40 px lower than 11 June, and the Utah top is no longer a separate run (nothing is hidden: the 4th Division box sits above the line, so one run). Not the front: the heavy untoothed boundaries (the diagonal VII/V corps line from about (1900,2270) to (2040,2100) and its short continuation to (2100,1990), the verticals at x about 2840, 3300, 3500, 3700 and 3830, the First/Second army line south from (2800,2300)), the dashed British boundaries and arrows (the thin one to the SS box), the unit boxes and circles, the dashed lines, the corps and army group tick marks.
# Reader: METHOD: hand waypoints (`runs:`), 89 points on the scan read by eye on 2x crops with a 50 px grid labelled every 100 (crops from 1700,1550 700x650; 1900,2050 700x600; 2550,2200 700x600; 3200,2150 700x450; 3600,1950 600x500), 7 Nov 2026. Started from 11 June's shifted -16,-16, but the sheet differs (the Carentan hook, the V's foot and the Utah top) so the run was redrawn wholly on today's ink; nearly every waypoint differs from 11 June's shifted ones by more than 12 px because the points were re-spaced, but the line itself moved little except at the foot of the V and the Utah south edge (Carentan). RADIUS 4, dark 110 worked this time (no "no ink between"); 11 June needed 3. Teeth looked on every crop: they hang on the Allied side (north of the Caen reach, west of the pocket leg, inside Utah, east of the Vire stretch); nothing flipped.
# Reader: result: 1 run, 143.4 km from the GeoJSON (11 June 147.1 km, which had two runs). Overlay crops (1650,1550 1000x700; 2200,2100 1100x500; 3200,2100 750x450) looked at: the trace follows the heavy line end to end and the red ticks fall on the map's teeth. Nothing off the ink or untraced; the thick line crossing the boundaries at x about 2840 and 3300 is bridged cleanly.
# Reader: boxes: with waypoints only the title, SECRET and legend boxes are kept.
# Reader: sides: 11 June's GeoJSON backed up (cmp: unchanged after --sides) and --sides run on 11 June and today, diffed town by town: no town changes. Tool's line today: `2W 50N           enemy     by run 1 enemy at 2531,2524` (11 June: enemy, by run 1 own at 2658,2441, run 2 enemy at 1937,1623). 2W 49.5N and 1.5W 49.5N enemy as before (they lie west of the Cotentin and the Utah front, outside the run's reach), 1W..0.5W 49.5N own, and 0.5E and 1E 49.5N still read own: open-end artefacts inland east of the Seine mouth (German-held), as on 11 June; no line runs between them and the sea. All 34 agree with 11 June.
# Reviewed: hand waypoints at radius 4, dark 110; overlay crop 1750,1500 looked at: one line from the Utah lodgement round Carentan, down the Vire side to the V's foot short of St-Lo, past Tilly and along the Caen reach round Colombelles to the Orne pocket, ticks on the Allied side throughout. WRONG sides, open-end artefacts east of the Seine mouth: 0.5E and 1E 49.5N read own (German-held). About 143 km.
