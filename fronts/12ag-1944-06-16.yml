# Reader: title SITUATION - 2400 HRS 16 JUNE 1944 / HQ FUSAG / COPY No. ___ (blank); "12 AG OUTLINE MAPS 1:500,000" top left margin; no report number. Agrees with the catalogue (ict21011, 1944-06-16). Legend (bottom left): U.S., BRITISH and ENEMY boxes and a FRONT LINE sample (heavy toothed line), left out with the box [1300,4750,2100,5300] as on 15 June (not re-looked at on today's sheet beyond the layout); SECRET box at the top right as on 15 June.
# Reader: towns matched to 12ag-1944-06-15, sheets offset +0,+0 px: 33 of 34 agree (median 0.5 px); 1.5W 48.5N (13 px off) is placed through the transform.
# Reader: drawn as the front: one ticked line, enemy on the left: Orne pocket's east leg (top 3855,2162), round Colombelles, west along the Caen reach (Tilly dip), SW down the V's east side to the foot (2835,2702), NW up the Vire side past Carentan (peak at 2300,2235, a notch at 2250,2280), west along the south of Utah, north up its west side and east along the top to (1975,1555). Utah has pushed out again: the south reach now runs on to (1547,1932) (x 1677 on 15 June at y 1930) and the west side stands at x about 1555 at y 1862 (1677 on 15 June at 1850), the top at about (1850,1580) to (1975,1555). A break in the line at the west corner, 1535,1912 to 1540,1880, holds two heavy dots (as the line's open end) and is left as drawn: two runs end and begin at the dots. Not the front: the heavy untoothed boundaries and corps lines with their dot ends (x about 2830-2890 down to the foot, 3280, 3500, the diagonals through the bridgehead), the dashed British boundaries and arrows, unit boxes, circles.
# Reader: METHOD: hand waypoints (`runs:`), read by eye on gridded 2x crops of the bare scan (50 px grid labelled every 100; crops from 1450,1550 600x700; 1800,1450 600x400; 1900,2050 700x600; 1500,1900 550x350 (the south reach redone after a check that 7 waypoints sat 3-8 px off the ink); 2450,2400 700x400; 2900,2250 700x350; 3450,2100 500x400), 7 Nov 2026, afresh on today's ink. RADIUS 3, dark 110: at radius 4 the tool said "no ink between" (the heavy dots at the line's break do not survive); the dots were found as ink at radius 3 only.
# Reader: result: 2 runs (150 and 27 points), 163.7 km from the GeoJSON by the sum of its legs (15 June 158.3 km by the same: longer by Utah's pushed-out south and west sides). Overlay crops (1500,1500 800x700; 2200,2100 800x650; 2850,2250 800x450; 3300,2050 700x500) looked at: the trace follows the heavy line end to end, the red ticks fall on the map's teeth on the Allied side; nothing off the ink; the only untraced stretch is the break 1535,1912 to 1540,1880 (about 30 px) between the two runs' dots. Nothing flipped.
# Reader: sides: 15 June's GeoJSON backed up (cmp: unchanged after --sides); 34 towns diffed, one changes: 1.5W 50N (15 June `1.5W 50N         own (US)  by run 1 own at 2584,2601`; today `1.5W 50N         enemy     by run 2 enemy at 1772,1705, run 1 own at 2806,2704`). Reason: the town lies in the Channel off the north Cotentin, beyond the line's open end at Utah's top; today the Utah west side (run 2) is the nearer reference and calls it enemy, which is right (Cherbourg and the north Cotentin are German-held on 16 June), so the change is the open-end test settling the other way, not a change drawn. 0.5E 49.5N reads own and 1E 49.5N enemy as on 15 June: open-end artefact east of the Seine mouth. 1W 50N and 0.5W 50N read own (at sea, either way). All other towns agree with 15 June.
# Reviewed: hand waypoints at radius 3, dark 110 (two heavy dots in the west corner do not survive radius 4). Overlay crop 1450,1500 looked at: the Utah lodgement now reaches St-Sauveur-le-Vicomte (taken 16 June), its west side and south reach about 120-130 px west of 15 June's, on the ink with the ticks inside; the west corner is drawn as two dots, and the two runs end at them (about 1 km open). The rest as on the reader's crops. WRONG side: 0.5E 49.5N reads own, the open-end artefact east of the Seine mouth. About 164 km.
