# Reader: report no. 364, situation as of 041200 JUNE 1945 (the catalogue says 1945-06-04: agrees; title read with --title 4100 150 1900 1000). The legend (bottom left, overlay crop 100,5300) draws only the "U.S." and "BRITISH" boxes: no FRONT LINE sample and no ENEMY sample, as on 5 June.
# Reader: the line of contact with the Soviet armies (the Elbe, the Mulde, Saxony, Graslitz, Karlsbad, the Pilsen diagonal, Budweis, the Enns, the Salzach, the Tauern) is a heavy black line with NO ticks, as on 5-7 June: looked at 4x at 3660,780, 3850,1290, 4090,2000, 4180,2740, 3900,2320, 4420,3060, 4640,3350, 5100,3880, 5230,4800, 5150,5150, 4960,5560, 4780,5700. The only ticks on the sheet are the grey-filled outlines south of the Twelfth/Fifteenth boundary at Heiligenblut into Carinthia (the Moelltal and a loop by Lienz; overlay crop 4050,5550), which the sheet does not explain; boxed (5 June's first box moved, with the area) and not traced. Empty front (owner's decision, 8 Nov 2026).
# Reader: towns from 12ag-1945-06-05: sheets offset +8,-16 px; 34 of 58 towns agree (median 1.5 px), 24 placed through the transform; conic fit rms 0.9 km, leave-one-out 1.0 km, worst 2.5 km (15E 47N). 5 June's 77 boxes and its area were moved here by a quadratic fit of 5 June's towns to today's (58 towns, rms 1.3 px, worst 3.9 px). A run with no boxes (310 runs, 37 ticked-looking, 257 unsure) was compared: the moved boxes left 3 runs, all non-front, each given a box (two on the bare Enns line east of Liezen, one a stub at the XV/XIII lettering at Radstadt). A run with all the boxes traces 0 runs.
