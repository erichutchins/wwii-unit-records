# Reader: 2 March, report 270. gcps_from 12ag-1945-03-01 (sheet offset +24,+24; 73 of 81 agree, median 0.8 px, 8 placed through the transform: Gemund, Haguenau, Strasbourg, Nijmegen, Kleve, Munster, Zweibrucken, Pirmasens). 03-01's 113 boxes moved by the median offset of the five towns nearest each (+25..27, +21..24 everywhere); signature box right edge now 1612, left of the Walcheren arc's west end (about 1620). The Walcheren, Schouwen-Duiveland and Tholen arcs trace (red ticks on the south, the map's small ticks); the short black Duiveland arc at about 2020-2150,810 is not traced (as on 03-01, not looked into).
# Reader: tested the boxes against a run with no boxes (64 runs, against 44 now): the boxes hold only lettering, the stamp, the legend, boundaries and symbol/Rhine ink; the TWELFTH/SIXTH last-stretch box (4248,3921,4424,4079) was tried without it, which only added the boundary line as a blue stretch, so it stays. 03-01's six Rhine flips (runs 77-82) and its Zulpich check dropped: the Rhine above Strasbourg is now one run that the tool turns right by itself (overlay crop 5150,4700: red ticks on the west on the map's small ticks, Siegfried hatching east), Strasbourg own, Colmar own, Offenburg enemy; the Zulpich link is blue and continuous.
# Reader: two boxes added: the SECOND BR./NINTH U.S. boundary's end at the front by Roermond (3630,1418,3700,1450; a magenta stub, unsure at 3679,1428) and a stub on the 15 symbol's outline by Rheinberg (3998,955,4045,982). Left unsure: 3958,844 (the Goch stub in the black mass, as 03-01; Kleve own and Bocholt decided by other runs) and 4255,3415 (a stub in the smudge between two blue runs near Trier, 4255,3415; decides no town: Trier by run 35 enemy, Bitburg own). A small spur of the heavy line at about 4195,1670 by the 99 symbol was left (looked, --look 4195,1670: a lobe of the front's own ink).
# Reader: sides against 03-01: 80 of 81 agree. Only Prum changed, enemy -> own: 'Prum             own (US)  by run 31 own at 4153,2668' (03-01: 'Prum enemy by run 50 enemy at 4039,2717'). The ring (4120,2725) sits under the front, which runs through it (overlay crop 3900,2500; the map's ticks are on the west, the town's name east of the line), so it can read either way: the line, not an error; the user expected enemy. Grevenbroich enemy (its ring, 4204,1524, also on the line: 'by run 19 enemy at 4217,1472'), Gemund enemy, Adenau enemy, Julich own, Bitburg own, Strasbourg own, Offenburg enemy, Haguenau enemy (weak). Neuss, Munchen-Gladbach, Rheydt and Zulpich are not among the 81 towns. Front 940 km (03-01: 872 km).
