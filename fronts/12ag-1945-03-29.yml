# Reviewed: Daaden, Nastätten, Bocholt, Marburg (own) and Münster, Soest, Paderborn nearer the front are the breakouts from Remagen and Wesel. Siegburg (own) is doubtful: it sits under the line on the Sieg and was German-held into April; a weak test. The heavy ticked east side of the Frankfurt bridgehead (x 4300-4700) is past the towns' spread and untraced.
# Reviewed (area): `area: [4230, 3000, 4880, 4460]` takes in the Frankfurt bridgehead's east side (Aschaffenburg north past Hanau and Nidda to the Vogelsberg), the 4th Armored corridor's tip at 4840,3050 and the Worms bulge: 4 stretches added, front 1166 to 1350 km; ticks checked on crops 4150,3000 and 4580,3030 (4x); the heavy stretch at 4290,3580 traced across; no town changed side. Still missing: nothing found.
