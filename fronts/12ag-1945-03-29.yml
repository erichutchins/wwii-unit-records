# Not traced, noted: the front east of the Rhine bridgehead is drawn as a very heavy ticked black line from Aschaffenburg north
# past Hanau and Nidda to near Fulda (x 4300-4700, y 3100-4400), and the bridgehead outside Worms (4250,4400-4500): too heavy for
