# Reviewed: two boxes added: the boundary wedge at 3770-3870, 1725-1830 (heavy, no ticks), and the army symbol's top bar at Giessen (5980-6120, 2270-2320), which had put Siegen, Marburg, Daaden on the US side.
# Reviewed: 12-07's box [4520, 4280, 4830, 4660] covered ticked front here (the Saar line east of Saarlautern, x 4630-4890, y 4170-4400, map's ticks hang south-west); narrowed to [4520, 4430, 4900, 4660], the boundary alone. 12-07's trace has the same gap (not touched).
# Reviewed: --sides diffed with 12-07, town by town: 79 of 81 agree. Differences: Julich (06: own, 07: enemy) and Haguenau (06: own, 07: enemy): rings lie close to the line, the front moved between the days.
# Reviewed (7 Nov 2026, on 5 December's review): Jülich reads own here and is WRONG (German-held until 23 February 1945; 5 and 7 December read it enemy); Haguenau reads own and is WRONG for 6 December (freed about 11 December). Both rings sit near the line; the trace is not shown wrong, the side test is.
