# Reader: title SITUATION 2400 HRS 26 JUNE 1944, HQ FUSAG, COPY NO. blank. Agrees with the catalogue's day (ict21021).
# Reader: towns matched to 12ag-1944-06-27's (base B01), sheets offset -16, -8 px: 32 of 34 agreed (median 0.6 px); 2W 50N (6 px) and 1W 49N (22 px) placed through the transform. No refusal; 28 June and towns-B01.csv not needed.
# Reader: METHOD: hand waypoints read afresh on 3x crops of the bare scan with a 50 px grid (labelled every 100 px): crops 850,1100 300x200 at 4x (the Hague end); 1000,1100 550x300; 1500,1100 550x300; 1650,1350 550x300 (the Cotentin line); 1200,1880 550x300; 1650,2000 550x300; 2150,2200 400x400; 2450,2450 550x300; 2950,2250 450x400; 3300,2150 600x350 (the main line, read west to east and written east to west). Run 1 has 134 waypoints, run 2 has 66, every 20-60 px and at every bend. None kept from 27 June. Radius 3, dark 110 as on 27 June.
# Reader: TODAY'S SHEET differs from 27 June: there are two runs, not three. Run 1 is the main line, the Orne arc's north tip (3803,2187) down its east side, west along the Caen reach, down the Odon head's east arc, the V under the Lehr box, west past St-Lo, up the Vire, the Carentan diagonal, the loop under the 101 box, over the ridge to the west tip at the lake (1265,2053). Run 2 is ONE line round Cherbourg, drawn as a single ticked line: from the Hague side (967,1206) over Flottemanville, a narrow tongue up at (1283,1160) and down beside the arsenal (79 box) to (1347,1270), up and east along the shore past the 709 box to the peak at (1653,1105) by St-Pierre-Eglise, south by Beauperthus and Quettehou, and south-east to (1915,1467) south-west of the Montebourg marsh: this is 27 June's Hague line and Barfleur line joined, with the middle (Cherbourg itself, east to Quettehou) drawn as front today. The Cotentin stretch is much longer and reaches further south (Quettehou, Montaigu) than 27 June's.
# Reader: the Odon salient (Epsom) is not drawn as a head: the line runs from the Caen reach down one broad arc (3357,2310) to (3200,2540), then west along y 2550-2565; the heavy spur and the thin heavy boundary with xxx beside it near (3330-3360, 2250-2420) are boundaries or the head's inner edge, no ticks, left out. Ticks: the map's ticks hang to the right of both runs in their order (enemy on the left): south of the Cherbourg line (west to east) and west of its Quettehou leg; on the main line, west of the Orne arc, north of the Caen reach, inside the Odon arc, north of the St-Lo stretch, west of the Vire, north of the Carentan diagonal. The overlay's red ticks fall on the map's ticks everywhere (crops 950,1050 1000x450; 1250,1880 1000x400; 2150,2150 900x600; 3000,2150 900x600).
# Reader: untraced, on purpose: the heavy boundaries with no ticks (the thin lines with xxx from the Cotentin's west coast at Carteret, the one down from (2050,2147) up toward the 83 box, the one down x 2480-2600 to the front near (2440,2530), the one down x 2800-2830 to the V at (2810,2700), the First U.S./Second Br. army boundary at x 3170-3200, the Odon spur). Nothing off the ink on the overlay; no stretch flipped or checked (no stretch method). The Cherbourg line's south-east end (1915,1467) is where the drawn line stops, at the marsh; the line is not drawn further.
# Reader: --sides on 27 June (its GeoJSON and gcps backed up in the scratchpad, unchanged after) and today, 34 towns diffed: no town changes side (only the runs that decide them differ, since runs are numbered differently). 0.5E and 1E 49.5N enemy; 2W, 1.5W, 1W 50N enemy, 0.5W 50N and 0E-1E 50N own (at sea, either way). No town on the wrong side. Length from the GeoJSON about 208 km (2 runs: 148 and 60 km; 163 and 66 points).
# Reviewed: hand waypoints, read afresh, radius 3, dark 110. Overlay crop 950,1050 looked at: the Cherbourg line is one ticked line (ticks south and west, the Allied side) from the Hague end over Flottemanville, round the tongue by the arsenal, east past the German 243 and 709 to the peak by St-Pierre-Eglise and south by Quettehou: front, ringing the Germans north of the US 9, 79 and 4. The main line from the Orne arc (the Odon a single broad arc today) to the west tip follows the ink on the reader's crops. No town on the wrong side; about 208 km.
