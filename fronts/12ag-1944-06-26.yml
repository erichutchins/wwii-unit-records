# Reader: THE 79th: its US infantry box (open, crossed, xx) stands at x,y 1370,1332, on the arsenal/Cherbourg side of the Cotentin line (the tongue of the line at 1283,1160-1347,1270 is just north of it), beside "Cherbourg" on the sheet, not at La Haye-du-Puits. Neighbours at Cherbourg: US 9 at 1192,1291 (by Flottemanville/Octeville), US 4 at 1572,1275 (by Tourlaville); German 243 at 1368,1130 and 709 at 1525,1115 (hatched, north of the line on the shore). La Haye-du-Puits (x about 1500,2190) has German boxes: 91 at 1410,2107, 77 (SPLIT) at 1505,2055, 265 at 1642,2140. Their VIII Corps neighbours: US 90 at 1837,2060, 82d Airborne at 1630,1882, 101st Airborne at 1922,2130, 83 at 2075,1763, VIII Corps HQ box at 2010,1902, VII Corps at 1590,1632.
