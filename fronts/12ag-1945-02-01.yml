# Reviewed: 81 of 81 towns on 31 January's side; the larger stamp, the V Corps boundary (no ticks) and the moved 21/12 and 12/6 boundary stubs boxed.
# Reader: 224 symbols read (US 76, enemy 118, British 17, French 7, Canadian 5, Polish 1; by echelon 152 divisions, 2 brigades, 45 corps, 16 armies, 6 army groups, 3 C in C / SHAEF); 172 found by --boxes (of its 188 numbered boxes, 16 are the title's lettering) and 52 by eye on crops of the scan (the British and Canadian boxes, the XXX, XXII, XVIII, III, XIX, XC, the armies and army groups, the 65 and 69 of the Dieppe - Rouen box, and the 3, 277, 9, 167, 276, 212, 6, 78 and 95 the finder missed). Lists: 15 out-of-contact, 3 unlocated (49, 8?, XII SS), 3 dieppe-rouen (65, 69, 89), 1 lorient-st-nazaire (66), 3 arrow (the 159, the 106 (a brigade, x, an oval drawn in the box: read armored, where the 31st left it unread) and the 716 by Colmar, each with an arrow drawn from it as on the 31st). Not recorded: the small arrows over the 331 and 604 zbV in Holland (they start at the symbols' x marks, as on the 31st), and the free arrow to a "?" beside Bitburg. Differences from the 31st (226): the 172 (enemy, by Saarbrucken) and the XIV SS (enemy corps, in Baden) are not drawn today; the 75 (US) is no longer in the Ardennes (3665,2660) but stands by Colmar (4621,5315, open box, no qualifier); the 3 (US, by Colmar) has no (+) today; the 4 (US armored) and the 80 carry (+) today and the 31st wrote none; the FG (enemy, out of contact) is drawn xx where the 31st read x (the FE is x); the 2(-) FR (French armored) is no longer by Strasbourg (4963,4872) but at 5040,5206 by Ribeauville, 330 px south; the 106, 87, 1 and 82 (US) stand 115, 92, 59 and 57 px east of the 31st's (3269,2323 against 3154,2315 for the 106). The rest stand within the day's shift of the sheet (median 13 px east, 14 south over 205 symbols matched). The 9th Armored where it was on the 31st (3955,3988 against 3941,3974). Qualifiers read as drawn: 5(-), 78(+), 7(+), 4(+), 80(+), 44(+), 45(+), 79(+), 1(+) FR, 2(-) FR, 51(-), 52(-), 10(-), 14(-), 42(-), 63(-), 70(-), LEHR(-). The 31st's "89" east of Schleiden reads "?8" today (the first figure under the black ink beside the box). Unsure: the hatched boxes in the Eifel under the Westwall's black and railway ink, entered "?" (the box at 3935,3070, which the 31st also left "?"), "7?" (4035,3160: a 79 may be written there, the second figure under ink), "3?" (4101,3201, first figure only) and "?6" (3896,3016, the 31st's 276: the 6 is all that shows), nothing filled in from another day; the airborne mark of the 3 (4073,2501, under ink; read airborne as the 31st did); the 82, 17, 101 (US) and 6 (British) are drawn as "AB" in the box (read airborne); the "5 FR" has no (-); the "216?" the map's own; the "XXXIX" drawn in an oval; boundary labels such as "XXI / I FR" by Remiremont, "XIII / XII" and "XVIII", "XXX" in the Ardennes, "NINTH U.S.", "FIRST / THIRD" were left out as not symbols.
# Reviewed (8 Nov 2026): the symbols. Looked: the four hatched boxes in the Eifel under the Westwall's ink (overlay crop
# 3800,2950), dots on their boxes, labels kept as legible ("?", "7?", "3?", "?6"), nothing filled in from the 31st. The 75 by
