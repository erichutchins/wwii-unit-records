# Reader: the sheet draws the line of contact with the Soviet armies as the ticked line (US divisions on the ticked, west, side), as on 24 May; the
# legend (bottom left) reads U.S., BRITISH, ENEMY, FRONT LINE (the front line's sample is a short ticked bar). Report no. 354, as of 251200 May 1945
# (title read at 4200,150, 1800x900). Traced: the Elbe, Dessau, Bitterfeld and the Mulde, Chemnitz, the wavy pocket by Zwickau, Graslitz and Karlsbad,
# the Pilsen diagonal to the x marks short of Strakonitz, Strakonitz south, the arc by Prachatitz, Haslach, Neumarkt and Steyregg, the Enns by Steyr,
# Weyer and Liezen to Radstadt (lower, ticked edge), the Salzach, the Tauern bands and finger, the Gross Venediger. Not ticked, so boxed: the EAST BOUNDARY
# TWELFTH A.G. (Chemnitz fork to Annaberg bare, x marks at Annaberg, bare to Karlsbad and along the diagonal, x marks short of Strakonitz, bare by Budweis,
# Kaplitz and Freistadt), the Waidhofen-Windischgarsten-Liezen heavy line, the upper edge of the Enns band (bare), the upper heavy line of the Tauern loop,
# the Twelfth/Fifteenth boundary over the Tauern and the Gross Venediger.
# Reader: towns matched to 24 May's: 53 of 58 agree, sheet offset -16,+24 px (median 0.8 px), five placed through the transform (12E and 15E 53N, 13E 50N,
# 14E 49N, 12E 48N). 24 May's boxes were moved by an affine fit of 24 May's 47 plainly matched towns to today's (rms 0.9 px, max 1.8; so in effect one offset),
# small boxes by their centre, the big ones by their corners; the coordinates inside the reasons were moved the same way (the "looked at" points are
# 24 May's looks, moved, not looked at again unless said). 69 boxes moved; each checked against a run with no boxes at all (334 runs); 34 held no stretch
# and were dropped, the Strakonitz-Budweis-Kaplitz box kept although its stretch's middle (5185,3900) falls a few px off it. 24 May's two Kaplitz boxes
# (moved to 5035,4238 and 5106,4248) were dropped for the opposite reason: they held the ticked connector from Kaplitz to Haslach (stretches mid 5048,4297
# and 5162,4277; barbs on its upper side at 5x on the overlay), which 24 May traced; with them it was lost (27 km).
# Reader: eight boxes added for stretches that held no ticks and whose middles moved off the moved boxes: the Waidhofen line (mid 5280,4876), the two stretches
# of the Enns band's bare upper edge (mid 5046,5144 and 4865,5256; looked at 4x on the raw scan at 4700,5120: ticks on the lower edge only, as on 24 May), the
# Tauern loop's upper line (mid 4901,5497; 4x at 4750,5470: no ticks), the Inn at Wegscheid (mid 4653,4290; 4x at 4560,4230: bare), the Linz-Urfahr stub (mid
# 5137,4504) and the two Gross Venediger stretches of the Twelfth/Fifteenth boundary (mid 3965,5603 and 4086,5600; 4x at 3900,5540: bare, TWELFTH XXXX FIFTEENTH
# stands on it). The last two are not on 24 May's trace: unboxed they came out ticked (red ticks on a line the map draws bare).
# Reader: no flips; no stretch left to check by eye. One run is unsure and kept as 24 May kept it: the Radstadt finger's second heavy line (mid 4728,5451,
# 12 km, between the ticked edge and the bare line; looked at 4x at 4600,5380: a tangle of heavy lines and the (TEMP) lettering, a few small strokes, not settled).
# Reader: differs from 24 May (the line is the same to within 3 km except): about 27 km less, all small ends: 5.6 km at the Elbe's start (11.2E 53.15N), the
# Tauern finger's tip (14.0E 47.1N, 9 km: its pieces sit in a 24 May box moved onto them; a tangle of heavy lines at 6x, not settled), the Salzach end
# (13.5E 46.8N, 7 km), two 3 km bits. The sides: 57 of 58 towns as on 24 May; 9E 47N (Switzerland, by the Gross Venediger corner) reads own today, enemy on 24 May:
# the open-end artefact the 24 May review named, the deciding run's middle moved (run 48 own at 4050,5468; the line is the same there). 14E 47N reads enemy, 14E 49N own (on the arc).
# Setting: radius 4, dark 70 as on 24 May; 57 runs, about 1205 km (24 May 57 runs, 1231 km). Report 354.
# Reviewed (8 Nov 2026): the line of contact with the Soviet armies, ticked, as on 24 May; report no. 354; the legend still has its FRONT LINE and ENEMY samples. Read against 24 May's reading and the reader's crops: the two Kaplitz boxes dropped held the ticked connector from Kaplitz to Haslach (traced on 24 May); the Enns band's upper edge, the Tauern loop's upper line and the Gross Venediger boundary are bare and boxed. Left as drawn and unsettled: the Radstadt band's second heavy line (run 48, unsure, about 12 km) and the Tauern band's tip by 4990,5570, boxed. 9E 47N (Switzerland) reads own: an open-end artefact. About 1205 km.
