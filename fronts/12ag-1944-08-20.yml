# Reviewed: 7 Nov 2026 (q-0820). Copied from 08-19: radius 4, area box, title and legend boxes (same places on this sheet). The REPORTED IN TRAP frame stands further right today (x 4220-4560, y 370-1040), so its box is moved to [4180,330,4600,1070]. 23 of 28 towns agree (median 1.2 px; 1.5W 49N, 0.5W 49N, 0E 49N, 0E 48.5N, 1.5E 47.5N placed through the transform: the day's overprint).
# 13 stretches (10 ticks, 3 line, 0 unsure), 224.4 km. No flips, no checked: nothing unsure; every red tick looked at on the overlay crops (the north from Dives to Livarot, the Falaise-Argentan pocket) fell on the map's own hatching.
# The heavy salient north of Argentan-Livarot that 19 Aug missed is traced today (runs 1-3).
# Gaps over 20 px: (a) the diagonal wall of the Chambois tongue, run 11's start (0.0682E 48.8265N, scan 3395,1593) to run 12's end (0.1072E 48.7929N, 3463,1682), about 112 px (4.7 km), heavy ink there is continuous on the sheet but not traced; (b) Argentan, run 10's end (-0.0195, 48.7428) to run 13's start (-0.0069, 48.7492), about 28 px (1.2 km). Not hand-traced.
# Falaise: the sheet draws the Argentan line meeting the Chambois tongue's diagonal at about (3465,1685) (looked at 3470,1680): the pocket's ring is closed on the map, no mouth, the enemy list 'REPORTED IN TRAP' beside it; the traced runs leave gap (a) in it. The east line (run 9) is a separate line, about 40 px east of the kink.
# Ends: north (-0.109, 49.296) at Dives; south-east (0.288, 48.726) at the blunt stub south-east of Exmes.
# Reviewed: the ring is closed on the sheet, the Canadian-Polish tongue meeting the US 90th's line at Chambois. Ticks are consistent all round: inside the tongue (CDN 2, 3, 4 and POL) and outside the pocket, both the Allied side (reviewer's crop 2900,1250). The tongue's heavy diagonal at its tip (about 4.7 km) is untraced, so the traced ring is open there. None turned.
