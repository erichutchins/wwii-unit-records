# 12ag-1945-03-15: the sheet as read on its title, and the hand decisions its trace needed (tools/trace_front.py;
# fronts/README.md). The towns are <map>-gcps.csv, the symbols <map>-units.csv; the GeoJSON is generated.
# Reader: the earlier reading of this day (6 Nov 2026, for the Remagen engagement only) is replaced. It matched its towns to 7 March's old 20 hand-read rings (gcps_from 12ag-1945-03-07), traced only within their spread (20 runs), and kept two exclude boxes (the 21st/12th Army Group boundary, 3700,1420,4280,2000; a spur toward Zell, 4630,2895,4690,2950), no flips and no checks. This reading traces the whole sheet by the stretch method, as 7 to 14 March (records/fronts/12ag-1945-03-14.yml); the earlier two boxes are not carried as such (the boundary and the Zell hook are in the copied boxes).
# Reader: gcps_from 12ag-1945-03-14 (the 81 towns; sheet offset +0,+0; 79 of 81 agree, median 0.7 px; Kleve (8 px off) and Muenster (7 px off) placed through the transform). Fit conic, rms 0.8 km, leave-one-out 0.9 km, worst 2.2 km (Baden-Baden). Against the earlier reading's 20 rings the new towns stand 0-10 px away (median 5 px; largest Grevenbroich 10, Gemuend 9, Neuwied 7, Mayen 7, Cochem 6).
# Reader: radius 5 (the opening disk; the default is 4), dark default 70. At radius 4 the heavy line broke where it thickens, at Linz (4782,2301 to 4819,2358) and at Saarlautern (4369,3877 to 4379,3971), and the side test put Metz (a US town) on the enemy side; at 5 the Linz gap closes, the Saarlautern run joins its neighbour down to 4370,3910 (a gap of about 60 px remains between 4370,3910 and 4379,3971, in the black strip where the boundary stub joins) and Metz reads own. Dark 80, 90 and 75 at radius 4 broke the Rhine into unsure pieces and were dropped. At radius 5 the Scheldt arcs trace whole.
# Reader: boxes: 145 in all. The 146 boxes of 14 March copied (the sheet is +0,+0 of 14 March's), each moved by the median offset of its five nearest towns (122 moved, by 1 to 3 px; 14 March had no checks to carry), and one dropped: the short stub on the enemy band beside the 347 symbol (4468,3970,4565,4039), which on 14 March held no front but today holds ticked front (the Saar front east of Saarlautern toward Saarbruecken, about 150 px east of 14 March's, Seventh Army attacking north). Tested at radius 5 with no boxes at all (74 stretches, 3 unsure): the boxes hold only legend lettering, the Zell hook and blunt end (4660,2923; 4628,3036), and the Aachen boundary's last stretch to the front (run 42 at 3824,1942, whose ticks are the road's); no box holds ticked front (the title, signature and stamp lettering merge into no stretch at radius 5, the boxes stay as a guard). The bracketed list of divisions facing the bridgehead (right of Neuwied) traces nothing.
# Reader: flips: none. Checked: 4, each looked at on an overlay crop and found the right way: the Bergsche Maas run at 2915,720, the Rhine hook at Neuss (4263,1350), the Tholen arc (2085,866) and the west part of the Krammer/Volkerak arc (2170,820): the map's black ticks hang south and the tool's red ticks fall on them as drawn (turned, they fell above the arcs; the arcs were right and an earlier flip at radius 4 does not apply at 5). 0 unsure.
# Reader: the front is 70 runs, about 817 km (14 March: 60 runs, 837 km, same measure); every point of 14 March's front lies within 3 km of today's except 12 points on the Moselle and Saar, which advanced. A gap of about 45 px at Neuwied (4952,2421 to 4997,2427, the Rhine's dark ink) and the Saarlautern gap above remain. At Remagen the heavy line follows the Rhine's west bank from Bonn to below Koenigswinter (about 4690,2105), then bends east of the river round the bridgehead's symbols (7, 78, 9, 99) to about x 4845 between Linz and Neuwied, ticks inside (west), hooks back to the river at Linz (4783,2301) and runs on along it by Andernach to Neuwied and Koblenz; the BRIDGEHEAD N.-S. box and its list column (x 5000 and east) are not front. The towns' sides differ from 14 March's in three: Koenigswinter (enemy to own) and Cochem (enemy to own), rings under the line, and Haguenau (own to enemy), its ring under the line.
