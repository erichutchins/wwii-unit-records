# Boxes copied from 04-21 and shifted by the sheets' offset (+24, -48); the why texts keep 04-21's coordinates. Two boxes
# added for stubs that came up unsure (Rhine at Hamborn; the boundary beside XXIII near Oberstein). No flip, no checked.
# Read 7 Nov 2026: of the 60 towns 57 are on 21 April's side. 11E 53N (own; ring just south of the line at Gartow) and
# 12E 52N (enemy; ring on the corner of the Barby bridgehead line) sit on the line. 6E 52N reads enemy because the Dutch
# front's Apeldoorn arc west of Deventer (heavy, ticked, 04-21 run 28) is not traced: it runs on to the sheet's left
# edge, west of the towns' spread, and is dropped there; the ring (750,2052) lies south of the arc, with the CDN
# symbols, on the US side.
# Reviewed: 57 of 60 towns on 21 April's side. 6E 52N reads enemy only because the ticked Deventer-Apeldoorn arc is joined today to a run that reaches the sheet's west edge, past the towns' spread, and is dropped (the trace-area limit); it was US-side. 11E 53N (Gartow) and 12E 52N (the Barby bridgehead's corner) sit under the line.
# Reviewed (area, 7 Nov 2026): `area: [400, 1730, 840, 2170]` takes in the Deventer-Apeldoorn arc and its run down the west side to the Rhine opposite Nijmegen: 3 stretches added, 2088 -> 2206 km (89 -> 92); red ticks checked on overlay crop 300 1500 800 700 against the map's ticks. 6E 52N now reads own (US) by the arc's runs (it was enemy); no other town changed side. The arc's blunt hook end at Deventer (about 820,1765-1790) is a short heavy end with no ticks, left as the tool traced it.
# Reviewed later (from 14 May): area widened west and north (x0 100, y0 820) so the ticked front in the north-west outside the old area is traced: the ticked Friesland coast west of Dokkum and the ticked line round the IJsselmeer's north-east shore by the Noordoostpolder. Each added stretch located by the reviewer (5.4-6.0E, 52.6-53.4N, the 30 April one 51.9-52.4N); no town changes side.
