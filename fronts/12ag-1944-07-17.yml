# Reader: title 1200 HRS 17 JULY 1944, no report number; agrees with the catalogue (ict21042). Towns matched to 12ag-1944-07-18's: 33 of 34 agreed (median 0.8 px), 1W 50N placed through the transform (61 px off).
# Reader: boxes re-tested by tracing with and without each. Title box: without it 90 stretches (64 unsure); legend box: without it 96 (60 unsure); both kept. The 353 symbol's box from 07-18 catches nothing here (17 stretches with and without it), so it is dropped. Twelve new boxes over unticked strokes in unit symbols (XXX, 39, 277, 10SS, VIII, 276, 265, 243, 711 (ELMS), 346) and boundaries' last stretches (First US/Second Br, II CDN/I) and the 43 arrow's shaft; each re-tested, each removes one stretch. Without them 32 stretches, 7 unsure.
# Reader: 17 stretches, about 135 km (from the GeoJSON), 0 unsure, 0 turned, 0 checked by hand, from the Passage de la Deroute coast (1347,2200) to the Orne mouth (3855,2172). Line north of Saint-Lo differs from 18 July: on 17 July it loops round the town (crop 2000,2380) where 18 July runs south of it. Gaps over 20 px (fitted pixels, a few px error): 21 px at 2014,2384; 32 px at 2187,2526; 35 px at 2994,2519; 23 px at 3091,2499; 27 px at 3683,2381.
# Reader: --sides: 34 towns agree with 07-18's, town by town; none on the wrong side. Eleven own (US/British), 23 enemy. Towns in the sea off the Orne end (0.5E 50N, 1E 50N) read either way: 1E 50N reads own on two runs against enemy on two, as on 18 July.
# Reviewed: all 34 towns on 18 July's side. 17 stretches, about 135 km, Passage de la Déroute to the Orne mouth, hatching and red ticks north and west; no turns. Saint-Lô not yet taken: the line loops round the town here (crop 2000,2380). Title and legend boxes kept; the 353 box caught nothing and is dropped; 14 boxes added over symbol strokes, two coast boundary stubs and an arrow shaft, each re-tested (each removes one stretch). Largest gap 35 px under the 5 symbol.
