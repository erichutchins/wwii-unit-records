# Reader: title read 1200 HRS 4 OCTOBER 1944, no report number (agrees with the catalogue, 1944-10-04). gcps matched to 12ag-1944-10-05 (offset +48,-16 px; 53 of 81 agree, median 0.9 px, 28 placed through the transform); conic fit 1.1 km rms over 81, leave-one-out 1.1 km, worst Beauvais 3.4 km. NO ticked front is drawn on this sheet: heavy plain lines (Twenty One / Twelfth boundary, the loop west of the Maas at Venlo, army boundaries toward Metz and Nancy, a line beside the Yonne) and the Siegfried hatched band carry no ticks (--look at 3980,720; 3100,1500; 1858,5105). Boxes: 10-05's 61 excludes shifted (+48,-16), plus 47 boxes on each run left over at its middle (the 10-05 boxes did not catch the runs here: this sheet's lines lie elsewhere, so most are new), plus 1 on the Yonne boundary at 1858,5105. Final trace: 0 stretches. The stretches the tool called ticked (the Maas loop's blue, a river's ticks) are rivers' or roads' ticks, not the map's. Not looked at in tiles: the far north-east and east, outside the towns' area.
# Reviewed: as on 5-7 October, no ticked front is drawn: the front is empty, no front drawn, not no front. Heavy plain lines (the Twenty One/Twelfth boundary, the loop west of the Maas at Venlo, army boundaries toward Metz and Nancy, a line by the Yonne) and the Siegfried band carry no ticks and are boxed; eight runs the tool first counted as ticked took their "ticks" from river and road ink. 53 of 81 towns matched to 5 October; fit 1.1 km rms.
