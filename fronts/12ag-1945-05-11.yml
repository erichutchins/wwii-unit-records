# Reader: title read: report 340, 111200 MAY 1945 (the stamp top left reads 11 MAY 1945); agrees with the catalogue (1945-05-11). Whole sheet traced, front alone (no symbols). --gcps-from 12ag-1945-05-10 (one run): sheets offset -16,-24 px (scan 5983x6692 against 6010x6733); 45 of 60 towns agree (median 0.9 px); 15 placed through the transform (13E 53N, 15E 51N, 14E 49N, 15E 49N, 13E 48N, 7E 54N, 10E 54N, 11E 54N, 14E 54N, 14E 53N, 8E 52N, 12E 52N, 11E 51N, 13E 51N, 7E 48N).
# Reader: legend still reads U.S., BRITISH, ENEMY, FRONT LINE, and the line is drawn as on 9 and 10 May: an ordinary ticked front (ticks on the US side). No line of contact with the Soviets, no demarcation line is drawn, and nothing else on the sheet is ticked. Traced as ticked: the Elbe and Mulde to the Czech border, the Austrian salient to the Enns, the Tauern and Tyrol hairpins, the Allgaeu loop at Oberstdorf, the north-west coast. Army group and army boundaries are heavy or thin and unticked, and are left out by boxes.
# Reader: 05-10's boxes (175 + 8 added) and area shifted by -16,-24 and measured against an unboxed trace (356 runs). Scan scale differs by 0.4 per cent, so shifted boxes miss by up to about 15 px in places. One box held a ticked stretch and is DROPPED: 05-10's box at 2991,6058-3081,6128 shifted (the heavy L at the foot of the Allgaeu loop by Oberstdorf, x 3060-3200 y 6063 and x 3060 down to the sheet's edge): looked --look 3058,6075 and overlay crop 2700 5800 800 560: the horizontal bar carries the map's own strokes on its north side and the vertical bar on its west side, the red ticks fall on them, and the bars join the blue ticked front running south-west from 3205,6075 into one loop with the ticks outside. 05-10 boxed it as untick (its box 'run 171 no ticks'): that look is worth repeating on 05-10, where the loop's bars are left out.
# Reader: other boxes that hold ticked-class runs on the unboxed trace were looked and kept: the title and stamp lettering (box 0, 35, 88: --look 1437,718), the Elbe boundary at Ludwigslust (3619,1008), the river by Lorch (1748,3872: heavy black with blue, no ticks), the legend lettering (742,6125), the south-edge band (3158,6272: plain blobs); the long grey-ticked railways beside the Palatinate and Third/Seventh boundaries made runs 244, 260 read as ticks, but those lines are plain.
# Reader: boxes ADDED at their middles (all looked): 4 on the Elbe estuary's blue edge (2581,553 2638,642 2661,669 2690,728); 3377,721 and 3294,597 (a small lake and the Elbe-Luebeck canal); 4 on the Schweriner See (3665,588 3688,584 3677,643 3676,707); the Dannenberg-Uelzen boundary (3290,1180,3380,1250: 05-10's box shifted caught its mid only on my reckoning, the tool still traced it as ticks); lake runs in Bavaria and Austria (3559,5610 3562,5666 3677,5680 3675,5757 3700,5925 3933,5882 4326,5724 for the Chiemsee, 5139,5700 5100,5695 4993,5657 4987,5699, and 4716,5624 4527,5650 in the XV Corps and 20 boxes); and ten on the Bodensee (2333,5807 ... 2629,6060). 216 boxes.
# Reader: flips: 05-10's four flips shifted by -16,-24 matched four stretches. The Tauern hairpin tip's two arcs sit at 4921,5813 and 4915,5829 (not 4936,5810 and 4927,5826): re-centred, kept (the map's strokes cross the gap between the legs from the upper leg's lower edge: ticks inside, as the red ticks fall; looked --look 4920,5820 4800,5775). The Scharnitz curl's two flips (3572,6243 and 3572,6267 shifted) are DROPPED: on today's sheet both arms come out ticked by themselves with the ticks inside (red ticks inside the curl on both arms, no unsure), and with the shifted flips they were turned outward. No town near either. checked: 05-10's three entries shifted, and a new one at 3347,448 (the Trave mouth connector at Travemuende).
# Reader: --sides on 05-10 and on today diffed town by town: 60 of 60 agree, none changed side (05-10's GeoJSON backed up and put back untouched). 174 stretches, about 2923 km (05-10: 126, about 2814 km: today's sheet breaks the line into more runs, and the Allgaeu loop and the Schwerin line are now traced), 0 unsure.
