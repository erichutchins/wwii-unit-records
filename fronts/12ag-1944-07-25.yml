# Reviewed: no stretch turned. Every ticked stretch's red ticks looked at 4x against the hatching from the west coast (x 1384, y 2349) through the Marigny lobe, St-Lo, the Caumont and Tilly stretches, Caen and the Orne reach to the Orne mouth (hatching on the north and west, the US and British side): all on the hatching. Run 8 (2011,2460) checked by eye, hatching on its east like its neighbours.
# Reviewed: excludes taken from 12ag-1944-07-26 and re-tested here at radius 3. Kept, moved: the title (foot lowered to y 910, the COPY NO. rule stands at y 837-866), SECRET (foot to 560), the legend (raised to y 4100, its top symbol's middle is at y 4146). Dropped as catching nothing today (traced with and without, 29 stretches either way): the First US/Second BR. army boundary box (2780,1980,2940,2260), the Caen loop box (3400,2465,3515,2515) and its last-stretch box (3495,2565,3530,2612; it would sit across the front's own Caen reach). Added 17 small boxes on symbols' and flags' strokes that traced as blue front (48 stretches fell to 29); one (the 276 symbol) was first misplaced and corrected.
