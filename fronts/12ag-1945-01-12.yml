n us; XIII SS reads as an open box; "9 ELMS" has ELMS with no brackets seen; the 82 and 101 are lettered AB in the arm place (written airborne); the British 2(-) at 3547,789 has no CDN (written uk); LVIII and LVII (box 74) are hard to read; FUH is written as drawn; the 5? (3947,3258) is partly under the front; the 13th's 2(+) and 5 US and 7(+) US show here as 2, 5 and 7 without a qualifier. Differs from the 13th: 218 here against 213; only today 344, 41, 553, 711, C IN C ADV, LXXXII, 9(-), 106(-), 3 CDN as written; only on the 13th the LXXXIII (here LXXXII), 18 (here 1), 47 (here 41) and the CDN 2(-).
