# Reader: title read 7 Nov 2026: 1200 hrs 25 November 1944, no report number; agrees with the catalogue (ict21174, 1944-11-25). Towns matched to 11-26 (offset +24,+48 px): 62 of 81 agree, median 0.9 px, 19 placed through the transform (Grevenbroich, Juelich and Adenau 26 px, Pruem 25, Colmar 18 ...). 11-26's boxes shifted by +24,+48; the title box reset to this sheet (SECRET top y ~357, GROUP bottom y ~753, 1944 ends x ~2220; box 370-2350 x 330-800 stops above the Scheldt arcs, highest y ~900, and west of the Hollandsch Diep arc). Each shifted box dropped alone: needed the title, legend, Twenty One/Twelfth, Twelfth/Sixth SW of Dombasle, Canadian/British, both Seventh/First stubs, the 3894 Ninth/First stub and the Marne-Rhine canal box (dropped alone it lets a boundary stretch at 4383,4758 through, Toul still own); the Ninth/First box 3524-3824 x 1978-2078 and the Twelfth/Sixth junction box 3404-3584 x 5208-5318 catch nothing alone nor with each other nor with the canal box: dropped. The Walcheren hook flip (shifted to 1598,992) and the corner check (4564,4516) were not carried: the arc traces right unturned (map ticks on its SE concave side, red ticks there, overlay crop 1560,900 enlarged both ways; flipped they fell on the NW), and the corner piece is not unsure here. Boxes added: the First/Third boundary (2900-4000 x 3650-3790; it was not drawn into 11-26's trace, its two boxes dropped there; here it came through as three unsure fragments), the legend lowered to y 5660 (lettering to ~5610), the Seventh/First stub joining the front beside ALG 3 (4470-4500 x 5560-5576; a wider box cut the front's link), the tail of the Ninth/First boundary at the Meuse (3420-3490 x 2070-2115; its railway ticks turned Namur, Huy and Verviers enemy). One checked: 3931,2225. The Saar and Vosges front traces whole. Strasbourg reads enemy here: the sheet draws no front line round it (2 FR symbol in the open), so the test has nothing to read there; not compensated.
# Reviewed: 80 of 81 towns on 26 November's side. Strasbourg reads enemy and is WRONG (liberated 23 November; "Strasbourg       enemy     by run 39 enemy at 4960,4706, ..."): this sheet draws no front round Strasbourg, only the 2 FR symbol in the open, so the town lies off the line's course and the test has nothing to read. Jülich, Haguenau, Kleve, Landau, Darmstadt enemy; Toul own. 45 stretches, about 898 km, 0 unsure; the Saar and Vosges front traces whole. No flips (the Walcheren arc right unturned on an enlarged crop); one short piece where a thin boundary crosses the front checked (3931,2225). Boxes added on the First/Third boundary, a Seventh/First stub kept small to spare the front, and the railway-ticked tail of the Ninth/First boundary at the Meuse (it had put Namur, Huy and Verviers enemy); two empty boxes dropped. A gap of about 15 px where the First/Third boundary meets the front.
