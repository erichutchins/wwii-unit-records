# Reader: title read 7 Nov 2026: report 259, situation as of 191200 Feb. 1945 (agrees with the catalogue, ict21260). Towns matched to 12ag-1945-02-18, one run, accepted: offset -32,+8 px; 71 of 81 agree, median 0.8 px; 10 placed through the transform (Julich, Gemund, Strasbourg, Nijmegen, Kleve, Trier, Prum, Zweibrucken, Pirmasens, Baden-Baden). The 64 boxes of 02-18 copied, each moved by the median offset of its five nearest towns (-29..-31, +7..+16). Five boxes added: the Helmond/Deurne boundary's lowest piece (3340,1204; 02-18's box sat 100 px above), the Rhine's ink at Wesel (4207,909) and above Duisburg (4219,1183), the Rhine's ink above Bonn (4509,1871; 02-18's Bonn box misses it by 20 px), the Seine's blue at Argenteuil (325,4250, which put Amiens, Saint-Quentin, Laon, Soissons, Beauvais enemy). Title and signature boxes stop above the Walcheren/Tholen arcs, which trace (overlay-sheet, ticked south). Twenty One/Twelfth, Helmond, Deurne, Turnhout, Moll boundaries stay boxed. No flips today: 02-18's three flips were re-centred (today's runs 37, 38, 39) and looked at without any flip; on the raw trace all four runs of the reach (37-40) have their red ticks west on the map's own small ticks (--look 4085,2300 and 4075,2440 and 4060,2680, overlay crop 3900,2200 enlarged), so the band's outline did not pass for ticks this sheet; I first flipped 37 and 40 on a misreading of the old flips' effect and took both out after the 2x crop showed their red ticks fell east. Final: 63 stretches (44 ticks, 19 line), 0 unsure, about 828 km by a flat sum of the geojson (02-18, the same way, 821). Sides vs 02-18 (02-18's geojson backed up at scratchpad q-0219/02-18.geojson.bak, unchanged by its --sides run): 79 of 81 agree; two changed, both weak, one run each. "Haguenau         own (US)  by run 42 own at 5270,4513" on 02-18 is "Haguenau         enemy     by run 52 enemy at 5127,4511" today (American-held, so wrong; the ring is at the Moder corner and sits on the line, as on 02-17)