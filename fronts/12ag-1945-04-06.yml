# Reader: title read on the sheet: "To accompany G-3 Report No. 305, situation as of 061200 Apr. 1945"; agrees with the catalogue (ict21306, 1945-04-06). Base B12 (its last day). Towns: 75 of 81 agree with 04-05's (median 1.0 px, offset -8,+16); six placed through the transform (Epernay, Trier, Zweibruecken, Pirmasens, Landau, Karlsruhe), none further than 6 px.
# Reader: boxes. 04-05's 15 boxes shifted -8,+16 and tried on an unboxed trace (217 stretches). Kept (holding stretches' middles): the title signature, the two Saar boundary boxes (the hatched belt's rungs beside a plain boundary), the legend, the Third/Seventh boundary box, and the Lahn boxes at 3306,3440 (now 3328,3486) and the Alsenz box at 3491,4261 (now 3513,4307). Dropped, holding nothing: 04-05's boxes at 3734,1096; 2250,1485; 3823,4224; 4574,3625; 2679,1593; 4843,3375; 3988,4078 (the boundaries trace as differently split runs today). Added at the middle of each unticked heavy run left outside every box, each looked at with --look: 3907,1013 (Muenster-Bohmte boundary, run 29 of 952 px); 3293,1334, 2759,1507 and 2376,1884 (the Twenty One/Twelfth boundary from Muenster SW to the Rhine, three runs where 04-05 had one); 2275,1535 (Emmerich arc); 2221,2033 (Duisburg, parallel boundary lines); 3071,2780 (an enemy division's symbol outline, the 363, traced as a stretch); 4880,3359 and 4614,3608 (plain diagonals); 3560,3502 (Lahn wiggle past Nassau); 3766,4276 (Alzey angle). 19 boxes.
# Reader: boxing run 29 cut the Bohmte spearhead's Petershagen hook (runs 21, 17, 22 at 4341,818 / 4407,777 / 4392,852) off the chain that had turned it, and they came out unsure and reversed. Looked at at 3x (crop 4180,620 and look 4380,810): the map's black ticks stand on the hook's inside (US inside), and the way found now is the continuation of the lower strand (runs 26, 24, ticks on the right), so they are in `checked`, no flip. The unboxed trace had them the other way (red ticks outside the hook): the boundary's long run had carried them wrong. No flips anywhere else; the Arnhem notch at 3x (crop 1750,1180) has the tool's red ticks on the map's own, south of the notch.
# Reader: area [2142, 516, 6592, 4816], 04-05's shifted -8,+16: the whole front; no ticked line runs past it. 166 stretches (89 ticks, 74 line, 3 checked by eye, 0 unsure), about 1797 km (04-05: 149 stretches, about 1975 km: the long boundary runs that were traced as front on 04-05 no longer count, and the hook's runs are split differently).
# Reader: sides. 80 of 81 towns on 04-05's side; Karlsruhe only: 04-05 `Karlsruhe        enemy     by run 144 enemy at 4071,5198` -> 06 `Karlsruhe        own (US)  by run 161 own at 4073,5273, run 158 own at 4272,5055, run 160 own at 4021,5251`. Its ring (4056,5249 today, 4063,5233 on 04-05) stands on the line at the angle by the Rhine bridge (crop 3700,4950): a ring under the line, which reads either way; own agrees with the town's capture by the French on 4 April, but the test is weak here. Arnhem enemy ("Arnhem           enemy     by run 50 enemy at 2006,1322"), Nijmegen own. Strasbourg own as on 04-05 ("by run 166 own at 3532,5763", the line runs on to its ring at the sheet's foot); Colmar and Offenburg enemy as before. Ruhr pocket ticked outward: Soest, Much, Waldbroel enemy; Siegburg enemy by one run (ring on the pocket's edge, weak); Siegen own by runs 118, 117 (edge, weak). Muenster own, as on 04-05.
# Reviewed: 80 of 81 towns on 5 April's side. Karlsruhe own ("Karlsruhe        own (US)  by run 161 own at 4073,5273, ..."; 5 Apr enemy): its ring sits on the line at the angle by the Rhine, a weak test (the French took the town on 4 April). Arnhem enemy, Nijmegen own, Münster own; Soest, Much, Waldbröl enemy inside the Ruhr pocket; Siegen, Siegburg on its edge (weak); Strasbourg own, Colmar and Offenburg enemy at the Rhine line's open end. 166 stretches, about 1797 km (5 Apr 1975: there the long runs chained more front together; 5 April's spearhead and Petershagen hook read right on a crop by the reviewer). The Petershagen hook is three stretches checked at 3x (the map's ticks inside), cut off by today's box on the 952 px Münster-Bohmte boundary. No flips; the Arnhem notch right. Seven empty boxes dropped, eleven added, each looked at.
