# 12ag-1945-03-16: the sheet as read on its title, and the hand decisions its trace needed (tools/trace_front.py;
# fronts/README.md). The towns are <map>-gcps.csv, the symbols <map>-units.csv; the GeoJSON is generated.
# Reader: the earlier reading of this day (6 Nov 2026, for the Remagen engagement only) is replaced. It matched its towns to 7 March's old 20 hand-read rings (gcps_from 12ag-1945-03-07), traced only within their spread (9 runs, 195 km) and kept one exclude box (the 21st/12th Army Group boundary, 3700,1420,4280,2000) and one check (4358,1578, by Grevenbroich). This reading traces the whole sheet by the stretch method, as 7 to 15 March (records/fronts/12ag-1945-03-15.yml).
# Reader: gcps_from 12ag-1945-03-15 (the 81 towns; sheet offset +0,+8; 81 of 81 agree, median 1.0 px; none placed through the transform). Fit conic, rms 0.8 km, leave-one-out 0.9 km, worst 2.2 km (Baden-Baden). Against the earlier reading's 20 rings the new towns stand 1-11 px away (median 5 px; largest Grevenbroich 11, Gemuend 10, Neuwied 9, Mayen 8, Nastaetten 6).
# Reader: radius 5, dark default 70, as 15 March (the default radius is 4). Radius 4 was not tried: at 5 the front came out whole (Linz and Saarlautern joined, Metz own, the Scheldt arcs whole), nothing merged that shouldn't and no stretch is unsure, so there was no reason to change it, and no reason for a darker cutoff.
# Reader: boxes: 142 in all. The 145 boxes of 15 March copied (each moved by the median offset of its five nearest towns, 0 to -4 px across and +5 to +8 down; not re-centred, none needed it). Run once with no boxes at all (30 stretches, 26 by ticks, 3 line, 1 unsure) and compared by geometry: three boxes dropped because ticked front runs through them today, the Boppard Rhine ink box (the front's hook at 4995,2740 clips its corner), and on the Moselle the blunt-south-end box (4606,3023,4646,3063: the tongue of the line at about 4625,3040, four map ticks) and the short-spur box (4474,3147,4514,3202: the hairpin at about 4490,3170, ticked): the Moselle front has moved onto what they covered. Two boxes do the work: the title block's lettering (a four-point false stretch at about 1226-1258,297, which the tool took for ticks) and the Zell hook (4641,2920,4681,2950; its unsure stub at 4652,2927 has no ticks; the two ticked runs beside it only end at its edge, so it stays). With the 142 boxes the front is the no-box front minus those two stretches, point for point (28 stretches); no box holds the map's list of divisions facing the bridgehead, which is lettering and symbols (x 4880 and east, y 1980 to 2260), and none holds front today.
# Reader: flips: none. Checked: none needed (0 unsure, 0 by hand). The four arcs 15 March checked came out the right way by the tool's own ticks, and were looked at on a 4x crop (the Tholen and Krammer arcs: the map's black teeth hang south and the tool's red ticks fall on them); the Bergsche Maas run and the Neuss hook come out by ticks too. The old reading's one check (Grevenbroich) is not carried: the stretch is ticked.
# Reader: the front is 28 runs, about 968 km (15 March: 70 runs, 817 km, same measure). Every point of 15 March's front lies within 7 km of today's; today's has 150 km more, a salient the Third Army's attack has drawn south-east of the Moselle (the Hunsrueck): from the Rhine at Boppard (about 5000,2740) down the Rhine's west bank past Bacharach and Bingen, back north-west by Bad Kreuznach, Simmern and Cochem (about 4690,2855), ticks inside (west), the symbols 5, 9, 159, 4 inside it. Gaps of about 20 px or less remain only where the map's own line breaks (the Scheldt arcs, Saarlautern 4371,3930, the hook at 4250,3790): the 60 px Saarlautern gap and the Neuwied gap of 15 March are closed. At Remagen the heavy line follows the Rhine's west bank from Bonn to Koenigswinter (about 4690,2095), then bends east of the river round the bridgehead's symbols (7, 78, 9, 99) to about x 4857 (at y 2250), ticks inside (west), hooks back to the river at Linz (4790,2325) and runs on along it by Andernach and Neuwied to Koblenz and Boppard; the BRIDGEHEAD N.-S. box and its list column (x 4880 and east) are not front. The Saar: the line runs down the Saar by Saarlautern (4370,3930), then east along the Forbach road to 4880,4209 and on to Haguenau and the Rhine. The towns' sides differ from 15 March's in one: Koenigswinter (own to enemy), its ring on the line (within about 3 px).
