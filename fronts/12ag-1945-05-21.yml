# Reader: after 8 May the ticked line is the line of contact with the Soviet armies (the Elbe, the Mulde, the line across
# Bohemia, the Enns, the Tauern to the Gross Venediger), not a front against the enemy; the legend's "ENEMY" hatched box is the
# map's own wording. Stretches turned by hand: none (flip is empty). The line ends at the Austria-Italy border at Gross
# Venediger (about 3920,5650); the Brenner stretch of the Austria-Italy border has no ticks and is not traced. North of the
# Elbe at 53 N the line runs on to the Baltic side beyond the towns' spread; it is traced to (3260,280), where the heavy
# black ends at the neat line.
# Reader: 20 May's box [3150, 3350, 4650, 5400] left a gap of about 18 km in the ticked line along the Salzach (St. Johann,
# Schladming, about 4490-4660 x 5300-5380 on today's scan); today the box stops at y 5300 and the line is whole there. 20 May
# probably has the same gap (reviewer: look).
# Reviewed (8 Nov 2026): the line of contact with the Soviet armies, as on 20 May (the Elbe, Dessau, the Mulde, across Bohemia, the Enns, the Tauern to Gross Venediger), not a front against the enemy. Overlay crop 4250,5050 looked at: the Bavaria box, moved from 20 May, held about 18 km of the ticked line along the Salzach from St. Johann to Schladming; cut to y 5300, the line is whole there, ticks north (20 May had the same gap and is fixed with this). The sheet prints report no. 349, as 20 May's does. The Dessau hook and three heavy unticked runs on the Enns are checked, by continuity with the ticked runs either side. All 58 towns on the same side as 20 May. About 1149 km.
