# Reader: 20 May's 23 boxes moved by the sheet offset (-40, -16 px; 21 May is 5935 x 6668), each tested by dropping it alone
# from a run with all boxes in: ten held nothing today and are left out (British units table, foot stamp, the box east of the
# line, the Schnackenburg spur, Stassfurt, the Graslitz and Saxony-Bohemia pieces, the XII/V piece, the 26 symbol, Mondsee);
# thirteen kept; four added. Box coordinates in each "why" (and "unsure run" notes) are 20 May's wording; the box itself is
# today's. Nothing the sheet draws as a ticked line is inside any box except as noted: box 9's foot, which on 20 May's
# coordinates (3150, 3350, 4650, 5400) swallowed the ticked line along the Salzach at St. Johann (about 18 km, mid 4586,5335 on
# today's scan), is cut to y 5300 here (see Reader note at the foot).
