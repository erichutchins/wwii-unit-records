title: "HQ 12th Army Group Situation Map (SECRET struck through), to accompany G-3 report no. 349: situation as of 211200 May 1945; signed for A. Franklin Kibler, Brigadier General, GSC, A.C. of S., G-3; 1:1,500,000 Albers conical equal-area sheet"
