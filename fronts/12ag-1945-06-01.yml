# Reader: report no. 361, situation as of 011200 JUNE 1945 (the catalogue says 1945-06-01: agrees; title read with --title 4100 150 1900 1000). Legend (bottom left, overlay crops 40,5450 / 40,5850 / 40,6250; look at 280,6140): the "U.S." box, the dashed "BRITISH" box and a "FRONT LINE" sample (a ticked line, five ticks); no ENEMY sample, as on 2-7 June.
