# Reader: the sheet draws the line of contact with the Soviet armies as the ticked line (US divisions on the ticked, west, side), as on 23 May:
# the Elbe, Dessau, the Mulde, Chemnitz, the wavy pocket by Zwickau, Graslitz and Karlsbad, the Pilsen diagonal to the x marks short of Strakonitz,
# the arc by Prachatitz, Haslach and Linz, the Enns by Steyr, Weyer and Liezen to Radstadt, the Salzach, the Tauern bands and finger, the Gross Venediger.
# Not drawn as ticks, so not traced: the EAST BOUNDARY TWELFTH A.G. (Chemnitz fork to Annaberg bare again, x marks at Annaberg, bare to Karlsbad and
# along the diagonal, x marks short of Strakonitz, bare by Budweis, Kaplitz and Freistadt), the Waidhofen-Windischgarsten-Liezen heavy line over the red
# border, the Twelfth/Fifteenth boundary over the Tauern, and the heavy upper lines of the Tauern bands. Report no. 353, as of 241200 May 1945.
# Reader: towns matched to 23 May's: 49 of 58 agree, sheet offset +8,+24 px (median 1.7 px), nine placed through the transform (12E/14E/15E 53N,
# 14E/15E 52N, 6E 50N, 13E 50N, 6E 48N, 14E 47N). The shift is not one offset (an affine fit of 23 May's towns to today's: rms 1.8 px, max 4.2),
# so the 56 boxes of 23 May were moved by that fit (small boxes by their centre, the big ones by their corners). Coordinates quoted inside the
# reasons are 23 May's, not today's. Checked against a run with no box at all (stretch middles listed from the unboxed trace): nine boxes added,
# one dropped, one box cut (below), and a dozen more added for runs whose middles moved off 23 May's boxes (the Strakonitz-Budweis-Kaplitz stretch is
# one 86 km stretch today, mid 5235,3892; the Windischgarsten-Liezen line, four stretches; the Matrei and Zillertal stubs; the Tauern loop's bare lines).
# Reader: dropped 23 May's box at the Freistadt-Pregarten move [5261,4532,5321,4592]: its stretch (mid 5285,4538) is the ticked line from Pregarten
# to Steyr (looked at 3x on the raw scan at 5190,4440: barbs on the west side, the line continuous down the Enns); and 23 May's Tauern box above the
# finger [4878,5453,4928,5503]: it held a barbed stretch (mid 4895,5503) of the finger. Kept as 23 May had it: the Radstadt boxes holding the second
# heavy line beside the ticked finger edge (stretches mid 4748,5372 and 4778,5373): one of them has barbs on a 3x look and may be a second ticked edge; unsure.
# Reader: Bitterfeld is ticked today (barbs on the south-west side at 4x, 3880,1540), not x marks as on 23 May; the Elbe south of Seehausen is
# ticked and then x-marked (y 560-730) with the line continuous under the x marks, traced as one line (23 May's trace differs from it by 3 km only).
# Reader: no flips. Checked: the Dessau hook tip (3837,1423) by continuity. Setting: radius 4, dark 70 as on 23 May; 57 runs, about 1231 km (23 May 70 runs, 1265 km). Report 353.
# Reviewed (8 Nov 2026): the line of contact with the Soviet armies, ticked; report no. 353. Overlay crop 4500,4400 (Linz, the Enns and the Tauern) looked at beside 23 May's: on 23 May the Enns valley from Liezen to Gröbming was drawn as a grey band ticked on both edges, and both were traced; today the upper edge is drawn heavy and bare, running on east to Windischgarsten as the army group's boundary, and only the lower, ticked edge is traced. The Tauern bands are traced as on 23 May. The x-marked stretch of the Pilsen diagonal is left out today. 9E 47N (in Switzerland, by the Gross Venediger corner) and 14E 47N (south of the Tauern band's open end) read enemy: open-end artefacts. About 1231 km.
