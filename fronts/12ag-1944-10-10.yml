# Reader: title read 1200 HRS 10 OCTOBER 1944, no report number, SECRET struck through (agrees with the catalogue). gcps: matched to 12ag-1944-10-11 on the first run (accepted: sheets offset +8,-8 px; 41 of 81 towns agree, median 1.7 px, 40 placed through the transform, so a town's place is partly the transform's); conic fit 1.1 km rms over 81, leave-one-out 1.1 km, worst Beauvais 3.5 km. Boxes: 10-11's 16 excludes moved by (+8,-8) and each tried alone: title, the Arras-Albert, Louvain-Geilenkirchen and Somme boundary boxes and the Twelfth/Sixth south-west box catch stretches and are kept; the unit box at Dunkirk, the First/Ninth stub and five Siegfried boxes catch nothing today (the stretches lie 10-40 px away) and are dropped, their features re-found by looking. 10-11's ring box (east of Heerlen, moved to 4248,1567..4308,1627) catches ticked run 16 (the front's own arc south of Aachen at about 4290,1600) and is dropped, as that cuts a ticked stretch; today the two ring fragments of 10-11 are not traced at all. New boxes, each looked at (--look or overlay crop): the Antwerp boundary north-east (3476,844 and 3647,814), the Twenty One/Twelfth boundary beyond Geilenkirchen towards Dusseldorf (plain heavy line, a straight blue 'ticked' run of grey road ticks), the First/Ninth and Ninth/Third boundaries, the Twelfth/Sixth boundary through the Palatinate with its Siegfried hatched features, the same boundary at the canal's end (the ticked front ends in the junction blob at about 4595,4395; the plain boundary after it is boxed, the box at 4573,4413 the least certain), east of the canal and in the Vosges (4973..5053,5138), the First Canadian/Second British boundary at 1060,1987, the Arras-Albert boundary's lower piece at 1859,1990, the 'BRITISH' lettering at 729,5225 and the 526 box edge at 4588,1850. 10-11's check at 4211,1467 comes out right by itself (the blue stretches there are ticked) and is dropped. Two fragments stay unsure and unchecked: 4254,1463 (a short hook under the loop's west side, ticks of its neighbours north) and 4443,1646 (a 30 px stub at the corner by the 9's box, in the fused Aachen-Monschau reach); neither could be told from a hatching bar, both are 2 km or less. No ticked front is drawn round Nijmegen, on the Antwerp-Breda line (a plain heavy boundary, boxed) or in the Vosges (a plain boundary, boxed): nothing traced there. The ticked front runs from the Geilenkirchen arc (from x 4187, y about 1243) and the Maastricht loop, round Aachen and Monschau and down the Ardennes edge and Luxembourg to the Marne-Rhine canal at about 4595,4395: 25 stretches, 19 ticks, 4 line, 2 unsure, no flips, about 426 km by the GeoJSON's own points (10-11 measures 325 km the same way in 65 stretches, which I could not account for: the overlay here is continuous from Geilenkirchen to the canal). Sides: 80 of 81 towns agree with 10-11, Metz enemy; 's-Hertogenbosch changes (see the report), off the north end.
# Reviewed: 41 of 81 towns matched to 11 October, the rest placed through the transform; fit 1.1 km rms. 80 of 81 towns on 11 October's side; 's-Hertogenbosch, beyond the open north end, flips with how the arc's legs chain (an artefact either way). Metz enemy. As on 11-14 October, a ticked front only from Geilenkirchen and the Maastricht loop by Aachen, Monschau and the Luxembourg edge to the Marne-Rhine canal. 25 stretches, about 426 km: the same extent as 11 and 12 October (48.65-51.06N) with less doubled line; the fused Aachen-Monschau reach chains whole here, where on 11-12 October it broke into fragments (323 and 302 km), so this day is the fuller trace. Two short fragments left unsure (a hook under the Maastricht loop, a stub by the 9 box). 11 October's ring box east of Heerlen cut the front's arc south of Aachen here and is dropped. Boundaries boxed, among them the Twenty One/Twelfth past Geilenkirchen, whose road ticks had traced it as ticked.
