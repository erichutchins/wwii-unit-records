# 12ag-1945-02-27: the sheet as read on its title, and the hand decisions its trace needed.
# Reader: excludes carried from 02-26 and moved by the median offset of the five nearest towns (offsets within 7 px; sheet offset +0,+0). The 02-26 box for a hook at Duren (4144,1970,4225,2017) is dropped: today the front itself runs through it (Julich arc to Gemund), ticks on its west side; with the box the whole stretch was missing.
# Reader: unsure run 3865,823 (a short heavy stub in the blob at Goch, between two blue runs of the Veritable front) left unflipped and unchecked: its red ticks are on the south, its neighbours' on the north, but the map's own ticks can't be told in the black mass (not 3x); no town depends on it (Kleve and Goch's side is decided by other runs).
# Reader: gap of about 70 px in the front at the Merzig bend (about 4000,3600 to 4000,3680) where the front joins the enemy band's heavy outline; not traced, no town depends on it.
