# Reader: title read: report 341, 121200 MAY 1945 (the stamp top left reads 12 MAY 1945); agrees with the catalogue (1945-05-12). Whole sheet traced, front alone (no symbols). --gcps-from 12ag-1945-05-11 (one run): sheets offset +16,+16 px (scan 5987x6739 against 5983x6692); 54 of 60 towns agree (median 0.9 px); 6 placed through the transform (13E 48N, 6E 54N, 11E 54N, 14E 54N, 8E 52N, 11E 51N).
# Reader: legend still reads U.S., BRITISH, ENEMY, FRONT LINE, as on 9 to 11 May: an ordinary ticked front (ticks on the US side). No line of contact with the Soviets, no demarcation line is drawn, nothing else on the sheet is ticked. Traced as ticked: the north-west coast and Elbe estuary, the Elbe and Mulde to the Czech border, the Austrian salient to the Enns, the Tauern and Tyrol hairpins, the Allgaeu loop at Oberstdorf. Army group and army boundaries are heavy or thin and unticked and are left out by boxes.
# Reader: 05-11's 216 boxes, 4 flips, 4 checked entries and area shifted by +16,+16 and measured against an unboxed trace (239 stretches, 144 outside every box). Scan scale differs, so shifted boxes miss by up to about 15 px. Boxes holding a ticked stretch (middle inside) on the unboxed trace were looked: the title, stamp and legend lettering, the diagonal army and army group boundaries (Ludwigslust, Dannenberg, Hannover, Westerberg, Weissenburg, 05-11's reasons stand) were kept. Four were DROPPED, each the front itself, which left gaps: 05-11's lake boxes shifted at 3663,629-3723,689 and 3662,693-3722,753 (the heavy black front EAST of Schwerin; the Schweriner See is not there, and the ticks (nubs) are on its west); 3358,702-3428,772 (the heavy band from Ratzeburg to Gadebusch that joins the two blue legs; ticks on its south); 3681,5906-3751,5976 (the front's west bulge by Lenggries, a gap of about 80 px; 05-11 called it a stray run on lake blue). 05-11's Schwerin and Lenggries gaps are therefore the same boxes: worth correcting there. 213 boxes.
# Reader: box ADDED at its middle: 1873,2046-1933,2106, run 62 at 1903,2076 (unsure, magenta): the Osnabrueck-Hannover army group boundary, heavy black, no ticks, which the shifted boxes either side stop short of. No heavy untick boundary else outside every box (overlay-sheet: all blue is front); the Muehldorf-Altoetting-Salzach line and the Third/Seventh boundaries are drawn plain and not blue. Lake and estuary boxes (Elbe estuary, Chiemsee, Bodensee, Bavarian lakes) shifted and kept; the title and legend are covered.
# Reader: flips: 05-11's two Tauern hairpin-tip flips re-centred on today's arcs (4935,5830 and 4925,5846; kept, the red ticks fall inside between the legs as the map's strokes do). The Scharnitz curl is not flipped (as on 05-11; both arms come out ticked with ticks inside). NEW: the Allgaeu loop's east bar at 3251,6182 (run 133, unsure, its red ticks fell inside the loop, the map's nubs stand outside on its east edge as on the top bar): flipped. NEW: run 43 at 1111,960, the lower part of the bar of the Dollart finger north of Groningen (unsure, its red tick on the west where the map's nubs are on the east): flipped. The bar's upper run (blue, about 1099,880) shows red ticks on its west too while the map's nubs are east of the bar: it is the same stretch as the cap and the slope (flipping it turned the whole stretch the wrong way, and 7E 53N changed side), so left as the tool has it; the reviewer might look (crop 1040 800 200 220). checked: 05-11's four entries shifted; none needed today (0 unsure).
# Reader: --sides on 05-11 (GeoJSON backed up and put back byte for byte) and on today diffed town by town: 60 of 60 agree, none changed side. 146 stretches, about 2783 km (05-11: 174, about 2892 km; today's sheet breaks the line into fewer runs and has the gaps above closed), 0 unsure.
