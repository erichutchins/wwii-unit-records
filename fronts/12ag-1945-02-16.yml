# Reader: title read 7 Nov 2026: report 256, situation as of 161200 Feb. 1945 (agrees with the catalogue, ict21257). Towns matched to 02-15 in one run (accepted): sheets offset +16,-32 px; 78 of 81 agree, median 1.0 px; 3 placed through the transform (Gemund, Kleve, Munster). The 56 boxes of 02-15 were copied and each moved by the median offset of the five towns nearest it (whole sheet +13,-34; varies +11..+17, -30..-40). First run: 62 stretches, 9 unsure; the signature block's last line (A. C. of S., G-3; unsure runs 1126,1126 and 1511,1135) stands lower than the moved box (the title is lettered by hand), so its foot was lowered to y 1170; the title box ends at y 822 and the signature box's east edge at x 1602, above and west of the Walcheren/Tholen arcs, which TRACE (crop 200,500: blue, ticked on the south, US side), and the Krammer-Volkerak arc with them; the Scheldt arcs did not fail. Seven boundary boxes added where this sheet's boundaries (Helmond/Turnhout loop, the Twenty One/Twelfth's western run Herck-la-Ville to Roermond, the end at the front near 3710,803) sit off the moved boxes, each looked at on overlay crop 2800,650 and --look 3695,791. The Twenty One/Twelfth boundary from Seraing east (the Seraing end, the middle, the eastern piece) stays boxed: nothing of it is traced (crop 2800,1650). Kleve: Veritable's ticks are on the west (Allied) side, runs 1, 4, 5 own. Final: 52 stretches, 0 unsure, 0 flips, 0 checks; 52 front runs. --sides: 02-15's geojson backed up (scratchpad q-0216/02-15.geojson.bak, unchanged by the run); all 81 towns diffed, 80 agree, 1 changed: "Haguenau         enemy     by run 48 enemy at 5220,4518" (02-15: "Haguenau         own (US)  by run 51 own at 5344,4595"): Haguenau is American-held, WRONG today; its ring (5302,4530) stands on the line's corner at the Moder, one run deciding, ticks on the south (crop 4900,4350), a weak corner test, not a turned stretch. Verviers reads enemy as on 02-15 ("Verviers         enemy     by run 25 enemy at 3863,1934"), WRONG, Allied-held: the front's west end near Aachen (3775,1980) is ticked north and Verviers lies beyond it, the open-end artefact of 02-15; the boundary west of it is boxed. Prum own ("Prüm             own (US)  by run 32 own at 4090,2724"), German-held, wrong, weak: ring on a bend of the line, as on 02-15. Gemund and Adenau enemy. Kleve own (weak). Chalons and Limburg's deciding runs changed number only, not side.
# Reviewed: all 81 towns diffed with 15 February: 80 agree. Haguenau reads enemy and is WRONG ("Haguenau         enemy     by run 48 enemy at 5220,4518"): American-held, its ring on the Moder line's corner, one run deciding; the ticks south (US) as the map's. Verviers enemy, WRONG as on 15 February ("by run 25 enemy at 3863,1934"): beyond the traced front's open west end at Aachen. Prüm own, weak (its ring on a bend). Gemünd, Adenau enemy; Kleve own. 52 stretches, about 841 km, 0 unsure, no turns; the Scheldt arcs trace, ticked south. Signature box lowered to this sheet's hand lettering; seven boundary boxes added (Helmond, Deurne, Turnhout, Moll, and three on the Twenty One/Twelfth boundary), each looked at.
