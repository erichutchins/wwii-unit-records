# Reader: report no. 366, situation as of 061200 June 1945 (the catalogue says 1945-06-06; the title stands top right, read with --title 4100 150 1900 1000). The legend (bottom left, read at 1:1 on overlay crops 100,5300 to 100,6050) draws the "U.S." and "BRITISH" boxes and a FRONT LINE sample (a ticked line), and no ENEMY sample (25 May had both samples; 7 June had neither).
# Reader: the line of contact with the Soviet armies (the Elbe from Schnackenburg, Dessau and the Mulde, Saxony, Karlsbad, the Pilsen diagonal, Budweis, Kaplitz, Freistadt, the Enns, the Salzach and the Tauern) is a heavy black line with NO ticks, as on 7 June: looked at 4x at the Elbe (3660,780), the Mulde (4090,2000), Graslitz (4180,2740, 4260,2780), Asch (4000,2860), Karlsbad to Pilsen (4330,2960, 4420,3060, 4540,3420), Budweis (5100,3880), Freistadt (5230,4800, 5275,4945), Liezen (5150,5150), Salzach (5045,5470, 4960,5560), Tauern (4780,5700, 4400,5640). Lettered EAST BOUNDARY OF TWELFTH A.G. (Annaberg, x marks; Karlsbad to Pilsen) and TWELFTH XXXXX FIFTEENTH (Tauern). The legend keeps its FRONT LINE sample but no stretch of the line of contact carries the sample's ticks.
# Reader: the only ticks on the sheet are in Carinthia (overlay crop 4050,5550): a ticked loop running south from the Twelfth/Fifteenth boundary at Heiligenblut (about 4410,5640), a heavy black outline with the map's own black ticks on its inner side, an eastern arm to about 4670,5900 (the Moelltal) and a closed western loop to about 4180,5860 beside Lienz. The sheet does not say what it marks (as on 7 June). Boxed (first box, with an area so that the box is seen to hold it) and not traced: from the first sheet with no ticked line of contact, the day is an empty front (owner's decision, 8 Nov 2026, as 7 June). This is the ticked line a reader might take for the front here: 6 June is the first day, working back from 7 June, on which the FRONT LINE sample is on the legend with a bare line of contact; look at it first.
# Reader: towns from 12ag-1945-06-07: sheets offset +16, -16 px; 42 of 58 agree (median 1.9 px), 16 placed through the transform (4 to 7 px off: the day's overprint). 7 June's 52 boxes moved to this sheet by a quadratic fit of 7 June's towns to today's (58 towns, rms 1.7 px, worst 3 px; the shift is +16,-16 near the middle and differs by a few px across the sheet), then checked against a run with no boxes at all (316 runs, 34 ticked-looking: the tool counts the Carinthia ticks and some red or blue strokes). With the moved boxes 24 runs were left (22 unsure, 2 ticked); each looked at on the overlay or at 4x and found not front (red state outlines, the bare boundary, Bohemian border hatching, a flag staff and lettering stub): 17 boxes added (the boxes after the moved ones), including the Karlsbad to Pilsen reach that 7 June's boxes did not reach (run 11 'ticks' came from the overlay's own red ticks on a black line with no map ticks) and a stub by the DONAU lettering (run 18). Final run: 0 stretches, 0 km. The red or blue colours on the earlier overlay are the tool's, not the map's.
# Reader: no flips, no checks. Sides: no front is traced, so every town reads '?'; 25 May's comparison was not run (nothing to compare: it is a ticked line, today empty). Setting: radius 4, dark 70, area as above. Length 0 km, 0 runs.
# Reviewed (8 Nov 2026): an empty front, as 7 June: no front drawn, not no front. Overlay crop 4000,2100 looked at: the line of contact runs bare from Chemnitz past Annaberg (x marks) to Karlsbad and Pilsen, lettered EAST BOUNDARY OF TWELFTH A G; 25 May's wavy ticked pocket by Zwickau and Graslitz is gone. The legend keeps a FRONT LINE sample but has lost its ENEMY sample; the only ticks on the sheet are the outline south of Heiligenblut into Carinthia, which the sheet does not explain, boxed and noted (Eric's decision, 8 Nov 2026). Nothing traces.
