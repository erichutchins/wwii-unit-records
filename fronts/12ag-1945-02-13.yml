# Reader: title read 7 Nov 2026: report 253, situation as of 131200 Feb. 1945 (agrees with the catalogue). Towns matched to 02-12 (sheets offset +0, +32 px; 68 of 81 agree, median 0.8 px; 13 placed through the transform: Gemund, Haguenau, Strasbourg, Verviers, Munster, Trier, Bitburg, Prum, Zweibrucken, Pirmasens, Landau, Baden-Baden, Offenburg). All 02-12 boxes copied and moved +32 px in y; overlay looked at whole and in crops (Kleve 3500,450; Liege/Seraing 3150,1950; Prum 3850,2550; Haguenau 5100,4450): no box catches a front stretch, both Twenty One/Twelfth ends (3290,2157 and 3570,2159) stay boxed, the title box (y 274-854) ends above the Walcheren/Tholen arcs. No flips; the 02-12 check at 4041,2441 dropped (the stretch comes out right by itself, nothing unsure). 49 stretches, 698 km against 781 on 02-12, 0 unsure. GAP: this sheet prints lighter, so the heavy-ink mask (dark < 70, fixed in the tool) misses the Walcheren/Tholen arcs (x 1580-2250, y 870-940) and the Krammer-Volkerak arc west of about x 2300 (nothing there is traced, west of lon 4.6); radius 2 to 6 tried in the YAML, none brings them in (radius 3 was worse), so left at the default. The Kleve loop's thin piece near 6.12E 51.8N on 02-12 is also not traced separately; looked, crop 3500,450: the traced line is ticked on the west, round Kleve. --sides diffed with 02-12 (backup in scratchpad q-0213): 78 of 79 lines parsed agree; one town changed: "Haguenau         enemy     by run 38 enemy at 5197,4569, run 39 enemy at 5376,4613" (02-12 "Haguenau         own (US)  by run 53 own at 5297,4537"): American-held, the ring (5281,4556, placed through the transform) sits on the Moder line, ticks south (US) in crop 5100,4450, so a weak test, not a turned stretch. Kleve own ("Kleve            own (US)  by run 3 own at 3692,562, run 7 own at 3798,762"), as on 02-12. Prum own ("Prum             own (US)  by run 22 own at 4080,2739"): as on 02-12, the ring lies about 30 px south of a bend east of a west-ticked line, a corner reading (one run decides it; looked, crop 3850,2550), not a stretch turned. Gemund and Adenau enemy. Verviers own.
# Reviewed: a thin day. The sheet prints lighter and the fixed dark<70 threshold misses the Walcheren/Tholen arcs and the Krammer-Volkerak arc (nothing traced west of 4.6E, about 83 km short of 12 February); no radius brought them in. 49 stretches, 698 km, none unsure, no turns. 78 of 79 parsed towns on 12 February's side. Haguenau reads enemy and is WRONG ("Haguenau         enemy     by run 38 enemy at 5197,4569, run 39 enemy at 5376,4613"): American-held, its ring on the Moder line, a weak test. Prüm own off a corner, as on 12 February (weak); Kleve own; Gemünd and Adenau enemy; Verviers own.
