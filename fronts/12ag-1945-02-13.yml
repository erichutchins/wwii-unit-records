h a bar under the plus (read +- as the map draws it: 43(±), 4(±)); the enemy 15 (3724,850, read armored-infantry); the US 8 (3601,1900, solid box with oval, read as 8th Armored as on 02-12); 352(-) at 4015,2870 and 352 ELMS at 4059,3154 are two boxes; 79 and 9 (enemy) in the Westwall band at 3939,3043 and 4027,3105 are overdrawn by the band; the "44" beside the SS divisions is the SS rune, read as SS. CDN 2 and CDN 3 and the other British boxes are drawn with corner ticks (not arrows). Not recorded: boundary labels (XIII xxx XIX, XVIII xxx V, VIII xxx XII, XV xxx VI, XX xxx XII, TWELFTH xxxxx SIXTH, TWENTY ONE xxxxx TWELFTH, FIRST CDN / SECOND BR, SEVENTH xxxx FIRST FR, XX xxx II FR). Overlay crops 1000 px viewed: 2, 4, 5, 6, 9, 12, 14 (every dot on its box, none doubled); 1, 3, 7, 8, 10, 11, 13 written but not looked at.
