# Reviewed: 77 of 78 towns on 7 February's side; Gemünd (own) on the line. The Colmar pocket is gone; the Tholen arcs come out right by themselves; one short Moselle-band junction turned (4226,3684); three boundary and symbol stubs boxed.
# Reader (8 Nov 2026): the symbols, read across the whole sheet: 224 symbols, 117 de, 77 us, 17 uk, 7 fr, 5 ca, 1 pl; 169 from the box finder's numbering, 55 found by eye (the British and Canadian boxes, most corps and armies, XIII Corps, FIFTEENTH (Ger.), the unboxed 85 and 3 by Duren, TWENTY ONE, SHAEF, the Dieppe-Rouen inset's 65 and 13, XC, the unboxed LXVII, the Upper Rhine army group's box and two of the Upper Rhine area's); the finder's box 100 (21, by 12 SS) was a second detection of box 105 and is left out. Lists: unlocated 2 (49, XII SS, box headed "UNLOCATED"), out-of-contact 15 (box headed "OUT OF CONTACT": 1 SS, 2 SS, 9 SS, 12 SS, 21, FG, FE, 15, 25, 3, 7, 361, I SS, II SS, SIXTH), upper-rhine-area 8 (box headed "UPPER RHINE AREA", the Colmar pocket's place: 159, 189, 198, 2 MTN, 338, 716, 708 and an unlabelled armored x), dieppe-rouen 3 (65, 89, 13; "VICINITY DIEPPE - ROUEN"), lorient-st-nazaire 1 (the 66; caption "LORIENT - ST. NAZAIRE SECTOR", singular), arrow 1 (the ?2 east of Pruem). The 9th Armored where it was on the 7th (3928,3987). Unsure: the 2 at 4077,2760 (hatched box, dark smudge, read as armored); the 3 at 4209,2172 (dark filled box, arm unread); the unlabelled box at 6186,5453 (label hidden, one x, read as armored); the box at 5477,4620 (label under ink, read "?"); the 7? at 3883,3055 (second figure unreadable); the 3 CDN and 2 CDN boxes' arm (unread: "CDN" inside); 80 and 4 carry the map's (+) with a bar under it, written (±); 52(-) uk (broken hatching) and the boxes of 79, 42 and 14(-) differ from 7 February's file as drawn: today's 79 stands near Pont-a-Mousson (3828,4423), the 42 near Chateau-Salins (4136,4598), the 14(-) near Sarrebourg (4953,4683), the 7th's file has 42 and 14(-) at each other's spots and its 52(-) at y 1650 (today 1105).
# Reviewed (8 Nov 2026): the symbols. The Colmar pocket's box is gone and the UPPER RHINE AREA box stands in its place (eight
