# Reader: --gcps-from 12ag-1945-05-07 (one run): sheets offset -8,+16 px; 45 of 60 towns agree (median 1.7 px); 15 placed through the transform (14E 49N, 15E 49N, 13E 48N, 14E 48N, 15E 48N, 6E 54N, 7E 54N, 11E 54N, 12E 54N, 13E 54N, 14E 54N, 15E 54N, 14E 53N, 15E 53N, 12E 48N). Title read: report 337, 081200 MAY 1945 (the stamp top left reads 8 MAY 1945); agrees with the catalogue (1945-05-08). Whole sheet traced, front alone (no symbols).
# Reader: 05-07's 171 boxes, flips and area shifted by -8,+16 and measured against an unboxed trace (191 runs). Boxes DROPPED (each held a ticked front stretch, looked --look 3711,938 1606,665): 05-07's box 85 (1206,508,1676,688 shifted; the Elbe/Weser front at 1606,665, ticked), box 161 (3661,883,3751,953; the front at 3711,938 by Ludwigslust, ticked), and the box at 4319,5325-4409,5395 (05-07's run 126, 4372,5344), which lay over the line west of Altoetting and held no run's middle: dropped with it, see the run 112 note. The title lettering (box 0, 155, 158) and the stamp (box 1) hold runs that are lettering; the legend and its list are covered and no run is left in either on the final trace.
# Reader: four boxes ADDED at their middles for heavy untick runs outside the shifted boxes: 3550,1040 (the Twenty One / Twelfth boundary's last stretch to the Elbe), 3844,5203 (the Twelfth/Sixth boundary's tail south-east of Freising), 3149,6258 (blunt end of the tapering band at the south edge), and 4530,5366 (run 112, the Third / Seventh army boundary along the Inn to the Salzach corner: heavy black with no ticks from west of Muhldorf to 4810,5590; the tool joins it as one run so the box can only be at its middle; before the box the sides test put 12E 49N enemy by it).
# Reader: the three Allgaeu-loop flips of 05-07 are NOT kept: re-centred at 2839,6083, 2925,6009 and 2990,6004 (shifted) none matched a stretch today (0 by hand), and without them the red ticks of the loop's upper-left arc (Staufen-Sonthofen, runs 134, 135) stand outside the loop on the map's own strokes (looked, overlay crop 2500 5700 1800 650); 8E, 9E, 10E 48N read own with no flip. The ticks are right today as found.
# Reader: two short unsure stubs checked by eye (3892,1805 and 5652,5360), both with their neighbours' side.
# Reader: legend and drawing: no change from 05-07 that I could see: the legend's sample (U.S., British, Enemy, Front Line) is as before and the line is drawn ticked as on 05-07 (the Elbe and Mulde to the Czech border, the Austrian salient to the Enns, the Inn/Salzach boundary heavy and unticked, the Allgaeu loops). No separate meeting line with the Soviets is drawn beyond the front: what is drawn is the ticked line.
# Reader: left unsure as found: the thin band from Neuenburg north to Wilhelmshaven (as on 05-06, 05-07; no ticks to read, traced like the Aurich-Neuenburg loop); the south edge below y 6110 (the Allgaeu loop's left leg ends at the sheet's edge, the hook at 3120-3200,6160-6260 boxed as untick). The Dutch coast at the left edge is outside the towns' spread and the area, as before.
