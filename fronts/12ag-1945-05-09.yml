# Reader: --gcps-from 12ag-1945-05-08 (one run): sheets offset +16,+48 px; 51 of 60 towns agree (median 1.0 px); 9 placed through the transform (13E 48N, 11E 54N, 13E 54N, 14E 54N, 15E 54N, 8E 53N, 13E 50N, 11E 49N, 7E 48N). Title read: report 338, 091200 MAY 1945 (the stamp top left reads 9 MAY 1945); agrees with the catalogue (1945-05-09). Whole sheet traced, front alone (no symbols).
# Reader: legend (U.S., BRITISH, ENEMY, FRONT LINE) and drawing as on 05-08: the sheet calls it the front line; no line of contact with the Soviets or demarcation line is drawn. The ticked line runs as before (the Elbe and Mulde to the Czech border, the Austrian salient to the Enns, the Allgaeu loops, the north-west coast), the army group and army boundaries heavy and unticked.
# Reader: 05-08's 172 boxes, checked entries and area shifted by +16,+48 and measured against an unboxed trace (229 runs; the scans differ in size, 6000x6722 against 5959x6673). No box held a ticked stretch (the 05-08 drops kept: the Elbe/Weser front and the front by Ludwigslust stay unboxed); the unboxed trace's runs in boxes were lettering, stamp, legend or boundaries (looked at 2378,951, 4124,5341, 498,5794, 1664,4625). Title, stamp and legend stay covered.
# Reader: three boxes ADDED at their middles for heavy untick boundary runs the shifted boxes missed by the scale difference (each magenta/unsure before, looked): 3623,1025 (Twenty One/Twelfth boundary's tail to the Elbe), 2195,1947 (the same by Osnabrueck), 3826,5170 (Twelfth/Sixth boundary's tail SE of Freising). The Muehldorf-Altoetting-Salzach line is drawn plain (Third/Seventh boundary) as on 05-08 and stays boxed (run 187 at 4546,5388, in the shifted box). 05-08's Allgaeu non-flips kept (no flips).
# Reader: checked by eye: the Enns hook's end at 5667,5382 (as on 05-08). Left unsure as on 05-08: 1482,956 (the thin band near Emden/Oldersum, a few short strokes on its lower side, traced with its neighbours).
