# Reviewed: 80 of 81 towns on 29 March's side; Siegburg back to enemy (right). The sheet draws no closed Ruhr ring on 31 March; the heavy ticked line north-east of Paderborn is past the towns' spread and untraced.
# Reviewed (area): `area: [4250, 1700, 5150, 4560]` takes in the heavy ticked line north-east of Paderborn (4300,1700 to 4600,1900), on by Kassel and Hersfeld (the line continues without a break) and down the Vogelsberg flank to Gelnhausen, then the Frankfurt bridgehead's east side by Aschaffenburg and the Odenwald to the Neckar: 13 stretches added, front 1005 to 1344 km; ticks checked on crops 4000,1500, 4350,2000, 4500,3640 (3x) and 4300,4400; one box on the diagonal's last stub. No town changed side. Already traced before, and not front: the heavy diagonal from Hanau (4450,3745) to 4565,3645 is the army boundary (no ticks of its own), left as it was. Still missing: nothing found.
