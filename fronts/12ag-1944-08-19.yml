# Reviewed: 7 Nov 2026 (q-0819). Copied from 08-18: radius 4, area box, title and legend boxes (same places). 25 of 28 towns agree (median 1.1 px; 1.5W 49N, 1W 48.5N, 1.5E 47.5N placed through the transform).
# New today: the black frame of the 'REPORTED IN TRAP' list (upper right) traced as front; boxed. 18 Aug's three army-boundary boxes and the corps-lettering box were not needed (radius 4; no strays).
# Radius 4 kept: 31 stretches, 162.7 km. Radius 3: 35 stretches, 156.3 km; radius 5: 29 stretches, 8 unsure. 4 is the most continuous. Shorter than 18 Aug (188.8 km): the heavy salient north of Argentan-Livarot (about (3300,810)-(3480,960)) is not picked up (gap ~230 px), nor at radius 3.
# Falaise gap: open, about 2.5 km between the traced tongue's tip (0.109E 48.800N) and the Argentan line (0.106E 48.777N); the inked tongue and the line are plainly apart on the scan (looked at 3470,1690), against about 7 km on 18 Aug. No ring; ticks on the Allied side outside the pocket.
# Ends: north (-0.164, 49.271) at Dives; east (0.262, 48.736) at the stub south of Nonant (the heavy line ends blunt at about (3750,1850); a thin line beside it is a boundary, not traced).
# Turned: run 26 at Argentan (3263,1825) only; hatching on its SE side, --sides had four southern towns 'enemy' by it; after the flip no town on the wrong side.
# Reviewed: the Falaise mouth about 2.5 km, the ring not closed on this sheet (no ink between the tongue and the Argentan line at 3470,1690); the short Argentan run turned to the map's hatching (south-east), three runs checked. The heavy salient north of Argentan toward Livarot (3300,810 to 3480,960) is untraced (the fused-tick fault). The REPORTED IN TRAP list's frame is boxed.
