# 12ag-1945-04-15: the sheet as read on its title (G-3 report 314, 151200 Apr 1945; agrees with the catalogue); B13, towns matched to 04-14 (25 of 26 agree, median 1.0 px, 7E 53N placed through the transform; offset +0,+8 px).
# 04-14's area and boxes shifted by y+8. The five lettering/list boxes kept; of the 04-14 boundary boxes only the eight that still hold a run today kept (Muenster, Lahn, Kassel, Muehlhausen, Ahr, Third/Fifteenth, Tonndorf, Neuwied; none holds a ticked front stretch); the others hold none (the boundary runs merged into longer ones today) and are dropped. New boxes (each at the middle of today's run, looked at on an overlay crop) for the 25 boundary/symbol/lettering runs the first run left in: the long Twenty One/Twelfth line (run 25 of the first run) and the lines in the First/Third, Twelfth/Sixth and Seventh/First French sectors.
# Left unsure: the stub at Hagen (1146,2445), where the Ruhr pocket's two halves meet (cut at Hagen today); kept as front. Front 2,079 km (04-14: 2,439): the Emmen loop and the Harz/Magdeburg pocket are smaller today, and today's long boundary lines are boxed.
# Pockets (Ruhr, Harz, Zeitz-Altenburg-Meerane, Kothen, Emmen) are closed rings whose map ticks fall on the outside (the US side); towns inside read enemy. Sides: 25 of 26 as 04-14; 11E 50N changed enemy -> own (inside the Bamberg/Scheslitz salient, 40 px from the line, a weak test).
