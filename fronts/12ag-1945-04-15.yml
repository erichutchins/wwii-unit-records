# Reviewed: 25 of 26 towns on 14 April's side. 11E 50N own ("11E 50N          own (US)  by run 81 own at 4172,4380"): the Coburg-Kronach front is gone and the town sits inside the Bamberg salient, ticked on its inside: right, a weak test. Pockets drawn and ringed, ticks outside: Emmen, the Ruhr (cut at Hagen), the Harz, Köthen/Barby, Zeitz-Altenburg; the Elbe Salzwedel-Havelberg. 91 stretches, 2079 km (14 Apr 2439: smaller pockets, and long boundaries now boxed). 28 of 14 April's boundary boxes caught nothing and are dropped; 25 added on today's runs, among them the long Twenty One/Twelfth line to Celle and the Frankfurt-Bayreuth line (the front at Celle kept). One unsure stub at Hagen, where the pocket's halves meet.
# Reader: area widened to [0, 0, 4900, 2958]: adds nothing but one 3 km river squiggle in the legend list's I CDN box, boxed; GeoJSON unchanged.
# Reviewed (7 Nov 2026): area widened to the sheet's top-left corner (B13's west neat line is about 6 35'E, so only the Dutch border strip lies there); what it added is the ticked front along the Dutch border (Emmen, Coevorden, Meppen, Lingen, Twente) where present, with the red ticks on the map's own (overlay crop 250,900 on 04-11). Boundaries and the Rhine ink at Wesel (behind the line since 24 March) boxed; no town changes side.
