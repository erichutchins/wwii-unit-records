# Reader: title read 7 Nov 2026: report 254, situation as of 141200 Feb. 1945 (agrees with the catalogue, ict21255). Towns matched to 02-12 (sheets offset +24, +40 px from 02-12, so about +24, +8 from 02-13 at the Rhine but varying across the sheet; the whole-sheet median of 02-13 to 02-14 town shifts is +20, +14; 67 of 81 agree, median 0.9 px; 14 placed through the transform: Julich, Gemund, Mayen, Strasbourg, Verviers, 's-Hertogenbosch, Nijmegen, Arnhem, Munster, Trier, Bitburg, Prum, Zweibrucken, Pirmasens). The 51 02-13 boxes copied, each moved by the median shift of the five towns nearest it, three more added today (the signature's t at 1530,860; two outline stubs by Bitburg at 4165,3214 and 4003,3105). The title box ends at y 868, above the Walcheren/Tholen arcs (tops about y 890); both ends of the Twenty One/Twelfth boundary (Seraing end and eastern piece) stay boxed, looked at crop 3000,1850. No flips; no checks (nothing unsure once the stubs were boxed). 64 stretches, 0 unsure. This sheet DOES trace the Walcheren/Tholen arcs and the Krammer-Volkerak arc (looked, crop 1400,700: all ticked on the south, US side), unlike 02-13. Kleve ticked on the west round the loop (crop 3400,400). --sides diffed with 02-13 (backup of its geojson in scratchpad q-0214, unchanged by the run), all 81 towns parsed on both days: 79 agree, 2 changed: "Haguenau         own (US)  by run 51 own at 5307,4570" (02-13 "Haguenau         enemy     by run 38 enemy at 5197,4569, run 39 enemy at 5376,4613": American-held, so today right; the ring sits on the Moder line, a weak test) and "Prum             enemy     by run 28 enemy at 4107,2745" (02-13 "Prum             own (US)  by run 22 own at 4080,2739"; Prum is German-held, so today right; one run decides it, a corner reading, weak). Gemund and Adenau enemy; Verviers own; Kleve own.
# Reviewed: all 81 towns diffed with 13 February: 79 agree. Haguenau own ("Haguenau         own (US)  by run 51 own at 5307,4570"; right, on the Moder line, weak). Prüm enemy ("Prüm             enemy     by run 28 enemy at 4107,2745"; 13 Feb own): one run near a bend decides it either way on these days, a weak test; the line there is ticked west. Gemünd, Adenau enemy; Verviers, Kleve own. 64 stretches, about 797 km, 0 unsure, no turns; the Walcheren/Tholen and Krammer-Volkerak arcs trace on this sheet (they did not on the lighter 13 February sheet). Boxes moved by the local offset of the nearest towns (the sheet shifts unevenly); three added: a signature stroke, and two strokes on the enemy band's outline by the 560 and 9 symbols.
# Reader: symbols read 8 Nov 2026 (spec by box number and by eye, in the reader's scratchpad q-u0214): 217 symbols: 109 enemy (de), 79 US, 16 British (uk), 5 Canadian (ca), 7 French (fr), 1 Polish (pl); 161 from the finder's 186 boxes (the rest title, signature, stamp and boundary-label lettering, and box 113, a second detection of the 340), 56 by eye (the British and Canadian cluster at Nijmegen and in Brabant, the armies and army groups, most corps, FIFTEENTH both sides, B, XC, C in C ADV, the 183, 9 and 560 in the Eifel, the 94, 83, 2, 80(+-), 212 and 4(+-), the Dieppe - Rouen 71 and 89, the Lorraine and Alsace 347, 14, 905, 30 SS, LXIII, FIRST FR, II FR, 2 FR, XXI, SHAEF, UPPER RHINE and the 2 MTN and 16 in the Upper Rhine box). Lists: 4 unlocated (box headed "UNLOCATED": 49, 361, 3(-), 10 SS; no OUT OF CONTACT box on today's sheet), 7 upper-rhine-area (box headed "UPPER RHINE AREA": 189, 159, 198, 2 MTN, 338, 16 and the 106, which has one x over it, a brigade as drawn; the 716 and 708 stand on the Rhine plain outside the box today), 4 dieppe-rouen (box headed "VICINITY DIEPPE - ROUEN" at the sheet's left edge: 65, 71, 89, 13; an arrow off the sheet to the left from the box's side), 1 lorient-st-nazaire (the 66; box headed "LORIENT - ST. NAZAIRE SECTOR", singular; an arrow drawn from the box's left side pointing west), 7 arrow (3 ELMS and 9 ELMS and 12 and 246, each with an arrowhead pointing west from the symbol's left edge; the British 15, 43 and 53(+) with arrows toward the front near Cleve, the 43's and 53's joined to one arrow). Ties: 22 (corps III V VI VII VIII XIII XV XVI XIX, armies FIRST THIRD SEVENTH NINTH FIFTEENTH, army groups TWELFTH and SIXTH, 1st, 45th, 79th, 11th Armored, the French 2nd Armored, the 9th Armored). The 9th Armored's oval stands at 3951,4005: the 9th Armored where it was on the 13th (3938,4002); the US "9" with the cross (4049,2278) is the 9th Infantry, untied. Compared with 13 February: 211 of the 217 symbols match the 13th's by nation, echelon and label (6 differ); today only: 15(+-) (13th 15(+)), 43 without a qualifier (13th 43(+-)), 51(+) (13th 61(+); read 51 plainly), 80(+-) and 5(+-) (13th 80(+), 5), 6 at 3964,672 / 7 at 3953,724 / 180 at 3898,777 (the 13th's file has 7, 180, 6 down the same column), the 716 and 708 outside the Upper Rhine box, 12 with an arrow, no arrow on the 47; the oval corps and armies FIFTH, LVII, XLVIII, XXXIX are armored as in earlier files. Moved far: LXIV (5622,5322, 13th 5385,5270), 245, 47, 75 (4298,5232; the 13th's 75 is elsewhere), 106 (6079,5464), 559; the rest sit within the sheet's shift of about +24, +3. Unsure: the box 38 "11(-)" at 3596,1452 is drawn with a solid line (British boxes are dashed) and the oval armored, so recorded us, untied (unit:-); the 13th reads it uk; the 15 (de) at 3755,852 (mark overdrawn, read armored-infantry) and the 17 SS at 4820,4158 (armored-infantry as drawn, overdrawn); the 778 at 4536,3926 (middle figure under the Westwall band, read 7?8 on the sheet, written 778 as the 13th); the 3 ELMS (arm read airborne) and 9 ELMS (armored); the 43's arrow (its line joins the 53's); the XXII at 2661,3741 (drawn XXII); LXXIV (a bolt-like stroke where the L stands); SHAEF (six x, 432,4420, by eye); label qualifiers 15(+-), 80(+-), 5(+-), 4(+-) read as the map draws them (a bar under the plus). Not recorded: boundary labels (XIII xxx XIX, VIII xxx XII, V xxx XVIII, XII xxx XX, XV xxx VI, II CDN xxx I, II FR xxx XX, FIRST xxxx THIRD, TWELFTH xxxxx SIXTH, TWENTY ONE xxxxx TWELFTH, FIRST CDN / SECOND BR, SECOND BR xxxx NINTH US, SEVENTH xxxx FIRST FR), the legend and the title.
