# 12ag-1945-04-18: the sheet as read on its title (G-3 report 317, 181200 Apr 1945; catalogue 18 April 1945); B13, towns matched to 04-17 (23 of 26 agree, median 0.7 px; offset -24,+0 px; 7E 53N, 8E 53N, 13E 53N placed through the transform).
# Reader: 04-17's area and 50 boxes shifted by -24,0 and checked against an unboxed trace (83 runs, 24 unsure). Kept: the Auth box, title and legend (they hold only lettering/legend 'ticks', as on 04-17; the front at the title's left edge, x 4700-4880, lies outside the title box, which starts at 4914) and the two boundary boxes that still hold a run (4420,4252; 1708,4619). 45 dropped: none held a ticked front stretch, all held nothing. Added 12 boxes at the middle of heavy black untick boundary runs outside every box (Sprakensehl-Celle-Hannover and on to Osnabrueck, five runs; Meiningen-Bayreuth, five; Hanau-Meiningen; Darmstadt-Worms), looked at on crops 2900,450 and 3300,3450 and the overlay sheet. After them 50 stretches, 0 unsure. The front round Celle stays traced: the Sprakensehl ring and the Salzwedel line (ticked, blue); only the thin boundary from Sprakensehl through Celle to Hannover is boxed.
# Reader: the Ruhr: the pocket's ring west of Essen is not drawn today (crop 0,2000: no ring, the Rhine's blue only); the heavy line east of Essen (Essen-Hagen-Arnsberg, plain on 04-17 and boxed) is drawn again as a plain black line with no ticks (looked, crop 0,2000), and the tool's mask (radius 4) does not even find it today, so no box is needed there and none is kept. Harz, Koethen/Barby, Emmen rings and the Zeitz-Chemnitz salient ticked outward (crops 3900,2150 and 450,100); the Elbe Wittenberge-Magdeburg line and the Plauer/Havelberg part drawn. Area: 04-17's shifted, no ticked line runs past it; the Emmen front's west end meets the Auth box's frame at about 1490,260 and is not followed under it. No flips, none checked.
# Reader: sides: 24 of 26 as 04-17 (04-17 run again for the comparison; its GeoJSON unchanged, compared with a backup). "7E 52N           own (US)  by run 7 own at 1511,350, run 4 own at 1617,351, run 8 own at 2167,388, run 13 own at 2522,419" (04-17: "7E 52N           enemy     by run 50 own at 718,2451, run 48 own at 654,2417, run 53 own at 805,2440, run 54 enemy at 816,2455"): Muenster is on US ground, the ring end that made it enemy is gone: the artefact is cured. "8E 53N           own (US)  by run 4 own at 1617,351" (04-17: "8E 53N           enemy     by run 1 enemy at 1620,345"): the town (1641,373, placed through the transform) sits under the Emmen front's corner, a weak test; the ring is the same stretch, one run alone decides. Length 1,671 km over 50 stretches (04-17: 1,923, 97): the Ruhr ring and the Hagen-Arnsberg-side stretches are gone.
