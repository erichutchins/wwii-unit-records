# Reviewed: 24 of 26 towns on 17 April's side; both changes are now right: 7E 52N (Münster) own ("by run 7 own at 1511,350, ..."), the Ruhr ring whose end made it enemy on 17 April being gone; 8E 53N own (its ring under the Emmen front's corner, the same stretch deciding both days, weak). The Ruhr pocket's ring is not drawn today (the western part surrendered this day); the plain Ruhr line east of Essen does not trace. Harz, Köthen/Barby, Emmen rings and the Zeitz-Chemnitz salient ticked outward; the Elbe drawn; the front round Celle traced. 50 stretches, 1671 km, 0 unsure, no turns. 45 shifted boxes held nothing (today's boundaries print thinner) and are dropped; 12 added on boundary runs, each looked at. The Emmen front's west end stops at the Auth box's frame.
