# Reader: symbols read 8 Nov 2026 (12ag-1945-01-24-units.csv): 225 as drawn, 123 enemy, 73 US, 17 British, 6 French, 5 Canadian, 1 Polish (by echelon: 150 divisions, 4 single-x (the enemy F.G., FE and 106 and the US AB 17), 46 corps, 16 armies, 6 army groups, 3 C in C / SHAEF); 150 from the box finder (of 156 numbered, 6 being the title's letters and the legend's BRITISH lettering), 75 found by eye (tile by tile on the overview, one more, the enemy TWENTY FIFTH at the top edge, found on the overlay). Listed: 66 (lorient-st-nazaire, the box captioned LORIENT - ST. NAZAIRE SECTORS with an arrow pointing west); 49, 269 and "8?" in the box headed UNLOCATED; 1 SS, 2 SS, 12 SS, 62, F.G. and 116 in the box headed OUT OF CONTACT; 159, 716 and 2 MTN by Colmar, each with an arrow drawn from it to the sheet's foot (arrow); LEHR with an arrow drawn from its box to the south-west (arrow). Ties: the corps, armies and army groups named in the brief, 1(+), 45(+), 79(+), 11 armored, 2 FR and the 9th Armored (the oval 9 by the Moselle at 3925,3952: the 9th Armored where it was on the 23rd); the 9 with the cross (3797,2274) untied. No CCA, CCB, CCR or task force is drawn as its own symbol. Unsure: the arm of the enemy 3 at 3955,3134 (hatching and the Westwall band cross it: read unread); the tail of the enemy "2(?)" armored at 3911,3100 (the 23rd read 2(ELTS); the qualifier is under the Westwall's ink, so only "(" is read); the label of the enemy 276 (3825,2977, a road crosses it); the arm of the enemy 15 and 25 (armored-infantry), 21 and 10 SS (armored), partly hidden by hatching; arms of CDN 2 and 3 (unread, the dashed cross cannot be told); the US AB 17 is drawn with one x (a road runs over where the second would be; read x as drawn); the enemy corps at 4315,2419 reads "XIII" with no SS beside it (the XIII SS stands by Kaiserslautern at 4891,3715); the 405 has no WESTWALL caption beside it today (list empty); "?" with an arrow beside the 560/26 (pointing north) and beside the 277 (pointing south-east) are not recorded as lists: the reviewer should say if they are arrows from those symbols; the 1 SS and the other out-of-contact labels as written ("1ss", "2ss", "12ss": read 1 SS, 2 SS, 12 SS); the 2 FR stands at 4964,4948 beside II FR (the 23rd had it at 5190,4805 and II FR at 4976,4916).
