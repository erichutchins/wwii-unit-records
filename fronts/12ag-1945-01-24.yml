exclude:
  - {box: [950, 380, 2250, 740], why: "the title block's lettering (SECRET struck through, SITUATION 1200 HRS 24 JANUARY 1945, TWELFTH ARMY GROUP); ends above the Walcheren/Tholen front, which starts at about y 790"}
  - {box: [0, 4980, 1100, 5977], why: "the legend (U.S., British, Enemy, FRONT LINE sample, ticks and all)"}
