flip:
  - {at: [3683, 2709], why: "review: the short piece of the Ardennes front west of the enemy 560th's box, by the heavy junction with the First/Third boundary: the US 17th Airborne lies west, but it came out with its own side east (Dinant, Namur and Huy each had it against them)"}
checked:
  - {at: [4361, 3904], why: "the front's short piece joining the Saar reach to the corner where it turns south-east; the same line as its blue neighbours, whose map ticks fall on the south-west (US) side (looked close)"}
