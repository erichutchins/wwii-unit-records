  - {box: [3260, 2715, 3660, 2860], why: "a boundary labelled FIRST / THIRD, heavy black, no ticks, from the VIII corps symbol north-east to the front at about 3665,2730 (looked at 3300,2840, 3420,2790, 3520,2810, 3640,2735)"}
  - {box: [2770, 2805, 2880, 2865], why: "the same FIRST / THIRD boundary's stretch in the west (run at 2833,2830), heavy black, no ticks"}
