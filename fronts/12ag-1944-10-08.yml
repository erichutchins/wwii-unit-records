# Reader: title read 1200 HRS 8 OCTOBER 1944, no report number, SECRET struck through (agrees with the catalogue). gcps: matched to 12ag-1944-10-09 on the first run (offset +0,+0 px; 54 of 81 towns agree, median 1.0 px, 27 placed through the transform, among them Saint-Die 81 px, Kleve 60, Bergen op Zoom 59 off, so those towns' places are the transform's); conic fit 1.1 km rms over 81, leave-one-out 1.1 km, worst Beauvais 3.4 km. Boxes: 10-09's six, unshifted (offset 0). Tried each alone: the title box (5 stretches of lettering; 4 of them trace as ticked, so it does cut ticked stretches, kept on purpose: it lies far from the front, east of x 4100, and without it the trace holds 90 stretches of lettering and boundaries) and the Louvain-Geilenkirchen boundary box (4 stretches, none ticked) are kept. 10-09's Siegfried box at 5370,3385 catches one stretch that traces as ticked (the Siegfried double line, hatched): dropped as a box of that name, and re-made below. 10-09's three later boxes (2550,1371; 5078,3117; 5194,3181) catch nothing today and are dropped. New boxes for plain heavy lines that traced unsure or as ticked/line, each looked at with --look: the Twenty One/Twelfth boundary at Nijmegen, the Maas and Geilenkirchen (4059,599; 4113,1036; 4314,1177), the army boundaries in the west (1568,1671; 1843,1986; 1502,2452; 1368,2640) and the two that traced as 64 km of "line" (2456,1741; 2083,1822), the Twelfth/Sixth boundary (5344,4130; 4940,4337; 4670,4367; 4601,4390), the Sixth/First French boundary at the Rhine (5746,4640), and Siegfried hatched features at 6240,3780, 5350,3384 and 6091,3692 (the last two trace as ticked from their hatching; boxed all the same, because the Siegfried hatching is a fortification, not the front: that cuts ticked stretches, for the reviewer to look at). A box at 4601,4390 first also took a ticked stretch (4586,4414 at the front's end by the canal); it was cut down to the boundary stretch's middle and no ticked stretch is cut by it. No ticked front is drawn round Nijmegen, on the Antwerp-Breda line or in the Vosges: nothing traced there. The ticked front runs from the Geilenkirchen arc (6.0E, 51.06N) and the Maastricht loop, round Aachen and Monschau and down the Ardennes edge and Luxembourg to the Marne-Rhine canal at about 4590,4410 (48.63-51.06N): 26 stretches, 21 ticks, 5 line, 0 unsure, no flips, about 423 km by the GeoJSON's own points. The fused Aachen-Monschau reach traces on its east edge and round the boxes' arcs; the hatched strip between Aachen and Monschau (about 4300-4400, 1420-1630) is traced in part only, roughly two thirds. Sides: 81 of 81 towns agree with 10-09 (--sides run on both, diffed town by town; 10-09's GeoJSON backed up and found unchanged); Metz enemy; no town changes side.
# Reviewed: 54 of 81 towns matched to 9 October; fit 1.1 km rms. All 81 towns on 9 October's side; Metz enemy. As on 9-14 October, a ticked front only from Geilenkirchen round Aachen and Monschau and down the Luxembourg edge to the Marne-Rhine canal; none round Nijmegen, on the Antwerp-Breda line or in the Vosges. 26 stretches, about 423 km, 0 unsure, no turns; the fused Aachen-Monschau strip partly traced. The title box and two Siegfried boxes hold runs the tool counts as ticked: lettering and the Siegfried Line's double hatched lines, not the front (kept, as the reader proposed). Boundary boxes added, among them two plain lines whose road ticks had made 64 km of "line"; the canal-end box cut to the boundary stretch alone, sparing the front's last stretch.
