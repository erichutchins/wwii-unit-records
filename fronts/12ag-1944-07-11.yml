# Reader: --sides on 07-12 (its GeoJSON backed up and unchanged by the run) and today, town by town: all 34 towns on the same side, none changes. 0.5E 49.5N and 1E 49.5N read enemy (right: land north of the Seine, German-held) by three runs to one off the open east end. Beyond the open ends the towns read either way: 0E, 0.5E and 1E 50N are in the sea off the east end (own, runs split 3 enemy to 1 own for 0.5E and 1E; 0E own), 2W and 1.5W 50N in the Passage de la Deroute off the west end (own). No town on the wrong side.
