# Reader: boxes. The three of 07-12 each re-tested by removal: without the title block 52 stretches (10 unsure), without SECRET 57 (14 unsure), without the legend 95 (41 unsure); all kept. The legend box to x 2600 as on 07-12 (nothing past 2448 here). No boundary or symbol-stroke box was needed: the corps boundaries print thin today and trace nothing; no ticked front stretch is boxed.
