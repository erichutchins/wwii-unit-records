# Reader: 226 symbols read (US 76, enemy 120, British 17, French 7, Canadian 5, Polish 1); 58 found by --boxes, 168 by eye on the overview tiles. Lists: 15 out-of-contact (the boxed list at the right), 2 unlocated (49, 8?), 3 dieppe-rouen (65, 69, 89), 1 lorient-st-nazaire (66); no westwall caption on this sheet. The 9th Armored (oval "9", about 3919,3983) is the 9th Armored where it was on the 28th (the sheet's shift of about -35,+10 only). Ties made: 9ad, 1st-division, 45th-division ("45(+)"), 79th-division ("79(+)"), 11th-armd-div (oval "11", about 3307,3009), fr-2d-armd-div ("2(-) FR"), corps III V VI VII VIII XIII XV XVI XIX, the five armies, the two army groups. Unsettled: SIXTH is drawn with six x (recorded xxxxxx, tied to 6th-army-group); the enemy "56" by the front's arrow may be 560 (the last figure under a heavy line, recorded as written); the enemy "9" (about 3897,3000) and "LEHR(-)" (about 3915,3052) in the front's overdrawn stretch have their arms hidden (9 read infantry, LEHR unread); the enemy 5 (3863,2838), the out-of-contact 5 and the unlocated 8? read airborne from a faint curved mark; the "?" arrows by the 10 SS (about 5400,4420 and 5530,4440) are not symbols and are not listed. Today but not 28 Jan: the enemy 15 and the enemy "?" are not on this sheet. A few by-eye positions (the front's overdrawn symbols, 4045,3340 76, LEHR) are good to about 15 px.
