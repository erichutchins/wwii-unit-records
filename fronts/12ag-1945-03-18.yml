# 12ag-1945-03-18: the sheet as read on its title, and the hand decisions its trace needed (tools/trace_front.py;
# fronts/README.md). The towns are <map>-gcps.csv, the symbols <map>-units.csv; the GeoJSON is generated.
# Reader: title as printed: "TO ACCOMPANY G-3 REPORT NO. 286 / SITUATION AS OF 181200 MAR. 1945", signed C. T. Schmidt for A. Franklin Kibler; the stamp (top right) reads "Date: 18 March 1945". It agrees with the catalogue (sitmaps.csv: ict21287, 1945-03-18, B11). Report 286 follows 285 on 17 March. The scan is 6596 x 5972 px (17 March 6586 x 5987).
# Reader: gcps_from 12ag-1945-03-17 (the 81 towns; sheet offset +8,-8; 78 of 81 agree, median 0.6 px; 3 placed through the transform: Altenkirchen 22 px off it, Gemuend 16, Trier 8). Fit conic, rms 0.8 km, leave-one-out 0.9 km, worst 2.4 km (Baden-Baden; then Darmstadt 2.0, Turnhout 1.7, Epinal 1.5, Sedan 1.4).
# Reader: radius 5, dark default 70, as 15-17 March. Radius 4 and darker cutoffs not tried: at 5 every stretch is whole where the map's line is whole, nothing merged that shouldn't. The gaps of 20 px or more left are the map's own breaks (the Scheldt arcs of Walcheren, Noord-Beveland and Tholen: 34, 45, 114 and 203 px between ends), and four where the tool's runs stop short in heavy ink (see the flips and checks note).
# Reader: boxes: 139, the 17 March boxes copied, each moved by the median offset of its five nearest towns (+6 to +9 across, -12 to -7 down; not re-centred). Run once with no boxes (43 stretches: 35 ticks, 6 line, 2 unsure) and compared by geometry with the run with all 139 (39 stretches): the boxes take away exactly four stretches, each of four points or ten, none front: the title block's lettering (run at about 1251,292, ticked by the letters' strokes), the stamp (5415,458), the signature's pen strokes (about 1050,985) and the Twelfth/Sixth boundary west of Metz (3817 to 3923 by 4058 to 4076, heavy black, no map ticks); everything else is unchanged point for point. No point of today's traced front falls inside any box (checked by the traced points against all 139), so none is dropped: the three dropped on 17 March (St. Goar Rhine, Zell hook, Ninth/First boundary from Aachen) stay out. 135 of the boxes hold no heavy ink today; they are kept, as on 17 March, for the days after. The map's list of divisions facing the bridgehead (lettering and symbols, x 4880 and east, y 1980 to 2260) is not front and no box is needed for it.
# Reader: flips: none. Checked: two, both short unsure runs in heavy ink that join ticked neighbours and run their way (see the entries): run 19 at 4696,3593 (the corner at the head of the Birkenfeld corridor) and run 23 at 4324,3835 (Saarlautern, the front running into the enemy band's hatched outline). Nothing else is unsure. Tick direction was read on the overlay crops (800 px) and on 4x crops at the Bad Kreuznach loop (5050,3080), the bridgehead's east bend (4760,2150), the Birkenfeld corridor head (4300,3300) and Saarlautern (4230,3740): the red ticks fall on the map's own, on the US side (west and south, and inside the Hunsrueck salients), throughout. Gaps left in heavy ink, not the map's: about 25 px between runs 17 and 18 (4645,3565 to 4659,3587) and 50 px between run 19's end (4700,3601) and run 20's start (4695,3650), where the corridor head's spike, its corner and the lower line meet in a thick black mass with the enemy band; about 24 and 27 px either side of run 23 at Saarlautern; 13 px at 4761,4036. The reviewer may want to look at the Birkenfeld corner.
# Reader: the front is 39 runs (31 ticks, 6 line, 2 checked by eye), about 1073 km (17 March: 58 runs, 1002 km, same measure): fewer runs because the tool joined more at the junctions, longer by the Hunsrueck and Saar-Palatinate changes below (211 km of today's lies more than 3 km from 17 March's, of it about 120 km in the Hunsrueck and Nahe and about 90 km on the Saar and toward the Palatinate; the Scheldt, Maas, Wesel and the lower Rhine to Cologne, Bonn and the Rhine to Koblenz agree with 17 March). At Remagen the line follows the Rhine's west bank from Bonn to Koenigswinter (about 4690,2095), bends east round the bridgehead to about x 4850 (y 2200 to 2290), ticks inside (west), hooks back to the river at Linz (about 4790,2325) and runs on by Andernach and Neuwied to Koblenz and Boppard (5037,2723) as on 17 March; the BRIDGEHEAD N.-S. box and its list are not front. In the Hunsrueck the line runs down the Rhine's west bank from Boppard by Bacharach, then south-east by Rheinboellen and Stromberg to the heights above Bingen (about 5290,3100), round a loop at Bad Kreuznach (the 4 symbol, about 5240 to 5300,3150 to 3250, ticks inside) and back west along the Nahe's north side to about 5120,3295 (east of Bad Kreuznach, the Nahe, not past Kirn), then north-west to 5000,3110 east of Kirchberg and south-west in a V (point about 4880,3215) to Trarbach on the Moselle (about 4700,3045), with the symbols 5, 11, 89, 246 and 2 inside; from the Moselle it runs south-west by Bernkastel and Trier's side and south-east to the head of a narrow corridor (the 12, 94 and 10 symbols, tip about 4690,3455, its lower line along y 3650 back west to 4450,3720). On the Saar it runs down the west bank by Saarlautern (4324,3835 to 4372,3923), then east along the Forbach road (4485,4003 to 4687,4018) past Saarbruecken's west side, turns round the symbols 45 and 3 near Zweibruecken (about 4750 to 4890,4040 to 4090) and south by Bitche (x about 4890) and the Moder to Haguenau (5440,4500 on the Rhine), then down the Rhine's west bank past Strasbourg to the sheet's southern end (5111,5617). Zweibruecken, Pirmasens and Landau stay on the German side; the Palatinate is not entered by the line, which stops at the West Wall's hatched band.
# Reader: sides (--sides on 17 and 18 March, all 81 towns): 79 unchanged; two changed, both rings that sit on the line at the bridgehead: "Bad Godesberg    enemy     by run 21 enemy at 4647,2096, run 20 enemy at 4567,1993" (17 March) became "Bad Godesberg    own (US)  by run 9 own at 4791,2124", and "Königswinter     enemy     by run 22 enemy at 4777,2092" became "Königswinter     own (US)  by run 9 own at 4791,2124" (the tool's lines, Koenigswinter spelt as the tool prints it, with its umlaut). Their rings stand on the line (the overlay crop 4300,1800 shows both crosses on it) and read either way; on 18 March both are in the bridgehead, so "own" agrees with the map, and the line, one run now from Wesel's bend to Linz, is the same as 17 March's there to within 5 px. No town on land on the wrong side; Neuwied stays on the German side as on 17 March (run 10 at 4900,2428).
