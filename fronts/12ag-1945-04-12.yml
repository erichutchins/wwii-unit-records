# Reviewed: 23 of 26 towns on 11 April's side; 11E 51N and 11E 52N (own) are the advance to Erfurt and the Magdeburg pocket. 7E 53N (own) rests on one 59 px stub by the Polish symbol, a weak test. Doubtful: the heavy Lingen diagonal (runs at 1179,901 and 1128,942) is traced here as front but was boxed as boundary on 11 April; it shows only a stub of ticks.
