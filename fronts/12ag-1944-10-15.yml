# Reader: 81 of 81 towns on 10-16's side (Arnhem own on both, WRONG: the heavy ticked arc along the top of the Nijmegen salient, scan about 3900,5 to 4070,25, is on the sheet but is not among the traced runs; nothing was boxed or flipped to force it). Boxes are 10-16's moved (-11,-12) plus seven added; 11 stretches turned by hand (3 on the Nijmegen east flank, 8 on the Antwerp-Breda-Turnhout line and the Breskens end), 8 checked. 132 stretches, 587 km (10-16: 845 km, 47 stretches): the ticked front is traced in fragments round Geilenkirchen-Maastricht-Monschau, gaps unfilled. Unsure and left: (3961,999), (4011,1116), (4206,1279), (4387,1485)-(4325,1857) fragments, (4406,2178), (4732,4347) at the boundary's junction with the front.
# Reviewed: a thin day. 81 of 81 towns on 16 October's side, which includes Arnhem own: WRONG, as on 16 October (the arc across the top of the Nijmegen salient runs along the scan's top edge, about 3900,5 to 4070,25, and is not traced). Nijmegen own, Metz and Saint-Dié enemy. 132 stretches but only 587 km (neighbours 845, check_fronts "short"): the Geilenkirchen-Aachen-Monschau reach is traced in fragments (the fused-tick fault), with 15 stretches left unsure, mostly there. 11 stretches turned by hand, each on the map's own ticks (Nijmegen east flank, the Antwerp-Breda-Turnhout line and the Breskens end, ticks south); the whole-sheet overlay reads right from the Scheldt to the Vosges. A Siegfried-line stub that had put five Pfalz towns own is boxed.
