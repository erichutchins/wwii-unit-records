# Reader: title agrees with the catalogue (1200 HRS 4 NOVEMBER 1944, no report number). Towns matched to towns-B11.csv (first run, accepted): offset -48, +8 px, 76 of 81 agree, median 0.6 px, 5 placed through the transform (Nijmegen 78 px, Bitburg 66, Kleve 44, 's-Hertogenbosch 37, Prum 36). The tool's unboxed trace had 62 runs, 21 unsure: 11 in the title (SECRET, the 4 and 9 of 1944, the T of TWELFTH) and 9 in the legend's lettering, the Beveland two real. Boxes: title and legend only (own, drawn from overlay crops). The eight boxes of 11-29 shifted by -26,-11 px (today against that day's towns) were each tried with and without: none changes the GeoJSON, so none kept; the sheet shows no heavy untraced-boundary stretch traced as front today (army group and army boundaries come out thin or not at all), and no symbol outline traces. Flips (three): the two unsure Beveland north-shore runs (red ticks north, map ticks south; Breda enemy before, own after) and the hook at the west end of the Beveland shore's heavy line near Walcheren (tool's red ticks north/west, map's ticks inside; Ostend own either way). Walcheren's west arc and east arc kept as traced (map ticks outside/east, red ticks on them). Gap: the Beveland/Tholen north shore from about x 1800 to 2150, y 840-870 is drawn thick black (dashed in places) and doesn't trace: about 350 px (roughly 25 km) is missing from the line; a box can't fix it, the mask is too thin there. Front 33 runs, about 755 km (11-03 about 807 with 65 runs, 11-29 about 946). Sides: 80 of 81 on 11-03's. Arnhem changed: "Arnhem           own (US)  by run 2 own at 4105,167" on 11-03, "Arnhem           enemy     by run 1 enemy at 3631,481" today; Arnhem was German-held, so today's is right and one run carries each. Metz enemy by run 28; Aachen is not among the 81 towns.
# Reviewed: the first B11 day. 80 of 81 towns on 3 November's (B09) side; Arnhem enemy ("Arnhem           enemy     by run 1 enemy at 3631,481"), right (3 November's own was one run of its trace). Metz enemy. 33 stretches, about 755 km (3 Nov about 807): the Beveland/Tholen north shore from about x 1800 to 2150 is drawn thick, dashed in places, and does not trace (about 25 km). Three flips on enlarged crops: two on the Beveland north shore (red ticks north, the map's hang south; Breda own after) and a hook at the shore line's west end (the map's ticks inside). Walcheren's arcs right as traced. Boundaries print thin today: 29 November's eight boundary boxes caught nothing and are dropped; title and legend boxed.
