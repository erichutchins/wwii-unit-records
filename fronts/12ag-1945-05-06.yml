title: '12 Army Group Outline Map 1:1,400,000. Top right, lettered by hand: SECRET, HQ 12TH ARMY GROUP, SITUATION MAP, TO ACCOMPANY G-3 REPORT NO. 335, SITUATION AS OF 061200 MAY 1945, signed C. T. Schmidt for A. FRANKLIN KIBLER, Brigadier General, G.S.C., A.C. of S., G-3'
read: the title on the sheet (title.jpg via --title 3900 200 1700 1000), 7 Nov 2026
gcps_from: 12ag-1945-05-05
# Reader: --gcps-from 12ag-1945-05-05: sheets offset +8,-16 px, 51 of 60 towns agree (median 1.6 px); 14E 48N, 15E 48N, 7E 54N, 8E 54N, 12E 54N, 13E 54N, 14E 54N, 15E 54N, 7E 48N placed through the transform. 05-05's 156 boxes and its area shifted by +8,-16, each measured against an unboxed trace (252 runs).
# Reader: box 155 of 05-05 (5363,5432-5423,5492, 'a very heavy boundary band near Neubofen, no ticks') DROPPED: today (and on the unboxed trace) the band's run at 5419,5436 counts map ticks, and on --look 5365,5340 / 5365,5410 / 5490,5480 short strokes stand on the band's west and inside (US box 65 and 71) side all along the loop round Neubofen-Steyr; it is the front, drawn very heavy (US 65, 71, 80 inside, hatched 36, 46 outside), traced and ticked now. 05-05 boxed it out, so 14E 48N read enemy there for want of it (to the reviewer).
# Reader: four boxes added: the title's left edge (3960,640-4040,820: the T of TO and the S of SITUATION, runs at 4008,678 and 4019,773), the top edge of the title (SECRET, 4750,240-5450,300), the legend's FRONT LINE letters (440,6030-850,6150) and the heavy tapering band's tip at the south edge (4030,6000-4140,6090: two lines closing to a blunt black end, no ticks); each shifted box fell 10-30 px short of today's letters. Every other boxed run is lettering, the legend, or a heavy unticked boundary (runs 176 at 2081,3950, 177 at 1656,4567, 180 at 3426,4686 looked).
# Reader: area widened from 05-05's [334,1247,4252,6218] shifted to [342,1231,5900,6300]: the heavy ticked line round the Salzburg-Berchtesgaden pocket (x 4170-4600, y 5700-5900, ticks on its north side, hatched enemy boxes 198, 189, 465, 16?, 407 inside) lay east of the old area's x 4260 edge and south of the towns' 48N, and was not traced on either day (looked, --look 4300,5735 4500,5760; overlay crop 3700 5450 2250 850). Not on 05-05's sheet: that day's GeoJSON lacks it too (to the reviewer). Two unsure stubs left as found: the wedge's tip at Traunstein (4367,5540, ticks outward on both of its lines) and the blunt end of the hook at the south edge (3151,6227).
# Reader: no flip, no checked. The Inn-corridor stubs sit at 4586,5358 (run 122) and 4576,5374 (run 125) today and the tool finds ticks on both; their red ticks fall north, with the map's own on the north (the Allied side, open US box 13); nothing to turn (overlay crop 4540 5330 90 70 enlarged tenfold).
# Reader: the Schonberg chord of 05-05 (3426-3494,472-481) is no longer drawn: at 3434-3500,456-465 today the sheet shows only a thin grey road through the box with the armored symbol; the heavy line runs round the salient (left side to x 3440, right from x 3530), and no stretch of the trace stands there (--look 3434,460 3470,460 3500,455).
# Reader: sides agree with 05-05 for 58 of 60 towns; 14E 48N enemy -> own (the dropped box 155, above); 12E 52N own -> enemy (the ring sits under the Elbe line at Zerbst: run 72 (4019,2166) now decides, the same line's ticks fall on the right side, looked on overlay crop 3800 1980 450 300; the ring is 3980,2080 against 3976,2096 on 05-05). 12E 48N, 6E 52N and 7E 52N read own.
