  - {box: [1990, 4120, 2420, 4460], why: "the same boundary, a long diagonal run (85) from Frankfurt to near Fulda (1870-2907 x 3695-4522, middle 2384,4138), heavy line, no ticks; the front itself is some 400 px east of it at Fulda (the sheet's front from the Werra south to Meiningen)"}
