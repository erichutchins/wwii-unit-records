# 12ag-1945-04-08: the sheet as read on its title, and the hand decisions its trace needed (tools/trace_front.py;
# fronts/README.md). The towns are <map>-gcps.csv; the GeoJSON is generated. Boxes start as 04-07's (B13), moved as looked at.
item: ict21308
date: 1945-04-08
as_of: 081200 APR. 1945
report: "307"
title: "HQ 12th Army Group Situation Map, to accompany G-3 Report No. 307, situation as of 081200 Apr. 1945 (SECRET; signed C. T. Schmidt for A. Franklin Kibler, Brigadier General, G.S.C., A.C. of S., G-3), at top right"
read: the title on the sheet, 6 Nov 2026
