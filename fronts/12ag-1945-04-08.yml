area: [470, 2320, 760, 2950]   # traces past the towns' spread: the Ruhr pocket's west side along the Rhine, Duisburg to Koln (west of the 7E crossings)
# Boxes: 04-07's 25, each looked at on today's overlay (run with no excludes: 122 runs, 57 not front). The sheet is the same
# base printing, 24 px off 04-07's in x. The title/Auth/legend are lettered by hand, so moved a little; boundaries are heavy
# black runs with no ticks, and a run is left out by its middle, so each box now stands on the middle of today's run. The
# boxes of 04-07 whose boundary is thin black today (Ninth/First at Paderborn, First/Third round Kassel, Giessen, Frankfurt NE,
# Fulda, Twelfth/Sixth south of Frankfurt to Neunkirchen) catch no run: today's trace draws no stretch there, so they are dropped.
exclude:
  - {box: [400, 150, 1520, 480], why: "the Auth / Initials / Date box at top left (SECRET, Auth: CG Twelfth Army Group, C.T.S., Date: 8 APRIL 1945), heavy lettering and frame; one unsure run at 1458,294 (the 'p' of Group); same place as 04-07; no front near (checked on the crop). The 1st CDN Army sector list below it is not front either"}
