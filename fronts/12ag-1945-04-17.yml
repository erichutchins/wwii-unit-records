# Reviewed: 25 of 26 towns on 16 April's side. 7E 52N (Münster) reads enemy and is WRONG ("7E 52N           enemy     by run 50 own at 718,2451, run 48 own at 654,2417, run 53 own at 805,2440, run 54 enemy at 816,2455"): with the Ruhr pocket shrunk to its western part, the nearest runs are the ring's top at Essen, three own to one enemy; an artefact of the test, not a wrong stretch. The remaining Ruhr pocket (Duisburg-Essen-Wuppertal-Düsseldorf) traces as a closed ring ticked outward (crop 450,2150, read by the reviewer); the heavy Ruhr line east of Essen to Hagen and Arnsberg carries no ticks and is boxed, with the Hagen stubs 16 April kept. Harz, Köthen/Barby, Emmen and the Zeitz-Chemnitz salient ticked outward; the Elbe Salzwedel-Havelberg drawn. 97 stretches, about 1923 km, 0 unsure, no turns. 31 empty boxes dropped, 35 added on boundaries (each looked at), among them three Bad Kreuznach-Baumholder strokes the tool had counted as ticked.
