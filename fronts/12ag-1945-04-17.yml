# 12ag-1945-04-17: the sheet as read on its title (G-3 report 316, 171200 Apr 1945; catalogue 17 April 1945); B13, towns matched to 04-16 (26 of 26 agree, median 0.6 px; offset +8,-24 px).
# Reader: 04-16's area and boxes shifted by +8,-24; of its 46 boxes 15 kept (the Auth box, title, legend, which hold only lettering/legend 'ticks'; the Muenster, Lahn, Neuwied/Third-Fifteenth, Hanau, Celle, Ruhrort, Linz, Meiningen, Eltville and Oppenheim boundary boxes that still hold a run), 31 dropped as empty today; no box holds a ticked front stretch (the ticked runs in the three lettering boxes are letters, looked on crops 380,100 and 4700,80).
# Reader: an unboxed trace of 184 runs (check: 69 unsure); the untick heavy/thin boundary runs outside every box were boxed at their middle (looked on crops of every one): the Celle-Muenster boundary (runs 53, 61), Celle's NE spur (25), the Plauer See edge, the Fifteenth/Ninth boundary north of Ruhrort (81, 82), the Ruhr bank line from Essen to Hagen and beyond to Arnsberg (85-88, 94, 96, 100: looked at 1100,2420 and 1300,2440, no ticks, the pocket's north side is only the army boundary today), Kassel, Zeitz, Eder, Treysa, Giessen, Ahrweiler, Fulda, Lahn, Hanau-Meiningen-Bayreuth, Darmstadt-Worms, Saarbruecken, Speyer and Heilbronn-corner strokes. The ticked front round Celle stays traced.
# Reader: pockets, all ticked outward on the whole-sheet overlay: the Ruhr has shrunk to a ring west of Essen (Duisburg, Wuppertal, Duesseldorf), its north side open along the Ruhr; the Harz, Koethen/Barby, Emmen, the Zeitz-Altenburg-Chemnitz salient and the Elbe Salzwedel-Havelberg all drawn. Area: 04-16's box shifted, no widening needed (no ticked line runs past it). The first boxed trace made 102 stretches, 2 unsure (Celle's NE spur, the Heilbronn corner stub: boxed); then three more boundary strokes the tool had counted as ticked (Bad Kreuznach-Baumholder, runs 84, 85, 87) were boxed, found on the overlay sheet as thin blue lines.
# Reader: sides: 25 of 26 as 04-16 (04-16 run again for the comparison; its GeoJSON unchanged). 7E 52N own -> enemy: "7E 52N           enemy     by run 50 own at 718,2451, run 48 own at 654,2417, run 53 own at 805,2440, run 54 enemy at 816,2455" (04-16: "7E 52N           own (US)  by run 46 own at 886,2421, run 47 own at 783,2477, run 50 own at 585,2443, run 51 enemy at 1020,2430"). The town (Muenster, 823,1668) lies some 700 px north of the shrunken Ruhr ring, in US ground; its nearest runs are the ring top at Essen, three own and one enemy (the hook run 54 at Essen, whose end the town lies off), and today the Ruhr bank line east of Essen that was a ticked ring side on 04-16 is plain boundary (no ticks, looked), so there is no run on the ring top to carry it: an end-of-line artefact, not a stretch turned the wrong way. Length 1,923 km over 97 stretches (04-16: 1,931, 93).
