# Reader: title read 7 Nov 2026: 1200 hrs 27 November 1944, no report number; agrees with the catalogue (ict21176, 1944-11-27). Towns matched to 11-28 (offset -16, 0 px): 41 of 81 agree, median 2.0 px, 40 placed through the transform (Saint-Dié 60 px, Colmar 15, Épinal 13, Metz 13 ...). Front traced at dark 100 (the print is pale from Faulquemont through the Vosges: at the default 70 only 71 stretches and about 500 km, the Saar-Vosges reach missing; dark 80: 99 stretches, 715 km, reach still broken; dark 90: 102 stretches, 863 km, gaps at the Saverne salient and at 4720,5100-5200 in the Vosges; dark 100: 95 stretches, 959 km with the strays below, the whole ticked line from Faulquemont by the Saverne salient and the Rhine at Strasbourg and down through the Vosges past Saint-Dié to the foot); lengths are the GeoJSON's by a flat-earth sum. Final: 85 stretches (35 ticks, 39 line, 10 unsure), about 870 km (11-28: 962). Boxes, all earlier ones kept as caught (11-28's twelve shifted -16,0, four dropped, five moved to this sheet's lettering: legend y1 5600, Twelfth/Sixth x0 3400, First/Third x0 2940, Ninth/First 3350-3640,1950-2080, title box below the Walcheren arc), and five added at dark 100, each tested with and without, ticks stretches unchanged by each except the stamp lettering's: the Twelfth/Sixth boundary's heavy end beside the Marne-Rhine canal (4440-4580,4480-4700; 11 km), the stamp G5701s at the foot right (5900-6350,5150-5330; 14 km, one stray tick stretch of the lettering), the Seventh/First boundary's stub at the foot (4230-4420,5490-5570; 4 km), the Twelfth/Sixth boundary's north-east end (3968-4130,4822-4880; 27 km), and the First Canadian/Second British boundary's run from Den Bosch to the Maas (3270-3545,690-950; 32 km, thin heavy line with the railways' grey ticks, seen on --look 3300,850). No flip and no checks now: at dark 100 the Walcheren arc's red ticks hang south (the inside, the map's own) without the flip (overlay crop 1500,780), and flipping it turned its vote enemy and Ostend, Ypres enemy; the old flip (1630,885) is dropped. The three old checks (the Beveland hook 1751,869; the vertical north of Saarlautern 4164,3798 and 4162,3828) no longer match an unsure stretch (the GeoJSON is byte-identical with and without them) and are dropped. Still unsure, ten short bits, all left as found: 3560,700 and 3586,717 (the junction of the front and the boundary blob on the Maas), 2220,839 (a gap-bridge on the Hollandsch Diep line), 5216,4610 (Saverne salient's east corner), 4753,5016, 4726,5070, 4717,5132, 4682,5284 (Vosges front, pale), 4457,5499 and 4461,5591 (the front's end at the sheet's foot, beside the Seventh/First boundary). Sides: 81 of 81 as 11-26's (diff empty): Metz, Toul, Épinal, Saint-Dié, Strasbourg own; Haguenau, Colmar, Zweibrücken, Kaiserslautern, Landau, Trier enemy; Ostend, Ypres own with the arcs unflipped. The Beveland hook (1742,875) and the Tholen arc (2020,872) still vote enemy on Ypres/Amiens/Arras as the open-arc test's artefact; the majority is own.
# Reviewed (7 Nov 2026): held unfinished (the Saar-Vosges reach did not trace at the default cutoff); finished at dark 100. Whole-sheet overlay regenerated and looked at: one ticked line from the Scheldt arcs (ticks inside; the earlier Walcheren flip rightly dropped) down the Maas and the Westwall, round the Saverne salient to the Rhine at Strasbourg and down the Vosges to the sheet's foot; the ten unsure pieces lie on the line (the pale Vosges stretch, the Maas junction, the foot). 81 of 81 towns as 11-26; Strasbourg own.
