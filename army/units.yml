# What each unit was, in a line, in our words (guides/OPERATIONS-VIEWER.md 2.1): the designation in units.csv is the
# records', and with people's names kept out of the public records it is the only name there is, so a reader is told
# first what kind of thing the unit was and what it did. One sentence a reader without the Army's vocabulary can follow,
# from what units.csv's note, the stations and the READMEs already say; no person is named. Keyed by units.csv `unit`;
# tools/build_subjects.py reads it into records/subjects.json and fails on a unit without one.
