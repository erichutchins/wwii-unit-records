  zone: I
  lat_raw: 17-13N
  lon_raw: 118-18E
  translation: >-
    BANG fires all ten tubes at three ships at about 1510; Sarawak Maru is hit in the bow and Miri Maru under
    the bridge, and both reach Manila
  note: >-
    Secondary. Time "about 1510" is BANG's (sheet 1508-1509 I); position is the source's. Temporary repairs at
    Cavite until 24 July
- id: J04
  source: jacar:C08030032900
  page: p28
  ship: Kuri
  event: attacked_no_damage
  date: 1944-07-04
  time: '0515'
  zone: I
  lat_raw: 19-22N
  lon_raw: 115-43E
  original: 〃 〇五一五 N一九-二二 E一一五-四三 栗 我雷撃ヲ受ク被害ナシ 制圧中(?)
  translation: >-
    (4th) 0515, N 19°22′ E 115°43′, from Kuri: we are under torpedo attack, no damage; suppressing (the last
    word probably 制圧中)
  note: >-
    2nd China Expeditionary Fleet war diary, July 1944, enemy-submarine table (別図参照), read right to left; each
    position written vertically, N column then E column, in kanji numerals. Zone not stated; taken as I (Tokyo
    time), assumed. Kuri (栗) is a destroyer. The last word is cramped; read as 制圧中 ('suppressing', i.e.
    depth-charging), probable. Nine minutes after BANG's Attack 3 (0506 I) and about 17 nm southeast of it
    (bearing 127°); SEAHORSE logged depth charges eleven minutes after BANG fired. Positions in this table: the
    left sub-column (under the printed N) holds the longitude, 1xx-xx; the right the latitude
- id: J05
  source: jacar:C08030032900
  page: p27
  ship: Kuri; Hatsukari
  convoy: No. 91
  event: status
  date: 1944-07-04
  zone: I
  original: 四日東沙島南西海面ニ於テ第九一船団ハ二隻乃至三隻ト推定サル敵潜ノ執拗ナル攻撃ヲ受ケ護衛艦栗初雁ハ之ニ対シ適確ナル爆雷攻撃ヲ加ヘ重油流出ヲ認メタルモ効果ヲ確認シ得ズ
  translation: >-
    On the 4th, in the waters southwest of Pratas Island, the No. 91 convoy came under persistent attack by
    enemy submarines estimated at two or three; the escorts Kuri and Hatsukari made accurate depth-charge
    attacks on them and saw oil come up, but could not confirm the result
  note: >-
    2nd China Expeditionary Fleet war diary, July 1944, narrative (一) 敵情, (ロ) 敵潜ノ動静. Names the convoy of J04 and
    of SEAHORSE patrol 5 J01-J02 (第九一船団). 乃至 read from a cramped hand. The estimate of two or three is the
    diary's. From the US side, SEAHORSE and BANG attacked a convoy there that day; that is not corroboration of
    the diary's count
- id: J06
  source: jacar:C08030275400
  page: p04
  event: sub_sighted
  date: 1944-06-14
  zone: I
  original: 十四 一?〇〇 〃 〃 二?度三〇分 一四四度三〇分 其ノ他 敵潜ノ存在確実
  translation: '14th, 1?00, N 2?°30′ E 144°30′: other (type of report); presence of an enemy submarine certain'
  note: >-
    Chichijima Area Special Base Force war diary, June 1944, 一 経過 (一) 敵情 (二) 近海ニ於ケル敵潜水艦ノ出没状況 (enemy
    submarines in nearby waters), a table of date, time, position (北緯 right, 東経 left), kind and remarks. The
    hour's second digit is a cursive stroke read as 六 or 七 and left unread (1600 or 1700); the latitude's
    second digit is 二 or 三. The 14th has two other rows: 1120, N 23°40′ E 142°30′, 測定 精度B (a direction-finding
    fix, accuracy B), and 2259, about N 29° E 141°, 発見 (sighted), 天草 and 能美 suppressing. The table has no
    torpedo attack on the 14th: its 雷撃 rows in June are Akiyama Maru damaged (7th) and Matsukaze sunk (9th).
    Zone not stated; taken as I (Tokyo), assumed. Time and position left out of the fields (each has a digit unread); they are in `original`. The signal the row was entered from (J07) reads 1200 and 22-30N
- id: J07
  source: jacar:C08030275500
  page: p18
  event: sub_sighted
  date: 1944-06-14
  time: '1200'
  zone: I
  lat_raw: 22-30N
  lon_raw: 144-30E
  original: 大海機密第一四一七三〇番電 十四日一二〇〇 二二─三〇N 一四四─三〇E 其ノ他 敵潜ノ存在確実
  translation: >-
    Navy GHQ signal 141730: 14th, 1200, 22-30N 144-30E, other (type of report): presence of an enemy submarine
    certain
  note: >-
    Chichijima Area Special Base Force war diary, June 1944, part 2 (its signal log, 令達報告等): a Navy GHQ
    broadcast (大海, 一般) sent at 1730 and logged at 1744 on the 14th (read at 400 dpi). It is the signal J06's table
    row was entered from, and its figures are clear where the table's are not: 1200, not 1600 or 1700, and 22-30N.
    So the report is from four hours before BANG fired (1601 I) and about 80 nm east of her attack position: not
    her attack. "Other" is not explained; it is not a torpedoing. The log for the 14th and 15th (pp17-20) has no
    tanker torpedoed and no survivors landed: its other submarine reports are direction-finding fixes from the
    Owada station and an attack on the Miho Maru convoy near 29N 141E. Zone not stated; taken as I, assumed
