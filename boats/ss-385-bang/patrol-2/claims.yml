# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/SCHEMA.md (A patrol's claims).
# Searched for Attack 1 (14 June 1944, a lone tanker, 23-15N 143-15.6E): the Navy's June 1944 summary (C16120659700),
# no entry; the Chichijima Area Special Base Force war diary, June 1944 (C08030275400, pp. 03-05), no torpedo attack
# on the 14th (J06 is its nearest submarine report). Not yet read: the base force's 15 June-5 August diary and
# action report (C08030274600), the Yokosuka Guard Squadron (C08030363100) and the Central Pacific commands. 5 Nov 2026.
# 11 Nov 2026: the base force's June signal log (C08030275500 pp17-20, the 14th and 15th) has no tanker torpedoed and
# no survivors; its GHQ broadcast for the 14th (J07) puts J06's submarine report at 1200 I and 22-30N, four hours
# before Attack 1 and about 80 nm east, so J06 is no longer paired (context only). The Yokosuka Guard Squadron's June
# diary (C08030363300 pp14-15, its table of submarine appearances) has no row on the 14th; its waters are the Izu
# islands, far north. Attack 1 stays without a Japanese record. BANG claimed damage to an empty tanker (one hit, the
# target settled by the stern and put out boats); none of these records has her.
- attack: Attack 2
  record: J01
  relation: hit
  note: >-
    Oilers Miri Maru and Sarawak Maru of HI-67 (Moji to Singapore via Manila), both minor damage; both reached
    Manila. BANG's sheets claimed 2(a) a large engine-aft freighter or tanker sunk (fits Sarawak Maru, hit in
    the bow), 2(b) a large passenger freighter sunk with a hole under the bridge (fits Miri Maru, hit under the
    bridge), and 2(c) a freighter probably sunk (no Japanese record of a third ship hit). FRUPAC relayed the
    claim as 2 AK sunk, 1 AK probably sunk. JANAC, which lists losses only, credits BANG with nothing between
    4 May and 9 September 1944 (janac:6/p3). Both oilers were lost later, to other agents (below)
  janac:
    - {ship: Mirii Maru, date: 1945-01-15, type: Tanker, tons: "10,564", lat_raw: 22-45N, lon_raw: 120-15E,
       agent: Navy Carrier-Based Aircraft, probable: false, ref: janac:4/p81,
       note: "Miri Maru, printed \"Mirii\"; lost seven months after this attack, not by it"}
    - {ship: Sarawak Maru, date: 1945-03-19, type: Tanker, tons: "5,135", lat_raw: 1-20N, lon_raw: 104-34E,
       agent: Army Mine, probable: false, ref: janac:4/p85, note: "lost nine months after this attack, not by it"}
- attack: Attack 3
  record: J04
  relation: miss
  note: >-
    The destroyer Kuri reported being under torpedo attack with no damage at 0515 I, nine minutes after BANG
    fired (0506 I), at a position about 17 nm from BANG's. SEAHORSE had attacked the same convoy four hours
    earlier (0054 I) and was not firing then. BANG's sheet claimed damage to 1 AK; the Japanese record has no
    ship hit at this time
