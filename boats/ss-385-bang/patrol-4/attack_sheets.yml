# The attack data sheets' words, as typed. Hand-edited; the numbers are in attacks.csv.
# Each sheet is two pages: `page` (time, position, target and own-ship data, type attack) and `table_page`
# (one column per torpedo). attacks.csv cites `page`, the attack's row in positions.csv.
# attacks.csv units, as typed on these sheets: courses degrees (T), speeds kts, ranges yds, drafts ft (typed
# "21 Feet"); own_depth typed "Surface" for every attack. The sheets type no zone letter: zone K is positions.csv's
# (King, per the narrative). Times as typed, some with seconds ("0032-50" = 00h 32m 50s). depth_set as typed under
# the heading "Depth Set (ft.)" (6, no foot mark); power typed "-" in every column; firing_int as typed (seconds).
# track as typed with its side (80S). `spread` here holds the sheet's "Type Spread" row, typed per torpedo as the
# offset from the point of aim (3L, 0, 3R); the type attack's words are below. Where the sheet types the hits once
# across the columns ("2 Hits") and not per torpedo, `hit` is left blank in attacks.csv and the words are `hits`
# here. A draft typed in feet and inches (6'9") does not fit a CSV cell: blank there, as typed in target_line here.
# target_line and own_ship are the sheet's lines as typed.

- attack: Attack 1
  type_attack: >-
    Night surface. Used radar ranges and TBT bearings. Fired three torpedoes spread 3-0-3 from aft forward by means
    of the offset knob on the TDC.
  description: >-
    Convoy consisting of one large loaded AK, seen at 1800 yards with overcast half moon, much larger than any
    other ship in convoy, an outstanding pip throughout the approach; five medium AK's; and three or four escorts,
    one similar to the ITSUKUSHIMA (CM-4) class minelayer, ONI 41-42, and the others probably CHIDORI class.
    Fired at one medium AK.
  sunk: One medium AK. EU.
  determined_by: Saw and heard two hits. Saw target disappear visually and from radar screen.
  target_line: >-
    Target Draft: 21 Feet. Course: 115° Speed: ? Range: 2350
  own_ship: >-
    Speed: 6.0 Course: 025° Depth: Surface Angle: 0°
  hits: 2 Hits
  sea: Choppy; State 2-3
  overhaul: Submarine Base, Midway.
  remarks: Miss due to spread used.
  time: '0032'
  position: 24°23'5N 122°41'E
  page: rg367-74802868/p12
  table_page: rg367-74802868/p13
  note: >-
    The target's speed is a blot on the scan (p12; read at zoom): unreadable, `?` in attacks.csv. The sheet types
    the hits once across the three columns ("2 Hits") and the remarks say one torpedo missed; which tube missed is
    not typed, so `hit` is blank for each torpedo.

