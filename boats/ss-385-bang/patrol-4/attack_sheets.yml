- attack: Attack 3
  type_attack: >-
    Night surface. Used radar ranges and TBT bearings. Fired four torpedoes at large AK with medium AK
    overlapping, spread 3-1-1-3 from aft forward by means of the offset knob on the TDC.
  description: >-
    Same convoy as Attack No. 1. Fired at same large AK as Attack No. 2, overlapping with one medium AK.
  damaged_or_probably_sunk: One medium AK. EU.
  determined_by: Saw and heard one hit.
  target_line: >-
    Target Draft: 28 Feet / 21 Feet (typed one above the other) Course: 115° Speed: 7 Range: 2200 / 3100 (typed
    one above the other)
  own_ship: >-
    Speed: 12 Course: 200° Depth: Surface Angle: 0°
  sea: Choppy; State 2-3
  overhaul: Submarine Base, Midway.
  remarks: >-
    Misses due to target sinking before torpedoes reached track. Hit was in an overlapping target.
  time: 0034-50
  position: 24°23'5N 122°41'E
  page: rg367-74802868/p16
  table_page: rg367-74802868/p17
  note: >-
    Two drafts and two ranges are typed, one above the other (p16): attacks.csv gives the upper pair (28 ft,
    2200 yds), taken as the large AK the torpedoes were fired at; the 21 ft, 3100 yds pair is taken as the
    overlapping medium AK (the sheet does not label them). Time typed 0034-50; positions.csv has the minute, 0034.
    The typed tracks (85S, 88S, 91S, 93S) are 14° less than own course 200 + gyro + 180 - target course 115 gives
    (99S, 102S, 105S, 107S), the same for all four torpedoes; re-read at zoom (p16, p17) and kept as typed. The
    sheet's own course or target course does not match the fire-control solution its tracks and gyros came from
    (an own course near 186° would fit).

