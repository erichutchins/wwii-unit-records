# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/README.md (A patrol's claims).
# Attacks 4 and 5 (0147-0148 K, six torpedoes, all missed) have no entry: W-15, the only TAKA-206 escort whose report
# has been found (jacar:C08030607900), was astern rescuing Hozan Maru's crew until 0120 I and records nothing between
# 0120 and the depth charges heard at 0450 I (p42). Amakusa Maru's and Sakae Maru's own sheets were found on 11 Nov
# 2026 in the requisitioned-ship movement tables (徴傭船舶行動概見表 甲 第五回: J10, J11), after the Navy's November
# summary (J09, Hozan Maru only), the designated-ship movement tables series 4 and 5 (indexes jacar:C08050101600,
# C08050103900) and a search for Manazuru's report had none. Still missing: the 4th Escort Unit's November 1944 diary
# (its JACAR series C08030143700-C08030144200 jumps from September to December).
- attack: Attack 1
  record: J03
  relation: probable
  note: >-
    BANG fired at one medium AK at 2332 I from 2350 yds and saw it disappear; a ship was sunk at 2337 I 3.5 nm
    away (J03) and Hozan Maru was seen torpedoed at 2339 I (J02). The US Navy chronology gives Hozan Maru to
    REDFISH, and so does JANAC, as probable ("Submarine*"; janac:4/p76). REDFISH's report settles it for BANG: her
    first attack was at 0104 K (0004 I), 25 minutes after Hozan Maru was seen torpedoed, and W-15 named the ship
    sunk at 2337 I as Hozan Maru (J07). Attacks 1-3 were fired within three minutes; which of them hit is open
- attack: Attack 1
  record: J05
  relation: probable
  note: >-
    Of TAKA-206's six ships, three were sunk (Hozan, Amakusa, Sakae Maru) and three reached Funauki (J04). BANG
    claimed four sunk and one damaged in seven attacks; the postwar credit is two (Sakae, Amakusa; janac:6/p3), both
    marked "Submarine*", "*Probable Agent", as is Hozan Maru, credited to REDFISH (janac:4/p76)
- attack: Attack 1
  record: J07
  relation: probable
  note: >-
    The ship sunk at 2337 I (J03) was No. 2 ship Hozan Maru (J07). BANG's Attacks 1-3 (0032-0035 K = 2332-2335 I)
    are the only attacks on TAKA-206 in the minutes before; SHAD's had been an hour earlier and missed, REDFISH's
    first came at 0004 I. Probable rather than hit only because three of BANG's attacks share the window
- attack: Attack 1
  record: J09
  relation: probable
  note: >-
    The Navy's November summary has Hozan Maru sunk east of Formosa at 2337 I, five minutes after Attack 1 (2332 I),
    the same time as Manazuru's signal (J03), which it repeats; it adds no position. Probable for the same reason as
    J07: Attacks 1-3 share the window
- attack: Attack 2
  record: J03
  relation: possible
  note: >-
    BANG claimed a large AK sunk ("2 Hits") at 0032-50 K, within a minute of Attack 1. W-15's signals name one ship
    sunk in those minutes, Hozan Maru (J03, J07); Amakusa Maru's own sheet adds a second (J10). Attacks 1, 2 and 3
    all fit Hozan Maru's time
- attack: Attack 3
  record: J03
  relation: possible
  note: >-
    BANG claimed a medium AK damaged or probably sunk at 0034-50 K (one observed hit). Same window as Attacks 1-2;
    one ship sunk (Hozan Maru, J07)
- attack: Attack 2
  record: J04
  relation: possible
  note: >-
    By 1655 I on the 23rd Sakae Maru was missing and Amakusa Maru unnamed (J04). Their own sheets, found later, put
    Amakusa Maru's loss on the 22nd by Attacks 1-3 (J10) and Sakae Maru's on the 24th, 10-15 nm north-west of the
    night's attacks (J11); the postwar credit gives both to BANG (janac:6/p3), "probable agent"
- attack: Attack 6
  record: J04
  relation: possible
  note: >-
    BANG claimed a medium AK sunk at 0150-40 K (0050 I; "3 Hits"), seven minutes after REDFISH's Attack 3 hit
    (0143 K) in the same part of the convoy. Amakusa Maru's sheet puts her loss on the 22nd (J10), so not this
    attack; Sakae Maru's sheet has the 24th (J11)
- attack: Attack 7
  record: J04
  relation: no_loss
  note: >-
    BANG claimed a minesweeper sunk at 0314 K (0214 I). All four escorts were afloat that afternoon: Manazuru sent
    the 1655 I order (J04) to W-15, No. 16 Shonan Maru and Seki Maru (p47). Two hits were claimed; if they struck
    anything it was a merchant ship (Sakae Maru was missing, J04), which the record does not say
- attack: Attack 2
  record: J10
  relation: probable
  note: >-
    Amakusa Maru's own sheet has her torpedoed and sunk on the 22nd at 24-20N 122-40E (J10), 3.5 nm from Attacks 1-3
    (24-23.5N 122-41E, 2332-2335 I, the last minutes of the 22nd in Japanese time). With Hozan Maru (2337 I, J03),
    two ships went down in that window, and BANG claimed two sunk in it (Attack 1, a medium AK seen to disappear;
    Attack 2, a large AK, two hits). Which attack sank which ship is open. Probable, not hit: the sheet gives no
    time, and REDFISH's Attack 1 (0004 I on the 23rd, 24-28N 122-43E) is the next nearest
- attack: Attack 6
  record: J11
  relation: possible
  note: >-
    Sakae Maru's own sheet has her torpedoed and sunk on the 24th at 24-34N 122-3?E (J11). No attack in the kit
    falls on the 24th; BANG's Attack 6 (0050 I on the 23rd, 24-24N 122-45E, "3 Hits", a medium AK claimed sunk) and
    REDFISH's Attack 3 (0043 I, 24-27N 122-47E, one hit, seen to sink) are the claimed sinkings of that night not
    accounted for by Hozan and Amakusa Maru. Possible only: the sheet's date and place fit neither
