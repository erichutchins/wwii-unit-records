  original: 二三三七 ✓鳳山丸（C 総?2345ﾄ）台湾東方 ｜ 潜∠ 沈没
  translation: >-
    2337: Hozan Maru (type C, ?2,345 tons), east of Formosa | (Result) enemy submarine's torpedo, sunk
  note: >-
    The Navy's November 1944 day-by-day summary (escort and anti-submarine, 大東亜戦争経過概要), 22nd; the result is
    bracketed with the entry above it (1940, Dowa Maru, off Shinnanshoto). One character before the tonnage is not
    read (?). It compiles signals and gives the same time as Manazuru's 0020 signal (J03), so it counts once with it.
    It is the only TAKA-206 loss in the summary: neither the 22nd nor the 23rd names Amakusa Maru or Sakae Maru. The
    tonnage, 2,345, is the figure W-15's convoy table (p33) sets against its No. 4 ship
- id: J10
  source: jacar:C08050106900
  page: p17
  ship: Amakusa Maru
  convoy: TAKA-206
  event: sank
  date: 1944-11-22
  zone: I
  lat_raw: 24-20N
  lon_raw: 122-40E
  original: 一九、一一、二二 北緯二四度二〇分東経一二二度四〇分ノ地点ニ於テ敵潜ノ雷撃ヲ受ケ沈没
  translation: >-
    22 Nov 1944: torpedoed by an enemy submarine and sunk at N 24°20′ E 122°40′
  note: >-
    Amakusa Maru's own sheet in the requisitioned-ship movement tables (大東亜戦争徴傭船舶行動概見表 甲 第五回, ア～オ
    part (4); the series' ア index, jacar:C08050106600 p02, lists her). Her sheet runs from 29 February to 22 November
    1944 (header, p14; checked on the image), ship number 一〇三二三, operated by the 船舶運営会; the tonnage is under
    a stamp (四 and 五 read). Her last row (p17) sails from Keelung on the 22nd with no arrival, as TAKA-206 did. The
    remark gives the date but no time. The minutes are small figures: the latitude's read 二〇 (三〇 is possible), the
    longitude's 四〇. The 22nd in Japanese time puts her loss before midnight I, so in BANG's Attacks 1-3 (2332-2335 I
    at 24-23.5N 122-41E, 3.5 nm off), with Hozan Maru (2337 I at 24-21N 122-38E, J03); REDFISH's first attack was at
    0004 I on the 23rd, SHAD's at 2238 I missed. A log's date can be a day out, so probable rather than hit
- id: J11
  source: jacar:C08050033500
  page: p32
  ship: Sakae Maru
  convoy: TAKA-206
  event: sank
  date: 1944-11-24
  zone: I
  lat_raw: 24-34N
  lon_raw: 122-3?E
  original: 一九、一一、二四、北緯二四度三四分、東経一二二度三?分ノ地点ニ於テ敵潜ノ雷撃ヲ受ケ沈没
  translation: >-
    24 Nov 1944: torpedoed by an enemy submarine and sunk at N 24°34′ E 122°3?′
  note: >-
    Sakae Maru's (榮丸) own sheet in the same tables (第五回の二, サ part (3); the サ index, jacar:C08050033300 p02,
    lists her). Header (p31): 9 June to 24 November 1944, ship number 二八五五四, 2,878 tons (二?七八, the second figure
    under a stamp; W-15's table has 二八七八), 船舶運営会. Her last row (p32) sails from Keelung; the row before it
    has her lying at Keelung (基隆在泊), and the one before records aircraft engaged on 12 October, one shot down
    and the rest driven off (敵機ト交戦一機ヲ撃墜他ヲ撃退). Both the header and the
    remark give the 24th (checked on the image); the longitude's second minute figure is not read. No submarine in
    the kit attacked on the 24th: BANG's, REDFISH's and SHAD's last attacks on TAKA-206 were on the 23rd, 10-15 nm
    south-east of this position, and W-15 was searching for her at 1655 I on the 23rd (J04). Either the date is
    when her loss was reckoned (a straggler last seen in the night), or she was hit on the 23rd and sank later, or
    sunk on the 24th by a boat not in the kit. The sheet does not say which
