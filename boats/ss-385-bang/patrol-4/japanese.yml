    二三四六 戦斗爆雷戦 第一回爆雷攻撃 深度三〇米（使用爆雷数三個）… 〇〇〇三 探信儀右四〇度六〇〇米潜水艦ラシキモノ探知
    〇〇〇五 第二回爆雷攻撃深度?〇米（使用爆雷数二個） 〇〇〇九 原速 … 効果検討 続イテ探知掃蕩 〇〇三〇 遭難者発見
  translation: >-
    2346: depth-charge action, first depth-charge attack, depth 30 m (three charges) … 0003 (23rd): sonar,
    something like a submarine at 40° to starboard, 600 m. 0005: second depth-charge attack, depth ?0 m (two
    charges). 0009: standard speed … assessing the result, continuing to search and sweep. 0030: survivors sighted
  note: >-
    W-15's log of the action, after Hozan Maru was torpedoed (J02). 2346 I = 0046 K, 0003-0005 I = 0103-0105 K.
    W-15 stayed behind to hunt and rescue (49 rescued by 0105 I, p41) and rejoined the convoy at 0120 I, so its
    log records nothing of BANG's later attacks. BANG was on the surface throughout; the contact was not BANG.
    One depth figure is unclear (?)
