  original: 一、大建丸三仁丸映海丸ハ船浮ニ避泊セリ 二、各艇ハ敵潜水艦掃蕩撃滅人命救助並ニ栄丸捜索護衛ニ任ゼヨ
  translation: >-
    (1) Taiken, Sannin and Eikai Maru have sheltered at Funauki. (2) All escorts: hunt and destroy the enemy
    submarine, rescue survivors, and search for and escort Sakae Maru
  note: >-
    Same signal log, 23rd 1655. Three of the six ships survived; Amakusa Maru is not named and Sakae Maru was
    still missing. Search area 30 nm around N 24°20′
