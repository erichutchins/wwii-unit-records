  original: 〇?三〇 N24°19′ E123°19′ニ於テ船浮ニ避泊セントスル関丸護衛ノ三仁丸ヲ認メ直ニ他ノ船団捜索ノタメ反転ス
  translation: >-
    At 0?30, at N 24°19′ E 123°19′, sighted Sannin Maru, escorted by Seki Maru, making for shelter at Funauki;
