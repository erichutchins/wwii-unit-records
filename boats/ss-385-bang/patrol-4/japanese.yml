  event: rescue
  date: 1944-11-23
  time: '0036'
  zone: I
  original: 遭難船ハ二番船ノ鳳山丸
  translation: The ship in distress is No. 2 ship, Hozan Maru
  note: >-
    Same report, signal log: W-15's captain to Manazuru, 23rd 0036 I (W-15 had asked at 0025 whether it might
    lower a cutter to rescue survivors, p49). Ties the ship sunk at 2337 I (J03) to Hozan Maru. A later signal
    (0215 I) gives W-15's count of those rescued from Hozan Maru, her master among them (p50)
