  zone: I
  lat_raw: 24-22N
  lon_raw: 122-31E
  original: 二二四〇 北緯二四度二二分東経一二二度三一分ニ於テ一番艦真鶴信号拳銃赤色一個（浮上潜水艦）ヲ認ム 配置ニ就ケ 戦速
  translation: >-
    2240: at N 24°22′ E 122°31′, No. 1 ship Manazuru fires one red flare (surfaced submarine); W-15 goes to
    battle stations, battle speed
  note: >-
    Minesweeper W-15's battle report on convoy TAKA-206 (Keelung for Naha, 22 Nov; escorts Manazuru, Seki Maru,
    No. 16 Shonan Maru, W-15; ships Taiken, Hozan, Sannin, Amakusa, Eikai and Sakae Maru, p33). 戦闘経過 (log of the
    action). 2240 I = 2340 K: two minutes after SHAD fired three torpedoes at a CHIDORI-type torpedo boat (Manazuru
    was one) at 2338 K from 24-16N 122-28E and dived at 2340 K; W-15 heard depth charges at 2245 I (2345 K), when
    SHAD's report has ten close charges from 2343 K (SHAD's japanese.yml). Not BANG, 52 minutes before her first attack
