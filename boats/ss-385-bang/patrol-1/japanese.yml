  time: '1925'
  zone: I
  original: 電令作第一七一號 明二十八日日施哨戒ヲ兼ネ對潜對空警戒機ヲ派出スベシ … 二 三〇基地 タモ一八船團、パタ〇九船團、ユタ〇五船團、臨時船團、タマ一七船團
  translation: >-
    Operation order 171: tomorrow, the 28th, send out aircraft for anti-submarine and anti-aircraft cover,
    combined with the daily patrol … 2. 30th Base: convoys TAMO-18, PATA-09, YUTA-05, a temporary convoy,
    TAMA-17
  note: >-
    Takao Guard District war diary, radio log; from the district commander to the air units and the army air
    forces. Tamsui base and the army air units were given other convoys, so TAMA-17's cover on its first day was
