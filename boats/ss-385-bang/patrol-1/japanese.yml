- id: J08
  source: jacar:C08050103200
  page: p25
  ship: Nittatsu Maru
  convoy: TAMA-17
  event: torpedoed
  date: 1944-04-30
  time: 0419
  zone: I
  lat_raw: 19-06N
  lon_raw: 119-10E
  original: 仝〇四時一九分我右舷約二〇〇米附近ニ敵魚雷ヲ発見シ面舵ヲ命シタレドモ … 右舷第二番艙後方ニ命中、続イテ約十秒後船橋前方附近ニ命中シ船体ハ約二分後ニ直立シ其ノ後三分ニテ沈没セリ
  translation: >-
    At 0419 a torpedo sighted about 200 m to starboard; right rudder ordered, but it hit aft of No. 2 hold,
    starboard; about 10 s later a second hit near the front of the bridge. The hull stood vertical about 2
    minutes later and sank 3 minutes after that
  note: >-
    Position is in the log's location column beside this entry (北緯一九度〇六分 東経一一九度一〇分). Torpedo sighted by Third
    Officer Minagawa Shirō. combinedfleet.com gives 0419 and 19-11N 119-10E (BANG's attack-sheet position)
