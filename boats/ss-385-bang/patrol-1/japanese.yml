  zone: I
  original: 三〇日〇三時〇〇分敵魚雷五本ヲ受ケ内三本ハ本船船底附近ニテ炸裂シタレドモ被害ナシ
  translation: >-
    At 0300 on the 30th, five enemy torpedoes; three exploded near the ship's bottom but did no damage
