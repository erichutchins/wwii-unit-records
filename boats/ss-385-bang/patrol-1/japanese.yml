  date: 1944-04-28
  zone: I
  original: 電令作第一七二號 明二十九日日施哨戒ヲ兼ネ對潜對空警戒機ヲ派出スベシ … 二 三〇基地 ヒ五八船團、タマ一七船團、タマ一七Ａ船團、タ六〇四船團、臨時船團、間宮船團、臨時濟南丸船團及ヒ五九船團
  translation: >-
    Operation order 172: tomorrow, the 29th, send out aircraft for anti-submarine and anti-aircraft cover … 2.
    30th Base: convoys HI-58, TAMA-17, TAMA-17A, TA-604, a temporary convoy, the Mamiya convoy, the temporary
    Sainan Maru convoy and HI-59
  note: >-
    Same radio log; no time written. A separate TAMA-17A convoy was at sea on the 29th: it may account for ships
    other lists put in TAMA-17 (Yashima Maru, the FRUPAC note F01) — a lead, not established. The 30th Base's 29
    April report (J09) says rain prevented the convoy cover
- id: J19
  source: jacar:C08030140700
  page: p28
  ship: Kinrei Maru; Shoryu Maru; Taiyoku Maru; Toyohi Maru; Daibu Maru
  convoy: TE-04
  event: sank
  date: 1944-05-04
  zone: I
  original: 4日 22?9 N2?-46 E118-?4 沈没 金嶺丸 昌竜丸 大翼丸 豊日丸 大武丸 (基隆)
  translation: '4th, 22?9, N 2?°46′ E 118°?4′: sunk: Kinrei, Shoryu, Taiyoku, Toyohi and Daibu Maru; (Keelung)'
  note: >-
    1st Surface Escort Division diary, May 1944, chart 別表第三 (Moji–Yulin), beside two sinking marks on the テ04
    track. The date, time and position are faint pencil: the day may be 4 and the time 22x9, read with low
    confidence; no attack on the night of 3–4 May was at 22xx I, so one or more of these is probably misread (or
    a summary). Not paired. Survivors drawn into (基隆) Keelung. Time and position left out of the columns because
    digits are illegible; they are in 'original' as read
- id: J20
  source: jacar:C08050105400
  page: p10
  ship: Taiyoku Maru
  convoy: TE-04
  event: sank
  date: 1944-05-04
  time: '0237'
  zone: I
  lat_raw: 20-56N
  lon_raw: 118-04E
  original: >-
    一九.四.三〇 楡林 積荷八〇〇〇噸 船客六名 英霊四柱 基隆向航行中五月四日二時三十七分東経一一八度〇四分(p11)北緯二〇度五六分ニ於テ敵潜ノ雷撃ヲ受ケ沈没
  translation: >-
    30 April 1944, [from] Yulin, loaded 8,000 t, 6 passengers, the remains of four war dead. While bound for
    Keelung, at 0237 on 4 May, at E 118°04′ N 20°56′, torpedoed by an enemy submarine and sank
  note: >-
    Taiyoku Maru's (大翼丸, combinedfleet's Daiyoku Maru) own movement log (designated-ship movement tables, 5th
    series, タ–ワ part 2; header p9). The entry runs from the foot of p10 to the top of p11. Zone not written; taken
    as I like the convoys' other logs. The same loss as the secondary source's J15 ("about 0300", with Shoryu
    Maru) and the May loss list's 大翼丸 (J11): one loss, counted once. Shoryu Maru's own log (TINOSA's Patrol 6 J04)
    puts her sinking at 0353 I, after TINOSA's Attack 3, so J15's pairing of the two at "about 0300" doesn't hold
