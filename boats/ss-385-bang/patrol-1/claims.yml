# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/README.md (A patrol's claims).
- attack: Attack 1
  record: J03
  relation: hit
  note: >-
    Takegawa Maru (1,930 GRT), TAMA-17; sank 2240 I (J04). BANG was then depth-charged by Harukaze. JANAC credits
    her to BANG, not marked probable: 29 April, 1,930 tons, 19-26N 118-45E (janac:4/p58; janac:6/p3)
- attack: Attack 2
  record: J07
  relation: miss
  note: >-
    BANG fired 6, all logged as misses; Nittatsu Maru felt 5 torpedoes, 3 exploding near her bottom, no damage.
    Attacks 2 and 3 were 3 minutes apart
- attack: Attack 3
  record: J07
  relation: miss
  note: BANG fired 4, all logged as misses
- attack: Attack 4
  record: J08
  relation: hit
  note: >-
    Nittatsu Maru (2,859 GRT), TAMA-17; sank about 5 minutes after the hits. BANG had identified her as a
    10,400-ton AP. JANAC credits her to BANG, not marked probable, as cargo: 30 April, 2,859 tons, 19-11N 119-10E
    (janac:4/p58; janac:6/p3)
- attack: Attack 5
  record: J12
  relation: possible
  note: >-
    JANAC credits BANG with Kinrei Maru (janac:6/p3), but marks the agent "Submarine*", "*Probable Agent"
    (janac:4/p59): a probable credit, not a certain one. The secondary source's 0106 I for her sinking is the
    minute PARCHE fired her Attack 2. BANG fired at 0232 I, after PARCHE and TINOSA had scattered the convoy (her own words);
    the losses timed about 0300 (J15) are the nearer match. Taiyoku Maru's own log (J20) now times a loss at 0237
    I, five minutes after this attack, which leaves Kinrei Maru to PARCHE's attacks at 0106-0127 I (inferred)
- attack: Attack 5
  record: J15
  relation: possible
  note: >-
    BANG's Attack 5 (0232 I) is 28 minutes before the secondary source's "about 0300" for Shoryu and Daiyoku
    Marus, which it credits to PARCHE. So does JANAC: Shoryu Maru (6,475 tons) not marked probable, Taiyoku
    (Daiyoku) Maru (5,244 tons) "Submarine*", probable; both 4 May at 20-48N 118-03E (janac:4/p59; janac:6/p27)
    Superseded by J20 for Taiyoku Maru: J15 and J20 describe the same loss and count once; the ships' own logs
    put Taiyoku at 0237 I and Shoryu at 0353 I (TINOSA's Patrol 6 J04), not together at "about 0300"
- attack: Attack 5
  record: J20
  relation: probable
  note: >-
    Taiyoku Maru's own log: torpedoed and sank at 0237 I at 20-56N 118-04E, five minutes after BANG fired at 0232 I
    (0332 K) and about 5 nm from BANG's attack position (20-58N 117-59E). No other boat was firing then: PARCHE's
    last attack was at 0127 I and TINOSA was deep under depth charges until 0234 I (0134 H), firing next at 0349 I.
    Against: JANAC credits Taiyoku (Daiyoku) Maru to PARCHE, as probable ("Submarine*"; janac:4/p59; janac:6/p27),
    and the secondary source (J15) agrees with JANAC. That credit is why this is probable, not hit. J11, J15 and this
    entry are one loss, counted once
