# Notes for BANG's dive profile (site/dives.html). Hand-edited; tools/build_dives.py reads them.

# Background shown with particular log entries in depths.csv (matched on patrol, local date, event)
context:
  - patrol: 6
    date: 1945-05-02
    event: quake
    text: >-
      No earthquake on 1-2 May 1945 appears in the USGS/ISC-GEM or ISC bulletins (searched within
      1,500 km). Those catalogues are only reliable for magnitude 6+ quakes in 1945, and Taiwan's own
      seismograph network nearly stopped recording from March 1945 to January 1946, so a moderate quake
      off eastern Taiwan could easily go unrecorded. The nearest catalogued events are an M6.1 west of
      Yonaguni on 10 April 1945 and an M6.5 off Hualien on 1 August 1945.
    sources: [usgs-comcat, isc-gem, isc-bulletin, taiwan-cwa]

