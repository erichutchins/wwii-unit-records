  translation: >-
    20th, noon 25-01N 122-21E: 06?0 sailed escorting TAKA-909 for Naha. / 21st, noon 24-51.5N 124-45E: 1530
    anchored at Miyako; 2?00 sailed escorting TAKA-909 for Naha. / 23rd: 0830 action stations, something like a
    periscope sighted; 0840 the periscope was floating wreckage; 1350 the convoy dispersed; 1520 entered Naha
  note: >-
    W-15's daily pages for the 20th-23rd (p49-p50; the noon positions are typed in figures at the head of each
    day's column). TAKA-909 sailed again from Keelung on the morning of the 20th and was at sea east of Keelung
    that night, on the way to Miyako: by straight interpolation between the two noon positions, about 24-56N
    123-30E at 2315 I, some 25-30 nm west-south-west of BANG's Attacks 5-6 (2315-2317 I on the 20th, 25-21N
    123-58E; ours, inferred, and the convoy need not have steamed evenly). Nothing is entered for the night of the
    20th: no attack, no loss. The hour of the 20th's sailing and of the 21st's has one figure not read (?)
