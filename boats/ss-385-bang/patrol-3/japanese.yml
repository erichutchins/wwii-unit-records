  event: torpedoed
  date: 1944-09-19
  time: '0820'
  zone: I
  lat_raw: 24-52N
  lon_raw: 122-23E
  original: >-
    別紙一 一、〇八二〇 東経一二二度二三分北緯二四度五二分第七番船東勢丸雷撃ヲ受ク 二、〇八三〇 本艇船団ヲ率ヒ基隆ニ避退ス
    三、一二五六 基隆島沖ニテ船団ト解列現場ニ向フ 四、一六二五 現場ニ到着第三〇號海防艦ト協力敵潜水艦攻撃始ム 五、一六三〇
    飛行機トノ協力ニ依リ第三〇號海防艦敵潜水艦撃沈確實ノ報ヲ受ク 六、一七〇〇 掃蕩ヲ打切リ基隆ニ向フ 七、二〇〇〇 基隆港ニ仮泊
  translation: >-
    Separate sheet 1. (1) 0820: at E 122°23′ N 24°52′, No. 7 ship Tosei Maru torpedoed. (2) 0830: W-15 leads the
    convoy back to Keelung. (3) 1256: off Keelung island, leaves the convoy for the scene. (4) 1625: arrives;
    begins attacking the enemy submarine with CD-30. (5) 1630: receives the report that CD-30, working with aircraft,
    has certainly sunk the enemy submarine. (6) 1700: breaks off the search for Keelung. (7) 2000: anchors at
    Keelung
  note: >-
    Minesweeper W-15's war diary, September 1944 (第十五號掃海艇戦時日誌, cover p42; the ship written 東勢丸, without
    the 第二 of J02 and J04), the 19th's action written up on a
    separate sheet as the daily page (p49) says. W-15 was one of TAKA-909's six escorts (J06). Its daily page: 0210
    sailed escorting TAKA-909 for Naha; 0830 Tosei Maru torpedoed; 2000 anchored at Keelung. Five minutes after
    BANG's Attacks 3-4 (0915 K = 0815 I), 8 nm east-south-east of her position (24-56N 122-14.5E), and the first
    record with a time and place for the sinking: J02 has the place but no time, J04's 0925 is 65 minutes later.
    The convoy put back to Keelung, so the escort's own diary answers the question J06 left open. The 1630 report of
    a submarine certainly sunk "with aircraft" has the same time and wording (撃沈確實) as the Navy summary's entry
    for the 953rd Air Group, which the summary puts on the 20th (J05): possibly the same event, dated a day later
    there. BANG was at 450 ft from 0920 K and came to periscope depth at 1730 K (1630 I) with nothing in sight
