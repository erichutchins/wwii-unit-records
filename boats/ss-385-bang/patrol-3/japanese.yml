# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/README.md (A patrol's Japanese record).
- id: J01
  source: combinedfleet:yasojima_t
  ship: Tokiwasan Maru; Shoryu Maru
  convoy: No. 3905
  event: sank
  date: 1944-09-09
  zone: I
  lat_raw: 28-58N
  lon_raw: 137-45E
  translation: >-
    Convoy No. 3905 (Yokosuka to Haha-jima; escorts Yasojima, Hachijo, CD-4, CD-12): BANG torpedoes and sinks
    both Tokiwasan Maru and Shoryu Maru at 28-58N 137-45E
  note: >-
    Secondary. The page has the convoy leaving Tateyama at 1520 and sunk "at about 1600, shortly after the ships
    leave port", but the position is ~350 nm south of Tateyama; FRUPAC's intercept has "torp & sunk 1520/09"
    (frupac.yml F02), so 1520 I is likely the attack, not a departure. Time left blank here for that reason.
    DANFS: 1,804-ton Tokiwasan Maru and 1,916-ton Shoryu Maru. No primary record found yet (convoy was under
    Yokosuka, not the 1st or 4th Surface Escort Division)
- id: J02
  source: jacar:C08030144100
  page: p12
  ship: Tosei Maru No. 2
  convoy: TAKA-909
  event: sank
  date: 1944-09-19
  zone: I
  lat_raw: 24-54N
  lon_raw: 122-23E
  original: >-
    海防三〇、掃一五、三拓南丸、七利丸、太安丸、三号太平丸 タカ九〇九船団護衛 / 海防三〇、太安丸陸軍飛行機ト共ニN二四─五四 E一二二─二三ニ於テタカ九〇九船団ヲ雷撃セル敵潜水艦攻撃 / 被害 第二東勢丸沈没 戦果
    敵潜水艦一隻撃沈
  translation: >-
    CD-30, W-15, No. 3 Takunan Maru, Shichiri Maru, Taian Maru, No. 3 Taihei Maru: escorting convoy TAKA-909. /
    CD-30 and Taian Maru, with army aircraft, attack the enemy submarine that torpedoed convoy TAKA-909 at N
    24°54′ E 122°23′. / Damage: No. 2 Tosei Maru sunk. Result: one enemy submarine sunk
  note: >-
    4th Surface Escort Division / Okinawa Base Force war diary, September 1944, 作戦経過概要 (daily operations
    summary), column 19. No time given. The "submarine sunk" was BANG, which surfaced that night after about 80
    charges. 東勢 is read Tosei (DANFS: 507-ton tanker No. 2 Tosei Maru). TAKA = Takao to Kagoshima. The columns
    for the 20th and 21st have no attack, so nothing yet for BANG's Attacks 5-6 (2315 I on the 20th)
- id: J03
  source: jacar:C08030363600
  page: p3
  ship: Shoryu Maru; Tokiwasan Maru
  event: sank
  date: 1944-09-09
  time: '1520'
  zone: I
  original: (イ) 九日一五二〇 須美寿島ノ二六五度一〇浬ニテ 昌隆丸 常盤山丸 被雷撃沈没
  translation: '(a) 9th, 1520, 265° 10 nm from Sumisu-jima: Shoryu Maru and Tokiwasan Maru torpedoed and sunk'
  note: >-
    Yokosuka Guard Squadron war diary, September 1944, 一 経過 (二) 敵潜水艦ノ出現 (losses to submarines). Zone not stated;
    taken as I (Tokyo), assumed. The position is a bearing from Sumisu-jima (須美寿島, about 31-26N 140-03E), which
    puts it near 31-25N 139-51E: about 188 nm north-east of BANG's attacks (28-53N 137-42E) and of the postwar
    position combinedfleet gives (28-58N 137-45E, J01). Left as written. The time is 4 minutes after BANG's
    first salvo (1616 K = 1516 I). The convoy is not named here
- id: J04
  source: jacar:C16120660000
  page: p07
  ship: Tosei Maru No. 2
  event: sank
  date: 1944-09-19
  time: '0925'
  zone: I
  original: >-
    一九 0925 ✓第二東勢丸（CC貨 500t 糖?）基隆→那覇 基隆東方海面ニテ被雷 沈没 ｜ 護衛艦CD30ハ其ノ他ノ艦艇ト協同
    此ノ潜ヲ反復攻撃 撃沈不確実
  translation: >-
    19th, 0925: No. 2 Tosei Maru (CC cargo, 500 t, sugar?), Keelung to Naha, torpedoed and sunk in the sea east of
    Keelung. / The escort CD-30, with other ships, attacked this submarine repeatedly; sinking uncertain
  note: >-
    The Navy's day-by-day summary of escort and anti-submarine events (大東亜戦争経過概要（護衛対潜関係）), September 1944,
    narrative for the 19th, read at 500 dpi. The same ship and the same escort as J02, and like J02 drawn from the
    escort's reports, so it counts once with J02; it adds a time, 0925 I, 70 minutes after BANG's first salvo (0915 K =
    0815 I). Here she sails Keelung to Naha, and the escorts' result is "sinking uncertain" where J02 has "one enemy
    submarine sunk". The second character of her cargo is not read (糖蜜, molasses, would fit). The day's other
    torpedo entry, 0915 Jingei 80 nm north-west of Okinawa, is not BANG's
