- id: J06
  source: jacar:C08030144100
  page: p05
  convoy: TAKA-909
  event: status
  date: 1944-09-19
  zone: I
  original: >-
    （二）直接護衛 … 一九 タカ九〇九 一〇 三四〇四九 海防三〇、掃一五、第三拓南丸、七利丸、太安丸、三号太平丸 基隆─鹿児島
    那覇─鹿児島
  translation: >-
    (2) Direct escort … 19th: convoy TAKA-909, 10 ships, 34,049 tons; escorts CD-30, W-15, No. 3 Takunan Maru,
    Shichiri Maru, Taian Maru, No. 3 Taihei Maru; Keelung to Kagoshima, Naha to Kagoshima
  note: >-
    4th Surface Escort Division / Okinawa Base Force war diary, September 1944, 一 経過 (二) 我ガ軍ノ状況 (イ) 海上護衛
    (2) 直接護衛, the table of convoys escorted (begins p04; columns: day, convoy, ships, tons, escorts, section).
    Read at 300 dpi. The day column's header is not read; for TAKA-909 it is the day of the attack, and probably
    the sailing from Keelung. Two sections are written in the route cell, one under the other; the first reads
    基隆─鹿児島 (the small 鹿児島 not certain). It is the only convoy in the table between the 15th and the 23rd on
    the Keelung lanes: KANA-402 (14th) is Kagoshima-Naha, TANA-304 (23rd) Miyako-Naha-Koniya, KATA-411 (24th)
    Kagoshima-Keelung. The table gives no losses and no arrival. Ten ships against BANG's count on the 19th of
    eight merchantmen and five or more escorts
