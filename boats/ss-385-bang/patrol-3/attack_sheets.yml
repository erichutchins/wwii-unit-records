# The attack data sheets' words, as typed. Hand-edited; the numbers are in attacks.csv.
# Each sheet is two pages: `page` (time, position, target and own-ship data, type attack) and `table_page`
# (one column per torpedo). attacks.csv cites `page`, the attack's row in positions.csv.
# attacks.csv units, as typed on these sheets: courses degrees (T), speeds kts (typed 2.0, 10.0), ranges yds,
# depths and drafts ft (own depth typed "Surface" for the night surface attacks 5 and 6); interval in seconds
# (typed 0, 8, 8: no unit); depth_set as typed under "Depth Set (ft.)" (6); power typed "-" in every column;
# track as typed with its side (100P). spread there is the kind only; the sheet's words are `spread` here.
# Layout differs from the SEAHORSE sheets: gyro is typed "15R" style on attacks 1 and 2 (degrees right of the bow,
# kept as typed) and as a three-figure angle on attacks 3 to 6; "Hit or Miss" is typed once across the columns
# ("2 Hits"), not per torpedo, so `hit` is blank in attacks.csv and the count is `hits` here. Times on attacks 2, 4
# and 6 are typed with seconds after a dash (1616-32 is 32 seconds after 1616: the narrative's "1616 Commenced
# firing ... At 1616-32 Commenced firing three torpedoes at AO", rg38-74802831/p04); kept as typed.
# target_line and own_ship are the sheet's lines as typed.

- attack: Attack 1
  type_attack: >-
    Day periscope. Sound tracking for 12 minutes prior to firing to avoid detection by escort passing close aboard.
    Final periscope set-up to TDC just before firing, and constant bearing given during firing. Fired three
    torpedoes spread 1½, 0, 1½ from aft forward by means of the offset knob on the TDC.
  description: >-
    Convoy consisted of one AO (nearest estimate, HOKKO MARU, ONI 208J (revised) page 265); one AK (nearest
    estimate, MYOGI or HOKUYO MARU, ONI 208J (revised) page 208); one unidentified medium AK; one new type destroyer
    escort; and one unidentified escort. Fired at leading AK. Clear daylight.
  sunk: One AK (similar to MYOGI or HOKUYO MARU). EU.
  determined_by: Saw and heard two hits, saw ship break in half. Heard breaking up noises through hull.
  target_line: >-
    Target Draft: 24 Feet Course: 180° Speed: 10.0 Range: 1700 yds.
  own_ship: >-
    Speed: 2.0 Course: 245° Depth: 65 feet Angle: 0°
  hits: 2 Hits
  spread: Divergent, 1°.5 between torpedoes
  sea: Slight swell
  overhaul: U.S. Submarine Base, Pearl Harbor.
  remarks: The miss was due to spread used.
  page: rg38-74802831/p13
  table_page: rg38-74802831/p14
  note: >-
    Two specks after "245°" in the own-ship course line are marks on the paper, not typed characters (zoomed);
    the course is 245, and the tracks typed agree with 245 + gyro against target course 180.

- attack: Attack 2
  type_attack: >-
    Immediately after firing in attack No. 1, gave new periscope set-up on AO to TDC, and constant bearings during
    firing. Fired three torpedoes spread 1½, 0, 1½ from aft forward by means of the offset knob on the TDC.
  description: Same convoy as Attack No. 1. Fired at AO.
  sunk: One AO (similar to HOKKO MARU). EU.
  determined_by: >-
    Saw and heard two hits. Saw ship settling completely enveloped in dense smoke. Heard breaking up noises
    through hull.
  target_line: >-
    Target Draft: 24 feet Course: 180° Speed: 10.0 Range: 1900 yds.
  own_ship: >-
    Speed: 2.0 Course: 245° Depth: 65 feet Angle: 0°
  hits: 2 Hits
  spread: Divergent, 1°.5 between torpedoes
  sea: Slight swell
  overhaul: U.S. Submarine Base, Pearl Harbor.
  remarks: The miss was due to spread used.
  page: rg38-74802831/p15
  table_page: rg38-74802831/p16
  note: >-
    The sheet's time is typed "1616-32(K)", and the narrative (rg38-74802831/p04) has "At 1616-32 Commenced
    firing three torpedoes at AO" straight after firing at the AK at 1616: 32 seconds after 1616. positions.csv
    has the minute, 1616 (it had 1632 until 31 Oct 2026, the seconds read as minutes); attacks.csv keeps 1616-32.

- attack: Attack 3
  type_attack: >-
    Day periscope. Had to run under bow and beam escort to get in. Below periscope depth using sound tracking only
    for 20 minutes prior to firing. Final periscope set-up to TDC just before firing. Fired four torpedoes spread
    3, 1, 1, 3 from aft forward using the offset knob on the TDC.
  description: >-
    Convoy consisting of two AK's (best estimate, similar to ADEN MARU, ONI 208J (revised), page 189); one large
    AO; five unidentified merchantmen; and five or more escorts. Escorts seen only with near 0° angle on the bow,
    estimated as CHIDORI type. Clear daylight. Fired at ADEN MARU type AK.
  damaged: One AK (similar to ADEN MARU). EU.
  determined_by: >-
    Heard two timed hits in this AK. Twenty minutes after attack heard slow heavy screws in opposite direction
    from direction of movement of convoy.
  target_line: >-
    Target Draft: 27 feet Course: 090° Speed: 7.0 Range: 1400 yds.
  own_ship: >-
    Speed: 2.0 Course: 340° Depth: 65 feet Angle: 0°
  hits: 2 Hits
  spread: Divergent, 2° between torpedoes
  sea: Slightly choppy
  overhaul: U.S. Submarine Base, Pearl Harbor
  remarks: >-
    One miss due to spread, the other probably due to target maneuver during torpedo run or to control errors.
  page: rg38-74802831/p17
  table_page: rg38-74802831/p18
  note: >-
    The damage heading is typed "Ships Damaged or Probably Sunk" (kept as `damaged`).

- attack: Attack 4
  type_attack: >-
    Same approach as for Attack No. 3. Immediately after firing bow tubes gave set-up for stern tubes, kept
    constant bearings to TDC during firing, and applied 3, 1, 1, 3 spread from aft forward by means of the offset
    knob on the TDC.
  description: Same convoy as Attack No. 3. Fired at ADEN MARU type AK.
  sunk: One AK (similar to ADEN MARU). EU.
  determined_by: Heard two timed hits in this AK. Heard prolonged breaking up noises through hull.
  target_line: >-
    Target Draft: 27 feet Course: 090° Speed: 7.0 Range: 1200 yds.
  own_ship: >-
    Speed: 2.0 Course: 340° Depth: 65 feet Angle: 0°
  hits: 2 Hits
  spread: Divergent, 2° between torpedoes
  sea: Slightly choppy
  overhaul: U.S. Submarine Base, Pearl Harbor.
  remarks: >-
    One miss due to spread, the other probably due to target maneuver during torpedo run or to control errors.
  page: rg38-74802831/p19
  table_page: rg38-74802831/p20
  note: >-
    The sheet's time is typed "0915-55(K)": 55 seconds after 0915, the stern tubes fired "immediately after firing
    bow tubes" (type attack). positions.csv has the minute, 0915 (it had 0955 until
    31 Oct 2026, the seconds read as minutes); attacks.csv keeps 0915-55. The typed tracks (76P to 85P) run about 9° short of what own
    course 340 + gyro (205 to 196) against target course 090 gives (85P to 94P); they would fit an own course near
    349. The sheet types one own-ship line, the same as Attack 3's, for both salvos; the boat may have swung while
    the stern set-up was made. Kept as typed (re-read at zoom: 205/202/199/196, 76P/79P/82P/85P; own course 340° on p19).

- attack: Attack 5
  type_attack: >-
    Night surface. Fired six bow tubes, spread 1° between torpedoes by means of the offset knob on the TDC at three
    over-lapping targets, ranges 2200 to 3900 yards.
  description: >-
    Convoy consisting of one AO (very long (450 ft. by binocular formula) and low, with stack extremely aft, best
    estimate, RIKKO MARU, ONI 208J (revised) page 283); five unidentified medium merchantmen; and three or more
    escorts, probably CHIDORI type. Fired at three over-lapping merchantmen. Moonless night with about 30% overcast.
  sunk: One medium AK. EU.
  damaged: One medium AK. EU.
  determined_by: >-
    Heard three hits from salvo of six torpedoes. Saw flash in two different targets from two of the hits. Tracked
    one pip detached from rest of convoy and stopped, and pip disappearing. Radar reported another pip disappearing
    but evidence of sinking not considered positive.
  target_line: >-
    Target Draft: 24 feet Course: 100° Speed: 8.0 Range: *2200 yds (to 1st) *3000 yds (to 2nd) *3900 yds (to 3rd)
    *Targets over-lapping.
  own_ship: >-
    Speed: 8.0 Course: 335° Depth: Surface Angle: 0°
  hits: 3 Hits
  spread: Divergent, 1° between torpedoes
  sea: Slightly choppy
  overhaul: U.S. Submarine Base, Pearl Harbor.
  sheet_note: "*Swung right after 3rd torpedo fired."
  remarks: >-
    This attack, firing the entire nest of bow tubes into a group of over-lapping targets, is not considered to be
    as good as making a series of individual attacks at definitely selected targets, but the proximity and
    maneuvers of the escort led me to believe that I had been detected (possibly by radar interference, in which
    my exact position was not known) and that I would soon have the escort on me; and I wanted to inflict as much
    damage as possible before this occurred.
  page: rg38-74802831/p21
  table_page: rg38-74802831/p22
  note: >-
    Three ranges are typed, one to each overlapping target; attacks.csv gives the first (2200), the sheet not
    saying which torpedoes went to which target. The gyro angles of tubes 3, 2 and 1 are typed with an asterisk
    (*355, *350, *345), keyed to the sheet's note "Swung right after 3rd torpedo fired"; attacks.csv holds the
    numbers. The sheet types only the one own course, 335, so those three tracks (56S, 58S, 60S) do not follow
    from 335 + gyro against 100 (50S, 45S, 40S): they fit an own course of about 341, 346 and 351 as the boat
    swung. Kept as typed. Tubes were fired from the bottom up, 6 first (remarks of Attack 6).

- attack: Attack 6
  type_attack: >-
    Same approach as for attack No. 5. Immediately after firing bow tubes swung right and opened outer doors on
    stern tubes, at this time did not know whether I would be escaping from the escort or firing at the tanker
    which was the trailing ship in the south column. Immediately after first bow torpedo hit, tanker swung right. I
    steadied with him sharp on my port quarter and as his angle on the bow passed through 90° fired four stern
    tubes spread 1½, ½, ½, 1½ from aft forward by means of the offset knob on the TDC.
  description: Same convoy as Attack No. 5. Fired at the AO.
  sunk: One AO (similar to RIKKO MARU). EU.
  determined_by: >-
    Heard two hits in this target. Saw target sinking and enveloped in dense smoke. Pip of this target soon
    disappeared from radar screen.
  target_line: >-
    Target Draft: 29 feet Course: 230° Speed: 8.0 Range: 1700 yds.
  own_ship: >-
    Speed: 10.0 Course: 120° Depth: Surface Angle: 0°
  hits: 2 Hits
  spread: Divergent, 1° between torpedoes
  sea: Slightly choppy
  overhaul: U.S. Submarine Base, Pearl Harbor.
  remarks: >-
    Misses due to target continuing to swing during torpedo run. On attacks 5 and 6 fired lower tubes first
    because I believe they afford less chance of detection on launching.
  page: rg38-74802831/p23
  table_page: rg38-74802831/p24
  note: >-
    The sheet's time is typed "0017-15(K)" (15 seconds after 0017); positions.csv has 0017. attacks.csv keeps
    0017-15. The type-attack paragraph gives the spread as 1½, ½, ½, 1½ (1° between torpedoes), as does the
    table's "Divergent, 1° between torpedoes".
