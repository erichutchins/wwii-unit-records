# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/SCHEMA.md (A patrol's claims).
# The Navy's day-by-day summary for September 1944 (jacar:C16120660000, p07) has no entry for Attack 4 (a second ship
# on the 19th: only No. 2 Tosei Maru, J04) or for Attacks 5-6 (no shipping loss between Hatsuharu's attack on a
# submarine at 1840 I on the 20th and 0700 I on the 21st, and none near 25-21N 123-58E). Read 5 Nov 2026.
# The same page has, at 1630 I on the 20th, aircraft of the 953rd Air Group escorting a convoy north-east of Keelung
# (J05): context, not paired. It is an air attack on an oil slick seven hours before BANG fired, with no convoy
# named and no position, so it isn't a record of Attacks 5-6; it shows escorted traffic north-east of Keelung that
# afternoon, as BANG found. JACAR has no war diary for the Takao or Mako Guard Districts or the
# Grand Escort Command for September 1944 under those names. The Sasebo Guard District's diary on JACAR ends with March
# 1944 (C08030352900) and the Sasebo Guard Squadron's with 9 April 1944 (C08030373800), though the diaries put No. 3
# Takunan Maru (a TAKA-909 escort) under Sasebo's command. The 1st Surface Escort Division's September diary
# (C08030141500, read 5 Nov 2026: narrative pp. 03-14, ships' movements table pp. 19-21, ships under command p17) has
# no convoy and no attack east or north-east of Keelung on the 19th-21st: its convoys that week were in the Luzon
# Strait and off Manila (MATA-27, MI convoys), and its one ship near Keelung, the torpedo boat Sagi (under the China
# Area Fleet), ran Keelung to Shanghai about the 17th-21st (p20, read at 200 dpi). The 4th Surface Escort
# Division's table of convoys escorted (J06) has TAKA-909 as the only convoy on the Keelung lanes from the 15th to
# the 23rd, and its daily summary (J07) no attack or loss on the 20th-23rd. 11 Nov 2026: the escort W-15's own
# September diary (J08, J09) settles the question below: TAKA-909 put back to Keelung on the 19th and sailed again on
# the morning of the 20th, so it was at sea east of Keelung that night; W-15 enters no attack and no loss. Attacks 5-6
# are paired with it as no_loss (the convoy inferred). What was written before W-15's diary was read: TAKA-909 again (her contact at 1555 I at 25-07N 122-57E and
# her attack at 2315 I at 25-21N 123-58E both lie about 15 nm south of the Keelung-Naha line, and the 953rd Air
# Group was escorting a convoy north-east of Keelung at 1630 I, J05), but only if it put back after the 19th's
# attack (24-54N 122-23E, 39 hours and 90 nm earlier, about 2.3 knots) and sailed again, which no record read says;
# BANG counted a smaller convoy that night (one AO, five merchantmen, three or more escorts). No loss is recorded
# that night (J07; the Navy's summary, J04's page) against her claims of an AK and an AO sunk. Nothing in either diary for a second ship on the 19th
# (Attack 4): the 4th's table and daily summary name only No. 2 Tosei Maru. 5 Nov 2026.
- attack: Attack 1
  record: J01
  relation: hit
  note: >-
    Tokiwasan Maru (1,804 t) and Shoryu Maru (1,916 t) of convoy No. 3905, Yokosuka to Haha-jima, both sunk.
    BANG claimed a medium AK and a medium AO (Attacks 1-2, 1616-1632 K). Secondary source only. JANAC credits
    both to BANG, neither marked probable, both as cargo: 9 September, 1,804 and 1,916 tons, 28-53N 137-42E
    (janac:4/p66; janac:6/p3)
- attack: Attack 3
  record: J02
  relation: hit
  note: >-
    No. 2 Tosei Maru (507-ton tanker) of convoy TAKA-909 sunk. BANG claimed one AK sunk and another probably
    sunk (Attacks 3-4); the escorts claimed BANG sunk. JANAC credits her ("Tosei Maru No 2", tanker, 507 tons) to
    BANG, not marked probable: 19 September, 24-56N 122-14E (janac:4/p68; janac:6/p3); no second ship
- attack: Attack 1
  record: J03
  relation: hit
  note: >-
    The Japanese record of the same sinkings (J01 is the secondary account): Shoryu and Tokiwasan Maru sunk at
    1520 I, 4 minutes after BANG's first salvo. Its position, a bearing from Sumisu-jima, is about 188 nm from
    BANG's; the names and the time pair them, the place does not
- attack: Attack 2
  record: J03
  relation: possible
  note: Second salvo 16 minutes after the first; the Japanese record has both ships sunk at 1520 I
- attack: Attack 3
  record: J04
  relation: hit
  note: >-
    The summary's entry for No. 2 Tosei Maru (J04), the same report as J02, counted once with it: sunk east of Keelung
    at 0925 I, 70 minutes after BANG's first salvo (0815 I) at 24-56N 122-14.5E, about 30 nm east of Keelung
- attack: Attack 3
  record: J08
  relation: hit
  note: >-
    W-15's own account of the 19th (J08): No. 7 ship Tosei Maru torpedoed at 0820 I at 24-52N 122-23E, five minutes
    after Attacks 3-4 (0815 I) and 8 nm from BANG's position. The same ship as J02 and J04, from a third report
    (W-15's, not the division's), and the only one with both a time and a place
- attack: Attack 5
  record: J09
  relation: no_loss
  note: >-
    TAKA-909 put back to Keelung after the 19th's attack and sailed again on the morning of the 20th for Naha by
    way of Miyako (W-15's diary, J08, J09): the convoy BANG found that afternoon (1555 I at 25-07N 122-57E) and
    attacked that night is most likely this one (inferred: the only convoy on the Keelung lanes that week, J06, and
    W-15's noon positions put it some 25-30 nm from her by straight interpolation). W-15's diary enters no attack
    and no loss that night, and the convoy reached Miyako the next afternoon. BANG claimed an AK and an AO sunk
- attack: Attack 6
  record: J09
  relation: no_loss
  note: Fired with Attack 5 (0017 K); same record
