# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/README.md (A patrol's Japanese record).
# None found yet. The five attacks are in the Yellow Sea: off the west coast of Korea (Attacks 1-2, 31 May and 3 June,
# 36-37N 125-23E to 125-30E, two four-masted sailing vessels), at the eastern end of the Gaichosan Suido off Dairen
# (Attack 3, 8 June, 39-07N 123-05E, two whale-killer patrol boats), and north-east of the Shantung promontory
# (Attacks 4-5, 11 June, 37-11N 123-23E, a ship with two escorts in fog, claimed sunk). The Navy's monthly summary of
# escort and anti-submarine events stops at February 1945 (L98), so the search went by command and month (L99),
# 5 Nov 2026:
# - Ryojun (Port Arthur) Special Base Force: its war diary on JACAR ends with May 1945 (jacar:C08030281600, parts
#   C08030281800, the Manchukuo maritime police guard ships Kaio, Kaiho, Kairyu, Kaizui, Kaiko attached to it, and
#   C08030281900, the base force's own, 28 pp.). Part 2 read for the month's operations table (pp. 15-16): harbour
#   tugs' sorties and drills, nothing on 31 May. No June 1945 part found (searched 旅順方面特別根拠地隊, 1945-06 on).
# - Dairen naval attache's office (大連在勤海軍武官府): May 1945 only (jacar:C08030709600-709800, ships routed out of
#   Dairen); not read, as Attack 1 is off Korea, not Dairen.
# - Chinkai (Chinhae) Guard District: no war diary for May-June 1945 found (searched 鎮海警備府, 鎮海警備府戦時日誌,
#   鎮海防備隊); only the Chinkai naval hospital's and port affairs department's diaries for May 1945.
# - Tsingtao (青島方面特別根拠地隊): no diary for 1945 found; only the Tsingtao naval air group's for May 1945
#   (jacar:C13120005700), not read.
# - 7th Fleet (第七艦隊), April-June 1945 (jacar:C08030022200, June, 63 pp.): its area is the Shimonoseki and Tsushima
#   Straits; its enemy-situation section refers to the 1st Escort Fleet's diary (第一護衛艦隊戦時日誌), which was not found
#   on JACAR for May-June 1945 (searched 第一護衛艦隊, 海上護衛総司令部 戦時日誌). pp. 02-03 read.
# - Escort ships' June 1945 diaries found (Kaibokan No. 22, jacar:C08030593800; No. 26, jacar:C08030593900) were at
#   Maizuru and Nagoya-wan (snippets), not in the Yellow Sea.
# - Searches for 黄海 敵潜, 山東 被雷, 喪失船舶 and 遭難船舶 for June 1945 found nothing.
# Finding aid (secondary, not read on a primary record): the English Wikipedia articles on SEGUNDO and its list of
# shipwrecks in June 1945, and the Naval Cover Museum's SEGUNDO page, name the ship of 11 June as Fukui Maru No. 2
# (第二福井丸), 1,591 tons, off the Shantung peninsula. JACAR has 第二福井丸 only in the 1943-44 designated-ship movement
# tables (jacar:C08050057300, C08050055000; not read); the 1943-45 fourth series (タ～ワ, C08050102600-103600) has no
# フ section (index, C08050102800). The 1943-44 tables may give her owner and route; a 1945 movement log or a loss
# report would be the record to find.
# Resume: the Ryojun base force or the Chinkai Guard District for June 1945 under other titles (戦闘詳報, 電報綴);
# the Navy's or the Shipping Operations Association's ship-loss returns for June 1945; 第二福井丸 in the 1943-44 tables.
