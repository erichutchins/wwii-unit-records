  translation: >-
    From the 16th 0945 at 19-17N 120-15E to the 17th 0345 at 18-53N 119-44E: Seattle, Hiyama, Shozan, Mantai,
    Sainei, Jinzan (sunk)
  note: >-
    The convoy chart 別表第七 (Philippines north route), beside a sinking mark on the line of タマ21C, which the chart's
    head gives 20 ships, operations party (一), and seven escorts, the cell read 海一, 海二, 草垣, 掃?三?, 前?島, 円島,
    駆?六二 (partly legible). The line leaves Takao on the 14th and reaches Manila about the 19th. The two positions
    bound the attacks, not any one ship: the 0345 end is 32 nm north of Attack 1's typed position and 36 nm north of
    Attack 2's. 日山 is read Hiyama after JANAC (secondary)
