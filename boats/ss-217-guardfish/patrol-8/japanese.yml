  translation: 18th 0850, 21-58N 119-50E / 18th 1055, 21-36N 119-58E, Kai-17 (slightly damaged)
  note: >-
    The convoy chart 別表第二 (Malaya direct route), on the line of (ヒ69), Moji to Manila, which reaches Manila on the
    20th (a mark at 20th 0530, 15-42N 118-37E, without words). Escorts in the chart's head: 香椎, 千振, 佐渡, two 海
    (the numbers not settled), 神鷹 (the escort carrier Shinyo), 14 ships. The 0850 mark has no words; the narrative
    (J05) has the stragglers torpedoed about 0800. The chart says slightly damaged (小破) where the narrative says
    moderately (中破). Nothing on the line after 1055 until Manila: GUARDFISH's Attack 5, 1822 I at 20-27N 119-11E, is
    7 h 27 min after and 82 nm south-west of the 1055 mark, on the convoy's way to Manila
