    … しやとる丸（5773）日山丸（2800）、祥山丸（2856）… （小破）聖川丸、海17、第一小倉丸、だかあ丸、日永丸
  translation: >-
    Ships damaged: (a) by enemy submarines, sunk (20 ships), slightly damaged (5) … Mantai Maru (5863), Sainei Maru
    (4916), Jinzan Maru (5215), Teiryu Maru (6550) … Seattle Maru (5773), Hiyama Maru (2800), Shozan Maru (2856) …
    (slightly damaged) Kiyokawa Maru, Kai-17, No. 1 Ogura Maru, Dakar Maru, Hinaga Maru
  note: >-
    The July summary table 別表第一, its notes (記事) item 2; gross tons in brackets as written. Only the ships of this
    patrol's days are given here. Teiryu Maru (帝竜丸) is the ship JANAC credits to Attack 6 (secondary); the list
    gives her no date or place. 帝竜 is read Teiryu after JANAC
- id: J05
  source: jacar:C08030141100
  page: p10
  convoy: HI-69
  ship: Kai-17
  event: torpedoed
  date: 1944-07-18
  time: '0800'
  zone: I
  original: >-
    ヒ六九船団中ノ天栄丸、播磨丸ハ十八日〇八〇〇頃船団ニ遅レ追及中敵潜ノ雷撃ヲ受ケ、船団後方ニテ制圧中ノ海十七ヲ急派シタル処、
    同艦ハ高速ニテ直進セシ為反ツテ敵潜ノ雷撃ヲ受ケ中破セリ
  translation: >-
    Tenei Maru and Harima Maru of convoy HI-69, which had fallen behind the convoy and were catching up, were
    torpedoed by an enemy submarine at about 0800 on the 18th; Kai-17, which was holding down the submarine astern of
    the convoy, was sent to them at once, and because she ran straight at high speed she was herself torpedoed and
    moderately damaged
  note: >-
    The narrative, item (ロ). The time is the attack on the two stragglers; Kai-17's own hit is charted at 1055 (J06).
    Neither Tenei Maru nor Harima Maru is in the month's loss list (J04), and the narrative says only that they were
    torpedoed. More than ten hours before GUARDFISH's Attack 5 (1822 I)
