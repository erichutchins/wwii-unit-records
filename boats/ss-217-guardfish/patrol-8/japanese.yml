# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/SCHEMA.md (A patrol's Japanese record).
# From the Navy's day-by-day summary of escort and anti-submarine events for July 1944 (大東亜戦争経過概要（護衛対潜関係）,
# jacar:C16120659800) and the 1st Surface Escort Division's war diary for July 1944 (第一海上護衛隊戦時日誌,
# jacar:C08030141100): its narrative (作戦指導, pp. 9-10), its July summary table with the month's loss list (別表第一,
# p27) and its convoy charts (別表第二, 馬来直航路, p28; 別表第七, 菲島北航路, p33). Zone I (Tokyo time) throughout, as
# GUARDFISH's report is.
# Three convoys: TAMA-21C (Takao to Manila; Attacks 1-4), HI-69 (Moji to Manila, with the escort carrier Shinyo;
# Attack 5) and an unnamed one on the 19th (Attack 6). TAMA-21C's six losses are in the diary's chart and loss list
# without a time for each ship, and THRESHER attacked the same convoy that night, so which ships GUARDFISH sank is
# not in the Japanese record; JANAC's credit (secondary, janac:6/p18) is given in claims.yml as the postwar answer.
# Searched and not found: the summary has nothing in the Luzon Strait on the 17th, 18th or 19th (C16120659800 p6: its
# entries are Saipan, the Bonins, the Java Sea, and the cruiser Oi west of Manila), so neither HI-69's damage nor the
# 19 July sinking is there; Teiryu Maru (帝竜丸) is in the diary's loss list only, with no convoy, time or place, and is
# on none of its convoy charts read (pp. 28, 32, 33, 35); her convoy is not yet identified. Not yet read: the
# summary's fair copy (C16120644000, pp. 20-28) for the 16th-19th, the designated-ship movement tables for Teiryu,
# Mantai, Jinzan and Hiyama Maru (each ship's own log would give the hour and position of her loss), and Shinyo's or
# the escort Kashii's records for HI-69 on the 18th.
- id: J01
  source: jacar:C16120659800
  page: p5
  convoy: TAMA-21C
  ship: Seattle Maru
  event: sank
  date: 1944-07-16
  time: '1030'
  zone: I
  original: >-
    高雄ヨリマニラニ向ヘル船団（護衛艦8 輸送船21）ハルソン島北方ニテ敵潜ノ襲撃ヲウク … 1030しやとる丸（A徴傭5773t
    部隊4300名）沈没 尚状況不明ナルモ同船団中夜半更ニ1隻沈没セルモノノ如キ模様アリ
  translation: >-
    The convoy bound from Takao to Manila (8 escorts, 21 transports) was attacked by an enemy submarine north of
    Luzon … at 1030 Seattle Maru (Army-requisitioned, 5773 tons, 4,300 troops) sank. The situation is not yet clear,
    but it appears that one more ship of the same convoy sank at midnight
  note: >-
    The 16th, written in the remarks column beside the entry. The convoy is TAMA-21C (J02). Seattle Maru's sinking is
    the morning's, PIRANHA's by JANAC (secondary, 19-26N 120-18E); "one more ship … at midnight" is the first word of
    GUARDFISH's Attack 1 (2342 I). The page is marked "19-7" (July 1944) at the foot
- id: J02
  source: jacar:C08030141100
  page: p10
  convoy: TAMA-21C
  event: sank
  date: 1944-07-17
  zone: I
  original: >-
    タマ二一C船団ハ呂宋海峡ニテ十六日朝敵潜ノ雷撃ヲ受ケ「シヤトル」丸沈没ノ為之ガ救助船団ト二分航行中十七日未明追躡セル
    敵潜ノ攻撃ヲ受ケ五隻沈没セリ 依ッテ事後研究会ヲ開催セシメ参謀一名ヲ「マニラ」ニ派遣セリ
  translation: >-
    Convoy TAMA-21C was torpedoed by an enemy submarine in the Luzon Strait on the morning of the 16th and Seattle
    Maru sank; because of this it was sailing divided into the ships rescuing her and the convoy, and it was attacked
    before dawn on the 17th by an enemy
    submarine that had followed it, and five ships sank. A meeting to study the attack afterwards was therefore
    ordered, and a staff officer sent to Manila
  note: >-
    The narrative, item (ハ). "Before dawn on the 17th" (十七日未明) covers GUARDFISH's Attacks 1-4 (2342 on the 16th to
    0303) and THRESHER's; the diary speaks of one following submarine. Five, with Seattle Maru six: the six names of
    J03 and J04. Re-read at 500 dpi for THRESHER's file (its J02): 沈没ノ為之ガ救助船団ト二分, the ノ為 after 沈没
