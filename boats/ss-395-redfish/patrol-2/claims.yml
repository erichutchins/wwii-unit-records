# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/SCHEMA.md (A patrol's claims).
# 23 November 1944 (Attacks 1-6) and 9 and 19 December 1944 (Attacks 7-11). Attack 10 (four stern torpedoes at an
# escorting destroyer, no hits) has no entry: Unryū's battle report (J06-J08) does not mention it.
# Attack 2 (0129 K, three torpedoes, no hits) and Attack 6 (0712 K, four, no hits) have no entry: nothing in W-15's
# report matches them (header of japanese.yml). J01-J02 (Hozan Maru, sunk 2337 I = 0037 K, 27 minutes before
# REDFISH's first attack) and J11 (the Navy's summary, Hozan Maru, same time) are not paired: the postwar credit of Hozan Maru to REDFISH (janac:4/p76) does not fit the
# times, which give her to BANG's Attacks 1-3 (ss-385-bang/patrol-4/claims.yml).
# J12 (Amakusa Maru's own sheet: sunk on the 22nd, before REDFISH's first attack at 0004 I on the 23rd) is not paired
# either; it goes to BANG's Attacks 1-3 as well.
- attack: Attack 1
  record: J03
  relation: possible
  note: >-
    REDFISH claimed an engine-aft MARU sunk, hits timed at 0106-30 K (0006 I). Two ships besides Hozan Maru were
    lost, Amakusa Maru and Sakae Maru (J03). Their own sheets, found later, put Amakusa Maru's loss on the 22nd,
    before this attack (J12), and Sakae Maru's on the 24th, 10-15 nm north-west (J13): neither fits. JANAC gives
    both ships to BANG (janac:6/p3), "probable agent"
- attack: Attack 3
  record: J03
  relation: possible
  note: >-
    REDFISH claimed a heavily loaded AK sunk, one hit at 0143 K (0043 I). Seven minutes later BANG's Attack 6
    claimed a medium AK in the same part of the convoy. Amakusa Maru's sheet rules her out (the 22nd, J12); Sakae
    Maru's (J13) has the 24th and a place 10-15 nm north-west, which fits neither boat's attack
- attack: Attack 4
  record: J04
  relation: possible
  note: >-
    No hits claimed (0540 K); depth charges heard by W-15 at 0450 I (0550 K, J04). Possibly a counterattack on
    REDFISH; REDFISH's report would say whether she was charged then
- attack: Attack 5
  record: J04
  relation: possible
  note: Fired with Attack 4 (0540 K); same record
- attack: Attack 7
  record: J10
  relation: possible
  note: >-
    REDFISH claimed one hit on a SHOKAKU or HAYATAKA type carrier at 0156 (31-57N 129-01E). The summary records
    Junyō torpedoed about 50 miles south-west of Nomozaki, which fits that position, with two hits, at 0130 I. Its
    one time is 26 minutes before Attack 7 by REDFISH's zone I (or 34 minutes after, if the J the sheet types is
    right). SEA DEVIL's report (ss-400-sea-devil/2, Attack 4) times two explosions at 0031:40 and 0031:55 I at
    31-43N 129-04E, each checking with a torpedo's run, and PLAICE saw her hits: two hits, as the summary has, an
    hour before its 0130. PLAICE (ss-390-plaice/3) heard her own hits at 0131 and 0133 I on what she took for
    destroyers of the screen, at 31-57N 129-01E, the position REDFISH's sheet types for this attack; the summary also
    has the destroyer Maki hit in the bow. Its place (about 50 miles south-west of Nomozaki) is nearer REDFISH's and
    PLAICE's. Which boat's torpedoes made the two hits the summary does not say
- attack: Attack 8
  record: J10
  relation: possible
  note: >-
    REDFISH claimed one more hit on the same carrier at 0320 (32-13N 129-13E), nearer Nomozaki. The summary's single
    entry (0130 I, two hits) does not separate the attacks; SEA DEVIL's and REDFISH's Attack 7 could account for
    both hits as well
- attack: Attack 9
  record: J06
  relation: hit
  note: >-
    Four bow torpedoes at UNRYU fired 1636 I (narrative: first hit 1635.45). Unryū's lookout and hydrophone operator
    reported a torpedo at starboard 30° at 1635 and she was hit below the bridge; her engines and power failed.
    No other boat was there
- attack: Attack 11
  record: J07
  relation: hit
  note: >-
    One stern torpedo at the stopped, burning carrier, hit 1650.43 by REDFISH's narrative. Unryū's report has the
    second hit forward to starboard at 1645 with the engines stopped, setting off the cargo in her lower hangar
    (the Ōka); the five minutes' difference is the same at the sinking (J08)
- attack: Attack 11
  record: J08
  relation: hit
  note: >-
    Unryū sank stern up at 1657 by her report, about 1700 by the Navy's summary (J09); REDFISH's captain saw her
    sink at 1659
- attack: Attack 9
  record: J09
  relation: hit
  note: >-
    The summary's entry is timed 1638 and places the loss about 230 miles north-north-west of Miyako-jima; REDFISH's
    sheets give 28-59N 124-03E. Its claim that Hinoki and Shigure certainly sank the submarine is not borne out
- attack: Attack 3
  record: J13
  relation: possible
  note: >-
    Sakae Maru's sheet has her sunk on the 24th at 24-34N 122-3?E (J13). Attack 3's hit (0043 I on the 23rd, at
    24-27N 122-47E, the target seen to blow up and sink by the stern) and BANG's Attack 6 (0050 I) are the night's
    claimed sinkings not accounted for by Hozan and Amakusa Maru. Possible only: the date and place fit neither
