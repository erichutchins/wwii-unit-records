- attack: Attack 7
  type_attack: Night radar surface attack.
  description: >-
    Task Force consisting of one SHOKAKU or HAYATAKA type aircraft carrier, one battleship, three escorting
    destroyers. The aircraft carrier was attacked. Initial contact was by SJ Radar range 31,000 yards. Visibility
    at time of attack about 6,000 yds.
  sunk: None
  damaged: (EC) Damaged one SHOKAKU or HAYATAKA type aircraft carrier (29,800 tons).
  determined_by: Commanding Officer on bridge observed one timed hit (2min. 10 sec) after commenced firing.
  target_line: "TARGET DRAFT: 21ft. COURSE: 070 SPEED: 11 RANGE: 2900"
  own_ship: "SPEED: 13.0 COURSE: 010 DEPTH: Surf ANGLE: ---"
  spread: "#1 1/2 R, #2 1/2 L, #3 1 1/2 L, #4 1 1/2 R, #5 2 1/2 R, #6 2 1/2 L"
  sea: Sea from 000T., amount 2, swell 3.
  overhaul: USS FULTON
  remarks: >-
    * At least one of these torpedoes ran erratic as determined by sound bearings after firing. It is not known
    which one. Unable to explain other misses. Course 050T. and speed 13 were used in estimate of course and
    speed. Plotting of definitely observed timed hit shows course 070T. speed 11. It is believed target was
    employing a modified constant helm zig plan.
  page: rg38-74837267/p53
  table_page: rg38-74837267/p54
  note: >-
    The sheet types the time 0156 (J); positions.csv has zone I (the patrol's zone that week; Attack 8, 84 minutes
    later, is typed (I)). Kept as typed. The target course on the sheet (070, first digit faint) is the plotted one
    from the remarks, not the 050 set on the T.D.C. at firing. Tracks are typed without a side: with 070 they
    compute starboard and within 3 degrees of those typed (125S, 130S, 131S, 127S for tubes 3-6 against 124 30,
    128, 128 30, 124), not checked by the tool, which needs a side. Erratic is typed * for tubes 2-6 (the remarks' asterisk).

- attack: Attack 8
  type_attack: >-
    Night radar surface attack. Target zigged away during firing - T.D.C. was corrected and firing continued.
  description: Task force as described in Attack No. 1. Visibility at this firing 12,000 yards.
  sunk: None.
  damaged: (EC) Damaged one SHOKAKU or HAYATAKA type aircraft carrier (29,800 tons).
  determined_by: One timed hit at 3min. 59 sec. after commenced firing.
  target_line: "TARGET DRAFT: 21ft. COURSE: 035T. SPEED: 12 RANGE: 3500"
  own_ship: "SPEED: 13.0 COURSE: 010T. DEPTH: Surf. ANGLE: ---"
  spread: "#1 1/2 R, #2 1/2 L, #3 1 1/2 L, #4 1 1/2 R, #5 2 1/2 R, #6 2 1/2 L"
  sea: Sea from 000T., amount 2, swell 3.
  overhaul: USS FULTON
  remarks: >-
    * One premature explosion was observed at 2min. 15sec. after firing. It is not known which torpedo was the
    premature. Explosion observed by C.O. Target was seen to zig away during firing of torpedoes resulting in a
    greater track angle than at instant of commence firing. Course and speed of target estimated to be 050T. - 12.
  page: rg38-74837267/p55
  table_page: rg38-74837267/p56
  note: >-
    "Task force as described in Attack No. 1" means this patrol's Attack 7 (the carrier group). Tracks are typed
    without a side. The sheet's one target course (035) gives about 156 starboard for tubes 1-3 and 160 and 155 for
    4-6; the typed tracks of tubes 1 and 2 (140, 139) fit the course before the zig (about 050, the remarks'
    estimate), those of tubes 3-6 (154, 158, 158, 153) the corrected T.D.C. Kept as typed. The narrative times
    the first torpedo 0320.37 (positions.csv). Erratic * on tubes 1-5 marks the unidentified premature; tube 6 is
    the one typed Hit.

- attack: Attack 9
  type_attack: >-
    Submerged periscope depth approach. Target zigged toward apparently trying to avoid torpedo wakes.
  description: >-
    * One UNRYU aircraft carrier with prominent island and planes on deck, escorted by three modern destroyers.
    Contact made by periscope while submerged. Visibility at firing about 8000 yds.
  sunk: >-
    (EC) One UNRYU class CV (tonnage 42,000 from addendum to Cincpac - CincpOA "WEEKLY INTELLIGENCE", VOL. 1, NO. 7
    entitled "Silhouettes of Japanese Warships, 'Know your Enemy!".
  damaged: None.
  determined_by: >-
    C.O. observed two timed torpedo hits and witnessed sinking of target at range of about 2000 yds.
  target_line: "TARGET DRAFT: 21ft. COURSE: 188T. SPEED: 18 RANGE: 1275"
  own_ship: "SPEED: 3 kts. COURSE: 098T. DEPTH: 60ft. ANGLE: 1 deg down."
  spread: "#3 2 1/4 R, #4 2 1/4 L, #5 6 L, #6 6 R"
  sea: Sea from 340T. amount 3, swells from 340T., amount 4.
  overhaul: USS FULTON
  remarks: >-
    First hit witnessed and timed at 45sec. after commenced firing. Plot and post-firing analysis indicated actual
    mast head height of 9? ft. instead of 80ft. as used. Also true course of 188T. instead of 190T. as used and
    speed 18 instead of 16 as used.
  footnote: "* For exact identification see Comsubpac dispatch 290906 of December 1944."
  page: rg38-74837267/p57
  table_page: rg38-74837267/p58
  note: >-
    The typed tracks (93S, 96S, 98S, 82S) disagree with own course 098 + gyro + 180 - target course 188, which
    gives 87S, 84S, 82S, 98S: each typed track is 180 degrees minus the computed one (the same figures, measured
    from the other end). Re-read at zoom; the sheet says this, and the 190 course used at firing does not explain
    it. Kept as typed; check_attacks lists the four. The determined_by line says two hits; the table types one
    (tube 3), and the remarks time the first at 45 sec. The mast-head height in the remarks is typed over (9 and a
    struck-over second digit, written 9?). The sinking was witnessed after Attack 11 (that sheet's remarks).

- attack: Attack 10
  type_attack: Submerged periscope depth approach.
  description: >-
    Task force as composed in attack No. 9. Carrier is badly damaged, listing heavily and burning. Target is now
    one of the escorting destroyers.
  sunk: None.
  damaged: None.
  determined_by: None.
  target_line: "TARGET DRAFT: 6' - 8' COURSE: 210 - 260 SPEED: 18 RANGE: 1700"
  own_ship: "SPEED: 3 kts. COURSE: 095 DEPTH: 60ft. ANGLE: 1 deg down."
  spread: "#7 4R, #8 2 R, #9 2 L, #10 4 L"
  sea: Sea from 340T., amount 3, swells from 340T., amount 4.
  overhaul: USS PROTEUS
  remarks: Target zigged away immediately after firing first torpedo. Should have ceased firing.
  page: rg38-74837267/p59
  table_page: rg38-74837267/p60
  note: >-
    Time typed 1637-30 with the zone letter illegible; positions.csv has 1637 I. The target course is typed as a
    range, 210 - 260: tube 7's track (123P) computes from 210 and tubes 8-10 (171P, 167P, 171P) from 260, within 1
    degree, matching the remarks' zig after the first torpedo. check_attacks cannot compute a track from a range of
    target courses, so these four are not checked by the tool. The target speed's second digit is faint (18).

- attack: Attack 11
  type_attack: Submerged periscope depth approach.
  description: >-
    Task force as indicated in Attack No. 10. Carrier is listing 20 deg to starboard, burning and stopped, and is
    the target once more for the "coup de grace."
  sunk: >-
    * (EC) One UNRYU Class CV (Tonnage 42,000 from addendum to Cincpac - CincpacOA "WEEKLY INTELLIGENCE", VOL. 1,
    NO. 7 entitled "Silhouettes of Japanese Warships, 'Know your Enemy!".
  damaged: None.
  determined_by: C.O. watched second hit in carrier and witnessed her sink.
  target_line: "TARGET DRAFT: 21ft. COURSE: 015T. SPEED: 0 (zero) RANGE: 1133"
  own_ship: "SPEED: 3 kts. COURSE: 050T. DEPTH: 60ft. ANGLE: 1 deg down."
  spread: "0"
  sea: Sea from 340T., amount 3, swells from 340T., amount 4.
  overhaul: USS FULTON
  remarks: >-
    This torpedo must have hit a vital spot - a magazine or gasoline stowage for it was no ordinary torpedo hit.
    The initial explosion timed at 1min. 08sec. was continued for several seconds and accompanied by tremendous
    flames, smoke and debris. Eight minutes later, the carrier had sunk.
  footnote: "* For exact identification see Comsubpac dispatch 290906 of December 1944."
  page: rg38-74837267/p61
  table_page: rg38-74837267/p62
  note: >-
    The sheet's time is 1650 (I); the narrative has fired 1649.35, hit 1650.43, sunk 1659 (positions.csv). The
    sheet's 1 min 08 sec run agrees with the narrative's 1649.35 to 1650.43.
