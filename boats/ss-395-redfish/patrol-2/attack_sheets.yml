  spread: "#2 0, #3 2 1/8 L, #4 2 1/8 R"
  sea: State 3, medium swell.
  overhaul: USS PROTEUS (tube 2); US S/M Base, MIDWAY (3, 4).
  remarks: One observed hit at 2min. 18 sec.
  page: rg38-74837267/p47
  table_page: rg38-74837267/p48
  note: >-
    Tracks and gyros of tubes 3 and 4 are typed with a raised 30 (110 30 P, 105 30 P; 356 30, 001 30): written
