- attack: Attack 4
  type_attack: >-
    Night radar surface attack. Three torpedoes were fired at target and then three more at trailing escort.
    Cannot explain missing target. The escort made a radical change of course and avoided torpedoes.
  description: >-
    Same as Attack No. 1 except that there is only one ship and her escort left. Visibility 2000 yards.
  sunk: None
  damaged: None.
  determined_by: None.
  target_line: "TARGET DRAFT: Unk COURSE: 070 SPEED: 4 RANGE: 2600 / 2750"
  own_ship: "SPEED: 8.5 / 8.3 COURSE: 164 30 / 161 30 DEPTH: Surf ANGLE: ---"
  spread: "#1 0, #2 1 3/4 L, #3 1 3/4 R"
  sea: State 3, medium swell.
  overhaul: USS PROTEUS (tubes 1, 2); US S/M Base, MIDWAY (3).
  remarks: One of these torpedoes broached. It is not known which one.
  page: rg38-74837267/p49
  table_page: rg38-74837267/p50
  note: >-
    One sheet, "TORPEDO ATTACK NO. 4 & 5", for both salvos. It types two ranges (2600, 2750), two own speeds
    (8.5, 8.3) and two own courses (164 30, 161 30) one above the other, and one target course and speed. Attack 4
    (tubes 1-3, at the ship) takes the first of each, Attack 5 (tubes 4-6, at the trailing escort) the second; the
    tracks agree with that pairing. The broaching remark covers all six torpedoes.

