# The attack data sheets' words, as typed. Hand-edited; the numbers are in attacks.csv.
# Each sheet is two pages: `page` (time, position, target and own-ship data, type attack) and `table_page`
# (one column per torpedo). attacks.csv cites `page`, the attack's row in positions.csv. Attacks 4 and 5 share one sheet.
# attacks.csv units, as typed on these sheets: courses degrees (T), speeds kts, ranges yds, depths and drafts ft.
# Differences from the SEAHORSE sheets:
# - Angles typed with a raised 30 (minutes: 110 with a superscript 30 = 110 deg 30 min) are written .5 (110.5P, 356.5).
# - own_depth "Surf" and target_draft "Unk" are the typed words; depth_set is typed without a unit (3, 10, 15, 6).
# - power is typed "-" (Attacks 1, 2, 4, 5) or a long dash (Attacks 3, 6, 10, 11; written ---).
# - interval: the first column is typed "---", written 0; the rest typed "10sec." or "8sec" (seconds since the
#   torpedo before).
# - offset: the sheets give no kind of spread, only each torpedo's offset as typed (3/4R, 2 1/2 L, 2 1/8 L, 6 L);
#   attacks.csv writes it in decimal as in BANG patrol 1 (0.75R, 2.5L, 2.125L, 6L); 0 = typed 0.
# - Attacks 7 and 8 type the track without a side (123 30, 125, 140); attacks.csv keeps it without one.
# - erratic * (Attacks 7, 8) is the sheet's asterisk, explained in the remarks.
# - Attack 10's target course is typed as a range, 210 - 260 (written 210-260), and its time 1637-30 with the zone
#   letter illegible (?).
# target_line and own_ship are the sheet's lines as typed. Hit or Miss typed HIT/MISS, written Hit/Miss.

- attack: Attack 1
  type_attack: Night radar surface attack. Three ships were over lapping.
  description: >-
    Seven ship convoy, none identified as to type or tonnage. Contact made at 18,800 yards by SJ Radar. Visibility
    at time of attack about 3000 yards.
  sunk: (UN) One unidentified engine-aft MARU. This ship gave the largest radar pip of the ships in convoy.
  damaged: None
  determined_by: >-
    Two timed hits in target, also a subsequent search by radar revealed one less ship in convoy.
  target_line: "TARGET DRAFT: Unk. COURSE: 040 SPEED: 6 RANGE: 2610"
  own_ship: "SPEED: 3.0 COURSE: 345 DEPTH: Surf. ANGLE: --"
  spread: "#7 3/4R, #8 3/4L, #9 2 1/2 R, #10 2 1/2 L"
  sea: State 3, medium swell.
  overhaul: U.S.S. PROTEUS (tubes 7, 8); USS PROTEUS S/M Base, MIDWAY (9, 10) (typed run together).
  remarks: Timed explosions recorded at 2min. 25 sec. and 2min. 34 sec. after firing.
  page: rg38-74837267/p43
  table_page: rg38-74837267/p44
  note: >-
    The middle digit of the longitude is faint (1?2-43.2E; positions.csv). The overhaul line is typed with
    repeated words; the per-tube attribution here is our reading of the column layout.

- attack: Attack 2
  type_attack: Night radar surface attack. These misses cannot be explained.
  description: Same as on attack No. 1 less one ship sunk in Attack No. 1.
  sunk: None.
  damaged: None.
  determined_by: "---"
  target_line: "TARGET DRAFT: Unk. COURSE: 130 SPEED: 6.5 RANGE: 2500"
  own_ship: "SPEED: 9.4 COURSE: 191 DEPTH: Surf ANGLE: ---"
  spread: "#5 0, #6 1 1/2 L, #1 1 1/2 R"
  sea: State 3, swells medium.
  overhaul: USS PROTEUS
  remarks: None
  page: rg38-74837267/p45
  table_page: rg38-74837267/p46
  note: >-
    Tube 5's gyro is typed over (struck-over figures) with 359 typed again to its left; attacks.csv has 359.
    The typed tracks run 121P, 119P, 120P against gyros 359, 358, 000; the arithmetic gives 120P, 121P, 119P,
    each within 2 degrees.

