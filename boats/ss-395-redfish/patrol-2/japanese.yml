# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/SCHEMA.md (A patrol's Japanese record).
# Covers 23 November 1944 (Attacks 1-6, convoy TAKA-206; J01-J04) and 9 and 19 December 1944 (Attacks 7-11, the
# carriers Junyō and Unryū; J05-J10, header further down).
# TAKA-206 (Keelung for Naha, 22 November 1944) is read from minesweeper W-15's battle report (jacar:C08030607900),
# the record BANG's Patrol 4 uses (ss-385-bang/patrol-4/japanese.yml). W-15 stayed astern to rescue Hozan Maru's crew
# from 2346 I and rejoined at 0120 I, so it saw none of REDFISH's attacks (0004-0612 I); the report gives no time or
# place for the losses of Amakusa Maru and Sakae Maru. Nor do the other records searched (5 Nov 2026): the Navy's
# November 1944 summary (jacar:C16120660200 p08, J11) names only Hozan Maru; neither ship has a table in the
# designated-ship movement tables, series 4 or 5 (indexes jacar:C08050101600 pp1-4, C08050103900 pp2-7, read in the
# ア and サ lists; series 5 runs 1 Dec 1943 - 30 Nov 1944); and no battle report or war diary of Manazuru was found
# (searched 真鶴 戦闘詳報, 真鶴 戦時日誌, 水雷艇真鶴, タカ２０６船団). The 4th Escort Unit's November 1944 diary is still
# missing (its JACAR series C08030143700-C08030144200 jumps from September to December).
# Amakusa Maru's and Sakae Maru's own sheets were found on 11 Nov 2026 in another series, the requisitioned-ship
# movement tables (徴傭船舶行動概見表 甲 第五回): J12 and J13, read as in ss-385-bang/patrol-4/japanese.yml (J10, J11).
