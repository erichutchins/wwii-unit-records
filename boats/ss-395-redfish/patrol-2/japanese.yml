  translation: >-
    1645: a torpedo track was sighted at starboard 30°, but with the engines still stopped she was hit forward to
    starboard; at once the transport cargo in the lower hangar, the (dai) and the rest, exploded, great explosions
    following one after another, and within minutes she listed heavily by the bow
  note: >-
    ㊅ (maru-dai) is the code for the Ōka rocket aircraft she was carrying (J09: thirty). REDFISH's Attack 11, one
    stern torpedo at the stopped carrier, was fired 1649.35 and hit 1650.43 by her narrative, five minutes after
    this time; the two clocks differ by about that much at the sinking too (J08)
