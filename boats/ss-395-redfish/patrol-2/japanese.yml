  zone: I
  original: >-
    〔一六三五〕見張員ハ「右三十度雷跡近イ」ト報ス同時ニ水中聴音員ハ「右三十度魚雷音」ト報ス直ニ面舵一杯前進一杯ヲ令ス
    … 右前方ノ魚雷ヲ躱シ得ズ艦橋下ニ命中ス … 右舷中部艦橋下主管制盤室被雷ニ依リ附近浸水火災發生 艦内電源停止
  translation: >-
    1635: the lookout reported "torpedo track close, starboard 30°"; at the same moment the hydrophone operator
    reported "torpedo noise, starboard 30°". Ordered full right rudder, full ahead … could not avoid the torpedo
    from ahead to starboard; it hit below the bridge … the hit flooded the main control room below the bridge,
    starboard amidships, with fire; the ship's power failed
  note: >-
    Before the hit (p04) she was steaming at 18 knots, base course 180°, zigzagging, in worsening weather and
    visibility. The hit and the damage are on p05, which adds that the engines stopped. REDFISH's Attack 9 sheet fires at 1636 I, first hit 1635.45
    (narrative)
