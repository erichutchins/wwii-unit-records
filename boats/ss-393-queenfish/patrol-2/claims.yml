# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/SCHEMA.md (A patrol's claims).
- attack: Attack 4
  record: J01
  relation: hit
  note: >-
    QUEENFISH claimed an escort carrier ("Kaiyo type", ferrying planes) hit by two torpedoes. The Japanese table has
    Akitsu Maru, an Army aircraft-carrying ship in convoy HI-81, sunk the same day at 1200 I, 5 minutes after
    QUEENFISH fired; no other loss that day. So the ship she hit was very likely Akitsu Maru, not a carrier
    (inferred). HI-81's escort carrier Shinyo was in the convoy and was lost two days later (J02's chart). The
    distance can't be checked until Shirase light is placed. JANAC credits Akitsu Maru to QUEENFISH, not marked
    probable, as an aircraft ferry: 15 November, 9,186 tons, 33-15N 128-10E (janac:4/p76; the appendix prints
    128-19E, janac:6/p32). It credits Shinyo (printed "Jinyo") to SPADEFISH, 17 November (janac:3/p18; janac:6/p45)
- attack: Attack 4
  record: J02
  relation: hit
  note: The route chart's note of the same loss (same headquarters, counts once)
- attack: Attack 1
  record: J03
  relation: no_loss
  note: >-
    QUEENFISH claimed freighters sunk off Kyushu on 8 November. Not in the 1st Surface Escort Division's November
    loss table; the table covers only that division's convoys, so this is not settled. JANAC credits QUEENFISH,
    not marked probable, with two cargo ships sunk on 8 November at 31-09N 129-38E, off western Kyushu: Keijo
    Maru (1,051 tons) and Hakko Maru (1,948 tons) (janac:4/p74; janac:6/p32). Those sinkings need a Japanese
    record from outside the division
- attack: Attack 2
  record: J03
  relation: no_loss
  note: >-
    Claimed a transport and a tanker sunk on 9 November. Not in the division's loss table (see Attack 1). JANAC
    credits QUEENFISH, not marked probable, with one ship that day: Chojusan Maru, a converted gunboat of 2,131
    tons, at 31-17N 129-10E (janac:4/p74; janac:6/p32)
- attack: Attack 3
  record: J03
  relation: no_loss
  note: >-
    Claimed one hit on a freighter on 11 November. Not in the division's loss table (see Attack 1); JANAC credits
    QUEENFISH with nothing between 9 and 15 November (janac:6/p32)
