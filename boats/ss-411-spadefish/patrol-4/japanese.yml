    石垣島警備隊行 便乘者 59名 ... ㊃艇1型 15隻 ... ㊃艇1型 27隻 ... ①1?糎高角砲 1基 ... (39)燃料 155ドラム ... 石炭 200瓲
  translation: >-
    Navy-requisitioned ship Dōryō Maru, cargo stowage plan; loaded at Sasebo 13-15 March, to be landed at Ishigaki
    Jima ... the 39th Shinyō Unit, its main body, 1?7 men ... a 1? cm high-angle gun battery, the Takano (?) party,
    75 men ... passengers for the Ishigaki Jima Guard Unit, 59 men ... shinyō boats type 1, 15 and 27 ... one 1? cm
    high-angle gun ... the 39th's fuel, 155 drums ... coal 200 tons.
  note: >-
    The cargo plan (p39), hand-drawn: the holds' contents and the troop space in No. 2 hold, with the shipper of each
    lot marked: ① Sasebo Naval Arsenal, the Sasebo construction and supply departments (施設部, 軍需部), (39) the 39th
    Shinyō Unit (第三十九震洋隊). Also lorries, a sidecar, a three-wheeled lorry, timber, cement, carbide, oxygen,
    rations, clothing and the battery's stores. The battery's calibre is written 1? (13 or 12; not settled at 330
    dpi) and its party's name 高野 with the first character uncertain. The 39th's strength is written 1?7; 187
    would make the three parties 321, the 262 missing plus 59 rescued of J04 (inferred). Date is the last day of
    loading, the time not stated
