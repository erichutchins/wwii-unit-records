  ship: Dōryō Maru
  event: sank
  date: 1945-03-23
  time: '1713'
  zone: I
  lat_raw: 29-24N
  lon_raw: 127-31E
  original: >-
    船體ハ中央部ニテ折斷サレシモノノ如ク左舷ニ大傾斜シ艦首ヲ上ゲテ急速ニ沈没セリ 被雷時ヨリ沈没マデ二五秒乃至三〇秒ト判斷サル ...
    船體ト共ニ沈没（水深約二〇〇米）シ敵手ニ陥ルガ如キコト無シト認ム
  translation: >-
    The hull seems to have broken in two amidships; she listed heavily to port, lifted her bow and sank quickly. From
    the hit to the sinking is judged 25 to 30 seconds ... [the confidential books] went down with the ship (depth of
    water about 200 m), and we judge there is no chance of their falling into enemy hands.
  note: >-
    Section 6, continued. The time is the hit's (J02) and the sinking 25-30 seconds later; the position is the
    estimate of p27. The page also tells how the master, on his way to the bridge after supper, was blown into the
    passage by the second explosion and carried under by floating timber as she sank
