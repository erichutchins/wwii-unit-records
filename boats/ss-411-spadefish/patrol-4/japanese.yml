  original: >-
    一、船名 道了丸、噸數二二七四噸七一、速力八節 ... 二、年月日 昭和二十年三月二十三日一七一三、 場所 東支那海 推測位置
    北緯二九度二四分 東經一二七度三一分 天候海上模様 天氣曇リ 風向北、風力六、視界約一〇〇〇〇米 波浪五、ウネリノ方向北北西 同階級四、
    海水温度一五度 氣温一三度 氣壓七六五粍 ... (p30) 三月二十三日一七一三右舷二番艙前部ニ爆發起リ甲板上積大發並ビニ○四艇ノ大部ハ
    飛散シ船橋ヲ破壞ス 續イテ約一秒後右舷二番艙後部ニテ爆發シ船橋樓甲板以上全部吹キ飛バセリ ... 當直番員全部戰死シ被雷ヲ確認シ得ザレド
    高崎丸ハ本船爆沈直後右方ニ二本ノ雷跡本船方向ヨリ來ルヲ認メタリト言フヲ以テ敵潜ノ雷撃ニ依ルモノト認ム
  translation: >-
    1. Ship: Dōryō Maru, 2,274.71 tons, speed 8 knots ... 2. Date: 23 March 1945 [Shōwa 20], 1713. Place: East China
    Sea, estimated position 29°24'N 127°31'E. Weather: cloudy, wind north force 6, visibility about 10,000 m; sea 5,
    swell from NNW grade 4; sea temperature 15°, air 13°, pressure 765 mm ... (p30) At 1713 on 23 March an explosion
    in the forward part of No. 2 hold, starboard, blew away most of the landing craft and the boats [○四艇] stowed on
    deck and wrecked the bridge; about one second later a second explosion, aft in No. 2 hold, starboard, blew away
    everything above the bridge deck ... The whole watch was killed and the torpedoing could not be confirmed, but
    Takasaki Maru says that just after this ship blew up she saw two torpedo tracks to her right coming from this
    ship's direction, so we judge it a torpedo attack by an enemy submarine.
  note: >-
    Sections 1-2 (p27) and 6, the action (p30). The tonnage's first numeral is written small and could be taken for
    三 (3,274); read 二 at 450 dpi, which agrees with JANAC's 2,274. The position is an estimate (推測位置). The
    deck cargo marked ○四 (a circled 四) is the shinyō boats of the cargo plan (J06); landing craft is 大發. The
    passengers in the temporary troop space in No. 2 hold "are judged all killed by the two explosions" (p30)
