# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/SCHEMA.md (A patrol's Japanese record).
# Dōryō Maru's own report, 敵潜ニ依ル被襲撃報告 (report of attack by enemy submarine), jacar:C08050050600 pp. 26-39:
# the master's report, dated 19 May 1945 and signed as master of the Navy-requisitioned ship (海軍徴傭船) Dōryō Maru
# (p34); the convoy's three formations (p35-p36), the ship's armament and lookouts (p37) and the cargo plan (p39).
# Read on the scan at 150 dpi, the position, tonnage and cargo plan at 300-450 dpi. The report names the ship's
# master, a hand-written name not carried here; its passengers are named by unit only.
# Times are Tokyo time (zone I): the report gives no zone, and the convoy sailed from Sasebo.
# Not yet searched: the escorts' war diaries (CD-215, CD-219, CD-32), the Sasebo Guard District's diary for March
# 1945, and a convoy record for サイ〇五 (Sai-05).
- id: J01
  source: jacar:C08050050600
  page: p28
  ship: Dōryō Maru
  event: departed
  date: 1945-03-22
  time: '0400'
  zone: I
  original: >-
    本船ハ三月十九日〇六〇〇佐世保發同日一八〇〇待機錨地富江着 二十二日〇四〇〇富江發石垣島ニ向フ。本船團ハ「サイ〇五船團」ニシテ
    僚船ハ高崎丸、清河丸、第一日正丸、鹿島丸 護衛艦ハ第二百十五號海防艦、第二百十九號海防艦、第三十二號海防艦、掃海艇第七利丸、同姫島丸ナリ。
  translation: >-
    This ship left Sasebo at 0600 on 19 March and reached the waiting anchorage, Tomie, at 1800 the same day. She
    left Tomie at 0400 on the 22nd for Ishigaki Jima. The convoy is the "Sai-05 convoy" (サイ〇五船團); the other
    ships are Takasaki Maru, Kiyokawa Maru, No. 1 Nisshō Maru and Kashima Maru; the escorts are Kaibōkan No. 215,
    No. 219 and No. 32, and the minesweepers No. 7 ?ri Maru (第七利丸) and Himeshima Maru.
  note: >-
    Section 5 (航行實施及警戒ノ情況). Five merchant ships, three escort ships and two minesweepers. The page goes on: at
    0500 abeam Kuroshima, speed 8 knots, course 180, zigzag plan 3; from 1200 Kashima Maru fell out of sight with a
    breakdown and Himeshima Maru left to escort her; No. 1 Nisshō Maru dropped out in fog at 1300 and rejoined at
    1600 (p29); course 235 from 1900 and 200 from 0400 on the 23rd; convoy speed 5 to 5.5 knots in a gale from the
    north (p29-p30). The formation sketch (p36) writes the third escort 第22號 in one formation and 第三二 in the
    other; the text has 第三十二號 here and on p32. The convoy's number is written サイ〇五; read by the reader as
    Sai-05 (サ for Sasebo, イ for Ishigaki is inferred, not stated). Readings of the merchant ships' names in kana
    are not given on these pages; 清河丸 is read Kiyokawa and 第七利丸's reading is not known (assumed)
