    生存者中戰傷ニ依リ佐世保上陸後海軍病院ニ入院セル者別紙ノ如ク船員二名 警戒隊員三名 便乘者九名ナリ ... 船團ハ本船被雷後直チニ退避ス
    第三十二號海防艦ハ海面制壓ニ從ヒ爆雷投射ヲナス 掃海艇第七利丸ハ本船生存者救助ニ來リ一八〇〇頃ヨリ日没後迄 生存者 船員一五名、
    警戒隊員九名、便乘者五九名ヲ救助シ (p33) 全員救助ヲ了ヘタル後船團ニ追尾シ二三〇〇頃復歸セリ
  translation: >-
    All the cargo blew up or sank. Missing, and judged killed from the circumstances, as in the attached list: crew
    39, guard detachment 21, passengers 262. Of the survivors, wounded and taken into the naval hospital after
    landing at Sasebo, as in the attached list: crew 2, guard detachment 3, passengers 9 ... The convoy turned away at
    once after this ship was hit. Kaibōkan No. 32 dropped depth charges to hold down the sea area. The minesweeper
    No. 7 ?ri Maru came to rescue this ship's survivors and from about 1800 until after sunset rescued crew 15, guard
    detachment 9 and passengers 59; (p33) having rescued them all, she followed the convoy and rejoined it at about
    2300.
  note: >-
    Sections 7 and 9 (p32-p33). The attached lists of names are not in these pages. Lost: 322; rescued: 83. Section 8
    (p32): "nothing could be done" to warn friendly forces. SPADEFISH heard about 52 depth charges from 1715 to 1812
    (I) and "the remainder" of the escorts near the sunken ship, "probably picking up survivors" (rg38-74850330/p06)
