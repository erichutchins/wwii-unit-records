  original: >-
    〇二三五機械室中央ニ被雷炸裂火災ヲ生ゼリ極力防火ニ努メタルモ及バズ火勢全艦ニ蔓延艦体左舷ニ傾キ沈没ニ瀕セルヲ以テ〇五三〇
    總員退艦ヲ命ゼリ其ノ後〇七五〇N33-54 E122-55ノ位置ニ沈没セリ。機密書類ハ全部格納筐ニ收納鎖鑰ヲ施シタル儘沈没セリ
    敵手ニ渡ル虞ナキモノト認ム 生存者准士官以上三名下士官兵六四名
  translation: >-
    At 0235 a torpedo struck amidships in the engine room and exploded, starting a fire. We fought the fire to the
    utmost, but in vain; it spread through the whole ship, she listed to port and was about to sink, so at 0530 all
    hands were ordered to abandon ship. She then sank at 0750 at N33-54 E122-55. The secret papers all went down
    locked in their cases; we judge there is no danger of their falling into enemy hands. Survivors: three warrant
    officers and above, 64 petty officers and men. (Positions written N33-55 E122-55 and N33-54 E122-55.)
  note: >-
    The rest of Kume's telegram (J01), read at 300 dpi; the last lines (from 機密書類) run on to p14. The diary's narrative (p05, read
    at 400 dpi) has 一月二十七日 海防艦久米護衛作戦ニ従事中北緯三三度五四分東経一二二度五五分ニ於テ被雷沈没 (27 January: the
    escort ship Kume, on escort operations, torpedoed and sunk at 33°54'N 122°55'E); its table of the ships'
    movements (p08) marks 沈没 for Kume on the line between the 27th and the 28th
