  note: >-
    The Navy's day-by-day summary of escort and anti-submarine events, August 1944, narrative (time, event, area,
    result), read at 600 dpi. The first character of the merchant's name is not read (a top stroke over a cross-like
    body; 寿, 亀 or 光 would fit the shape, none decided). Re-read at 1,200 dpi with JANAC's "Kotoku Maru" of the
    same tonnage in mind (janac:4/p65): 光 (光徳丸, Kōtoku) fits the foot, a leg to the left and a hooked stroke to
    the right as in 儿, but the top is blotted and does not show 光's three short strokes; not decided on this page alone, left ?. The owner's log (J04) names 光徳丸, 1,943 tons,
    sunk by torpedo on 25 August 1944 between Aparri and Manila: same day, same tonnage, same coast. The character
    here is consistent with 光 and nothing in it contradicts it, so the ship is Kotoku Maru (光徳丸); the
    transcription keeps ? because this page does not show the character clearly, nor the character before 船 in her description (空船,
    "empty", would fit). The submarine and torpedo are written in the page's shorthand (a triangle for 潜, a loop
    for 雷撃). One time for both ships. No position in figures. Compiled from signals
