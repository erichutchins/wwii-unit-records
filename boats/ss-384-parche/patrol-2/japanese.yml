    編制左ノ如シ / 七月二十八日 第一掃蕩小隊 第二一掃海隊（掃三八・掃三九） 指揮官 21??司令 / 第二掃蕩小隊 朝風 屋代 指揮官 屋代艦長 /
    第三掃蕩小隊 草垣 松輪 指揮官 草垣艦長 / 八月六日附 第一掃蕩小隊ニ鴻ヲ編入 …
  translation: >-
    It was decided to form submarine-hunting groups of four escort vessels each by the organisation order; the
    hunting groups were to keep near the convoys without being tied to them, giving indirect and direct escort, and
    to act as occasion offered to catch and attack enemy submarines. Organisation as follows. 28 July: 1st hunting
    subgroup, 21st Minesweeper Division (Minesweepers 38 and 39), commander the division's commanding officer; 2nd
    hunting subgroup, Asakaze and Yashiro, commander Yashiro's captain; 3rd hunting subgroup, Kusagaki and Matsuwa,
    commander Kusagaki's captain. From 6 August, Otori added to the 1st subgroup …
  note: >-
    The 1st Surface Escort Division's war diary for August 1944, narrative, (三) 作戦指導 (イ) 掃蕩隊; read at 220 dpi.
    Six ships in three pairs from 28 July, the day before MI-11 sailed: this is the "?D×6" hunting group beside the
    31 July entry in the Navy's summary (J04's copy), which can now be read as six escort vessels. The text does not
    name MI-11; the minesweepers' own diary (J07) has two of the six rescuing survivors and guarding Dakar Maru after
    the attack, and the August chart (p19) has Asakaze, Matsuwa, Yashiro and Kusagaki sailing from Takao with an
    "(ミ一三掃蕩隊)", the hunting group for MI-13, in the first days of August. The commander's unit abbreviation
    after 21 is not read
