    1.敵ト遭遇船団名 … ミ11(2) … / 2.被害船舶名 (イ)敵潜ニ依ル被害 沈没（20隻） 小破（5隻） 12?,176噸 … 扶桑丸(81?5)，光栄丸(1,0000)，
    吉野丸(8990)，万光丸(4471) … （小破）聖川丸，海17，第一小倉丸，だかあ丸，日永丸
  translation: >-
    1. Convoys that met the enemy: … MI-11 (2) … 2. Ships damaged: (a) by enemy submarines, sunk (20 ships), slightly
    damaged (5 ships), 12?,176 tons … Fuso Maru (81?5), Koei Maru (10,000), Yoshino Maru (8990), Manko Maru (4471)
    … (Slightly damaged) Hijirikawa Maru, Kaibokan 17, No. 1 Ogura Maru, Dakar Maru, Hiei Maru
  note: >-
    The 1st Surface Escort Division's July 1944 diary, 別表第一 (its convoy-escort statistics for the month), the
    notes under the table; read at 400-600 dpi. The month's loss list, not dated by ship: no time or position.
    What it adds to the Navy's summary (J01-J04): MI-11 met submarines twice in July ("ミ11(2)"); the four sunk with
    their tonnage, the fourth written 光栄丸 (as in J04) with 1,0000 (so written: 10,000); and No. 1 Ogura Maru and
    Dakar Maru (written だかあ丸) classed 小破, slightly damaged, not sunk. Fuso Maru's third figure is not certain
    (8195 is JANAC's figure). The total tonnage's third figure is not read. The other sunk ships on the list are
    other convoys'. The count of two encounters fits HAMMERHEAD's attack on the 30th and the boats' on the 31st,
    but the table doesn't date them
- id: J06
  source: jacar:C08030141400
  page: p19
  convoy: MI-11
  event: status
  date: 1944-08-01
  zone: I
  original: >-
    華山丸：（ミ一一）＝（第一小倉丸 被雷船）＝ サンタクルスニ避泊 ＝（第一小倉丸 被雷船）＝ コレヒドール /
    占守：（ミ一一救助）… マニラ / 春風：（單）（ミ一一）… マニラ
  translation: >-
    Kazan Maru: (MI-11), then (No. 1 Ogura Maru, the torpedoed ship), sheltered at Santa Cruz, then (No. 1 Ogura
    Maru, the torpedoed ship) to Corregidor. Shimushu: (MI-11 rescue) … Manila. Harukaze: (single), (MI-11) …
    Manila
  note: >-
    The 1st Surface Escort Division's August 1944 diary, chart 麾下艦船部隊ノ行動 (其ノ二), days 1-10 (read right to
    left). Kazan Maru stays with MI-11 into the 1st, then escorts the torpedoed No. 1 Ogura Maru, shelters at Santa
    Cruz (on the Luzon coast) about the 4th and brings her on to Corregidor about the 5th-6th: so No. 1 Ogura Maru
    stayed afloat and reached Manila Bay. Shimushu is on "MI-11 rescue" from the 1st to about the 3rd, and Harukaze
    joins MI-11 on the 1st; both rows then read Manila from about the 3rd, which is the nearest this chart comes to
    the convoy's arrival. The day columns are read from the column rules; the times on the small stamps are not
    read. Dakar Maru is not named on this page
- id: J07
  source: jacar:C08030211100
  page: p3
  convoy: MI-11
  ship: Dakar Maru
  event: rescue
  date: 1944-08-01
  zone: I
  original: >-
    （一日）掃三十八：二四〇 遭難者ヲ揚陸 一三二五 だかあ丸 救??地点ニ向ケ「パングイ」湾出港 / 掃三十九：二四二 遭難者ヲ機帆船ニ移ス、
    だかあ丸 福寿丸 警戒 / 所在：掃三八 バングイ湾 一三二五 … 19-14N 121-38E；掃三九 バングイ湾 … 二四?? 19-09N 121-16E /
    （二日）掃三十九：一三二〇 だかあ丸漂流位置ニ到着 一三四〇 だかあ丸 福寿丸 泊地附近 掃蕩任ニ就ク、一五五〇 燃料補給ノ為単艦ニテ高雄ニ回航 /
    所在：カラヤン島 仮泊（掃三八）、カラヤン（掃三九）
  translation: >-
    (1st) Minesweeper 38: [0]240, landed survivors; 1325, left Pangui Bay for the place of Dakar Maru's [rescue; two
    characters not read]. Minesweeper 39: [0]242, transferred survivors to sailing vessels; guarded Dakar Maru and
    Fukuju Maru. Position: Minesweeper 38, Pangui Bay at 1325, then 19-14N 121-38E; Minesweeper 39, Pangui Bay, then
    at about midnight [the time not read] 19-09N 121-16E. (2nd) Minesweeper 39: 1320, arrived at Dakar Maru's
    drifting position; 1340, took up a hunting patrol off the anchorage for Dakar Maru and Fukuju Maru; 1550, left
    alone for Takao to refuel. Position: Calayan Island, temporary anchorage (Minesweeper 38), Calayan (Minesweeper 39)
  note: >-
    The 21st Minesweeper Division's war diary for August 1944 (第二十一掃海隊戦時日誌), 作戦経過概要, days 1-2; read at
    330-600 dpi. Minesweepers 38 and 39 were the 1st subgroup of the escort division's submarine-hunting group formed
    on 28 July (J08), so this is the hunting group at work after the attack. What it adds: Dakar Maru (だかあ丸, as the
    escort division's loss list writes her) was still afloat on 1-2 August, adrift ("漂流位置", her drifting
    position), and was taken in to the anchorage at Calayan Island, north of Luzon, with Fukuju Maru (福寿丸, not
    otherwise in the convoy's records); so she was not sunk on the 31st, as JANAC has her, but damaged, as the Navy's
    summary and the loss list say. Both minesweepers had survivors aboard, landed at or moved from Pangui Bay, where
    the convoy had withdrawn. The drifting position itself is not written; 19-09N 121-16E is Minesweeper 39's
    position at about midnight on the 1st, 13 h 20 min before she reached the drifting ship, so not the place of the
    attack. The first figure of the two early times (written 二四〇 and 二四二) is not seen; 0240 and 0242 are the
    likely readings. The two characters after 救 are not read
