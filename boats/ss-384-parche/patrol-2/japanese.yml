  zone: I
  original: >-
    29日高雄ヲ出港シ「マニラ」ニ向ケ航行中ノ陸軍部隊其他輸送十六隻船団（護ノ艦六隻）0330頃連続敵潜ノ襲撃ヲ受ク …
    沈没 吉野丸 萬光丸 扶桑丸 光栄丸 / 被雷損傷 第一小倉丸 「ダカア」丸 / 船団ハ一時「パングイ」湾（「ルソン」島北西端）ニ避退 …
    敵潜掃蕩隊編成 ?D×6 対潜ノ集中（約80粁）協力 … 「ルソン」海峡方面敵潜跳梁始メテ以来未ダ所期戦果ヲ挙グルニ至ラズ
  translation: >-
    The sixteen-ship convoy (six escorts) carrying Army units and other transport, which left Takao on the 29th for
    Manila, was attacked by submarines one after another from about 0330. Sunk: Yoshino Maru, Manko Maru, Fuso Maru,
    Koei Maru. Torpedoed and damaged: No. 1 Ogura Maru, Dakar Maru. The convoy withdrew for a time to Pangui Bay (the
    north-west tip of Luzon). [Beside it:] A submarine-hunting group formed, ?D x 6, concentrating (about 80 km) in
    cooperation [the last characters not certain]. [Below:] Since enemy submarines began to range over the Luzon
    Strait, the results hoped for have not yet been achieved
  note: >-
    太平洋戦争経過概要 9/10 (1 July to 31 August 1944), the 2nd Demobilization Bureau's fair copy of the Navy's
    day-by-day summary, the 31st (sheet 56). The convoy entry is the same text as J01-J03, so it counts once with
    them (a copy, not a second witness); it still gives no time or place for any one ship. What it adds: the fourth
    name written plainly as 光栄丸 (the first character as the 光 of 萬光丸 beside it), and two lines in the action
    column that the July summary's page (C16120659800 p9) doesn't have: a submarine-hunting group of six ("?D×6",
    the letter before D not read; perhaps escort vessels) formed to concentrate on the area, and a judgement that
    anti-submarine work in the Luzon Strait had not yet achieved what was hoped. The hunting group is not tied to
    MI-11 in the text. Event status: the losses are J02 and J03
