# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/README.md (A patrol's Japanese record).
# MI-11 (ミ一一), Takao to Manila, sailed 0500 I on 29 July 1944 with sixteen ships and six escorts
# (convoys/mi-11/convoy.md). PARCHE and STEELHEAD (Coordinated Attack Group 17.15, with HAMMERHEAD) attacked it from
# 0332 I on the 31st. The only Japanese record of the attack found is the Navy's July summary (J01-J03): no time or
# place for any one ship. Searched and not found (5 Nov 2026): the ships' own logs in the designated-ship movement
# tables (the 昭和18-19 series, index C08050055200 pp. 1-7; the 3rd, C08050052800; the 4th, C08050101600 and
# C08050102800; the 5th, C08050105300 pp. 1-6: none of the six ships is listed; they were probably Army or
# Navy-requisitioned ships, which these tables don't cover). The 1st Surface Escort Division's July diary
# (C08030141100) has the convoy's escorts and sailing but not the attack, except a convoy "ミ一?" attacked off Cape
# Bolinao (p6), some 150 nm south of the boats' positions, not yet tied to this night. Next: the Army's shipping
# records (船舶輸送司令部, 碇泊場司令部 陣中日誌, Takao or Manila, July-August 1944); the August summary for the damaged
# ships' later fate. Searched 5 Nov 2026 (round 2): JACAR by each ship's name (no hits); the 4th Shipping Transport
# Command's Manila branch diaries (C13071797000-C13071798400 and their annexes) end in December 1943; the 31st Special
# Base Force diary (C08030266800) has September 1944 onward, not July; the August summary (C16120659900, pp. 1-7)
# has no entry for No. 1 Ogura Maru or Dakar Maru at a first read (pp. 278-284 of the copy). Found: the 2nd
# Demobilization Bureau's copy of the summary (J04), with the fourth name legible.
