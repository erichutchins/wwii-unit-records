# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/SCHEMA.md (A patrol's
# claims).
# The only record of the attack is the Navy's July summary (J01-J03; J04 is a later copy of the same text): sixteen ships attacked from about 0330 I, four
# sunk and two damaged, with no time or place for any one ship. So each claim of a sinking is paired with J02 as
# possible: the record confirms losses that night, not which attack made them.
# JANAC (postwar, secondary) lists for 31 July Koei, Manko and Yoshino Maru at PARCHE's attack position 19-10N
# 120-58E and Dakar and Fuso Maru at STEELHEAD's 18-57N 120-50E (janac:4/p64): the boats' own positions, so it
# repeats their reports and doesn't time any ship.
# PARCHE fired from 0359 to 0433 I (the times on the attack sheets; Attacks 7-8 typed 0420 and 1433, the narrative's
# 0429 and 0433). STEELHEAD fired first, at 0332 I, so J01's "about 0330" is the start of both boats' attacks.
# Attack 1 (both missed) has no entry.
# Round 3: the 1st Surface Escort Division's July loss list (J05) has the same four sunk, with tonnage, and both damaged
# ships slightly damaged (小破); its August chart (J06) has No. 1 Ogura Maru escorted to Corregidor. Still no times.
# Round 4: the 21st Minesweeper Division's August diary has Dakar Maru afloat and adrift on 1-2 August (see japanese.yml);
# it pairs with no attack of this boat's (JANAC credits STEELHEAD).
- attack: Attack 2
  record: J03
  relation: possible
  note: >-
    One explosion on an AK "similar to Panama Maru", claimed damaged. The summary has two ships torpedoed and
    damaged (No. 1 Ogura Maru, Dakar Maru); which boat damaged which is not recorded
- attack: Attack 3
  record: J02
  relation: possible
  note: >-
    Four hits on a large AO, claimed sunk. The summary's sunk list has one ship that may be a tanker, the fourth
    name, unread on the July page (J02) but written 光栄丸, Koei Maru, in the Demobilization Bureau's copy (J04);
    JANAC has Koei Maru as a tanker credited to PARCHE. Neither copy gives a time or place, so nothing separates
    this from Attacks 4 and 6
- attack: Attack 4
  record: J03
  relation: possible
  note: >-
    Two hits on a second large AO, slowed to 2 knots, later attacked again (Attack 6). No. 1 Ogura Maru, damaged in
    the summary, may be this ship; the record doesn't say
- attack: Attack 5
  record: J02
  relation: possible
  note: >-
    A medium AP or AK "similar to Yokohama Maru", seen to break in two, claimed sunk. JANAC credits PARCHE with
    Manko Maru (passenger-cargo, 4,471 tons); the summary has her sunk but doesn't say by which attack
- attack: Attack 6
  record: J02
  relation: possible
  note: >-
    The AO of Attack 4, five hits in all, claimed sunk within three minutes. If Attacks 3 and 6 both sank tankers,
    the summary's list holds at most one (the ?? Maru); one of the two may be the damaged No. 1 Ogura Maru (J03)
- attack: Attack 8
  record: J02
  relation: possible
  note: >-
    With Attack 7: a large AP "similar to HEIAN MARU", two hits down the throat, then a stern shot; sank bow first
    at 0442 I. JANAC credits PARCHE with Yoshino Maru (transport, 8,990 tons), in the summary's sunk list
- attack: Attack 3
  record: J05
  relation: possible
  note: >-
    The 1st Surface Escort Division's July loss list has Koei Maru (光栄丸) sunk at 10,000 tons, the largest of the
    four and the only one of a size with a large AO; JANAC has her a tanker. The list has no time or place, so it
    doesn't separate this attack from Attack 6
- attack: Attack 4
  record: J06
  relation: possible
  note: >-
    If the second AO, slowed to 2 knots by two hits, was No. 1 Ogura Maru, she survived: the escort division's
    July list classes her slightly damaged (小破, J05) and its August chart has Kazan Maru escorting "the torpedoed
    No. 1 Ogura Maru" to Santa Cruz and on to Corregidor about 4-6 August (J06). That would make Attack 6's sinking
    claim another ship's, or a miss. Nothing in the records names the ship of either attack
- attack: Attack 2
  record: J05
  relation: possible
  note: >-
    The escort division's list classes the two damaged ships of the summary (No. 1 Ogura Maru, Dakar Maru) as
    slightly damaged (小破), with Hijirikawa Maru, Kaibokan 17 and Hiei Maru from other attacks; no time or place
