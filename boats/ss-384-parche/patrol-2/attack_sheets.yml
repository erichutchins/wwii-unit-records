  type_attack: >-
    Night surface attack from port flank. Fired 4 bow tubes at 1800 yards. First torpedo hit forward
    disintegrating bow while second, third, and fourth hit under bridge, quarter, and stern respectively. Ship
    sank almost immediately.
  description: Large AO, three masts, low ?at stack aft.
  sunk: 1 large unidentified AO. (??)
  damaged: None.
  determined_by: Four hits sank ship in about two minutes.
  target_line: Target Draft 28' Course 290 T Speed 8 kts. Range 1800 yds (at firing)
  own_ship: Speed 17.5 knots Course 025 T Depth Surface Angle 85 P (at firing)
  spread: 1 L, 0, 1 R, 2 R (tubes 3 to 6)
  hits: Hit, Hit, Hit, Hit
  torpedo_detail: Mark 23, Mark 6-4 exploders, actuation set and actual Contact, Mark 16-1 warheads, TPX, power -.
  sea: Moderate
  overhaul: S/M,Base,PH (tubes 3-5); USS PROTEUS (tube 6)
  page: rg38-74828617/p25
  table_page: rg38-74828617/p26
  note: >-
    Narrative p15, 0407 I: "fired four bow tubes on 110 port track at range 1500 yards" - the sheet types 1800
    yds and tracks 118-134 P. attacks.csv holds the sheet's. The sunk line's class letters are faded (EU on the
    other sheets). Description's stack word is half gone ("squat" on attacks 4 and 6).
    Typed tracks 118-134 P are wider than own course 025 + gyro vs target 290 gives (107-119 P; check_attacks.py; bow tubes, so no stern correction): kept as typed.
- attack: Attack 4
  time: 0410 I
  type_attack: >-
    Night surface attack on second tanker in center column of convoy. After firing at first tanker, swung right
    to bring stern tubes to bear on this target. Fired 3 stern tubes. First torpedo missed ahead, second and
    third torpedoes hit forward and under bridge respectively slowing target to about 2 knots.
  description: Large AO, three masts, low squat stack aft.
  sunk: None
  damaged: 1 large unidentifi?? ?O. (EU)
  determined_by: Observed 2 hits fo??ard, tanker slowed to about 2 knots.
  target_line: Target Draft 28' Course 290 T Speed 8 kts. Range 1200 yds (at firing)
  own_ship: Speed 17.5 kts. Course 185 T Depth Surface Angle 100 P (at firing)
  spread: Offset, -, - (tubes 7 to 9)
  hits: Miss, Hit, Hit
  torpedo_detail: Mark 23, Mark 6-4, actuation set Ct, actual -, Ct, Ct; Mark 16-1 warheads, TPX, power -.
  sea: Moderate
  overhaul: USS PROTEUS
  page: rg38-74828617/p27
  table_page: rg38-74828617/p28
  note: >-
    Narrative p15, 0410 I: "Fired three stern tubes at this tanker on 100 port track range 1200 yards" (the
    sheet's tracks are 115-117 P, its angle 100 P). Firing intervals typed 0, 19, 11 without a unit.
    Re-read on the scan (zoom): tracks 115 P, 115P, 117 P and own course 185 T are as typed. check_attacks.py computes 61-69 S because it takes own course + gyro as the torpedo's heading; tubes 7-9 are stern tubes, so the torpedoes ran on about 185 - 180 = 005 less the gyro (359-351), and against target 290 that gives tracks of about 111-119 P, which agrees with the sheet. Kept as typed.
