# The attack data sheets' words, as typed. Hand-edited; the numbers are in attacks.csv.
# Each sheet is two pages: `page` (time, position, target and own-ship data, type of attack) and `table_page`
# (one column per torpedo). Every sheet of this patrol types the same position, Lat. 19-10 N Long. 120-58 E,
# and the date July 31, 1944, zone I.
# attacks.csv units, as typed: courses degrees (T), speeds kts, ranges yds, drafts and depth set ft; gyro as typed
# with its side (13° L -> 13L); track with its side (109 P -> 109P); interval in seconds between torpedoes, typed
# "0", "10 sec.", "19" (Attack 2's "3 minutes" written 180); since_first is the running sum. "Type Spread" is typed
# either per torpedo as an offset (1 L, 0, 2 R -> offset) or as the word "Offset" or "-" (-> spread).
# Power typed "-" is kept as -. Own depth "Surface" kept. Halves written .5 (1½ kts -> 1.5).

- attack: Attack 1
  sheet_heading: TORPEDO ATTACK NO. 1 and 2 (one sheet for both)
  time: 0359-0402I
  type_attack: >-
    Night surface attack on large escorted convoy. Commenced firing bow tubes just as target began swinging left.
    Checked fire and swung right to bring stern tubes to bear. Fired tube #7 after target had steadied on a
    southerly course.
  description: Medium AK, MKFKM, composite superstructure with tall thin stack similar to Panama Maru.
  sunk: None.
  damaged: Medium AK (EU), similar to Panama Maru.
  determined_by: 'One timed explosion about 2 minutes after firing tube #7.'
  target_line: >-
    Target Draft 26' Course (1) 280 T (2) 175 T Speed 8 kts 8 kts Range 480 yds (at firing) 2000 yds
  own_ship: 'Speed 16 kts Course (1) 3?? (2) 0?? Depth: Surface Surface Angle 140 P (at firing) 140 P'
  spread: 1 L, 1 R (tubes 1 and 2, "First Attack")
  hits: Miss, Miss
  torpedo_detail: Mark 23 torpedoes, Mark 6-4 exploders, actuation set Contact, actual -, Mark 16-1 warheads, TPX, power High.
  sea: Moderate
  overhaul: USS PROTEUS
  remarks: >-
    Obtained one timed explosion about two minutes after firing tube #7. No other confirmation of damage except
    that we were unable to locate this target after other attacks were completed.
  page: rg38-74828617/p23
  table_page: rg38-74828617/p24
  note: >-
    Own course: re-read on a close zoom, line (1) shows only a 3 and line (2) only a 0 (half-struck, like a C); nothing legible follows either figure. Written 3?? and 0??.
    The narrative (p15, 0359 I) says the first two torpedoes were seen going to miss astern, so fire was checked.
    Target (1) course 280, 480 yds is given to tubes 1-2 and target (2) course 175, 2000 yds to tube 7: the
    narrative fires tube 7 at 0402 "at range 2000 yards" and the sheet's words have the target steadied on a
    southerly course. Narrative 0357 I: the SJ lost the target at 450 yards before the bow shots.

