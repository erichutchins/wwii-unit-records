- attack: Attack 6
  time: 0421 I
  type_attack: >-
    Night surface attack. This was a second attack on the tanker previously damaged with two hits in fourth
    attack. Approached from port quarter, passed close astern and after being subjected to heavy machine gun
    fire brought stern tubes to bear. Fired three stern tubes at short range, all hit from amidships aft. Ship
    went under within three minutes.
  description: Large AO, three masts, low squat stack aft.
  sunk: 1 large unidentified AO (EU)
  damaged: None.
  determined_by: 'Three hits in tank? already damaged in attack #4. Total five hits. ??ip sank in 3 minutes.'
  target_line: Target Draft 28' Course 270 T Speed 1½ kts. Range 700 (at firing)
  own_ship: Speed 17.5 Course 320 T Depth Surface Angle 80 S (at firing)
  spread: 2 R, 0, 2 L (tubes 8 to 10)
  hits: Hit, Hit, Hit
  torpedo_detail: Mark 23, Mark 6-4, Contact/Contact, Mark 16-1 warheads, TPX, power -.
  sea: Moderate
  overhaul: S/M,Base,PH (tube 8); USS PROTEUS (tubes 9, 10)
  page: rg38-74828617/p31
  table_page: rg38-74828617/p32
  note: >-
    Narrative p15, 0419-0421 I: the tanker opened up at about 500 yards with "4 or 5" gun, 20mm and 40mm; "At 800
    yards range fired three stern tubes at this menace. All hit". The sheet types range 700.
    Re-read on the scan (zoom): 100 S, 93 S, 86 S and gyros 48 R, 43 R, 35 R are as typed. check_attacks.py's 82-95 P takes the bow heading; these are stern tubes (8-10): heading 320 - 180 = 140 plus gyro (188, 183, 175) against target 270 gives about 98, 93, 85 S, agreeing with the sheet. Kept as typed.
- attack: Attack 7
  sheet_heading: TORPEDO ATTACK NO. 7 and 8 (one sheet for both)
  time: 0420-1433 I
  type_attack: >-
    Night surface attack on large AP in starboard column of convoy. From position dead ah??d at 1800 yards fired
    three shots down the throat. Two hits were obtained stopping the target. Then closed on starboard bow and
    swung out to the left to bring stern tube to bear. Fired last stern shot at 1100 yards for a bulls eye. Ship
    sank ten minutes later, bow first.
  description: >-
    Large AP, composite superstructure with large conspicuous bridge structure forward and low fat stack,
    similar to HEIAN MARU.
  sunk: 1 large unidentified AP (EU), similar to HEIAN MARU.
  damaged: None.
  determined_by: 'Two hits in attack #7 and one hit in attack No. 8. Ship observed to sink bow first ten minutes later.'
  target_line: Target Draft 28' Course 215 T Speed 8 kts. Range 1800-1100 (at firing)
  own_ship: Speed 17.5 knots Course 035 T / 320 T Depth Surface Angle 0 / 180 (at firing)
  spread: Offset, Offset, Offset (tubes 3 to 5)
  hits: Miss, Hit, Hit
  torpedo_detail: Mark 23, Mark 6-4, actuation set Contact, actual -, Contact, Contact; Mark 16-1, TPX, power High.
  sea: Moderate
  overhaul: USS PROTEUS
  page: rg38-74828617/p33
  table_page: rg38-74828617/p34
  note: >-
    The time is typed "0420-1433 I", kept in attacks.csv (attack 7 at 0420, attack 8 at 1433). The narrative
    (p16) gives 0429 I ("Commenced firing bow tubes. First fish started off to the right so checked fire and
    spotted on, then fired two more") and 0433 I ("Fired one stern shot on 90 starboard track at 800 yards"),
    so 1433 is read as a typo for 0433 (positions.csv has the fix). Ranges: the first line's 1800 for attack 7,
    the second's 1100 for attack 8 (narrative 800). Own course and angle: 035 T / 0 for attack 7, 320 T / 180
    for attack 8. Narrative: the big AP stopped, down by the bow, then at 0442 I "the stern came up and went
    straight down, head first" (13 minutes after 0429, 9 after 0433).

