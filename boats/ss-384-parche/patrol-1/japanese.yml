# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/README.md (A patrol's Japanese record).
# PARCHE's attack sheets are in zone I, the Japanese zone. J01, J02, J03, J04 and J07 repeat readings first made for
# BANG's Patrol 1 (ss-385-bang/patrol-1/japanese.yml J10, J11, J12, J14, J15), cited to the same pages; J05 is the
# reading made for TINOSA's Patrol 6 (its J04). Searched and not found: movement logs for Kinrei Maru (金嶺丸), Toyohi
# Maru (豊日丸) and Daibu Maru (大武丸) (jacar.py search on each name, no hits).
- id: J01
  source: jacar:C08030140600
  page: p30
  convoy: TAMA-17
  event: loss_list
  date: 1944-04
  zone: I
  original: 敵潜遭遇船団名 … タマ17(2) / 被害船舶名 潜 沈没 … 竹川丸(1930) 日達丸(2859)
  translation: >-
    Convoys that met enemy submarines … TAMA-17 (twice). Ships sunk by submarine … Takegawa Maru (1,930 GRT),
    Nittatsu Maru (2,859 GRT)
  note: >-
    1st Surface Escort Division, attached table 1, April 1944 (BANG's Patrol 1 J10). Both TAMA-17 losses were
    before PARCHE's attack (2240 I on the 29th and 0419 I on the 30th, both BANG's)
