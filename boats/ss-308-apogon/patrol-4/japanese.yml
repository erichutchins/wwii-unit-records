# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/SCHEMA.md (A patrol's Japanese record).
# From the Navy's day-by-day summary of escort and anti-submarine events for July 1944 (大東亜戦争経過概要（護衛対潜関係）,
# jacar:C16120659800) and the 1st Surface Escort Division's war diary for July 1944 (第一海上護衛隊戦時日誌,
# jacar:C08030141100): its convoy chart 別表第七 (菲島北航路, Philippines north route, p33). Zone I (Tokyo time)
# throughout, as APOGON's report is.
# One convoy, the one PIRANHA attacked at 0656 I the same morning (PIRANHA's Patrol 1, japanese.yml J01-J02, reads
# these same entries; they are repeated here as APOGON's own ids). Its line on the chart is headed モマ01 (MOMA-01).
# Searched and not found: anything in the summary's 12th block (C16120659800 p5) near 0300 (its entries are timed
# 0100, 1330, 0935 and 0731: Guam, the Southwest Area Fleet's flag, Nichiran Maru, and a ship west of Palau); no ship
# damaged by ramming or by torpedo on the 12th in either record; the chart's MOMA-01 head has its escort and
# ship-count cells blank. The general summary's fair copy for 7-20 July (jacar:C16120643900, pp. 20-22, the
# 10th-11th) has no convoy entries on the pages read; its 12th not yet read. Not yet read: Nichiran Maru's own
# movement record (the designated-ship movement tables, 第5回 タ～ワの部? にちらん is filed under ナ).
