# The attack data sheets' words, as typed. Hand-edited; the numbers are in attacks.csv.
# Each sheet is two pages: `page` (time, position, target and own-ship data, type attack) and `table_page`
# (one column per torpedo). attacks.csv cites `page`, the attack's row in positions.csv.
# attacks.csv units, as typed on these sheets: courses degrees (T), speeds kts, ranges yds, depths and drafts ft;
# interval in seconds since the torpedo before ("Ten Seconds" or "10 sec." -> 10, "8 sec." -> 8), the first
# torpedo's left blank where the sheet types the interval once for the salvo. Gyro 182°30' kept as 182-30.
# power typed "Single Power Torpedoes" (Single Power). The sheets type zone I for every attack.

- attack: Attack 1
  type_attack: >-
    Contacted first by SJ radar. Tracked and dived ahead of convoy for normal night periscope submerged approach.
    Used T.D.C. and spread by "continuous bearing method" with periscope.
  description: >-
    At least a seven ship convoy with four or more unknown-type escorts. Contact made by SJ radar at range of
    39,500 yards. Visibility from poor to very good (dependent on obscurity of moon).
  sunk: None.
  damaged: None.
  determined_by: ''
  target_line: 'Target Draft: unknown Course: 230°T Speed: 8 knots Range: 1030 yds.'
  own_ship: 'Speed: 4 knots Course: 320°T Depth: 60 feet Angle: 2° down'
  spread: Continuous Bearing
  sea: Force 6
  overhaul: U.S.S. HOWARD W. GILMORE
  page: rg367-74843922/p24
  table_page: rg367-74843922/p25
  note: The "Damage Determined by" line is blank. Firing interval typed once, "Ten Seconds"

- attack: Attack 2
