  note: >-
    Same summary, the day's entries for the 29th (the day is marked on p15, and the 30th begins at the foot of p16).
    It repeats J01's table and counts once with it. The same day's entries list Notoro, Sarawak Maru and Miri Maru
    torpedoed (Notoro moderate damage; Sarawak and Miri Maru moderate damage, 中破, where the escort division's own
    notes say minor, 小破, jacar:C08030141000 p33): BANG's convoy HI-67 and FLASHER's Notoro. No other torpedoing on
    the 29th falls north of Luzon
