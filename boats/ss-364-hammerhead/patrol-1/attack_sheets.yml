# The attack data sheets' words, as typed (section (H) ATTACK DATA, report pages 27-31). Hand-edited; the numbers
# are in attacks.csv. attacks.csv cites `page`, the attack's row in positions.csv.
# attacks.csv units, as typed: courses degrees (T), speeds kts, ranges yds, depths and drafts ft; interval in
# seconds since the torpedo before (typed "10s", the first "-"); depth_set as typed (5, 8); power typed "-" kept
# as -; own depth typed "Surface" kept as Surface. Halves and quarters typed as fractions (354½, 1¼°) are written
# .5 and .25. The "Type Spread" row is typed per torpedo as an offset (1° R, ½° L, 3/4° L), so attacks.csv's offset
# holds it; tube 7 of Attack 1 types a faded mark read as 0.
# The gun attack report (p34, 9 July) is in positions.csv (Gun Attack 1); a gun attack has no rows here.

- attack: Attack 1
  type_attack: >-
    Daylight periscope attack. Three mark 18 torpedoes were fired at the AO. Torpedoes were tracked by sound to
    pass under the target.
  description: >-
    1 AO of the HUNAGAWA class as listed under miscellaneous coastal freighters and tankers section of ONI 208J
    (Revised) E.C. and 2 escorts of the PC 40 - 44 class.
  sunk: None.
  damaged: None.
  determined_by: '-'
  target_line: TARGET DRAFT 6 COURSE 170 SPEED 6.8 RANGE 3080 (AT FIRING)
  own_ship: SPEED 2.5 COURSE 250 DEPTH 64 ft. ANGLE 0° (AT FIRING)
  torpedo_detail: >-
    Mark 18-1 torpedoes (serials 54384, 54310, 54341), Mark 4-2 exploders (7947, 8371, 8388), actuation set
    Contact, actuation actual -, Mark 18 warheads (1772, 1891, 1381), TPX.
  sea: '1'
  overhaul: P.H.
  remarks: Tracked to target by sound. Passed under the target.
  page: rg367-74822943/p30
  table_page: rg367-74822943/p30
  note: >-
    Time: the sheet types 0851 I; the narrative (p15) has "0853 I Attack #1. Fired 3 torpedoes from stern tubes
    range 3000 yds., 95° starboard track ... depth setting 5 feet." The sheet's tracks (104 S, 106 S, 105 S) are
    about 15° wider than the narrative's 95°; check_attacks, computing as if bow tubes, gets about 90 P, and for
    stern tubes (own + 180 + gyro) about 89-91, so the typed tracks disagree either way: kept as typed. The
    position also disagrees: the sheet types 21 - 18N. 121 - 10E., the ship contact table (p23) 20 - 59N 120 - 27E
    (the target), and the narrative (p15) a faded 20 - 5?N 121 - ??E. The density-layer table has her at 20°53'N
    121°28'E at 0000 GCT (0800 I) the same morning. The table continues on p31 (warheads, interval, spread, sea,
    overhaul, remarks). The narrative names the target "HANAGAWA MARU Class about 900 tons"; the sheet HUNAGAWA.
    0901 I she was bombed by an unseen plane (aircraft contact #18) and received four depth charges 0907-0915.

- attack: Attack 2
  type_attack: >-
    Surface radar attack was made on the largest ship in the convoy using 6 Mark 23 torpedoes from the bow tubes.
    Four hits were made on the target
  description: >-
    Convoy consisting of 14 ships and 5 radar equipped escorts. [Conv]oy was ? ? in 3 columns of ships with five
    escorts located ahead [?] on each ? ? ? .
  sunk: 1 passenger freighter of the KANSAI MARU type as listed on page 75 of ONI 208-J (Revised).
  damaged: None.
  determined_by: >-
    Target was seen to sink by the Commanding Officer, Junior Officer of the Deck and Quartermaster. Target pip
    disappeared from radar screen.
  target_line: TARGET DRAFT 11 COURSE 215 SPEED 8 RANGE 4100 (AT FIRING)
  own_ship: SPEED 14 COURSE 250 DEPTH Surface ANGLE ____ (AT FIRING)
  torpedo_detail: >-
    Mark 23 torpedoes (serials 49607, 41217, 49428, 52998, 41172, 49708), Mark 6-4 exploders (8381, 6812, 4339,
    12797, 18520, 2712), actuation set Contact, actuation actual Contact, None, Contact, None, Contact, Contact,
    Mark 16-1 warheads (11713, 6812, 3365, 11970, 16999, 13415), TPX.
  hits: Hit, Miss, Hit, Miss, Hit, Hit
  sea: '3'
  overhaul: P.H.
  remarks: None.
  page: rg367-74822943/p31
  table_page: rg367-74822943/p32
  note: >-
    The description's second and third lines are too faded to read on the scan (zoomed): the words in brackets
    are guesses from the letters left, the rest ?. The narrative (p16) gives the formation in full: "3 columns of
    ships of 4 or 5 ships in each column with radar escorts ahead and on each bow and quarter". Narrative 0531 I:
    "With range of 4200 yds. and angle on bow of 140° port picked out largest ship in port column (and I believe in
    convoy) a passenger freighter type (Page 75 ONI 208J Revised) E.C. and fired six torpedoes"; 0534 "Heard first
    of four explosions about 10 seconds apart"; 0540 "observed first target sinking by stern and big smoke cloud.
    Pip on radar disappeared soon afterwards at 4000 yds." The sheet's range is 4100, the narrative's 4200. The
    target course (215) is the sheet's; the convoy's base course was 175 (narrative 0410, ship contact 12; Attack
    3's sheet). Typed tracks are about 4° wider than own course + gyro gives (152 P typed, 148 P computed for tube
    1): kept as typed. The serial 6812 is typed for both tube 2's exploder and its warhead.

- attack: Attack 3
  type_attack: >-
    Surface radar attack on next largest ship in convoy after KANSAI MARU, was hit. Four Mk 18's fired from the
    stern tubes missed the ship but three of them were heard to explode hitting ships in next column.
  description: >-
    Same convoy as described in attack #2. In this attack the ship next in column simular to the ZUIYO MARU as
    listed on page 126 of ONI 208-J (Revised) was selected as the target.
  sunk: None.
  damaged: Two AK's of the HIYAMA MARU Class as listed on page 199 of ONI 208-J (Revised) E.C.
  determined_by: >-
    Abrupt slowing down of both ships, leading ship swinging erratically to port and appearing to list. Smoke over
    convoy preventing positive identification of smoking after being hit. Radar unable to pick up at 7000 yds.
  target_line: >-
    TARGET DRAFT 20 ft. COURSE 175 SPEED 8 RANGE 2780 (AT FIRING) 5900 - 6100 (to ships hit)
  own_ship: SPEED 15 COURSE 060 DEPTH Surface ANGLE - (AT FIRING)
  torpedo_detail: >-
    Mark 18-1 torpedoes (serials 54312, 54342, 542?? , 54360), Mark 4-2 exploders (8239, 8276, 83?? , 8422),
    actuation set Contact, actuation actual Contact, Contact, None, Contact, Mark 18 warheads (1348, 1862, 1669,
    1860), TPX.
  hits: Miss *, Miss*, Miss, Miss*(See remarks)
  sea: '3'
  overhaul: P.H.
  remarks: >-
    Target fired at changed course shortly after firing presenting 90° angle on bow and appeared to increase to
    avoid target sunk with bow tubes. However, torpedoes 7, 8, and 10 hit ships in next column.
  page: rg367-74822943/p32
  table_page: rg367-74822943/p33
  note: >-
    Time: the sheet types 0537 I, the narrative (p16) "0538 I At 3300 yds. angle on bow 135° port fired 4 stern
    tubes at second target" (range 3300 against the sheet's 2780). Own course is faint: read 060 on the zoomed scan,
    and own course + gyro + 180 against the target's 175 gives the typed tracks (137 P computed, 135 P typed) only
    with 060. The type-attack line is faded in places ("radar attack", "hit. Four Mk 18's", "were heard"), read
    from the letters left. Tube 9's torpedo and exploder serials are blotted. The remarks type "chertly" (shortly).
    Narrative 0539-0545 I: the target turned left to 90° port; ships of the port and center columns overlapped
    "with two ships astern of our target about 200 yds", the second column "between 5800 and 6300 yds."; 0545 "Heard
    3 heavy torpedo explosions in direction of second column ... The leading ship of the two in the center column
    was observed to immediately swing to port and slow down precipitously listing slightly to port ... target
    astern of him appeared to maintain same distance of open water evidently slowing down." p17: "These two ships
    were AK's and were definitely determined by bearings to be at least 420 ft. long. I fully believe that we sank
    the one which swung rapidly and listed and definitely damaged or probably sunk the other one ... simular to the
    HIYAMA MARU about 6000 tons (page 199 of ONI 208J Revised) E.C."
