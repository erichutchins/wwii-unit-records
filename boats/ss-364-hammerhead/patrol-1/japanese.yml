# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/README.md (A patrol's Japanese record).
# HAMMERHEAD fired at a coastal oiler with two PCs at 0851 I on 29 July (Attack 1, no hits) and at convoy MI-11
# (ミ一一, Takao to Manila) at 0531 and 0537 I on 30 July (Attacks 2-3, 20-52N 120-47E), a day before PARCHE and
# STEELHEAD attacked it.
# Searched (5 Nov 2026), line by line for the 29th and 30th: the Navy's July 1944 summary (大東亜戦争経過概要（護衛対潜
# 関係）, jacar:C16120659800 pp. 8-9) and the 2nd Demobilization Bureau's fair copy (jacar:C16120644000, the 29th on
# p28, the 30th on p30, the 31st on p33). Neither has an attack on a convoy north of Luzon or south of Formosa on the
# 30th, any ship torpedoed there that day, or the 29th's oiler. The 30th has two entries: Kokuyo Maru (國洋丸, B
# tanker 10,026 tons, in ballast) torpedoed and sunk at 0210 in the southern Sulu Sea on passage Manila to Takao,
# and some thirty enemy ships gathered at Mapia (1530, about 0-20S 132-12E): neither is HAMMERHEAD's. The 29th's
# only anti-submarine entry near Formosa is J03, off the north-west coast, some 200 nm north of her. MI-11's entry
# (J01, J02) is on the 31st and dates the attack from about 0330 that day. Not searched yet: the convoy's escorts'
# own reports for the 30th; the 1st Surface Escort Division's July diary (C08030141100) for the 30th.
# Round 3 (5 Nov 2026): the 1st Surface Escort Division's July statistics and loss list (J04 here; p27) and its August
# chart (J05; C08030141400 p19): still no time or place for any one ship.
# Round 4 (5 Nov 2026): the 21st Minesweeper Division's August diary (J06; C08030211100 p3) has Dakar Maru afloat and
# adrift on 1-2 August, taken in to Calayan Island; the escort division's August narrative (J07; C08030141400 p11)
# gives the hunting group of six formed on 28 July. Searched, no hits: JACAR for 占守, 華山丸, 春風, 屋代, 草垣 war
# diaries or action reports (1944-07 to 1944-09). Next: the 21st Minesweeper Division's July diary (in C08030210300?).
