  original: >-
    華山丸：（ミ一一）＝（第一小倉丸 被雷船）＝ サンタクルスニ避泊 ＝（第一小倉丸 被雷船）＝ コレヒドール /
    占守：（ミ一一救助）… マニラ / 春風：（單）（ミ一一）… マニラ
  translation: >-
    Kazan Maru: (MI-11), then (No. 1 Ogura Maru, the torpedoed ship), sheltered at Santa Cruz, then (No. 1 Ogura
    Maru, the torpedoed ship) to Corregidor. Shimushu: (MI-11 rescue) … Manila. Harukaze: (single), (MI-11) …
    Manila
  note: >-
    The 1st Surface Escort Division's August 1944 diary, chart 麾下艦船部隊ノ行動 (其ノ二), days 1-10 (read right to
    left). Kazan Maru stays with MI-11 into the 1st, then escorts the torpedoed No. 1 Ogura Maru, shelters at Santa
    Cruz (on the Luzon coast) about the 4th and brings her on to Corregidor about the 5th-6th: so No. 1 Ogura Maru
    stayed afloat and reached Manila Bay. Shimushu is on "MI-11 rescue" from the 1st to about the 3rd, and Harukaze
    joins MI-11 on the 1st; both rows then read Manila from about the 3rd, which is the nearest this chart comes to
    the convoy's arrival. The day columns are read from the column rules; the times on the small stamps are not
    read. Dakar Maru is not named on this page
