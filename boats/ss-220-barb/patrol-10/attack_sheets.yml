# The attack data sheets' words, as typed. Hand-edited; the numbers are in attacks.csv.
# Each sheet is one page (rg38-74803310/p25-p30): time, position, target and own-ship data, type attack and the
# torpedo table together, so `page` and `table_page` are the same. attacks.csv cites `page`, the attack's row in
# positions.csv. Attack 2-D has its own sheet (p27), with its own time and position, and its own ref.
# attacks.csv units, as typed on these sheets: courses degrees (T), speeds kts, ranges yds, depths and drafts ft;
# fractions written as decimals (356½ -> 356.5, 1 3/4 -> 1.75, 7½ -> 7.5). Own depth typed "45'" etc., written 45.
# Depth set typed "6" (p25) or "8'", "10'", "3'" (p26-p30), written as typed. Power typed "--".
# Firing interval typed "0s", "10s", "35s": the gap since the torpedo before (written in `interval`); a "0s" after
# the first starts the next part or salvo.
# "Type spread" typed per torpedo as a kind ("Div.", "None"): written in `spread`; `offset` is blank.
# The sheets type no zone; the narrative's times are ITEM (positions.csv has I).
# Where a sheet types data per part (A, B, C, D), each torpedo's row carries its part's own-ship and target data.
# The sheets also type each torpedo's serial numbers, exploder, actuation and warhead; not transcribed here.
# The gun attack's sheet (p32) is in positions.csv (Gun Attack 1); a gun attack has no rows here.

- attack: Attack 1
  heading: TORPEDO ATTACK NO. 1-A-B-C-D.
  type_attack: >-
    A-Night submerged- Radar and periscope. B-Night surface - Radar and periscope. C-Night surface - Radar and
    periscope. D-Night submerged - periscope.
  description: >-
    Large AP(Aikoku Maru Class) MKFKM type. Target cruising singly. Contact radar. Visibility-excellent.
  sunk: Large AP (Aikoku Maru Class)(EC)-10,400 tons.
  determined_by: Target seen to sink by CO, PCO and other conning tower personnel.
  target_line: >-
    Target Draft: 29' Course: A-105 B-039 C-088 D-075 Speed: A-12 B-1`3/4 C-1 3/4 D-0 Range: A-2560 B-970 C-750
    D-1455 (at firing)
  own_ship: >-
    Speed: A-4 B-7½ C-5 D-2½ Course: A-179 B-102 C-102 D-348 Depth: A-45' B-Surface C-Surface D-63' Angle: A-1°
    down B- - C-- D-0° (at firing)
  sea: "2"
  overhaul: U.S.S. HOWARD W. GILMORE.
  remarks: >-
    Spread computed for 50 yds. between torpedoes along target. Target turned 47° toward 1 m and 20s after firing
    first spread. Target turned away after second single was fired. No speed red. used.
  page: rg38-74803310/p25
  table_page: rg38-74803310/p25
  note: >-
    Time 0334, 10 Nov. 1944, 33-23.6N 129-03.8 E: the sheet types one time for all four parts; the narrative times
    the attack from 0334-30 (part A) to 0409 (part D), so parts B-D carry the sheet's 0334 in attacks.csv though
    they were fired later. The position is Ship Contact 1's (p20, 0245, 33-23.6 / 129-03.8), the target at first
    contact, not a fix at firing. Tube 1 (part B) erratic typed "Yes- Broached and swung left." Its typed track 149P
    disagrees with own course 102 + gyro 356½ against target course B-039 (check_attacks computes 120½P); the 039
    is typed heavily over another figure and is kept as typed. Target speed B typed "1`3/4" (a stray mark before
    the 3/4), written 1.75 like C. Tube 5's power is "--" typed over another mark. Gyro D typed "181½". p31 (27 a)
    repeats tube 1: "One torpedo (serial #54343) fired from #1 tube while on the surface in a calm sea, speed 7.5
    knots, depth set 6 feet, gyro angle 356½, broached and swung left."

- attack: Attack 2
  heading: TORPEDO ATTACK NO. 2,A,B,C.
  type_attack: Night surface - radar.
  description: >-
    A- Large AK (EU) B-Medium AK(EU) C-Medium AK(EU) Convoy of four escorts and eleven large,medium, and small
    freighters. No air coverage. Visibility- poor. Contact radar.
  sunk: A- Large AK(EU). B-Medium AK(EU). C-Medium AK(EU).
  determined_by: Visual and Radar observations.
  target_line: >-
    Target Draft: A-25' B-20' C-20' Course: A-171 B-171 C-171 Speed: A-9 B-9 C-9 Range: A-2700 B-3240 C-3250 (At
    firing)
  own_ship: "Speed: A-9 B-9 C-9 Course: A-085 B-083 C-090 Depth: Surface. Angle: --- (At firing)"
  sea: "6"
  overhaul: U.S.S. HOWARD W. GILMORE.
  remarks: >-
    Spread computed for 50 yds. between torpedoes along target track. One half speed reduction used. Master gyro
    follow-up system out. Excessive range used because escort on collision course.
  page: rg38-74803310/p26
  table_page: rg38-74803310/p26
  note: >-
    Time 0140, 12 Nov. 1944, 31-39.0N 125-36.0E. The narrative has attack No. 2 at 0140-0153 in parts A-D; the
    sheets type A, B, C here and D on its own sheet (p27, Attack 2-D, 0153, 31-29.0N 125-36.0E). The position here
    is Ship Contact 2's at 2255 the evening before (p20, "31-39-0", 125-36.0), not a fix at firing: 2-D, 13 minutes
    later, is 10 miles south at the same longitude, so this row is off the track (on_track=no). Tube 5's track
    typed "82 S" and tube 6's "83 S", each with the second figure typed over another; tube 5's power is blank (the
    others "--"); tube 5's "Hit" has a stray mark. Tubes 3 and 4 (part B) type 91S and 92S; check_attacks computes
    83S from own course 083, gyros 351 and 351½ and target course 171 (8° apart); kept as typed. p31 (27 a): "In
    attacks #2 and #3, nine torpedoes were fired across and two into a state six sea for six hit."

- attack: Attack 2-D
  heading: TORPEDO ATTACK NO. 2-D
  type_attack: Night surface - radar, with TBT bearings.
  description: Large AK(EU). In same convoy as targets of attacks 2-A-B-C.
  damaged: Large AK (EU).
  determined_by: Visual observation.
  target_line: "Target draft: 25' Course: 265 Speed: 9 kts. Range: 2300 (At firing)"
  own_ship: "Speed: 12 kts. Course: 178 Depth: Surface. Angle: --"
  sea: "6"
  overhaul: U.S.S. HOWARD W. GILMORE.
  remarks: >-
    Spread computed for 50 yds. between torpedoes along target track. One half speed reduction used. Master gyro
    follow-up system out.
  page: rg38-74803310/p27
  table_page: rg38-74803310/p27
  note: >-
    Time 0153, 12 Nov. 1944, 31-29.0N 125-36.0E (the latitude's first digit faint). The narrative's part D of
    attack No. 2 ends at 0153, agreeing. Range typed 2300 (the 3 could be a 5). p31 (27 a): "During the reload
    after attack #2, one torpedo could not be loaded into the tube due to a bulged section of the after body just
    aft of the jointring. However, later the tube rollers were lowered, the torpedo loaded, and fired for a hit."

- attack: Attack 3
  heading: TORPEDO ATTACK NO. 3
  type_attack: Night periscope.
  description: Medium AK(EU). Small AK (EU). In same convoy as targets of attack 2. Targets overlapping.
  sunk: Small AK(EU).
  damaged: "Ship Probably Sunk: Medium AK(EU)."
  determined_by: >-
    Timed hits on both targets. Saw small AK blow up and sink. Heard distinct and separate sets of breaking up
    noises for both.
  target_line: "Target Draft: 25' Course: 300 Speed: 7.7 Range: 300 yds. (At firing)"
  own_ship: "Speed: 4 Course: 152 Depth: 65' Angle: 0°"
  sea: "6"
  overhaul: U.S.S. HOWARD W. GILMORE.
  remarks: >-
    Spread computed for 50 yds. between torpedoes along target track. One half speed reduction used. Master Gyro
    follow-up system out.
  page: rg38-74803310/p28
  table_page: rg38-74803310/p28
  note: >-
    Time 0412, 12 Nov. 1944, 31-29.0N 125-19.0 E; the narrative's 0412 agrees. The longitude's third digit is
    typed over (125 or 126); 125 read. Range typed "300 yds." Tubes 8 and 10 type 152P and 159P; check_attacks
    computes 147P and 163P (4-5° apart); kept as typed. The angle typed "0°" with the zero slashed.

- attack: Attack 4
  heading: TORPEDO ATTACK NO. 4
  type_attack: Night surface radar.
  description: >-
    Aircraft Carrier (Shokaku Class)(EC) . Cruising with three or possibly four escorts. Contact - Radar.
    Visibility - Fair.
  damaged: Aircraft Carrier (Shokaku Class)(EC)- 29,800 tons.
  determined_by: Visual observation and timed hit.
  target_line: "Target draft: 21' Course: 055 Speed: 19.4 Range: 2680 (At firing)"
  own_ship: "Speed: 8.5 Course: 340 Depth: Surface. Angle: 0"
  sea: "5"
  overhaul: U.S.S. HOWARD W. GILMORE.
  remarks: >-
    Spread computed for 50 yds. between torpedoes along target. Target zigged away about three minutes after
    firing. No speed reduction used.
  page: rg38-74803310/p29
  table_page: rg38-74803310/p29
  note: >-
    Time 2326, 15 Nov. 1944, 32-15.7 N 126-38.5 E. The narrative (p16-p17) types 2323 'TORPEDO ATTACK #4 ...
    Fired tubes 5,4,3,2,1 on a 131 starboard track, range 2680 yds, gyros 25° right' and 2327-20 'One hit timed';
    the sheet's 2326 is three minutes after the narrative's firing time (the 6 is clear on the scan). The position
    is Ship Contact 4's at 2249 (p20), the carrier at first radar contact, 37 minutes before firing; off the track
    (on_track=no). Gyros typed 025, 027½, 030, 032, 034 (degrees right).

- attack: Attack 5
  heading: TORPEDO ATTACK NO. 5
  type_attack: Day submerged - periscope.
  description: >-
    Two one thousand ton coastal freighters with two escorts. Smoke contact. Visibility - excellent.
  sunk: None.
  damaged: None.
  target_line: "Target Draft: 10' Course: 140 Speed: 6 Range: 1750 (At firing)"
  own_ship: "Speed: 4 Course: 262 Depth: 65' Angle: 0°"
  sea: "2"
  overhaul: U.S.S. HOWARD W. GILMORE.
  remarks: Fired one torpedo at each ship. Misses due to fire control error. One half speed reduction used.
  page: rg38-74803310/p30
  table_page: rg38-74803310/p30
  note: >-
    Time 1213, 17 Nov. 1944, 31-19.5N 130-06.1 E; the narrative (p18) 1213 agrees ('Fired tubes 9 and 10 ... Both
    missed'). The position is Ship Contact 5's at 1052 (p20); off the track (on_track=no). Tube 10 fired 35 seconds
    after tube 9 ("35s").
