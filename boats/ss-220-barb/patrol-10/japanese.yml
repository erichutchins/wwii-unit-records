- id: J08
  source: combinedfleet:junyo
  ship: Junyo
  event: attacked_no_damage
  date: 1944-11-15
  time: '2249'
  zone: I
  translation: >-
    At 2249, en route to Kure, detected by BARB; Fluckey misidentifies the carrier as Shokaku class and claims one
    hit on the stern at 2327, but no damage is sustained
  note: >-
    Secondary source only (combinedfleet.com Junyo TROM, Tully and Casse; archived copy
    https://web.archive.org/web/2015/http://www.combinedfleet.com/junyo.htm). Zone assumed I like the other Japanese
    records. Junyo, with Tone and destroyers, was a fleet unit, not under the 1st Surface Escort Division, so its
    absence from that diary is expected. No Japanese primary record of this night has been found. Blair's
    identification of the target as Shinyo does not fit: the escort division's chart has HI-81 unattacked that night
    and Shinyo lost on the 17th (ss-393-queenfish/2 J02)
