# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/README.md (A patrol's Japanese record).
- id: J01
  source: jacar:C08030141700
  page: p48
  ship: Gokoku Maru
  convoy: TAMO-28A
  event: sank
  date: 1944-11-10
  zone: I
  original: 護國丸 10438 沈没 1?日 03??分 古志岐灯台 ?0度 7浬 タモ28A
  translation: 'Gokoku Maru, 10,438 tons, sunk, 1?th 03??, Koshiki light ?0°, 7 nautical miles; convoy TAMO-28A'
  note: >-
    1st Surface Escort Division war diary, November 1944, 別表第一別紙, table of ships lost to enemy submarines;
    handwritten and faint in this row. The day's second digit, the time's last two digits and the bearing's first
    digit can't be read at 700 dpi; the route chart (J02) gives 10日 0345 and 10°, which fit what is legible. Time
    left out of the columns for that reason. The position is a bearing and distance from 古志岐灯台 (Koshiki light),
    which is not placed here: no wartime or official light list giving its position was found, so no position is
    derived
