# The attack data sheets' words, as typed. Hand-edited; the numbers are in attacks.csv.
# Each sheet is a header page (`page`: time, position, target and own-ship data, type of attack) and one or two
# table pages (`table_page`: one column per torpedo). attacks.csv cites `page`, the attack's row in positions.csv.
# attacks.csv units, as typed on these sheets: courses degrees (T), speeds kts, ranges yds, depths ft; zone H (the
# sheets' "(H)"); interval in seconds as typed per torpedo ("8 sec.", "10 sec."; Attack 3's tube 10 typed "- - -");
# depth_set typed "6 ft." written 6'; Power left blank on every sheet; track as typed with its side (098°S -> 098S);
# own depth typed "(Surface)" written Surface. The sheets give one range for the bow tubes and one for the stern
# tubes, and no draft; attacks.csv gives each tube the range for its end of the boat.
# Mark torpedo 23 in the bow tubes, 18-1 aft; exploders 6-4 (Mk 23) and 4-2 (Mk 18-1); warheads 16-1 and 18-1;
# Torpex; actuation set and actual Contact on every torpedo; overhaul activity "Sub/Base PHTH". Serial numbers are
# not transcribed.
# own_course in attacks.csv is the sheet's one course, the bow shots'. The boat swung for the stern shots (150 deg
# left in Attack 1, 165 deg right in Attack 2, "swung ship" in Attack 3, narrative p37-38), so check_attacks.py's
# computed track for each stern tube is off by about the swing (150, 165, 160 deg); the typed tracks are kept.
# target_line and own_ship are the sheet's lines as typed.

- attack: Attack 1
  type_attack: This was a night radar surface attack.
  description: >-
    Six ships in convoy, 3 AK's, 1 AO and 2 DD escorts. Name of ships unknown. Contact made by sight, visibility on
    initial contact in daylight, unlimited.
  sunk: >-
    Three (3). One (1) DD EU and two (2) AK's EU. The DD was probably a 1300 ton class and the AK's probably about
    7500 tons.
  damaged: None.
  determined_by: >-
    Observed torpedoes hit and saw ships sink. Ships disappeared from sight and off the radar screen.
  target_line: >-
    Target Draft ____ Course 240°T Speed 9 knots Range 2650 yds. bow tubes. 1900 yds. stern tubes.
  own_ship: Speed 13 knots Course 150°T Depth (Surface) Angle ____
  spread: Divergent (every torpedo)
  hits: Hit, Hit, Miss, Miss, Hit, Hit, Hit, Hit, Miss, Miss (tubes 1 to 10)
  sea: 2
  page: rg38-74855459/p45
  table_page: [rg38-74855459/p46, rg38-74855459/p47]
  note: >-
    Time 2330(H), Date July 16, 1944, Lat. 18-55N, Long. 119-44E (the 8 of 18 is broken on the scan; read on the
    zoom). The narrative (p37) fires at 2329 H "with the range to the near escort 2,000 yards and to the convoy 2,650
    yards, track angles about 120°S, gyro angles near zero": three torpedoes at the escort, three at the leading AK,
    then "swung ship 150° left and fired four torpedoes at the 2nd AK in column." The sheet's tracks are 098°S to
    115°S and its gyros 010° to 017° forward and 169° to 175° aft, not "near zero"; kept as typed. Which tubes went
    at which target is the narrative's order, not typed on the sheet: by the tracks, tubes 1-3 (098-100°S) and 4-6
    (104-106°S) are the two bow salvoes and 7-10 the stern. At 2332 "sighted four and heard six torpedo explosions
    ... It is believed that two hits were obtained on the DD, two on the leading AK, and two on the 2nd AK"; 2335 the
    DD stopped; 2345 the leading AK's pip lost; 2348 the 2nd AK's; 2350 the DD's. The sheet's six hits (1, 2, 5, 6,
    7, 8) agree with the six explosions.

- attack: Attack 2
  type_attack: This was a night radar surface attack.
  description: Three (3) ships left in convoy. One (1) DD, one (1) AO and one (1) AK.
  sunk: None
  damaged: >-
    Three (3). One (1) DD EU, 1 AK EU and 1 AO EU. 1300 ton DD, 7500 ton AK and 10,000 ton AO. Names unknown.
  determined_by: >-
    Saw torpedoes hit. Believe DD sank later. Internal explosions were observed in target and he disappeared from
    radar screen at 10,000 yards range, when he was previously picked up at 18,000 yards range.
  target_line: >-
    Target Draft ____ Course 305°T Speed 9 knots Range 2500 yards bow tubes. 1720 yards stern tubes.
  own_ship: Speed 17 knots Course 215°T Depth (Surface) Angle ____
  spread: Divergent (every torpedo)
  hits: Hit, Hit, Miss, Hit, Hit, Hit, Hit, Miss (tubes 2, 3, 4, 5, 6, 7, 8, 10)
  sea: 2
  page: rg38-74855459/p48
  table_page: [rg38-74855459/p49, rg38-74855459/p50]
  note: >-
    Time 0119(H), Date July 16, 1944, Lat. 18-56N, Long. 119-35E. The date is a slip: the narrative (p37-38) fires
    this attack at 0118 H on 17 July, an hour and three-quarters after Attack 1; positions.csv carries date_fix. The
    narrative: the convoy "had now changed base course to 265°T speed 8 knots ... the DD, leading, and the AK and AO
    in column"; "With the range 2,500 yards to the escort, track angle 90°S, gyro angles near zero fired two bow
    tubes at the DD escort; three at the leading AK; swung ship 165° right and fired three stern tubes at the AO."
    The sheet's target course is 305°T, not the narrative's base course 265°T (perhaps a zig leg); kept as typed. By
    the tracks, tubes 2-3 (086-087°S) are the pair at the DD and 4-6 (080-082°S) the three at the AK. Tube 8's gyro
    is faint (1?0, between 178° and 183°: probably 180). 0120 "Felt and heard six torpedo explosions ... It is
    believed that from times of run, two torpedoes hit each of the ships fired at"; the ships did not sink, and the
    escort was then "hugging the stern of the trailing AO. There was no fight left in him".

- attack: Attack 3
  type_attack: This was a night radar surface attack.
  description: Three (3) ships left in convoy including one (1) escort.
  sunk: Two (2) ships sunk. An AK EU, 7,500 tons, and an AO EU, 10,000 tons.
  determined_by: Observed both ships sink and saw torpedoes hit.
  target_line: >-
    Target Draft ________ Course 290°T Speed ? knots Range 2500 yards bow tubes 1700 yards stern tubes.
  own_ship: Speed 16 knots Course 230°T Depth (Surface) Angle ________
  spread: Divergent (every torpedo)
  hits: Hit, Hit, Hit, Hit, Miss (tubes 2, 3, 4, 5, 10)
  sea: 1
  page: rg38-74855459/p51
  table_page: rg38-74855459/p52
  note: >-
    Time 0224(H), Date July 16, 1944, Lat. 19-04N, Long. 119-26E. The narrative (p38) commences firing at 0244 H on
    17 July, not 0224 on the 16th; positions.csv carries the date_fix and keeps the sheet's time. The target speed's
    digit is illegible (it may be 7; the narrative's base course is 265°T at 6 knots). The narrative: "With the reload
    not yet completed on #6 tube; commenced firing at a range of 2,500 yards, 110°S track, gyro angles near zero.
    Fired two bow tubes at the AK, two bow tubes at the AO and one bow tube at the escort. Swung ship and fired
    remaining stern torpedo at the escort." That is six torpedoes; the sheet has five (four bow, tube 10 aft), and
    the patrol's total of 23 (10 + 8 + 5, as the first endorsement counts it, p63) agrees with the sheet, so the
    bow shot at the escort may not have been fired. 0246 two torpedoes hit the leading AK, "seen to sink
    immediately"; 0247 two hit the AO "with a tremendous explosion which lit up the entire area; he sank within 15
    seconds"; 0258 the escort's pip lost at 10,000 yards, "several explosions were noted on the escort and two rather
    heavy explosions seen just before he disappeared"; "it is believed the 2nd escort sank at this time".
