  original: 12日0745 N18-?9 E122-?0 日蘭丸（沈没）
  translation: 12th 0745, 18-?9N 122-?0E, Nichiran Maru (sunk)
  note: >-
    The convoy chart 別表第七, a sinking mark on the line that leaves Takao on the 9th and reaches Manila about the
    15th; the head above that line's column reads モマ01 (MOMA-01), its escort and ship-count cells blank. The second
    figure of each minute is lost in the binding's shadow, read at 10x. A convoy east of northern Luzon that morning,
    as PIRANHA's (southbound, course about 180)
