# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/SCHEMA.md (A patrol's Japanese record).
# From the Navy's day-by-day summary of escort and anti-submarine events for July 1944 (大東亜戦争経過概要（護衛対潜関係）,
# jacar:C16120659800) and the 1st Surface Escort Division's war diary for July 1944 (第一海上護衛隊戦時日誌,
# jacar:C08030141100): its narrative (p10) and its convoy chart 別表第七 (菲島北航路, Philippines north route, p33).
# Zone I (Tokyo time) throughout; PIRANHA's report keeps zone G (ZT -7), two hours behind.
# J02-J04 repeat records GUARDFISH's Patrol 8 already transcribes (ss-217-guardfish/patrol-8/japanese.yml J01-J03),
# as PIRANHA's own ids, citing the same pages; J01 is new.
# Not yet read: the summary's fair copy (jacar:C16120644000) for the 12th, 16th and 19th; Nichiran Maru's and Seattle
# Maru's own movement records. The 19th (Attack 3, no damage claimed): the summary's next page (C16120659800 p6) has no
# Luzon Strait entry for the 17th-19th by GUARDFISH's reading of it; not re-read here.
- id: J01
  source: jacar:C16120659800
  page: p5
  ship: Nichiran Maru
  event: sank
  date: 1944-07-12
  time: '0935'
  zone: I
  original: 陸軍部隊輸送ノ日蘭丸（A徴傭6503t）ハルソン島N西方ニテ敵潜ノ雷撃ヲウク … 沈没
  translation: >-
    Nichiran Maru (Army-requisitioned, 6503 tons), carrying Army troops, was torpedoed by an enemy submarine (N?)west
    of Luzon … sank
  note: >-
    In the 12th's block of the summary, between entries timed 1330 and 0731 (the entries are not in time order).
    "沈没" (sank) stands in the remarks column. "N西方" is read as written: the character before 西方 looks like a
    Latin N and may be 北 (north-west). 日蘭 is read Nichiran after JANAC (secondary, janac:6/p29, "NIGHIRAN MARU").
    The 0935 is the summary's; the diary's chart has 0745 (J02)
