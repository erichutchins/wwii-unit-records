# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/SCHEMA.md (A patrol's Japanese record).
# Searched (5 Nov 2026): the Navy's day-by-day summary of escort and anti-submarine events (大東亜戦争経過概要（護衛対潜関係）),
# January 1945 (jacar:C16120660400, pp. 10-11, the 23rd to the 25th), read at 200 dpi. The January part has no
# ship-loss table. The narrative has no entry in the Yellow Sea on the 23rd or the 24th: the 23rd's shipping entries
# are CD130 off Takao, the guard boat No. 7 Umenan? Maru, a convoy east of Aparri and Iwo Jima; the 24th's are Sarawak
# Maru off Malaya, an aircraft attack (P38) and Mindanao. The first entry of the 25th, 1330, Malay Maru (A cargo,
# 4,556 t) torpedoed twice and sunk "in the sea south-west of Kagoshima" (鹿児島南西海面), is about 400 nm from ATULE's
# position and the next day. Nothing to transcribe. Not searched yet: the Yellow Sea commands' war diaries for
# January 1945.
# Searched (5 Nov 2026): the 103rd Squadron's war diary, 20-31 January 1945 (jacar:C08030075600, all 38 pages):
# no loss or attack entry on the 23rd-24th (read at 80 dpi; Kume's loss on the 27th is SPADEFISH's). Not on
# JACAR: the Chinkai Guard District's diary after July 1944, the Ryojun Area Special Base Force's before April 1945.
# Searched (5 Nov 2026): the 1st Escort Fleet's war diary extract for January 1945 (第一護衛艦隊戦時日誌抜萃,
# jacar:C08030142000, 58 pages, all looked at; the table of losses read at 200 dpi). Its January statistics (別表第一,
# p49) list only the southern routes (Moji to Shonan, Takao, Hong Kong, Keelung, Manila, Saint Jacques, Swatow,
# Yulin): no Moji-Shanghai or Yellow Sea convoy. Its list of ships lost or damaged in January (別表第一別紙, p50) has
# four sunk by submarine (辰洋丸 and 安洋丸 on the 8th, くらいど丸 on the 29th, all in the Formosa Strait; 延喜丸 on the
# 31st at N14-58 E108-58) and nothing on the 22nd-25th but 大泰丸, "沈没 23日 0530 N27-03.5 E120-28.8", under
# 海難ニ依ル被害 (losses by marine accident), convoy モタ32: off the Chekiang coast, about 600 nm south of ATULE's
# position and listed as an accident. Not ATULE's. JACAR's catalogue has no hit for 大満丸, 大滿丸 or 第一大満丸.
