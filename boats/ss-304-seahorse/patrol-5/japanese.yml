- id: J03
  source: jacar:C16120659700
  page: p21
  ship: Medan Maru
  event: sank
  date: 1944-06-27
  time: '0600'
  zone: I
  original: 二七 0600（0152） バーシ海峡W めだん丸 5135 敵潜ノ雷撃 菲島蘭印
  translation: >-
    27th, 0600 (0152 written below it), west of the Bashi Channel: Medan Maru, 5,135 tons, torpedoed by an enemy
    submarine; area Philippines and Netherlands Indies
  note: >-
    The Navy's day-by-day summary of escort and anti-submarine events (大東亜戦争経過概要（護衛対潜関係）), June 1944,
    table 船舶被害（沈没） (ships lost): date, time, place, ship, affiliation, gross tons, escorts, remarks, area.
    Figures in Arabic on the page. The affiliation and escort columns are blank. The time column has 0600 with 0152
    below it; 0152 is the next row's time (Sansei Maru, 三星丸, 28th, Tsushima Strait) and the day's narrative (J04)
    has 0600 only, so 0152 is read as a slip. No position in figures. No other ship is entered for the 27th or 28th
    near the Bashi Channel, in this table or in the damage table below it (損傷), so the convoy's other ships are not
    reported lost or damaged here. Compiled from signals: counts once with J04
