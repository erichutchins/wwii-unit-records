# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/README.md (A patrol's claims).
- attack: Attack 1
  record: J03
  relation: hit
  note: >-
    Medan Maru (5,135 t), Manila to Takao, sunk west of the Bashi Channel at 0600 I on 27 June (J03, J04, one
    compilation). SEAHORSE commenced firing at 0412 H (0512 I), 48 minutes earlier, at 21-21N 120-18E, at the
    channel's western mouth, on a northbound convoy (course 340-010). The entry gives no position. Of the two
    attacks, Medan Maru fits Attack 1 (a medium AK claimed sunk, 4,000 tons) better than Attack 2's 10,000-ton
    tanker; the two attacks were 30 seconds apart, so the entry's time cannot separate them
- attack: Attack 2
  record: J03
  relation: no_loss
  note: >-
    SEAHORSE claimed a large tanker (10,000 tons) sunk by Attack 2, 30 seconds after Attack 1. The June loss table
    and the damage table (jacar:C16120659700 p21) list one ship from this convoy, Medan Maru, a cargo ship of 5,135
    tons, and no tanker lost or damaged on the 27th or 28th. If Medan Maru was Attack 2's target, Attack 1 is the
    no_loss instead (possible either way). Attack 1's claimed damaged AK is not in the damage table either
- attack: Attack 3
  record: J01
  relation: hit
  note: >-
    Nitto Maru sunk at 0100 I, about 11 nm from SEAHORSE's position for her stern-tube attack at 2354 H (0054
    I). Attacks 3 and 4 were a minute apart on the same convoy; the Japanese table records one ship sunk. JANAC
    credits her to SEAHORSE, not marked probable: 2,186 tons, at 19-28N 115-41E, but on 3 July, the boat's own
    date (2354 H), not the table's 4 July (janac:4/p62; janac:6/p40)
- attack: Attack 4
  record: J01
  relation: possible
  note: >-
    Same minute as Attack 3; the Japanese table has one ship sunk at 0100 I, so one of SEAHORSE's two claims
    there has no matching loss
- attack: Attack 5
  record: J02
  relation: hit
  note: >-
    Gyoyu Maru and No. 28 Kyodo Maru sunk at 1345 I, seven minutes after SEAHORSE's bow tubes (1237-45 H = 1337
    I), about 8 nm from her position. SEAHORSE claimed a medium and a large passenger freighter. JANAC credits both
    to SEAHORSE, neither marked probable, but splits them: No. 28 Kyodo Maru (1,506 tons) on 4 July at 20-20N
    114-54E, near the table's 20-18N 115-02E (janac:4/p63), and Gyoyu Maru (2,232 tons) on 3 July at Nitto Maru's
    position, 19-28N 115-41E (janac:4/p62; both janac:6/p40). The table puts Gyoyu Maru with No. 28 Kyodo Maru
    at 1345 I on the 4th; JANAC's date and place for her look carried over from the Nitto Maru entry (inferred)
- attack: Attack 6
  record: J02
  relation: hit
  note: Stern tubes 45 seconds after Attack 5; the two ships sunk together in J02
