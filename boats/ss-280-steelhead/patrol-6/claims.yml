# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/README.md (A patrol's
# claims).
# The only record of the attack is the Navy's July summary (J01-J03; J04 is a later copy of the same text): sixteen ships attacked from about 0330 I, four
# sunk and two damaged, with no time or place for any one ship. So each claim is paired as possible: the record
# confirms losses that night, not which attack made them.
# JANAC (postwar, secondary) lists for 31 July Koei, Manko and Yoshino Maru at PARCHE's attack position 19-10N
# 120-58E and Dakar and Fuso Maru at STEELHEAD's 18-57N 120-50E (janac:4/p64): the boats' own positions, so it
# repeats their reports and doesn't time any ship.
# STEELHEAD fired first, at 0332 I: J01's "about 0330" is her Attack 1. Attack 2 (all four believed missed ahead)
# has no entry.
# Round 3: the 1st Surface Escort Division's July loss list (J05) has the same four sunk, with tonnage, and both damaged
# ships slightly damaged (小破); its August chart (J06) has No. 1 Ogura Maru escorted to Corregidor. Still no times.
# Round 4: the 21st Minesweeper Division's August diary (J09) has Dakar Maru afloat and adrift on 1-2 August,
# taken in to Calayan Island; the hunting group of six formed on 28 July (J10). Still no time or place of any hit.
# I-29, 26 July 1944 (J07, J08): STEELHEAD only saw it (her "Ship 6", 1655 I); SAWFISH's patrol is not in the records,
# so no claim row pairs it.
- attack: Attack 1
  record: J01
  relation: possible
  note: >-
    Fired at 0332 I, two minutes after the summary's "about 0330" for the first attack on the convoy; PARCHE's first
    was at 0359. The time fits STEELHEAD's attack as the first; "about" keeps it possible
- attack: Attack 1
  record: J03
  relation: possible
  note: >-
    Six bow tubes at an AO and an AK in the first line, claimed damaged (one hit seen under the AK's bridge). The
    summary has No. 1 Ogura Maru and Dakar Maru torpedoed and damaged; which boat damaged which is not recorded
- attack: Attack 3
  record: J02
  relation: possible
  note: >-
    A two-stack AP "similar to TEIKYO MARU", two hits, seen at 0544 with a large hole in her port side, claimed sunk.
    JANAC credits STEELHEAD with Fuso Maru (transport, 8,195 tons), in the summary's sunk list
- attack: Attack 4
  record: J03
  relation: possible
  note: >-
    A medium AK "similar to MALTA MARU", two hits, bow almost awash, claimed sunk. JANAC credits STEELHEAD with Dakar
    Maru (cargo, 7,169 tons) sunk; the Navy's summary has Dakar Maru torpedoed and damaged, not sunk
- attack: Attack 4
  record: J05
  relation: possible
  note: >-
    The 1st Surface Escort Division's July loss list (別表第一) classes Dakar Maru (だかあ丸) slightly damaged (小破),
    not sunk, in agreement with the Navy's summary (J03) and against JANAC's sinking. Her later fate is J09. No time
    or place to tie her to this attack rather than Attack 1
- attack: Attack 4
  record: J09
  relation: possible
  note: >-
    The 21st Minesweeper Division's August diary has Dakar Maru still afloat and adrift on 1-2 August: Minesweeper 39
    reached her "drifting position" at 1320 I on the 2nd and saw her and Fukuju Maru into the anchorage at Calayan
    Island. So the ship JANAC credits to this attack as sunk was damaged, not sunk, 56 hours after the attack
    (0516 I on the 31st to 1320 I on the 2nd). Bow almost awash fits a ship that floated on, adrift. The drifting
    position isn't written; Minesweeper 39's midnight position on the 1st, 19-09N 121-16E, is about 27 nm ENE of
    STEELHEAD's 18-57N 120-50E, which doesn't place either attack. Still possible: nothing names the ship Attack 4
    hit, and Attack 1 claimed hits too
- attack: Attack 3
  record: J05
  relation: possible
  note: >-
    The same list has Fuso Maru sunk (81?5 tons, the third figure not certain; JANAC 8,195), among the four sunk
    from MI-11; no time or place for her
