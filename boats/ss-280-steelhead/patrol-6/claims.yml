# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/README.md (A patrol's
# claims).
# The only record of the attack is the Navy's July summary (J01-J03): sixteen ships attacked from about 0330 I, four
# sunk and two damaged, with no time or place for any one ship. So each claim is paired as possible: the record
# confirms losses that night, not which attack made them.
# JANAC (postwar, secondary) lists for 31 July Koei, Manko and Yoshino Maru at PARCHE's attack position 19-10N
# 120-58E and Dakar and Fuso Maru at STEELHEAD's 18-57N 120-50E (janac:4/p64): the boats' own positions, so it
# repeats their reports and doesn't time any ship.
# STEELHEAD fired first, at 0332 I: J01's "about 0330" is her Attack 1. Attack 2 (all four believed missed ahead)
# has no entry.
- attack: Attack 1
  record: J01
  relation: possible
  note: >-
    Fired at 0332 I, two minutes after the summary's "about 0330" for the first attack on the convoy; PARCHE's first
    was at 0359. The time fits STEELHEAD's attack as the first; "about" keeps it possible
- attack: Attack 1
  record: J03
  relation: possible
  note: >-
    Six bow tubes at an AO and an AK in the first line, claimed damaged (one hit seen under the AK's bridge). The
    summary has No. 1 Ogura Maru and Dakar Maru torpedoed and damaged; which boat damaged which is not recorded
- attack: Attack 3
  record: J02
  relation: possible
  note: >-
    A two-stack AP "similar to TEIKYO MARU", two hits, seen at 0544 with a large hole in her port side, claimed sunk.
    JANAC credits STEELHEAD with Fuso Maru (transport, 8,195 tons), in the summary's sunk list
- attack: Attack 4
  record: J03
  relation: possible
  note: >-
    A medium AK "similar to MALTA MARU", two hits, bow almost awash, claimed sunk. JANAC credits STEELHEAD with Dakar
    Maru (cargo, 7,169 tons) sunk; the Navy's summary has Dakar Maru torpedoed and damaged, not sunk
