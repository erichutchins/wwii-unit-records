  event: sank
  date: 1944-07-31
  zone: I
  original: 沈没 吉野丸 萬光丸 扶桑丸 ??丸 / 船団ハ一時パングイ湾（ルソン島北西端）ニ避退
  translation: >-
    Sunk: Yoshino Maru, Manko Maru, Fuso Maru, ?? Maru. The convoy withdrew for a time to Pangui Bay (the north-west
    tip of Luzon)
  note: >-
    The same entry's result column; no time or place for any one ship. The fourth name is not read: its first
    character falls between the 吉 and the 光 written beside it, its second reads as much like 洋 as 栄. JANAC's list
    for the night has Koei Maru (光栄丸, tanker, 10,238 tons), which would fit, but a postwar list can't settle a
    reading; kept as ??
