# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/README.md (A patrol's Japanese record).
# Convoy TAKA-206 (Keelung for Naha, 22 November 1944), from minesweeper W-15's battle report (jacar:C08030607900), the
# record BANG's Patrol 4 uses (ss-385-bang/patrol-4/japanese.yml). Manazuru, a CHIDORI-class torpedo boat, was the
# convoy's No. 1 ship and senior escort (p33).
- id: J01
  source: jacar:C08030607900
  page: p40
  convoy: TAKA-206
  event: sub_sighted
  date: 1944-11-22
  time: '2240'
  zone: I
  lat_raw: 24-22N
  lon_raw: 122-31E
  original: 二二四〇 北緯二四度二二分東経一二二度三一分ニ於テ一番艦真鶴信号拳銃赤色一個（浮上潜水艦）ヲ認ム 配置ニ就ケ 戦速
  translation: >-
    2240: at N 24°22′ E 122°31′, No. 1 ship Manazuru fires one red flare (surfaced submarine); W-15 goes to
    battle stations, battle speed
  note: >-
    W-15's log of the action (戦闘経過). 2240 I = 2340 K, two minutes after SHAD's Attack 1 (2338 K) and the
    minute she dived (2340 K), about 6 nm from SHAD's position (24-16N 122-28E); the position is presumably W-15's
