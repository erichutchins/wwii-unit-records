  source: jacar:C08030607900
  page: p40
  convoy: TAKA-206
  event: attacked_no_damage
  date: 1944-11-22
  time: '2245'
  zone: I
  original: 二二四五 爆雷音聴ユ 二二四八 戦斗爆雷戦 原速 針路北六〇度東 … 二三三七 爆雷戦要具収メ 艇内哨戒第二配備
  translation: >-
    2245: depth-charge explosions heard. 2248: action stations, depth charges; standard speed, course N 60° E …
    2337: depth-charge gear stowed, second watch condition
  note: >-
    Same log. 2245 I = 2345 K; SHAD's report has ten close depth charges from 2343 K. W-15 dropped none itself
    before 2346 I, so the charges were another escort's, presumably Manazuru's after her flare
- id: J03
  source: jacar:C08030607900
  page: p49
  convoy: TAKA-206
  event: sub_sighted
  date: 1944-11-22
  time: '2300'
  zone: I
  original: 此ノ附近ニ敵浮上潜水艦在リ
  translation: An enemy surfaced submarine is in this vicinity
  note: >-
    Same report, signal log: Manazuru's captain to W-15, 22nd 2300 I (2400 K). At 2335 I Manazuru ordered W-15 to
    keep a close watch astern of the convoy (p49). The report names no damage from this attack: the first ship
    lost, Hozan Maru, was torpedoed at 2339 I, an hour later (BANG's Attack 1)
