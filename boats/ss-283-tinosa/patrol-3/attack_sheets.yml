  spread: 2° Total
  performance_satisfactory: "*"
  location: 10-01N 148-31E
  page: rg367-74856215/p19
  narrative: >-
    1821(K) Target began dropping and throwing depth charges and firing with both guns. Eight depth charges in all
    were used. Target began turn to her right as if to ram as she had done during morning attack. ... Target swung
    past ramming course and was making about five knots. 1825(K) Fired two bow tubes. No indication of hits or
    explosions but shortly thereafter target stopped. List had increased slightly but there was no evidence of
    sinking. Gun fire continued.
  remarks: >-
    ... We fired two bow tubes as indicated in the table. The set up looked good but no explosions resulted. The
    torpedoes were heard to run on the correct course. The target's swing was undoubtedly due to the previous hit
    aft disabling the starboard screw. I believe these mark XVIII may have hit because shortly thereafter the ship
    stopped dead in the water, whereas she ran for at least six minutes after attack #3a.
  basis: >-
    hit (Miss on both rows) from the table's 0 hits, rg367-74856215/p19; the rest from the same table.
  note: >-
    The table's 0 hits stands in the CSV; the commanding officer believed "these mark XVIII may have hit" (remarks,
    p17). The narrative fires at 1825 K, a minute after the table's 0824 GCT.

