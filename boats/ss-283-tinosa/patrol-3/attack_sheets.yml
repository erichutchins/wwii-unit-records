- attack: Attack 3F
  column: (8)
  type_attack: P
  torpedoes: 1-Torpex Mk XVIII
  hits: "1"
  sunk: 10000 plus same as 2
  damaged: "0"
  type_of_target: AO
  draft: 20'-30'
  shot: Bow
  spread: "0"
  performance_satisfactory: "Yes"
  location: 10-01N 148-31E
  page: rg367-74856215/p20
  narrative: >-
    1913(K) Fired second bow tube, same conditions. Heard to run straight for target but no explosion and none seen.
    These two torpedoes were not even heard to hit. Target still seemed to have lots of buoyancy. 1923(K) ... Target
    now showed first evidence of sinking, the stern being down and settling fast. 1933(K) Target disappeared, sinking
    by the stern. STEELHEAD had made three hits on this target. We had at least six effective hits, ie. torpedoes
    which detonated.
  remarks: >-
    Same as 3e. One of these last two torpedoes must have been effective because shortly thereafter the ship began
    sinking rapidly. This might possibly have been caused by the collapse of bulkheads but there was no evidence of
    sinking prior to attacks 3e and 3f.
  basis: hit (Hit) from the table's 1 hit for its one torpedo, rg367-74856215/p20; the rest from the same table.
  note: >-
    The table types a hit and the sinking against this torpedo, but the narrative heard and saw no explosion from it
    ("These two torpedoes were not even heard to hit", p08), and the remarks give the sinking to "one of these last
    two" (p18): the hit is the table's inference from the sinking, not an observed hit. The CSV keeps the table's
    Hit. In XVIII Remarks (p30) "the sound operator heard one explode" of the last four shots, which is 3(d). The
    first endorsement (p34): "It is almost certain that the ship absorbed nine torpedo hits before sinking"; the
    second (p35) recommends "1 AO (Type undetermined) 10,000 tons" sunk.
