  original: 二四駆機密第〇六二〇一〇番電 二一四五風早遭難推定位置（一七二七敵潜水艦ト交戦地點九度五〇分N一四八度二四分E）ニ到着セシモ見当ラズ今ヨリ捜索ス 明朝ヨリ飛行機ノ協力ヲ得度
  translation: >-
    DesDiv 24 secret telegram 062010: at 2145 arrived at Kazahaya's estimated position of distress (1727, the point
    of engagement with the enemy submarine, 9°50'N 148°24'E) but she is not in sight; now searching. Request
    aircraft cooperation from tomorrow morning
  note: >-
    `time` is the engagement's, 1727. The telegram is numbered 062010 but its text reads 2145 for the arrival, so
    one of the two is misread or mistyped; neither is used. TINOSA fired 3(a) at 1818 K (1718 I) and 3(b) at 1825 K
    (1725 I) (rg38-74856215/p07). The position is about 13 nm south-west of the 10-01N 148-31E that TINOSA's table
    types for every evening attack
