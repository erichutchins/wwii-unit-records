# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/SCHEMA.md (A patrol's Japanese record).
# The oiler Kazahaya's signals and the orders for her escort and rescue, 6-7 October 1943, from the telegram log
# (三、令達報告等) of the 2nd Destroyer Squadron's war diary for October 1943 (第二水雷戦隊戦時日誌, jacar:C08030101300,
# pp. 22-26). The squadron sent DesDiv 24 to her. Each entry is one telegram: its sent time and number as written; where
# the text gives an earlier time for the event, `time` is that and the note says so. Zone I (Tokyo time), which the
# Imperial Navy kept: the log's times fit TINOSA's narrative, in zone K, an hour apart (Attack 2 at 1201 K, Kazahaya's
# "1105 third engagement"; the sinking at 1933 K, her "1830 sank").
# Searched and not found: the 4 October tanker (TINOSA's Attack 1; FRUPAC has the attack, frupac.yml F01). The same log's
# 4 and 5 October pages (pp. 19-21) have nothing on it; the 4th Fleet's war diary part for October 1943
# (jacar:C08030018500) holds only that month's tables of ships' movements, not the narrative or the telegrams; and the
# Navy's day-by-day summary of escort and anti-submarine events for October 1943 (大東亜戦争経過概要（護衛対潜関係）,
# jacar:C16120658600, p03) lists nothing near Truk on the 4th, though it lists Kazahaya on the 6th (J08). A tanker
# damaged, not sunk, may simply not have been reported that far up. Not yet searched: DesDiv 24's own diary (reported missing in
# the squadron's November diary, jacar:C08030101400 p01), the Combined Fleet's, and the escorts on the Palau-Truk route.
# 11 Nov 2026: the 4th Fleet's October part does hold, besides tables, a grid of its own ships' whereabouts day by day
# (麾下艦船ノ行動, pp05-07). Its one tanker coming in from sea at the start of the month is Hoyo Maru (J10), which
# combinedfleet has arriving at Truk from Balikpapan with crude oil on the morning of the 4th (J11, secondary).
# combinedfleet.com's record of Kazahaya (Kazahaya_t, read from the Wayback copy, 5 Nov 2026) is secondary and retells
# TINOSA's report. Where it differs from this log: it has Umikaze rescue "about 154 men" and no other ship (the log has
# Umikaze 154 and Hatsukaze 98, J09), all sixteen of TINOSA's torpedoes as Mark 14s, and the sinking at 10-50N 148-30E.
# Japanese Wikipedia's 風早 (給油艦) quotes the published diary of Prince Takamatsu (高松宮日記 vol. 7 p. 18) for
# "1727缶室被雷、1830沈没" and a position of 9°56'N 148°29'E (secondary; not read here), which helped read J06.
