  ship: Kazahaya
  event: sank
  date: 1943-10-06
  time: '1830'
  zone: I
  original: 二四駆機密第〇七〇二三〇番電 一、昨〇一〇〇以後敵潜水艦六隻ヲ見四回ニ亘リテ交戦被雷計五 二、一七二七罐室被雷一八三〇沈没 三、機密図書処分完了 四、一一〇五第三回交戦ノ際敵潜水艦一隻ヲ乗切リ爆雷攻撃効果確実
  translation: >-
    1. From 0100 yesterday sighted six enemy submarines and engaged them four times; torpedo hits five in all. 2. 1727
    boiler room torpedoed, 1830 sank. 3. Disposal of secret documents completed. 4. At 1105, in the third
    engagement, ran over one enemy submarine; depth-charge attack effective, certain
  note: >-
    Telegram of 7 October 0230, received 0602, its sender column 風早 (Kazahaya); the number is read as written. 1830 I is
    1930 K: TINOSA's "1933(K) Target disappeared, sinking by the stern" (rg38-74856215/p08). Five hits in all,
    against TINOSA's report's "at least six effective hits" of her own and three of STEELHEAD's, and the first
    endorsement's nine (p34). If the five are J01's one and J02's three, one remains for the evening. Six submarines
    and four engagements are her count; only TINOSA and STEELHEAD are known to have attacked her. The four characters
    after 1727 are faint: read as 罐室被雷 (boiler room torpedoed), the first character the old form of 缶, with the help of
    the same words in Prince Takamatsu's diary as quoted on Japanese Wikipedia (header). So the 1727 engagement of J05
    was a hit: TINOSA's 3(b) fired at 1825 K (1725 I) at 1,350 yards, about a minute's run; 3(a) at 1818 K (1718 I),
    nine minutes earlier, with two hits seen. No position
