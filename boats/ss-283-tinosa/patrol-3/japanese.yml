- id: J10
  source: jacar:C08030018500
  page: p05
  ship: Hoyo Maru
  event: status
  date: 1943-10-04
  zone: I
  original: （四）麾下艦船ノ行動 … 宝洋丸 一─四 航海 五─ トラック
  translation: >-
    (4) Movements of the fleet's ships … Hoyo Maru: days 1-4, at sea; from day 5, Truk
  note: >-
    4th Fleet war diary, October 1943 (第四艦隊戦時日誌, its part 4 on JACAR), the grid of its ships' whereabouts by day,
    days 1-9 (p05; days 10-31 on p06-p07, where the row stays at Truk to about the 21st). Read at 300 dpi: the line
    closing her 航海 (at sea) stands between the columns for the 4th and 5th, so she reached Truk on the 4th or
    the 5th, as the grid marks a day. The 4th Fleet's other oilers that week (杵崎, 石廊, 知床) and the tanker 地洋丸
    (at Saipan) were not coming in from the west. The grid lists only the 4th Fleet's own ships and says nothing of
    an attack or damage. Not a record of TINOSA's attack: it places a loaded tanker of the fleet at sea, on her way
    into Truk, on the morning TINOSA fired at one 90 nm west-north-west of it
