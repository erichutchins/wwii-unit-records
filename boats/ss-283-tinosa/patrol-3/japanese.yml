  zone: I
  translation: >-
    23 September 1943: at 0830 departs Balikpapan for Truk making 10.5 knots with another load of crude oil. 4
    October: at 1000 arrives at Truk escorted by destroyer FUKUE, which joined earlier that day. 5 October:
    transfers fuel oil to the light cruisers NAKA and ISUZU
  note: >-
    Secondary (combinedfleet.com's record of Hoyo Maru, read from the Wayback copy of 2 April 2026, 11 Nov 2026); it
    does not mention an attack. A finding aid for J10: a loaded tanker (TINOSA saw a loaded one, "similar to HUZISAN
    MARU, 9527 tons"; Hoyo Maru was a Navy oiler of about 8,700 tons) arriving six hours after the attack, 90 nm at
    11.6 knots being about eight. Her fuelling the cruisers next day fits TINOSA's one hit and one dud doing little
