  zone: I
  original: 特務艦風早（一二〇〇〇屯 一六．五節 TO）ハ単独トラックニ向ケ航行中トラックノNW二五〇′ニテ敵潜ノ襲撃ヲウク（GF） 敵一隻ヲ乗切リ有効ナル攻撃ヲ加ヘシモ前後五本ノ魚雷ヲ蒙リ一八三〇沈没
  translation: >-
    The special service ship Kazahaya (12,000 tons, 16.5 knots, TO), on passage alone to Truk, was attacked by an
    enemy submarine 250 miles north-west of Truk (GF). She ran over one of the enemy and attacked it effectively, but
    took five torpedoes in all and sank at 1830
  note: >-
    The Navy's day-by-day summary of escort and anti-submarine events, October 1943 (handwritten; numerals here as
    written, in Arabic figures on the page: 12000, 16.5, 250, 1830). `time` is the entry's, 0140: the start of the
    attacks, as her own "from 0100 yesterday" (J06). Compiled from the Combined Fleet's signals ("(GF)"), so it repeats
    J06 and counts once with it, not as a second witness. 250 miles north-west of Truk is about 10-20N 148-50E, within
    about 25 miles of where TINOSA's table puts her attacks of that day (10-35N 148-30E, 10-01N 148-31E)
