  translation: >-
    YB signal order No. 36: the commander of the 2nd Destroyer Squadron is to send one destroyer at once to escort
    Kazahaya (torpedoed once at 0244 at 10°30'N 146°37'E; able to proceed under her own power)
  note: >-
    The order of 6 October 0830 (sender YB, as written). The attack is STEELHEAD's, which is not in these records. The
    log has one torpedo; TINOSA's report has STEELHEAD hit her three times (remarks, rg38-74856215/p16; first
    endorsement, p34). The 1st Fleet's order of 0845 repeats the position (p23). The squadron sent DesDiv 24's Suzukaze
    (二四駆（涼風）ハ速ニ出撃, 0910, p22), which signalled 我出撃ス, "we sortie", at 1035 (p23). TINOSA sighted the tanker at
    0524 K (0424 I) and typed her at 10-24N 146-52E, about 15 nm east of this position (ship contact 3,
    rg38-74856215/p13)
