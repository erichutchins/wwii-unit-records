# TINOSA's sixth patrol report has no torpedo attack data sheets. Its only attack data is one page, "VII. SUMMARY
# OF SUBMARINE ATTACKS" (p26), one column per attack, which attacks.csv transcribes. Hand-edited; the numbers are
# in attacks.csv, the words here.
# What that table does not give is blank in attacks.csv: tube, own course, speed and depth, target course,
# power, each torpedo's hit or miss, erratic. Each attack has one row per torpedo fired (the table's "No. & Type
# of Torpedo Fired"), and every row repeats the attack's one typed value: the table gives a single track, gyro,
# depth setting, range and interval per attack, not one per torpedo. interval is the table's one interval
# ("9 Sec.") on every row: the interval between torpedoes, not each torpedo's time from the first.
# attacks.csv's spread is the kind (Div. -> divergent, Long. -> longitudinal); the amount as typed is `spread` here.
# Times are typed "Time G.C.T." (zone Z), as positions.csv has them. Ranges typed with thousands commas
# (3,000) are written without (3000). Where the table types more than one draft, track or gyro for an attack,
# attacks.csv leaves the cell blank and the values are here.
# The track check (tools/check_attacks.py) can't be run on these rows: no own or target course is typed.

- attack: Attack 1
  type_attack: P
  torpedoes: 6 14-3A
  hits: "4"
  sunk: 1-AK 5,500
  damaged: 1-AO 7,500 1-AK 5,500
  type_of_target: 1-AO 2-AK
  draft: 20' 18' 18'
  shot: Bow
  spread: 10° Div.
  performance_satisfactory: "Yes"
  overhaul: U.S.S. BUSHNELL
  location: Lat. 18-15.5N Long. 120-18.4E
  page: rg367-74856363/p26
  note: >-
    A summary table, not a data sheet. Three drafts are typed for three targets (one AO, two AK) and one range
    (3,000), so the drafts are left out of attacks.csv. positions.csv's note records that the narrative fires
    at 0919 H (0119 GCT), 18 minutes before this table's 0137, and that the table's longitude is 63 nm east of
    the narrative's sinking position; neither re-read here.

