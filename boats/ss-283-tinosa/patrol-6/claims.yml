# Which attack goes with which Japanese record (japanese.yml). Hand-edited; fields in records/SCHEMA.md (A patrol's claims).
# Attacks are named by their narrative refs (positions.csv, "Attack N fired", zone H), as BANG's Patrol 1 file names
# them: the summary table's times and positions disagree with the narrative (positions.csv notes).
# Attack 4 (0414 H = 0514 I, four fired, "results unknown", two explosions beyond the target) and Attack 5 (0850 H =
# 0950 I, four stern tubes at a damaged AK, results unknown) have no entry: none of TE-04's five losses is timed
# after 0353 I. By their own logs Toyohi Maru sank at 0008 I (J06), Kinrei Maru at 0109 I (J07), Taiyoku Maru at
# 0237 I and Shoryu Maru (J04) at 0353 I; only Daibu Maru has no primary time (the secondary source's 0113 I, J05),
# and the escort division's chart (BANG's Patrol 1 J19) is too faint to read a time. So neither later attack is known to have sunk anything; neither claimed a sinking.
- attack: Attack 1 fired
  record: J01
  relation: no_loss
  note: >-
    TINOSA fired six at 0919 H (1019 I) on 30 April, claimed one AK sunk and two ships damaged. The April loss list
    has only Takegawa and Nittatsu Maru for TAMA-17, both sunk earlier by BANG; TAMA-17's other ships reached
    Manila on 2 May. PARCHE had fired at the same convoy at 1010 I and heard a heavy explosion at 1014 I. JANAC
    credits TINOSA with nothing in April 1944 (janac:6/p51)
- attack: Attack 2 fired
  record: J06
  relation: hit
  note: >-
    TINOSA's first salvo, fired at 2309 H (0009 I), hit a tanker under the bridge and the bow at 2310 H (0010 I),
    and she sank at 20-51N 118-02E (the narrative's position of the target). Toyohi Maru's own log has her
    torpedoed and sunk at 0008 I at 20-51N 118-03E: one to two minutes before TINOSA's firing and hits (the two
    clocks need only differ by that much), and about 1 nm from the narrative's position. She was an ore carrier
    loaded at Yulin, not a tanker. JANAC credits Toyohi Maru (6,436 tons) to TINOSA, not marked probable: 4 May,
    20-51N 118-02E (janac:4/p59; janac:6/p51). The secondary source (J03) has the same 0008 I
- attack: Attack 2 fired
  record: J05
  relation: possible
  note: >-
    The second salvo hit an AK of about 6,000 tons at 2310-53 H (0010-53 I), and one torpedo hit an AK in the far
    column at 2311-52 H (0011-52 I); TINOSA then went deep under depth charges until 0134 H (0234 I) and didn't
    see either sink. Of the convoy's five losses, four now have their own logs, and none of them fits a ship hit
    at 0010-0012 I but Toyohi Maru (J06): Kinrei Maru sank at 0109 I (J07), 58 minutes later and 3 minutes after
    PARCHE fired, about 9 nm south of TINOSA's attack. That leaves Daibu Maru, timed only by the secondary source
    at 0113 I (J05), 61 minutes after the far-column hit and 7 minutes after PARCHE's Attack 2; JANAC credits her to
    TINOSA as probable ("Submarine*"; 20-54N 118-14E; janac:4/p59; janac:6/p51). A ship hit at 0011 I could have
    sunk an hour later, but PARCHE's second target, hit at 0106 I and seen to sink, fits the time better. Possible
- attack: Attack 3 fired
  record: J04
  relation: probable
  note: >-
    TINOSA fired four stern tubes at 0249-31 H (0349 I), heard three hits and saw the target "merely
    disintegrate", at 20-55N 118-12E. Shoryu Maru's own log puts her sinking at 0353 I, four minutes later, at
    20-54N 118-08E, about 4 nm away. No other boat attacked near that time: PARCHE's last attack was 0127 I and
    BANG's 0232 I. JANAC credits Shoryu Maru to PARCHE, not marked probable (4 May, 20-48N 118-03E; janac:4/p59;
    janac:6/p27), which is why this is probable and not hit. Supersedes the "possible" pairing with the secondary
    source's "about 0300" in BANG's Patrol 1 file
