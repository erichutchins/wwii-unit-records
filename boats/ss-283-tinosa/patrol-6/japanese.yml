# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/README.md (A patrol's Japanese record).
# TINOSA kept zone H (GMT+8) in her narrative, one hour behind the Japanese zone I; her summary table is in GCT
# (positions.csv). J01, J02 and J03 repeat readings first made for BANG's Patrol 1 (ss-385-bang/patrol-1/japanese.yml
# J10, J11, J13), cited to the same pages. Searched and not found: a movement log for Toyohi Maru (豊日丸) or Daibu
# Maru (大武丸) in the designated-ship movement tables (jacar.py search on both names, no hits); Kinrei Maru (金嶺丸) the
# same. Read for this patrol: Shoryu Maru's log (C08050104900) and Taiyoku Maru's (C08050105400 pp. 9-11; she sank at
# 0237 I, when TINOSA was deep, so her entry is in PARCHE's Patrol 1 file, not here).
- id: J01
  source: jacar:C08030140600
  page: p30
  convoy: TAMA-17
  event: loss_list
  date: 1944-04
  zone: I
  original: 敵潜遭遇船団名 … タマ17(2) / 被害船舶名 潜 沈没 … 竹川丸(1930) 日達丸(2859)
  translation: >-
    Convoys that met enemy submarines … TAMA-17 (twice). Ships sunk by submarine … Takegawa Maru (1,930 GRT),
    Nittatsu Maru (2,859 GRT)
  note: >-
    1st Surface Escort Division, attached table 1 (convoy escort statistics), April 1944; the reading made for
    BANG's Patrol 1 (its J10). TAMA-17's only two losses, both before TINOSA's attack (Takegawa Maru 2240 I on the
    29th, Nittatsu Maru 0419 I on the 30th, both BANG's)
