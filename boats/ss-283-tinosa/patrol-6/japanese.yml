# The Japanese record of this patrol's attacks, as written. Hand-edited; fields in records/SCHEMA.md (A patrol's Japanese record).
# TINOSA kept zone H (GMT+8) in her narrative, one hour behind the Japanese zone I; her summary table is in GCT
# (positions.csv). J01, J02 and J03 repeat readings first made for BANG's Patrol 1 (ss-385-bang/patrol-1/japanese.yml
# J10, J11, J13), cited to the same pages. The owners' own logs in the designated-ship movement tables give Toyohi
# Maru's sinking (J06, 5th series タ–ワ part 4) and Kinrei Maru's (J07, ア–ソ part 7), found through the series'
# own name index (jacar:C08050105300 pp. 1-4). Searched and not found: a log for Daibu Maru (大武丸): she is not in
# the 5th series' index (タ部: 大信丸, 大翼丸, 泰世丸 only) nor the 4th's (jacar:C08050102800, タ部: 泰南丸 only), and
# jacar.py search on 大武丸 has no hits. Also read: Shoryu Maru's log (C08050104900) and Taiyoku Maru's
# (C08050105400 pp. 9-11; she sank at 0237 I, when TINOSA was deep, so her entry is in PARCHE's Patrol 1 file).
