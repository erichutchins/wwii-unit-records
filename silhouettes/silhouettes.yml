  # YASOJIMA, as PING HAI (in the plate's list); the profile is of her sister NING HAI. No. 3905.
  ning-hai:
    name: "NING HAI class PG (ex-Chinese cruisers NING HAI, PING HAI)"
    length: 357.3
    plate: "ONI 41-42, Japanese Naval Vessels, NING HAI-CLASS PG-8, 9 plate, Division of Naval Intelligence, July 1943 (scan leaf 263): length 360' 0\" OA, 330' 0\" PP, beam 39' 0\", draft 13' 0\" (maximum), 11' 5\" (mean); displacement 1900-1990 tons (standard); armament (old) 6-5.5\", 6-3.1\" AA, 4-21\" torpedo tubes, two scout planes; height lines at 15 to 90 ft. Lists NING HAI (PG 8) and PING HAI (PG 9): \"captured from the Chinese in 1937 ... New names, armament unknown. Note differences in aft deckhouse arrangement. Profile is of NING HAI.\" Drawn as built, before PING HAI's rebuilding as the escort YASOJIMA (ONI 222-J, June 1945, lists YASOJIMA as a light cruiser, ex-escort, p. VI (scan leaf 12), and NING HAI and PING HAI among the available non-Japanese warships, p. XI (scan leaf 17); it has no plate of either). Traced from the profile (blurred 1.2 px, threshold 225; the height lines, the frame and the base rule erased) at 2.21 px/ft (first scaled to the printed 360', against 2.17 px/ft from the height lines, within 2%), then traced again at the same scale without the derrick boom off the mainmast tripod and the plate's frame line at the bow, which the first trace kept: 357 ft overall, within 1% of the printed length; the lines read the foremast top about 101', the trace 100'. Bow already to the right"
