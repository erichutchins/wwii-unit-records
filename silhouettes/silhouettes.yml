# Recognition silhouettes, in the manner of the wartime plates. Hand-edited; tools/build_silhouettes.py
# turns this into silhouettes.json, which the pages read. Every shape cites its plate (`sources`, ids in
# ../SOURCES.yml).
#
# categories: one generic shape per kind of ship or aircraft, for the battle pages, which say "the kind of
#   ship, not each one's outline". viewBox 0 0 120 24, bow to the right, waterline at y=22. Drawn by hand.
#   Every subpath runs clockwise, so a nonzero fill never punches holes.
#
# aircraft: traced by pixel from the plates themselves (outline of the solid black silhouette, panel lines
#   filled, antennas dropped, plan views made symmetric about the centreline), then normalised so the span is
#   100 units. Views: plan, front (head-on, with the cowling centre at cx, cy), profile. The F6F is FM 30-30's
#   plate at leaf n58 (the April 1943 edition does have one, headed "from data currently available").
#   The B-26 (FM 30-30, leaf n46) and the Me 262 (the U.S. Army-Navy Journal of Recognition, January 1945, p. 15:
#   FM 30-30 of April 1943 predates the jet) were closed by 3 px the same way before tracing.
#   The FM 30-30 plates traced for ju88 to wellington, and the hellcat, were first closed by 3 px (the Beaufighter's head-on by
#   10 px) to bridge their white panel lines; their head-on cy is the wing line at the centreline.
#   OSCAR 2 & 3 (Bulletin 105-45, July 1945) was closed by 3 px the same way, after its canopy glazing was filled and the
#   head-on view's aerial masts erased by hand; its head-on cy is the cowling centre.
#   The Japanese types from FM 30-30 (mavis to pete) were closed by 3 px the same way and their enclosed white areas
#   (glazing) filled before tracing; their head-on cy is the cowling or nose centre. Struts that enclose open bays (MAVIS's
#   parasol wing head-on, PETE's biplane bays and floats) cannot be one outline, so those views are left out. The US patrol types
#   (b24 to tbf), and the SB2C, B-17 and A-20 after them, are traced from FM 30-30 the same way; the PBM's and PBY's head-on views are left out for their float struts. FM 30-30 (April 1943)
#   has no Piaggio plate, so the P.108B is traced from a modern Commons three-view (CC BY-SA 3.0: that
#   entry alone carries the licence and the attribution); its line drawing was filled by flooding the outside.
#
# ships: drawn by hand to the heights and length printed on the ONI 54 recognition plates, with the plates as
#   the visual reference. Units are feet: x from the stern (0) to the bow (length), y above the waterline.
#   Bow to the right, as on the plates. Details smaller than about 4 ft are left out. Parts:
#     [box, x0, x1, top, base]   [poly, [[x, y], ...]]   [mast, x, top, base, width]   [gun, x0, x1, y, height]
#   The hull is a polygon from the stern at the waterline.
#   The GATO and BALAO plates (ONI 222-US) print only length, beam and draft, so each is one polygon traced from the
#   plate's profile (tools/trace_silhouette.py, de-skewed) and scaled to the printed length. So is the FLETCHER's
#   (p. 89 of the same manual, which also prints a 0-90 ft height scale), and the BUCKLEY DE's (p. 117).
#   The LST is traced the same way from ONI 226's inboard profile (a line drawing), cut at its sea-going waterline. The
#   ARGENTINA, ANCON and QUEEN MARY liners are traced from ONI 208's merchant profiles (line drawings with rigging: stays
#   and booms dropped, masts added back as `mast` parts; the Queen Mary's outlines closed and filled) and measured on the
#   plates' own scale bars. No QUEEN ELIZABETH: ONI 208 (April 1942) has no profile of her (its index lists QUEEN MARY
#   and QUEEN OF BERMUDA only), and no later merchant manual was found online.
#   The US warships iowa to benson-livermore are traced from the ONI 54-R plates reprinted in FM 30-50 (1943), the height rules
#   between drawing and scale removed, and scaled to the printed length; each plate entry says how the drawing meets the printed
#   heights. CASABLANCA and the LIBERTY are type-sheet silhouettes measured on the sheet's own scale bar. haskell to pt103 are traced from
#   ONI 222-US (1 September 1945), the PDF rendered at 400 dpi, specks and dotted height rules dropped, and scaled to the printed
#   length. No plate found for McCAWLEY (APA-4; lost in June 1943, she is not in ONI 222-US, and FM 30-50's merchant types are not
#   tied to her by any record) or the R class SS (ONI 222-US draws only the BALAO and GATO classes, FM 30-50 and FM 30-30 none).
#   The LCM(3) and LCT(5) are drawn by hand (parts) to ONI 226's inboard profiles, line drawings too crowded with arcs and leaders
#   to trace.
#   The Japanese escorts (shimushu to shirataka) are traced from ONI 222-J (June 1945) and ONI 41-42 (plates of June 1943)
#   (no13-minesweeper the same; minekaze and matsu from ONI 222-J and ning-hai from ONI 41-42's July 1943 plate, added after)
#   and scaled to the printed length; the Japanese merchants (type-tl-tanker to type-d-mod) from ONI 208-J (January 1945)
#   and its Supplement 3, scaled by the plates' unlabelled four-division scale bars read as 100 ft (inferred: each hull then
#   comes within 2-5% of its printed length). These are representative: a class or type stands for the convoys' ships, and each
#   entry's comment says which ships it draws and whether the plate names them. No plate drawn yet for W-15 (No. 13 class,
#   ONI 41-42 leaf 253) or CH-61; none found for Kinrei, Toyohi, Daibu, Taiyoku, Nitto, Gyoyu or No. 28 Kyodo Maru.
#   None for MAESHIMA: ONI 222-J (p. XI, scan leaf 17) lists her in the SOKUTEN class of small minelayers, with no plate, and ONI 41-42
#   (leaf 249) has the class (as YURISHIMA, CMc 21-31) "appearance & characteristics unknown".
#   None for convoy MATA-40's three ships (JACAR C08030596700: 新州丸, 吉備津丸, 日向丸). ONI 208-J (January 1945) and its index have
#   no KIBITSU/KIBITU or HYUGA/HIUGA MARU (Supplement 2's Hyuga and Hiuga Maru are a bonito boat and a pilot boat, not the
#   convoy's ship), and Supplement 3's standard-type lists name neither, so no standard-type plate can be fitted to them by a
#   record. ONI 208-J p. 128 (scan leaf 163; 24 MFM) does draw a SINSYU MARU, with KOZAN MARU (1933 and 1935, Japan, 4,180 GT,
#   diesel, "believed to be carrying oil in bulk"), but SINSYU can be 新州, 神州 or 信州 and no record found ties that ship to the
#   convoy's 新州丸, so she is left undrawn until one does.

# crop (optional, on aircraft and ships): the section of the plate's scan each outline was traced from, so the drawing
#   can be found on the scan and a later, more faithful retrace can start from it. Not drawn on any page and left out of
#   silhouettes.json. {scan, box, mirrored, px_per_ft}, one per view for aircraft (plan, front, profile): scan is
#   ia:<Internet Archive identifier>/<leaf> or ibiblio:<path>; box is [x, y, w, h] in the scan's own pixels at the
#   resolution the archive serves (or gbooks:<Google Books id>/p<PDF page>, the PDF rendered at 400 dpi); mirrored says the outline is the drawing flipped left to right (plan and head-on views,
#   symmetric, are false); turn, degrees clockwise, for a drawing printed sideways (the ANCON); px_per_ft is the box's
#   width over the span or length. Found by laying each outline on the scan's thresholded ink at its best scale and place.
#   Entries without one say why in a comment.

