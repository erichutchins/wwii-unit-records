  mavis:
    name: "MAVIS"
    type: "Kawanishi Type 97 flying boat (H6K), Navy patrol flying boat"
    dims: "131′ span, 82′ long"
    span: 131
    length: 82
    source: "FM 30-30 Recognition Pictorial Manual (April 1943), \"MAVIS\" Type 97 F/B plate, leaf n168"
