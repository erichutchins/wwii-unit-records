# Recognition silhouettes, in the manner of the wartime plates. Hand-edited; tools/build_silhouettes.py
# turns this into silhouettes.json, which the pages read. Every shape cites its plate (`sources`, ids in
# ../SOURCES.yml).
#
# categories: one generic shape per kind of ship or aircraft, for the battle pages, which say "the kind of
#   ship, not each one's outline". viewBox 0 0 120 24, bow to the right, waterline at y=22. Drawn by hand.
#   Every subpath runs clockwise, so a nonzero fill never punches holes.
#
# aircraft: traced by pixel from the plates themselves (outline of the solid black silhouette, panel lines
#   filled, antennas dropped, plan views made symmetric about the centreline), then normalised so the span is
#   100 units. Views: plan, front (head-on, with the cowling centre at cx, cy), profile. No Hellcat: none of
#   the recognition material read had an F6F plate, and it isn't drawn from memory.
#
# ships: drawn by hand to the heights and length printed on the ONI 54 recognition plates, with the plates as
#   the visual reference. Units are feet: x from the stern (0) to the bow (length), y above the waterline.
#   Bow to the right, as on the plates. Details smaller than about 4 ft are left out. Parts:
#     [box, x0, x1, top, base]   [poly, [[x, y], ...]]   [mast, x, top, base, width]   [gun, x0, x1, y, height]
#   The hull is a polygon from the stern at the waterline.
#   The GATO and BALAO plates (ONI 222-US) print only length, beam and draft, so each is one polygon traced from the
#   plate's profile (tools/trace_silhouette.py, de-skewed) and scaled to the printed length. So is the FLETCHER's
#   (p. 89 of the same manual, which also prints a 0-90 ft height scale), and the BUCKLEY DE's (p. 117).

