  label: 29 June 1944
  convoy: HI-67
  start: 1944-06-28T18:00Z
  end: 1944-06-29T12:00Z
  route: Moji → Singapore via Manila.
  ships:
  - name: Miri Maru
    kind: Oiler
    type: tanker
  - name: Sarawak Maru
    kind: Oiler
    type: tanker
  ships_note: >-
    Only the two ships hit are named in the Japanese record. FRUPAC's map gives the convoy as 1 CVS, 5 escorts and
    10 AK/AP.
  escorts: []
  outcome: >-
    Oilers Miri Maru and Sarawak Maru were hit, minor damage, and both reached Manila; neither is in the June list
    of ships sunk by submarine. BANG claimed two ships sunk and one probably sunk. Her sheet 2(b)'s "large hole
    under bridge" matches Miri Maru, hit under the bridge. The night before, 28 June, GROWLER sank a large tanker
    and an escort from a different convoy 130 nm to the northeast (her claim), then left for home on fuel.
- id: south-china-sea
  label: 4 July 1944
  convoy: ''
  start: 1944-07-03T12:00Z
  end: 1944-07-04T06:00Z
  route: ''
  ships:
  - name: Five freighters (AK)
    kind: As SEAHORSE identified them; BANG saw 1 AK
    type: cargo
  ships_note: ''
