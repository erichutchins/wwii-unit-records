notes:
- head: Reading the map.
  text: >-
    Positions are BANG's own dead reckoning and star sights; lines between them are straight, and where she went
    in between is not recorded. Open circles are ships she sighted, at the target's position. As the clock passes
    each firing time a red ring pulses at BANG's position; hover a diamond for the attack sheet.
- head: Clocks.
  text: >-
    BANG kept zone K (−10) for Attack 1 and zone I (−9) for Attacks 2 and 3, as her report does; GROWLER kept I
    on station, but SEAHORSE kept H (−8). Japanese records use Tokyo time (I, −9): the escort division's chart has
    HI-67's two oilers hit at 1515, seven minutes after BANG's sheet.
- head: What is missing.
  text: >-
    No Japanese record has been found yet for Attacks 1 and 3; those actions show only the American side. Where
    the Japanese record names only the ships that were hit, the rest of the convoy is described as the boats saw
    it.
- head: Sources.
  text: >-
    BANG's second war patrol report, NARA microfilm M1752 (74802784); SEAHORSE Patrol 5 (74845019); GROWLER Patrol
    9 (74818866). The 1st Surface Escort Division war diary, June 1944, via JACAR (C08030141000, National Institute
    for Defense Studies). Sarawak Maru's record from combinedfleet.com, a secondary source, flagged where used.
    Coastline: Natural Earth.
