  - name: Two destroyers (DD)
    kind: As SEAHORSE identified them
    type: destroyer
  - name: Other escorts
    kind: As SEAHORSE identified them
    type: escort
  outcome: >-
    No Japanese record of this convoy has been found yet. SEAHORSE attacked first, at 2354–2355 H on 3 July (0054–0055
    I), about 13 nm east-northeast of BANG's later attack, and claimed two freighters sunk; BANG fired at 0506 I
    on what was left of it, and SEAHORSE logged depth charges eleven minutes later "(Bang?)". SEAHORSE attacked
    again at 1238–1239 H and claimed two passenger freighters sunk. This explains FRUPAC's "torp attack 0105/04".
  target_label: Convoy of five freighters with destroyer escorts
