title: BANG, REDFISH and SHAD against convoy TAKA-206
short: Patrol 4 · TAKA-206
eyebrow: East of Formosa · Coordinated attack group "Sandy's Sluggers", Cdr L. D. McGregor in REDFISH
lede: >-
  The three boats' torpedo attacks of 22–23 November 1944, as typed on their attack sheets, beside the log the convoy's
  minesweeper W-15 kept of the same night. Times are converted to GMT, so BANG and SHAD (zone K) and the Japanese
  escorts (zone I) share one clock.
