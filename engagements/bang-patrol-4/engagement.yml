  outcome: >-
    Three of the six ships were sunk (Hozan, Amakusa and Sakae Maru); Taiken, Sannin and Eikai Maru sheltered at
    Funauki (W-15's signal log). BANG claimed four sunk and one damaged; REDFISH two sunk (her Attacks 1 and 3,
    0104 and 0141 K); SHAD's one salvo, fired by mistake at a torpedo boat at 2338 K, missed. The postwar credit
    gives BANG Sakae and Amakusa Maru and REDFISH Hozan Maru, but W-15 logged Hozan Maru torpedoed at 2339 I (0039
    K), 25 minutes before REDFISH first fired and seven minutes after BANG's Attack 1.
