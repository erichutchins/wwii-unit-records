- at: 1945-03-17 1030 A
  of: us
  actor: III Corps engineers
  kind: report
  words: >-
    "171030 Mar - Reports that enemy firing V-2's in attempt to destroy the bridge. Good progress being made on booms."
  source: III Corps AAR, March 1945, engineer journal
  ref: iiicorps-aar-1945-03/p122
  basis: assumed
  note: Printed page -116-. The journal types no zone letter; taken as A, the report's own time (assumed)
- at: 1945-03-17 1155 A
  of: us
  actor: III Corps engineers
  kind: casualty
  words: >-
    "171155 Mar - 1 Officer and 4 men killed and 33 men evacuated for wounds due to enemy V-2 (or some similar missile
    launched by the enemy)."
  source: III Corps AAR, March 1945, engineer journal
  ref: iiicorps-aar-1945-03/p122
  basis: assumed
  note: >-
    Printed page -116-. Zone taken as A (assumed). The journal doesn't say where they were hit or in which unit. The
    G-2 report (pdf 75): "on 17 March six V-2s fell on German soil, in the very general vicinity of the bridges. Our
    operations were not impeded, and no damage to the bridge resulted; however, one small German town was destroyed,
    and some US casualties resulted."
- at: 1945-03-17 1500 A
  of: us
  actor: III Corps G-2
  kind: report
  words: >-
    "the LUDENDORFF bridge, weakened by demolitions, artillery fire, near misses of bombs, and by heavy traffic,
    collapsed at 1500 March 17. It had served its purpose, and had been closed for repairs for several days; other
    bridges carried the traffic."
  source: III Corps AAR, March 1945, G-2 report
  ref: iiicorps-aar-1945-03/p75
  pos: bridge
  note: Printed page -73-. The time is typed without a zone letter; the report's A
- at: 1945-03-17 1505 A
  of: us
  actor: III Corps engineers
  kind: loss
  words: >-
    "171505 Mar - Railway bridge collapsed. Cause undetermined. Check revealed two companies of the 276th Engr C Bn
    were working on the bridge at the time. As far as can be determined, approximately 90 casualties. ... At the time
    of the collapse, there was no enemy action in the area."
  source: III Corps AAR, March 1945, engineer journal
  ref: iiicorps-aar-1945-03/p122
  pos: bridge
  basis: assumed
  note: >-
    Printed page -116-. Zone taken as A (assumed). The entry goes on to name two officers killed and to describe the
