- at: 1945-04-07 1240
  of: us
  actor: Haynsworth
  kind: rescue
  words: >-
    "From 1240 to 1345 we picked up 8 men who had been blown into the water when Hancock was hit." The action
    report: she and four other destroyers dropped astern; of the eight, four were injured; a pair of low-flying
    Zekes made a pass at the rescue group, and her line of fire was blocked by another destroyer; the CAP
    splashed both.
  source: Haynsworth war diary, p. 4; action report, p. 5
  ref: https://catalog.archives.gov/id/633422068?objectPage=4
  step: s10
