  kind: weather
  words: >-
    "Scattered to broken low type clouds. Scattered altocumulus. Ceiling generally unlimited. Visibility
    unrestricted. Surface winds northerly 8 to 16 knots. Flying conditions good. Moderate sea. No swell." Task
    Group 58.1 was a few miles east of 58.3.
