- at: 1945-04-06 1245
  of: us
  actor: Haynsworth
  kind: fight
  words: >-
    "The sound of dog-fight and machine gun fire" is heard and tracked from the port bow to the beam. "A Judy or
    Zeke" is splashed 1,500 yards on the port quarter.
  source: Action report, p. 3; Irons, Phalanx, 327–30
