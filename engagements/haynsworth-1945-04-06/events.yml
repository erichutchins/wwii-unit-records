- at: 1945-04-06 1246
  placed: Between 1245 and 1250; no time recorded
  of: us
  actor: Haynsworth
  kind: attack
  words: >-
    A Judy "appeared out of the clouds in a very steep dive" with a Corsair on each side. All three "pulled up
    sharply short of the water"; the Corsairs climbed into the cloud, and the Judy flattened out and "headed
    away from the ship". Speed increased to 25 knots.
  source: Action report, p. 3; war diary p. 3
  ref: https://catalog.archives.gov/id/140065945?objectPage=3
  pos: st-hay
  step: s7
- at: 1945-04-06 1248
  placed: Between 1245 and 1250; no time recorded
  of: us
  actor: Haynsworth
  kind: attack
  words: >-
    Fire opened at 1,500 yards, altitude 150 ft: 20 mm, 40 mm and 5-inch. The Judy turns to starboard, "wing
    over" and comes back at the ship. Its bomb, "released or ... knocked off in the turn", falls about 1,000
    yards abeam.
  source: Action report, p. 3
  ref: https://catalog.archives.gov/id/140065945?objectPage=3
  pos: st-hay
  step: s7
- at: 1945-04-06 1250
  of: us
  actor: Haynsworth
  kind: hit
  words: >-
    "With wings at 45° angle, striking at 1250 Item" in the main radio transmitter room, abaft the bridge, at
    the twin 40 mm mount 41. A gasoline fireball goes through Main Radio, the 40 mm platform, CIC and plot.
  source: Action report, p. 3; airmailgram 090010, pp. 7-9
  ref: https://catalog.archives.gov/id/140065945?objectPage=3
  pos: hit
  step: s7
- at: 1945-04-06 1250
  of: us
  actor: Haynsworth
  kind: casualty
  words: >-
    Seven men are killed outright, five of them in or beside mount 41's crew (Report of Casualties, items 1-7).
  source: Report of Casualties, action report p. 22; Irons, Phalanx, for mount 41's crew
  ref: https://catalog.archives.gov/id/140065945?objectPage=22
  pos: hit
  step: s8
- at: 1945-04-06 1300
  of: us
  actor: Haynsworth
  kind: damage
  words: >-
    "Seven dead, eleven critically wounded, fourteen slightly wounded." Fires under control in about ten minutes
    ("By 13??", overstruck), out in about fifty-five. Radio and radar out: she rejoins the group and is coached
    on station by other ships.
  source: Haynsworth war diary, p. 4; action report pp. 3-5
  ref: https://catalog.archives.gov/id/633422068?objectPage=4
  pos: hit
  step: s8
- at: 1945-04-06 1302
  of: us
  actor: Cabot
  kind: attack
  words: >-
    "Out of a 15 plane enemy raid, 2 ZEKE's closed": a suicide Zeke in a shallow dive clips Cabot's SK radar
    antenna and explodes close aboard. Bunker Hill calls it "another JUDY". At 1302 Washington shoots down a
    suicide Zeke attacking Hancock.
  source: Cabot p. 12; Astoria p. 72; Bunker Hill diary p. 8; VBF-6 history pp. 21-22
  ref: https://catalog.archives.gov/id/139967685?objectPage=12
  pos: cabot-1302
