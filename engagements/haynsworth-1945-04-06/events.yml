- at: 1945-04-09 1315
  of: us
  actor: Haynsworth
  kind: departure
  words: >-
    "At 1315 by authority CTF 58, 082125, we were detached from T.U. 58.3.4 and joined T.U. 58.3.10 proceeding
    to Ulithi. The T.U. consisted of Hancock, Cabot, Stemble and Haynsworth. OTC Captain Smith in Cabot."
  source: Haynsworth war diary, p. 5
  ref: https://catalog.archives.gov/id/633422068?objectPage=5
