- at: 1945-04-09
  placed: 'No time: during the replenishment'
  of: us
  actor: TG 58.3
  kind: departure
  words: >-
    "After clearing the Logistic Support Group, Task Group 58.3 stood to the northward to an operating area east
    of OKINAWA JIMA to give direct air support to the ground forces attacking enemy positions on OKINAWA JIMA.
    During the replenishment exercises the U.S.S. HANCOCK, CABOT, and HAYNSWORTH were detached from Task Group
    58.3 and directed to return to the rear area for repairs and overhaul."
  source: South Dakota war diary, p. 8
  ref: https://catalog.archives.gov/id/633438508?objectPage=8
  step: s11
- at: 1945-04-11 1355
  of: us
  actor: Haynsworth
  kind: arrival
  words: >-
    "At 1355 we entered Ulithi Lagoon via Mugai Channel and T.U 58.3.10 was dissolved. After fueling from
    Sepulga in berth #303, we moored alongside Yosemite (AD19) in berth #319 for tender availability." Clocks
    were set to zone -10 at 0100.
  source: Haynsworth war diary, p. 5
  ref: https://catalog.archives.gov/id/633422068?objectPage=5
  step: s11
