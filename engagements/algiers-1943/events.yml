- at: 1943-05-12
  placed: seq
  of: uk
  actor: 153 Sqn, Beaufighter V.8632
  kind: kill
  words: >-
    "The enemy aircraft which was taking evasive action from A.A. turned South about two miles West of Algiers.
    Our aircraft closed in and gave a two second burst. This was enough and the bandit blew up and fell into the
    sea. 1 Ju88 destroyed."
  source: No. 153 Squadron RAF, operations record book, Form 540 (summary of events), AIR 27/1027/37, p. 3
  ref: tna:AIR 27/1027/37/p3
  pos: turn-0512
  step: m12
- at: 1943-05-13
  of: fr
  actor: L'Écho d'Alger
  kind: report
  original: >-
    L'alerte a été donnée dans la soirée à Alger. Des avions ennemis ont survolé la ville. La réaction de la
    D.C.A. a été très violente et efficace. Quelques bombes ont été lancées.
  lang: fr
  translation: >-
    The alert was given in the evening at Algiers. Enemy aircraft flew over the city. The anti-aircraft fire was
    very violent and effective. A few bombs were dropped.
  note: Under the headline "Alerte à Alger".
  source: L'Écho d'Alger, 13 May 1943
  ref: gallica:bpt6k75870445
  step: m12
- at: 1943-05-13
  of: us
  actor: Allied Force HQ
  kind: communique
  original: >-
    La nuit dernière, des bombardiers ennemis ont essayé d'attaquer Alger. Ils ont été chassés par la D.C.A. et
    les chasseurs de nuit. Trois appareils au moins ont été détruits. Les quelques bombes qui ont été lâchées ont
    causé un petit nombre de victimes parmi la population civile et de légers dégâts.
  lang: fr
  translation: >-
    Last night enemy bombers tried to attack Algiers. They were driven off by the anti-aircraft guns and the night
    fighters. At least three aircraft were destroyed. The few bombs that were dropped caused a small number of
    casualties among the civilian population and slight damage.
  note: Communiqué no. 188, as the paper printed it in French.
  source: L'Écho d'Alger, 14 May 1943 (communiqué of 13 May)
  ref: gallica:bpt6k7587045k
  step: m12
