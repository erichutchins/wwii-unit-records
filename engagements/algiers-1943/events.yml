- at: 1943-05-13
  placed: seq
  side: allied
  actor: 153 Sqn, Beaufighter EL.162
  kind: probable
  words: >-
    "After a long chase in which no heights were given eventually obtained a visual on a Ju88. He then gave it 3
    bursts and although the e/a was badly 'mauled' and lost height, he did not see it fall into the sea and was
    only awarded a 'probable'."
  source: No. 153 Squadron RAF, operations record book, Form 540 (summary of events), AIR 27/1027/37, p. 3
  ref: https://discovery.nationalarchives.gov.uk/details/r/D8389771
  step: m13
- at: 1943-05-14
  side: press
  actor: L'Écho d'Alger
  kind: report
  words: >-
    "Nouvelle alerte à Alger": "Une alerte a été donnée, hier dans la soirée. Un violent tir de barrage de la
    D.C.A. a accueilli les appareils qui tentaient de survoler la ville. On ne signale ni dégâts ni victimes."
  source: L'Écho d'Alger, 14 May 1943
  ref: https://gallica.bnf.fr/ark:/12148/bpt6k7587045k
  step: m13
- at: 1943-05-14
  side: axis
  actor: Comando Supremo; OKW
  kind: silence
  words: >-
    Neither the Italian bulletins (nos. 1083, 1084) nor the German communiqués printed on 14 and 15 May mention
    Algiers: those days they announce the end in Tunisia and raids on Bône, Bougie and Sfax.
  source: La Stampa, 14 and 15 May 1943, p. 1
  ref: https://archive.org/details/lastampa_1943-05-15
  step: m13
