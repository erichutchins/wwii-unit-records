- at: 1943-06-05
  side: axis
  actor: Comando Supremo
  kind: bulletin
  words: >-
    Bulletin no. 1106: "L'aviazione dell'Asse ha bombardato questa notte il porto di Algeri." The German
    communiqué of 5 June: "Le installazioni portuali di Algeri sono state bombardate la scorsa notte."
  source: La Stampa, 6 June 1943, p. 1
  ref: https://archive.org/details/lastampa_1943-06-06
