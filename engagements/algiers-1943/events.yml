  kind: warning
  words: >-
    "On patrol in Algiers Bay, were told that a number of bandits were 40 miles to the North at 16000ft ...
    informed that the bandits were 5 miles away at angels 12."
  source: No. 153 Squadron RAF, operations record book, Form 540 (summary of events), AIR 27/1027/37, p. 2
  ref: https://discovery.nationalarchives.gov.uk/details/r/D8389771
  step: m12
