- at: 1943-06-05
  side: press
  actor: L'Écho d'Alger
  kind: report
  words: >-
    "Alerte à Alger": "L'alerte a été donnée dans la soirée à Alger. On signale des dégâts et quelques
    victimes." Admiral Muselier and the inspector general of civil defence went to the damaged areas.
  source: L'Écho d'Alger, 5 June 1943
  ref: https://gallica.bnf.fr/ark:/12148/bpt6k7587065b
  step: after
- at: 1943-06-05
  side: allied
  actor: Allied Force HQ
  kind: communique
  words: >-
    "Dans la nuit du vendredi à samedi, quelques appareils ennemis ont lâché des bombes dans la région d'Alger.
    Il y a eu quelques victimes et des dégâts ont été causés à la propriété civile. Deux bombardiers ennemis ont
    été détruits."
  source: L'Écho d'Alger, 6 June 1943
  ref: https://gallica.bnf.fr/ark:/12148/bpt6k7587066r
  step: after
- at: 1943-06-05
  side: press
  actor: L'Écho d'Alger
  kind: visit
  words: >-
    "Après l'alerte de vendredi soir": Generals Giraud and Catroux visited the bombed quarters on the Saturday
    morning, where clearing and rescue went on; Catroux called on Muslim families who had lost their homes.
  source: L'Écho d'Alger, 6 June 1943
  ref: https://gallica.bnf.fr/ark:/12148/bpt6k7587066r
  step: after
