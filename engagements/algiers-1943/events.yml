  side: axis
  actor: Luftflotte 2 ("2nd Air Force")
  kind: raid
  words: >-
    "Thirty bombers raided Algiers during the night of 12 May, scoring hits on the harbor." No units or losses
    given.
  source: German Naval Staff war diary, 12 May 1943 (ONI translation), vol. 45, p. 152
  ref: https://archive.org/details/wardiarygermann451943germ
  pos: harbour
  step: m12
- at: 1943-05-12 2050
  side: allied
  actor: Battery C
  kind: fire
  words: '"Fired on hostile targets 2050 to 2125 Weather good"'
  source: Battery C, 62nd CA (AA), morning report (record of events), May 1943
  ref: https://catalog.archives.gov/id/427182819?objectPage=519
  pos: battery-c
  step: m12
- at: 1943-05-12
  placed: seq
  side: allied
  actor: 153 Sqn, Beaufighter V.8632
  kind: kill
  words: >-
    "The enemy aircraft which was taking evasive action from A.A. turned South about two miles West of Algiers.
    Our aircraft closed in and gave a two second burst. This was enough and the bandit blew up and fell into the
    sea. 1 Ju88 destroyed."
  source: No. 153 Squadron RAF, operations record book, Form 540 (summary of events), AIR 27/1027/37, p. 3
  ref: https://discovery.nationalarchives.gov.uk/details/r/D8389771
  pos: turn-0512
  step: m12
- at: 1943-05-13
  side: press
  actor: L'Écho d'Alger
  kind: report
  words: >-
    "Alerte à Alger": "L'alerte a été donnée dans la soirée à Alger. Des avions ennemis ont survolé la ville. La
    réaction de la D.C.A. a été très violente et efficace. Quelques bombes ont été lancées."
  source: L'Écho d'Alger, 13 May 1943
  ref: https://gallica.bnf.fr/ark:/12148/bpt6k75870445
  step: m12
- at: 1943-05-13
  side: allied
  actor: Allied Force HQ
  kind: communique
  words: >-
    Communiqué no. 188: "La nuit dernière, des bombardiers ennemis ont essayé d'attaquer Alger. Ils ont été
    chassés par la D.C.A. et les chasseurs de nuit. Trois appareils au moins ont été détruits. Les quelques
    bombes qui ont été lâchées ont causé un petit nombre de victimes parmi la population civile et de légers
    dégâts."
  source: L'Écho d'Alger, 14 May 1943 (communiqué of 13 May)
  ref: https://gallica.bnf.fr/ark:/12148/bpt6k7587045k
  step: m12
- at: 1943-05-13 0820
