- at: 1943-05-14
  of: fr
  actor: L'Écho d'Alger
  kind: report
  original: >-
    Une alerte a été donnée, hier dans la soirée. Un violent tir de barrage de la D.C.A. a accueilli les appareils
    qui tentaient de survoler la ville. On ne signale ni dégâts ni victimes.
  lang: fr
  translation: >-
    An alert was given yesterday evening. A violent anti-aircraft barrage met the aircraft that were trying to fly
    over the city. Neither damage nor casualties are reported.
  note: Under the headline "Nouvelle alerte à Alger".
  source: L'Écho d'Alger, 14 May 1943
  ref: gallica:bpt6k7587045k
  step: m13
