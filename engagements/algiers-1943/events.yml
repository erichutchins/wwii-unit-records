- at: 1943-06-05
  of: it
  actor: Comando Supremo
  kind: bulletin
  original: L'aviazione dell'Asse ha bombardato questa notte il porto di Algeri.
  lang: it
  translation: Axis aircraft bombed the port of Algiers during the night.
  note: >-
    Bulletin no. 1106 ("questa notte" is the night of 4/5 June: the bulletin is issued the afternoon after). The
    German communiqué of 5 June, printed beside it: "Le installazioni portuali di Algeri sono state bombardate la
    scorsa notte" (the port installations of Algiers were bombed last night).
  source: La Stampa, 6 June 1943, p. 1
  ref: lastampa:1943-06-06/p1
  pos: harbour
  step: j4
- at: 1943-06-05
  of: fr
  actor: L'Écho d'Alger
  kind: report
  original: L'alerte a été donnée dans la soirée à Alger. On signale des dégâts et quelques victimes.
  lang: fr
  translation: The alert was given in the evening at Algiers. Damage and some casualties are reported.
  note: >-
    Under the headline "Alerte à Alger". Admiral Muselier and the inspector general of civil defence went to the
    damaged areas.
  source: L'Écho d'Alger, 5 June 1943
  ref: gallica:bpt6k7587065b
  step: after
- at: 1943-06-05
  of: us
  actor: Allied Force HQ
  kind: communique
  original: >-
    Dans la nuit du vendredi à samedi, quelques appareils ennemis ont lâché des bombes dans la région d'Alger. Il
    y a eu quelques victimes et des dégâts ont été causés à la propriété civile. Deux bombardiers ennemis ont été
    détruits.
  lang: fr
  translation: >-
    In the night of Friday to Saturday a few enemy aircraft dropped bombs in the Algiers area. There were some
    casualties and damage was caused to civilian property. Two enemy bombers were destroyed.
  note: The Allied communiqué as the paper printed it in French.
  source: L'Écho d'Alger, 6 June 1943
  ref: gallica:bpt6k7587066r
  step: after
- at: 1943-06-05
  of: fr
  actor: L'Écho d'Alger
  kind: visit
  words: >-
    "Après l'alerte de vendredi soir": Generals Giraud and Catroux visited the bombed quarters on the Saturday
    morning, where clearing and rescue went on; Catroux called on Muslim families who had lost their homes.
  source: L'Écho d'Alger, 6 June 1943
  ref: gallica:bpt6k7587066r
  step: after
