- at: 1944-01-12
  placed: seq
  of: de
  actor: Arko 414
  kind: report
  original: >-
    Beiderseitige Fliegertätigkeit, besonders rege am Nachmittag ... Über dem mittl. Korpsabschnitt vereinzelte
    Luftkämpfe. Am Nachmittag wurde ein Feindbomber durch Flak abgeschossen. ... Eig. Verschuss 4800
  lang: de
  translation: >-
    Air activity on both sides, especially lively in the afternoon ... isolated air combats over the corps'
    central sector. In the afternoon an enemy bomber was shot down by Flak. ... Own expenditure 4,800 rounds.
  note: >-
    Two passages of the one report, abridged with "...". Weather: heavy ground mist, clearing at midday, hazy,
    generally good visibility. No German air attack or German aircraft loss is reported.
  source: 'XIV Panzer Corps, tactical reports: Arko 414, Tagesmeldung vom 12.1.1944'
  ref: t314-0543/f0699
- at: 1944-01-13
  of: de
  actor: German High Command (communiqué)
  kind: communique
  original: >-
    Nella parte occidentale del fronte dell'Italia meridionale il nemico ha esteso i suoi attacchi anche al
    settore situato a nord di Venafro. Attacchi lanciati contro le nostre posizioni montane, dopo una forte
    preparazione di artiglieria, sono stati respinti con elevate perdite per il nemico, mentre due infiltrazioni
    locali sono state arginate.
  lang: it
  translation: >-
    In the western part of the southern Italian front the enemy also extended his attacks to the sector north of
    Venafro. Attacks launched against our mountain positions after a heavy artillery preparation were repulsed
    with heavy losses for the enemy, while two local penetrations were sealed off.
  note: >-
    The communiqué of Berlin, 13 Jan, for 12 Jan, as La Stampa printed it in Italian; it says nothing of German air
    attacks in Italy that day. The other side's claim.
  source: La Stampa, 14 Jan 1944, p. 1 (the German communiqué, Berlin, 13 Jan)
  ref: lastampa:1944-01-14/p1
