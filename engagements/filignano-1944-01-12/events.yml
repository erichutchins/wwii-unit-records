# Every dated entry, from either side, in the records' words. Hand-edited; fields in records/SCHEMA.md (An engagement's events).
- at: 1944-01-12 0645
  of: de
  actor: 5. Geb.Div.
  kind: report
  original: >-
    6.45 Uhr Abschnitt nördlich M 46 bis C 11 Feindangriff in mindestens Div.-Stärke auf breiter Front nach
    stärkster langanhaltender Art.-Vorbereitung (auch auf Versorgungswege und Hintergelände)
  lang: de
  translation: >-
    06.45, in the sector from north of M 46 to C 11: enemy attack in at least division strength on a broad front,
    after the heaviest and longest artillery preparation (also on supply routes and rear areas).
  note: >-
    Decoded on the January 1944 Bezugspunktkarte: M 46 is 4.6 km west of Battery F at Selvone; C 11 is in the
    Mainarde (positions.csv).
  source: 'XIV Panzer Corps, tactical reports: 5. Geb.Div., Tagesmeldung vom 12.1.1944'
  ref: t314-0543/f0697
  pos: m-46
- at: 1944-01-12
  placed: seq
  of: fr
  actor: French Expeditionary Corps
  kind: context
  words: >-
    The French Expeditionary Corps (2nd Moroccan and 3rd Algerian Divisions) attacked on 12 January toward Atina
    and Sant'Elia, on the Fifth Army's right. Context: that the German report of 06.45 describes this attack is
    inferred from the date and the sector.
  source: Blumenson, Salerno to Cassino (U.S. Army in World War II), p. 313
  ref: blumenson/p313
- at: 1944-01-12 1225
  of: us
  actor: Battery G
  kind: air
  words: >-
    "At 1225A fired at 2 ME 109's, 12rds 40mm & 80rds 50 cal expended. No hits claimed, withheld fire as 4
    Spitfires appeared in range."
  source: Battery G, 67th CA (AA), morning report (record of events), 12 Jan 1944
  ref: rg64-461580516/p0276
  pos: battery-g
- at: 1944-01-12 1430
  of: de
  actor: Arko 414
  kind: report
  original: >-
    Rege beiderseitige Fliegertätigkeit, Jabo-Angriffe auf D 14, M 06, D 12, M 28, Strasse C 02 - H 11.
    Vereinzelte Luftkämpfe. Durch schwere Flak wurde um 14.30 Uhr fdl. ein Flugzeug abgeschossen.
  lang: de
  translation: >-
    Lively air activity on both sides; [enemy] fighter-bomber attacks on D 14, M 06, D 12, M 28, the road C 02 -
    H 11. Isolated air combats. Heavy Flak shot down an enemy aircraft at 14.30.
  source: 'XIV Panzer Corps, tactical reports: Arko 414, Zwischenmeldung vom 12.1.1944'
  ref: t314-0543/f0690
  pos: m-28
