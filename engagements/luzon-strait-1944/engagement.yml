notes:
- head: Reading the map.
  text: >-
    Positions are the boats' own dead reckoning and star sights, and three navigators never quite agree, so the
    same convoy appears in slightly different places in each report. Lines between positions are straight; where
    a boat actually went in between is not recorded. Dashed outlines mark entries the report itself contradicts,
    kept with the reason.
- head: Clocks.
  text: >-
    BANG kept zone K (−10) and PARCHE zone I (−9); TINOSA kept zone H (−8) on station. Japanese records use Tokyo
    time (I, −9). On 29–30 April the target ship's own log and BANG's attack sheets agree to within one to seven
    minutes once both are in GMT.
- head: Sources.
  text: >-
    War patrol reports, NARA microfilm M1752 (BANG 74802746, PARCHE 74828582, TINOSA 74856363). Nittatsu Maru's
    movement log and the 1st Surface Escort Division war diary via JACAR (National Institute for Defense Studies).
    Convoy lists and the 3–4 May sinking times from combinedfleet.com, a secondary source, flagged where used. Coastline:
    Natural Earth.
