- at: 1945-04-20 1203 I
  side: us
  actor: bang
  kind: log
  words: Surfaced on lifeguard station. Sky completely overcast with strong wind and rough seas.
  ref: rg367-74802934/p11
- at: 1945-04-20 1213 I
  side: us
  actor: bang
  kind: log
  words: >-
    Sighted B-24 at about 8 miles on westerly course. He gave no indication of having seen us. No other planes
    were sighted, and nothing heard on VHF. It seems probable that scheduled strikes were called off on account
    of weather.
  ref: rg367-74802934/p11
- at: 1945-04-20 1600 I
  side: us
  actor: bang
  kind: log
  words: Sighted and exchanged calls with patrolling B-24. He had nothing to report.
  ref: rg367-74802934/p12
- at: 1945-04-20 1927 I
  side: us
  actor: bang
  kind: log
  words: Surfaced. Barometer high, but seas still state 5 to 6 from NNE with heavy overcast.
  ref: rg367-74802934/p12
- at: 1945-04-21 0935 I
  side: us
  actor: bang
  kind: log
  words: Sighted PB4Y heading southeast.
  ref: rg367-74802934/p12
- at: 1945-04-21 1200 I
  side: us
  actor: bang
  kind: log
  words: Posit Lat. 24-34N, Long. 122-47E.
  ref: rg367-74802934/p12
- at: 1945-04-21 1348 I
  side: us
  actor: bang
  kind: log
  words: Surfaced. Weather clear and seas moderating.
  ref: rg367-74802934/p12
- at: 1945-04-21 1415 I
  side: us
  actor: bang
  kind: log
  words: >-
    Received orders to leave present lifeguard station and proceed to point in vicinity of Sakishima Gunto to
    search for downed aviators. Proceeding at four engine speed.
  ref: rg367-74802934/p12
- at: 1945-04-21 1530 I
  side: us
  actor: chenango
  kind: status
  title: Four F6F-5s launched
  words: >-
    Four F6F-5s were launched from the U.S.S. CHENANGO at 1530 "I", 21 April 1945, as a combination strike and
    Target Combat Air Patrol over Ishigaki Shima. Principal attention was given to the Ishigaki airfield.
  source: NARA 140031168, ACA Report No. 50, image p248
  ref: https://catalog.archives.gov/id/140031168?objectPage=248
- at: 1945-04-21 1737 I
  side: us
  actor: chenango
  kind: ditched
  title: Corzine ditches; hit by AA over Ishigaki airfield
  words: >-
    On one of the bombing runs on Ishigaki airfield, Ensign Donald Elmer CORZINE ... received several hits,
    probably from medium A.A. ... He was able to maintain control over his plane and flew it about twenty-miles
    East of the Island before being forced to make a water landing. The other three Hellcats circled him ... and
    ascertained that he was in his life raft.
  source: NARA 140031168, ACA Report No. 50, image p248
  ref: https://catalog.archives.gov/id/140031168?objectPage=248
  basis: assumed
  note: >-
    The report gives no time or position for the landing. The time is BANG's "in the water fourteen hours"
    counted back from 0737; the position is 20 miles east of Ishigaki airfield. Both estimated.
  pos: corzine-ditches
- at: 1945-04-21 1900 I
  side: us
  actor: chenango
  kind: status
  title: The other three return
  words: >-
    Because of the late hour, it was impossible for the Dumbo plane to attempt a rescue that evening. Rescue was
    effected the following morning by submarine. The other three pilots returned safely to base at 1900 "I".
  source: NARA 140031168, ACA Report No. 50, image p248
  ref: https://catalog.archives.gov/id/140031168?objectPage=248
- at: 1945-04-21 2150 I
  side: us
  actor: bang
  kind: log
  words: >-
    Southwest of Iriomote Jima encountered strong 156 mc radar interference similar to that encountered by
    BATFISH on Jap submarine (see section U). Swung ship to determine bearing, but found it to be emanating from
    the island.
  ref: rg367-74802934/p12
- at: 1945-04-21 2200 I
  side: us
  actor: bang
  kind: log
  words: >-
    (Section U intercept log, ship position 24°06'N 125°14'E as typed: 156 mc, PRF 500, pulse width 10, antenna
    rotation irregular; second entry same time and position:) This had the looks of a 103MC carrier modulated
    with 100% modulation at 350 CPS. It made constant sweeps at 1 R.P.M. Maybe a Jap radar beacon - land based.
    (As typed, 24-06N 125-14E is about 40 nm south of Miyako Jima, not southwest of Iriomote Jima as the
    narrative says at 2150. It does fit the run from the 21 Apr noon position at four-engine speed (about 135 nm
    east in 7.6 h); unresolved.)
  ref: rg367-74802934/p35
- at: 1945-04-21 2330 I
  side: us
  actor: bang
  kind: log
  words: Arrived at reported position of downed aviators and commenced search southeast of Ishigaki Jima.
  ref: rg367-74802934/p12
- at: 1945-04-22 0500 I
  side: us
  actor: bang
  kind: log
  words: >-
    Began feeling distant explosions and seeing occasional flashes, presumed to be carrier planes striking
    Ishigaki Jima and Miyako Jima.
  ref: rg367-74802934/p12
- at: 1945-04-22 0630 I
  side: us
  actor: bang
  kind: log
  words: >-
    Began making contact with carrier planes. Requested information on any downed aviators and after a brief
    flurry of communications learned that we were within 20 miles of a downed Hellcat pilot in rubber boat.
    Planes furnished cover and guided us in.
  ref: rg367-74802934/p12
- at: 1945-04-22 0737 I
  side: us
  actor: bang
  kind: log
  words: >-
    Took aboard Ensign Donald E. Corzine, file #382983, U.S.S. CHENANGO Hellcat pilot. He had been in the water
    fourteen hours but was in excellent condition and very glad to be aboard. Replacement clothing was no
    problem except for his size thirteen shoes. ... this rescue did more for the morale of the crew than
    anything else could have done with the exception of sinking ships. Every officer and man is proud to have
    been of some help to those who are now the ball carriers. (No position or cause of loss given. Fourteen
    hours before 0737 I puts him in the water about 1737 I on 21 Apr.)
  ref: rg367-74802934/p12
- at: 1945-04-22 0740 I
  side: us
  actor: bang
  kind: log
  words: Proceeding with search for downed aviators previously reported in our orders.
  ref: rg367-74802934/p13
- at: 1945-04-22 0800 I
  side: us
  actor: bang
  kind: log
  words: >-
    Released fighter cover. Thereafter during the day numerous planes were contacted, mostly flying high enroute
    to or from their carriers.
  ref: rg367-74802934/p13
- at: 1945-04-22 1200 I
  side: us
  actor: bang
  kind: log
  words: Posit Lat. 24-03N, Long. 124-16E.
  ref: rg367-74802934/p13
- at: 1945-04-22 1200 I
  side: us
  actor: bang
  kind: log
  words: >-
    (Section U intercept log, ship position 24°01'N 124°12'E: 104 mc, PRF 350, pulse width very wide, antenna
    rotation 1.) The full scale sweep is as seen in the sketch. Made regular sweeps.
  ref: rg367-74802934/p36
- at: 1945-04-22 1635 I
  side: us
  actor: bang
  kind: log
  words: >-
    Completed search of probable southern sector. Dove and headed north, intending to transit the channel to
    eastward of Ishigaki Jima immediately after dark and continue search to northward. Strong northerly winds
    yesterday would have driven survivors to southwest, but with moderation of weather the northerly current
    would have taken charge.
  ref: rg367-74802934/p13
- at: 1945-04-22 1937 I
  side: us
  actor: bang
  kind: log
  words: Surfaced.
  ref: rg367-74802934/p13
- at: 1945-04-22 2100 I
  side: us
  actor: bang
  kind: log
  words: >-
    Received orders to return to our assigned lifeguard station to the northeast of Formosa. Proceeding
    westward. Learned later that the survivors for whom we had been searching had been picked up by a PBM.
  ref: rg367-74802934/p13
- at: 1945-04-23 0607 I
  side: us
  actor: bang
  kind: log
  words: Submerged on station.
  ref: rg367-74802934/p13
- at: 1945-04-23 0620 I
  side: us
  actor: bang
  kind: log
  words: Sighted unidentified single engine fighter plane on westerly course.
  ref: rg367-74802934/p13
- at: 1945-04-23 1200 I
  side: us
  actor: bang
  kind: log
  words: Posit Lat. 24-40N, Long. 122-37E.
  ref: rg367-74802934/p13
- at: 1945-04-23 1500 I
  side: us
  actor: bang
  kind: log
  words: >-
    (Section U intercept log, ship position 24°20'N 122°32'E:) Same intercepts as 2230, 13 April. 0400, 18
    April.
  ref: rg367-74802934/p36
- at: 1945-04-23 2214 I
  side: us
  actor: bang
  kind: log
  words: >-
    Dove for SJ contact at 4000 yds, moving in fast, nothing in sight. Suspected a plane, although APR had
    indicated no radars other than the customary assorted land-based air search equipment.
  ref: rg367-74802934/p13
- at: 1945-04-23 2220 I
  side: us
  actor: bang
  kind: log
  words: >-
    (Section U intercept log, ship position 24°38'N 122°27'E: 155 mc, came on suddenly.) A plane contact was
    made on the SJ shortly after this intercept was made.
  ref: rg367-74802934/p36
- at: 1945-04-23 2243 I
  side: us
  actor: bang
  kind: log
  words: >-
    Surfaced; all clear. During remainder of night we made numerous other close-in contacts, moving at various
    speeds. A check for phantoms ... showed they were real pips. ... My only explanation is that they possibly
    were porpoises or blackfish, of which a large number were seen during the daytime.
  ref: rg367-74802934/p13
