- at: 1945-02-22
  placed: The day; no time in the account
  actor: u-300
  kind: loss
  words: >-
    (The postwar account) After depth-charge damage from HMS Evadne, U-300 is scuttled under the gunfire of HMS
    Recruit and HMS Pincher west of Cádiz; nine dead, among them her commander, and 41 survivors.
  source: uboat.net, U-300 and Fritz Hein (after Niestlé and Busch and Röll)
  ref: https://uboat.net/boats/u300.htm
  pos: u300-lost
  basis: secondary
