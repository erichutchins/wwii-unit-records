    "Starker Lkw.Verkehr in XXIII 97 ... 2 Feindbatterien bekämpft, 2 Lkw.in Brand geschossen." (Heavy truck
    traffic in XXIII 97 [Sant'Elia] ... two enemy batteries engaged, two trucks set on fire.) No squares for the
    batteries.
  source: 'XIV Panzer Corps, tactical reports: 5. Geb.Div., Tagesmeldung vom 14.2.44'
