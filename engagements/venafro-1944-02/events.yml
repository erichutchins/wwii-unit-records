  side: allied
  actor: Battery A (1st Bn)
  kind: shelled
  words: >-
    "Battery heavily shelled by enemy FA action between 1430 & 1500 hrs. Type of ammo used by enemy presumably
    88's. Location of btry position believed to be revealed to the enemy as a result of (2) clip-winged
    Spitfires with proper British insignia"
  source: Battery A morning report, 16 Feb 1944
  ref: rg64-463960255/p0626
  pos: battery-a
