  placed: seq
  side: axis
  actor: 5. Geb.Div.
  kind: report
  words: >-
    "Mit einbrechender Dämmerung wurden im Raum XXIII 97 marschierende Feindkräfte in Stärke von 2 Batlnen.
    durch gutliegendes eigenes Artl.Feuer gefasst und zersprengt." (At dusk enemy forces of two battalions
    marching in the area XXIII 97 [Sant'Elia] were caught by well-placed own artillery fire and scattered.)
  source: 'XIV Panzer Corps, tactical reports: 5. Geb.Div., Nachmeldung zur Tagesmeldung vom 14.2.44'
  ref: t314-0544/f0362
  pos: xxiii-97
