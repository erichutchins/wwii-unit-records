  kind: casualty
  words: >-
    "Vehicles and personnel strafed and shelled by enemy en route to St. Elia between 1300 and 1600 hrs on the
    road Aquafondata and St. Elia. Five EM hospitalized as a result of wounds received during the activity."
  source: Battery A, 67th CA (AA), morning report (record of events), 8 Feb 1944
  ref: rg64-463960255/p0618
  pos: battery-a
- at: 1944-02-10 0300
