- at: 1944-02-16
  placed: seq
  side: axis
  actor: Arko 414
  kind: report
  words: >-
    "Kan.Bttrn. bekämpften 2 Feindbattrn. im Raum XXIII 122, 1 im Raum XXIII 112 und 1 bei XXIII 117. Eigener
    Verschuss etwa 5000 Schuss." (Our gun batteries engaged two enemy batteries in the area XXIII 122, one in
    XXIII 112 and one at XXIII 117. Own expenditure about 5,000 rounds.)
  source: 'XIV Panzer Corps, tactical reports: Arko 414 (corps artillery commander), Tagesmeldung vom 16.2.44'
  ref: t314-0544/f0406
