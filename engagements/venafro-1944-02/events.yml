  placed: seq
  side: axis
  actor: 5. Geb.Div.
  kind: report
  words: >-
    "Während der Mittagstunden starker Verkehr auf Strasse XXIII 117 nach XXIII 97 ... Eigene Artl. legt
    Störungsfeuer auf XXIII 117 und Nachschubstrassen und zerstört 6 Lkw." (At midday heavy traffic on the road
