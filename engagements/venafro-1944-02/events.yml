  words: >-
    Moved 9 Feb from Acquafondata "to vicinity of St. Elia, Italy" (11 miles), in position 0300 10 Feb; rejoined
    the battery near Lucenteforte 0800 23 Feb.
  source: Battery E morning report, record of events 24 Feb 1944
  ref: rg64-463960255/p0798
  pos: battery-e-sections
