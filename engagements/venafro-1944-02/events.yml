- at: 1944-02-17
  placed: seq
  side: axis
  actor: 5. Geb.Div.
  kind: report
  words: >-
    "Eigene Artl. ... vernichtet 1 Feindbatterie" (own artillery destroyed one enemy battery); no square or
    time. "Lebhafter Lkw.Verkehr auf Nachschubstrasse nördl. XXIII 89" (busy truck traffic on the supply road
    north of Cassino).
  source: 'XIV Panzer Corps, tactical reports: 5. Geb.Div., Tagesmeldung vom 17.2.44'
  ref: t314-0544/f0421
- at: 1944-02-18 0900
  side: allied
  actor: Battery A (1st Bn)
  kind: casualty
  words: >-
    "Battery and immediate vic heavily shelled by German FA from 0900 to 0930. Approximately 30 shells ... From
    1400 to 1515, the battery again was subjected to heavy enemy FA action. Approx. 50 shells ... Action again
    believed to be result of direct ground observation." A 90 mm gun hit directly; one man killed, two
    hospitalized, six wounded who stayed on duty (p0630).
  source: Battery A morning report, 18 Feb 1944
  ref: rg64-463960255/p0629
  pos: battery-a
- at: 1944-02-18
  placed: seq
  side: axis
  actor: 5. Geb.Div.
  kind: report
  words: >-
    "Auf Strasse XXIII 89 nach XXIII 97, 15 mit Truppen beladenen LKw. beobachtet. Eigene Artl. bekämpfte von
    XXIII 97 nach XXIII 9 d marschierende Gruppen (15o bis 2oo Mann), zersprengte eine Tragtierkolonne von 4o
    Tieren u. 3o Mann, schoss 4 Lkw. in Brand und vernichtete eine Feindbatterie und 1 Einzelgeschütz." (On the
    road from Cassino to Sant'Elia, 15 lorries loaded with troops seen. Own artillery engaged groups of 150 to
    200 men marching from XXIII 97 [Sant'Elia] toward XXIII 9? [the second digit unclear], scattered a
    pack-animal column of 40 animals and 30 men, set 4 lorries on fire and destroyed an enemy battery and one
    single gun.) Also "auffallend starke Verwendung von Phosphorbrand-Munition" (strikingly heavy use of
    phosphorus incendiary ammunition) by the enemy. No square or time for the battery and the gun.
  source: 'XIV Panzer Corps, tactical reports: 5. Geb.Div., Tagesmeldung vom 18.2.44'
  ref: t314-0544/f0438
  pos: xxiii-97
- at: 1944-02-21 1400
  side: axis
  actor: 90. Pz.Gr.Div.
  kind: report
  words: >-
    "14.oo Uhr 4 erkannte Feindbatterien wurden von eigener Artl. bekämpft." (At 14.00 four identified enemy
    batteries were engaged by own artillery.) In the Cassino sector; no squares.
  source: 'XIV Panzer Corps, tactical reports: Zwischenmeldung vom 21.2.44'
  ref: t314-0544/f0478
