# The questions the records leave open, and each answer's evidence. Hand-edited; fields in records/SCHEMA.md (An engagement's claims).
- question: Was the German fire of 21 Feb on Vallerotonda what hit Battery H?
  answer: Battery H's gun positions near Acquafondata were shelled at 1500 on 21 Feb; two men seriously wounded
  weight: record
  source: Battery H morning report, 21 Feb 1944
  ref: rg64-463960255/p0988
  note: 'The American side: time, place (near the village), and that it was artillery.'
- question: Was the German fire of 21 Feb on Vallerotonda what hit Battery H?
  answer: The 5th Mountain Division laid harassing fire on XXIII 117 and the supply roads
  weight: record
  source: 5. Geb.Div., Tagesmeldung
  ref: t314-0544/f0486
  note: No time; the date is typed over (21 or 22 Feb). Harassing fire on a point and roads, not on a battery.
- question: Was the German fire of 21 Feb on Vallerotonda what hit Battery H?
  answer: XXIII 117 is Vallerotonda, about 3 km west of Acquafondata village
  weight: inference
  source: Bezugspunktkarte, Feb 1944 edition, decoded
  ref: t312-0090/f0215
  note: >-
    Printed point 106 is the circle on Vallerotonda (XXIII = 8Z, less 11). Neither the battery's guns nor the
    German shells' fall are given closer than that.
- question: Was the German fire of 21 Feb on Vallerotonda what hit Battery H?
  answer: >-
    Other German artillery fired on American batteries that day: the 90th Panzergrenadier Division engaged four
    at 14.00
  weight: record
  source: Zwischenmeldung vom 21.2.44
  ref: t314-0544/f0478
  note: >-
    In the Cassino sector, south-west of Acquafondata; no squares. Whether the two sides kept the same clock is
    not known, so the hour between 14.00 and 1500 settles nothing.
- question: >-
    Where were Battery E's men hit on 14 and 16 Feb: at Lucenteforte, or with the sections near Sant'Elia?
  answer: Sections 2, 4, 6 and 8 were in position in the vicinity of St. Elia from 0300 10 Feb to 0800 23 Feb
  weight: record
  source: Battery E morning report, record of events 24 Feb 1944
  ref: rg64-463960255/p0798
  note: Half the battery's guns, about 8 km from the rest at Lucenteforte.
- question: >-
    Where were Battery E's men hit on 14 and 16 Feb: at Lucenteforte, or with the sections near Sant'Elia?
  answer: The wound entries give no cause and no place
  weight: record
  source: Battery E morning reports, 14 and 16 Feb 1944
  ref: rg64-463960255/p0775; rg64-463960255/p0779
  note: Only "Wounded in Action" and, on 14 Feb, 1740.
- question: >-
    Where were Battery E's men hit on 14 and 16 Feb: at Lucenteforte, or with the sections near Sant'Elia?
  answer: At dusk on 14 Feb German artillery fired on troops marching at Sant'Elia (XXIII 97)
  weight: record
  source: 5. Geb.Div., Nachmeldung zur Tagesmeldung vom 14.2.44
  ref: t314-0544/f0362
  note: >-
    Dusk and 1740 may be the same hour; if so, the sections near Sant'Elia were nearer that fire than the
    battery at Lucenteforte (about 18 km away). Inference: the reports don't say which men were where.
- question: Was the gun hit at St. Elia on 18 Feb the German report's 'Einzelgeschütz'?
  answer: >-
    Battery A (1st Bn) at St. Elia was shelled 0900-0930 and 1400-1515 on 18 Feb; a 90 mm gun "received direct
    hit causing piece to be temp. inactive"; one killed
  weight: record
  source: Battery A morning report, 18 Feb 1944
  ref: rg64-463960255/p0629
  note: Shelling "believed to be result of direct ground observation" (the battery's belief).
- question: Was the gun hit at St. Elia on 18 Feb the German report's 'Einzelgeschütz'?
  answer: >-
    The 5th Mountain Division's artillery fired that day on troops marching out of XXIII 97 (Sant'Elia) and
    "vernichtete eine Feindbatterie und 1 Einzelgeschütz"
  weight: record
  source: 5. Geb.Div., Tagesmeldung vom 18.2.44
  ref: t314-0544/f0438
  note: >-
    No square or hour for the battery or the gun; the corps artillery commander's reports for 17-18 Feb, which
    on 16 Feb gave the squares, are not on the film (folios run 141/17 to 169/17 without them).
- question: Was the gun hit at St. Elia on 18 Feb the German report's 'Einzelgeschütz'?
  answer: >-
    Same day and area at most: the gun was "temp. inactive", not destroyed, and the German claim names no place
  weight: inference
  source: the two records together
  ref: t314-0544/f0438; rg64-463960255/p0630
  note: >-
    A lead, not an identification: other Allied guns stood around Sant'Elia that day, and a destroyed-gun claim
    is the firer's claim.
