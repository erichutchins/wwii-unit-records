notes:
- head: Reading the map.
  text: >-
    BANG's track runs straight between her reported positions; her search southeast of Ishigaki on the night of
    the 21st and the pickup itself have no position in her report, so the line doesn't show them. The dashed ring
    is where the squadron's report puts Corzine's water landing, "about twenty miles East of the Island": an estimate,
    not a fix. Her 2200 radar-log position (125°14′E as typed) contradicts her own narrative and is drawn dashed.
- head: Clocks.
  text: >-
    BANG, CHENANGO's air group and the Miyako garrison all kept zone I (−9), Tokyo time, on 21–22 April 1945, so
    their local times can be read side by side.
- head: The Japanese side.
  text: >-
    No Japanese record of Corzine's loss has been found. The Miyako-jima Guard Unit's action summary for the 21st
    (sent 2243) claims one plane shot down and two damaged over Miyako, with no time or place; it is shown for context
    and is not his. Ishigaki's own report for the day is still missing.
- head: Sources.
  text: >-
    BANG's sixth war patrol report, NARA microfilm M1752 (74802934), narrative pages 11–13 and the Section U radar-intercept
    log. Air Group 25's aircraft action reports, Report No. 50 (NARA 140031168). The Navy's Nansei Shoto telegram
    file via JACAR (C19010021200, National Institute for Defense Studies). Coastline: Natural Earth.
