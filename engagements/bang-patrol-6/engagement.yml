    type: ditched
    title: Corzine ditches; hit by AA over Ishigaki airfield
    text: >-
      On one of the bombing runs on Ishigaki airfield, Ensign Donald Elmer CORZINE ... received several hits, probably
      from medium A.A. ... He was able to maintain control over his plane and flew it about twenty-miles East of
      the Island before being forced to make a water landing. The other three Hellcats circled him ... and ascertained
      that he was in his life raft.
    doubt: >-
      The report gives no time or position for the landing. The time is BANG's "in the water fourteen hours" counted
      back from 0737; the position is 20 miles east of Ishigaki airfield. Both estimated.
