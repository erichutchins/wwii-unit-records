title: BANG rescues Ensign Donald E. Corzine
short: Patrol 6 · Lifeguard, April 1945
eyebrow: Sakishima Gunto · BANG's sixth war patrol, lifeguard for the Okinawa campaign
lede: >-
  Hit by flak over Ishigaki airfield on the afternoon of 21 April 1945, a CHENANGO Hellcat pilot spent fourteen
  hours in his raft before BANG, sent from her lifeguard station off Formosa, took him aboard. BANG's report, his
  squadron's action report and the Miyako garrison's telegram of the same day, on one GMT clock.
