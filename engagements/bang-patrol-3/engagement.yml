notes:
- head: Reading the map.
  text: >-
    Positions are BANG's own dead reckoning and star sights; lines between them are straight, and where she went
    in between is not recorded. Open circles are ships she sighted, at the target's position. As the clock passes
    each firing time a red ring pulses at BANG's position; hover a diamond for the attack sheet.
- head: Clocks.
  text: BANG kept zone K (−10) throughout. Japanese records use Tokyo time (I, −9).
- head: Records with no time.
  text: >-
    Neither Japanese record for this patrol gives a time: combinedfleet.com's account of convoy No. 3905 and the
    4th Surface Escort Division's daily summary for TAKA-909. Each is drawn at the time of the attack it matches,
    and marked so. FRUPAC's intercept has No. 3905's ships "torp & sunk 1520/09" (1520 I = 1620 K, between Attacks
    1 and 2).
- head: What is missing.
  text: >-
    No Japanese record has been found yet for Attacks 5 and 6 (20–21 September); the 4th Escort diary has no attack
    on those days. Where the Japanese record names only the ships that were hit, the rest of the convoy is described
    as BANG saw it.
- head: Sources.
  text: >-
    BANG's third war patrol report, NARA microfilm M1752 (74802831). The 4th Surface Escort Division / Okinawa Base
    Force war diary, September 1944, via JACAR (C08030144100, National Institute for Defense Studies). Convoy No.
    3905 from combinedfleet.com, a secondary source, flagged where used. Coastline: Natural Earth.
