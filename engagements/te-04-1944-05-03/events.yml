# The boats' narrative entries for this engagement, as typed. Hand-edited; fields in records/SCHEMA.md (An engagement's events).
- at: 1944-05-03 0552 H
  of: us
  actor: tinosa
  kind: log
  words: Sighted masts of seven or more large ships, bearing 310°T, distance 8 miles.
  ref: rg38-74856363/p13
- at: 1944-05-03 0603 H
  of: us
  actor: tinosa
  kind: contact_report
  to: [parche, bang]
  words: >-
    Sent first contact report to PARCHE and BANG. Sent contact reports each hour until 1200 (H), while trailing
    convoy.
  ref: rg38-74856363/p13
- at: 1944-05-03 1204 K
  of: us
  actor: bang
  kind: received
  from: tinosa
  words: Received contact report from TINOSA. Surfaced and began chase.
  ref: rg38-74802746/p10
- at: 1944-05-03 1950 H
  of: us
  actor: tinosa
  kind: log
  words: >-
    Radar interference, so assumed it to be PARCHE or BANG. Kept at a safe range. We should have IFF on SJ Radar
    for use with coordinated attacks.
  ref: rg38-74856363/p14
- at: 1944-05-03 2030 H
  of: us
  actor: tinosa
  kind: log
  words: >-
    PARCHE asked for positions of all submarines. Our transmitter was out of commission, so could not report.
  ref: rg38-74856363/p14
- at: 1944-05-03 2155 H
  of: us
  actor: tinosa
  kind: log
  words: >-
    Ahead of convoy … Eased to starboard side to clear BANG who had received orders to attack from the port
    flank.
  ref: rg38-74856363/p14
- at: 1944-05-03 2213 H
  of: us
  actor: tinosa
  kind: log
  words: >-
    With clear bright moonlight, could not stay at radar depth long enough for radar to be of much advantage
    without danger of being sighted.
  ref: rg38-74856363/p15
- at: 1944-05-03 2310 H
  of: us
  actor: tinosa
  kind: log
  words: >-
    Observed first hit in Tanker under her bridge … One hit heard but did not see it, as was watching Tanker go
    down. Sank: Lat. 20-51N Long. 118-02E.
  ref: rg38-74856363/p15
- at: 1944-05-04 0016 I
  of: us
  actor: parche
  kind: log
  words: Series of distant explosions; one of the other boats evidently attacking.
  ref: rg38-74828582/p10
- at: 1944-05-03 2320 H
  of: us
  actor: tinosa
  kind: log
  words: Went deep. … Received a total of 55 depth charges.
  ref: rg38-74856363/p16
- at: 1944-05-04 0253 H
  of: us
  actor: tinosa
  kind: log
  words: >-
    Target completely gone. … Not a single depth charge heard. The Japs were completely in the dark as to what
    was going on.
  ref: rg38-74856363/p17
- at: 1944-05-04 0330 H
  of: us
  actor: tinosa
  kind: received
  from: parche
  words: Message from PARCHE to report position. Could not answer; transmitter still out of commission.
  ref: rg38-74856363/p17
- at: 1944-05-04 0343 H
  of: us
  actor: tinosa
  kind: log
  words: >-
    Heard 9 explosions. Thought possibly PARCHE was making another attack or maybe the Nips thought they were
    depth charging us.
  ref: rg38-74856363/p17
- at: 1944-05-04 0457 H
  of: us
  actor: tinosa
  kind: log
  words: Transmitter back in commission, sent position and results of attack to PARCHE.
  ref: rg38-74856363/p18
- at: 1944-05-04 0712 H
  of: us
  actor: tinosa
  kind: log
  words: Heard 48 explosions (0712 to 0733).
  ref: rg38-74856363/p19
