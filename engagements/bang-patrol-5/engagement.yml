notes:
- head: Reading the map.
  text: >-
    Positions are BANG's own dead reckoning and star sights; lines between them are straight, and where she went
    in between is not recorded. Open circles are ships she sighted, at the target's position. As the clock passes
    each firing time a red ring pulses at BANG's position; hover a diamond for the attack sheet.
- head: Clocks.
  text: BANG kept zone I (−9), Tokyo time, for this attack.
- head: What is missing.
  text: >-
    No Japanese record of this attack has been found yet. Of the pack, only ATULE was still in the Yellow Sea on
    10 February: on the 8th BANG ordered her to cover both their areas until the 11th. SPADEFISH was further north
    (Port Arthur, 6 Feb) and POMPON had left the area on 31 January after flooding her pump room. ATULE's report
    says nothing of BANG's attack.
- head: Sources.
  text: >-
    BANG's fifth war patrol report, NARA microfilm M1752 (74802868, pages 38–65); ATULE Patrol 2 (74802211). Coastline:
    Natural Earth.
