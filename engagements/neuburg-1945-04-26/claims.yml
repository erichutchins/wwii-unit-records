  weight: recollection
  source: S/Sgt. Louis N. Smith, MACR 14162 p. 11
  ref: rg92-91150796/p11
  note: 60 km from the form's position and sketch. Unreliable on place
- question: Whose jets?
  answer: JV 44's
  weight: inference
  source: Galland's claims; the secondary accounts
  ref: https://en.wikipedia.org/wiki/List_of_aerial_victories_claimed_by_Adolf_Galland
  note: >-
    Time, place and target type agree. JV 44's own records, and the Luftwaffe's loss returns, are still to find
- question: Where was Battery D?
  answer: With the 189th, near Bergen
  weight: inference
  source: 106th AAA AW Bn history, p. 2
  ref: ok45th-17560/p02
  note: From its assignment that month. The battery's 1945 morning reports aren't online
