  pos: bergen
  step: s1
- at: 1945-04-26
  placed: The day; the forms give no take-off time
  of: us
  actor: 17bg
  kind: order
  words: >-
    "Place of Departure Dijon, France ... Target or Intended Destination Lechfeld, Ger.: Type of Mission Bombardment".
    Big Red's co-pilot, in November: "We were ordered to perform a bombing mission on the German air-field at Lechfele
    [sic], Germany ... When approximately five minutes before reaching the target, our formation was attacked by German
    jet propelled fighter planes".
  source: Missing Air Crew Report 14162, pp. 2, 9
  ref: rg92-91150796/p02
  pos: lechfeld
  step: mission
  note: >-
    The other two forms give the same target (MACR 14163, p. 2; MACR 14164, p. 2). Lechfeld is about 65 km south-south-west
    of Neuburg, bearing about 200°: the courses typed at Neuburg (140°, 155°) point south-south-east, not at it, and five
    minutes' flying is nearer 30 km than 65. A turn short of the target (an initial point), or a loose recollection;
    whether the group bombed Lechfeld is not in the records read.
