- at: 1945-04-26 1145
  side: us
  actor: 34th Bomb Sq
  kind: loss
  words: >-
    B-26B-41 42-43311 "Spot Cash", out of Dijon for Lechfeld airfield, lost to "Enemy Aircraft". Last known:
    "Neuburg, Ger.". A gunner: "His ship ... was hit by ME-262's on their first pass".
  source: Missing Air Crew Report 14163, pp. 2, 4
  ref: rg92-91150810/p02
  pos: spotcash
  step: s2
- at: 1945-04-26 1145
  side: us
  actor: 106th AAA AW Bn
  kind: engage
  words: >-
    "From 1145B to 1147B six (6) ME-262s flying at 500 to 5000 feet attacking B-26 Bombers were engaged by
    Batteries C and D without result. Ammunition expenditures: 10 rounds 37mm and 159 rounds .50 cal."
  source: 106th AAA AW Bn, April 1945 history, p. 6
  ref: ok45th-17560/p06
  pos: bergen
  step: s2
- at: 1945-04-26 1150
  side: us
  actor: 432nd Bomb Sq
  kind: loss
  words: >-
    B-26G-25 44-68076 "Big Red" (No. 98) lost to "Enemy Aircraft". Last known 48° 46′ N, 11° 11′ E. The
    squadron's sketch map has the formation heading south-south-east past Eichstätt and the X just north of
    Neuburg.
  source: Missing Air Crew Report 14162, pp. 2, 5
  ref: rg92-91150796/p02
  pos: bigred
  step: s2
- at: 1945-04-26 1150
  placed: A claim as tabulated from a secondary source
  side: de
  actor: JV 44
  kind: claim
  words: >-
    Generalleutnant Adolf Galland, commanding JV 44, claims a B-26 "vicinity of Neuburg": his 100th, credited.
    It was his last mission.
  source: Mathews and Foreman, Luftwaffe Aces, vol. 2, p. 366, as tabulated in Wikipedia
  ref: https://en.wikipedia.org/wiki/List_of_aerial_victories_claimed_by_Adolf_Galland
  pos: neuburg
  step: s2
- at: 1945-04-26 1152
  side: us
  actor: 37th Bomb Sq
  kind: loss
  words: >-
    B-26F 42-96328 (No. 25), typed "B26-F1MA", lost to "Enemy Aircraft". Last known "Neuberg, Germany". A
    gunner: "It was attacked by a ME-262 from 6 o'clock level ... flames enveloped the ship from cockpit to rear
    bomb bay". The squadron's sketch map puts it down in the woods at Rohrenfels, south of the Danube.
  source: Missing Air Crew Report 14164, pp. 2, 5-6
  ref: rg92-91150835/p02
  pos: rohrenfels
  step: s2
- at: 1945-04-26 1155
  placed: A claim as tabulated from a secondary source
  side: de
  actor: JV 44
  kind: claim
  words: Galland claims a second B-26 "vicinity of Neuburg", unconfirmed.
  source: Mathews and Foreman, Luftwaffe Aces, vol. 2, p. 366, as tabulated in Wikipedia
  ref: https://en.wikipedia.org/wiki/List_of_aerial_victories_claimed_by_Adolf_Galland
  pos: neuburg
  step: s2
- at: 1945-04-26 1200
  placed: A round number
  side: us
  actor: 189th FA Bn
  kind: witness
  words: >-
    "At 1200 we witnessed a sad sight. A formation of American bombers flying directly overhead were attacked by
    four German jet propelled planes, and three of the bombers were shot down, one of which burst into flame and
    exploded in the air. One of the German aircraft was downed but the rest got away."
  source: 189th FA Bn, April 1945 history, typed pp. 246-247
  ref: ok45th-14862/p10
  pos: bergen
  step: s2
