# USS Haynsworth (DD-700): her war diaries. Hand-edited; see boats/ss-385-bang/ship.yml.
# The heading, the dates and the end of the track are left out: check_track.py fills them in from
# positions.csv when it writes ships.json, so they follow the diaries transcribed so far.
name: Haynsworth
hull: DD-700
class: Allen M. Sumner
kind: destroyer
# A Sumner-class destroyer can make 34 kn, but 25 kn is as fast as the diary says she steamed
# (flank speed ordered during the 6 Apr 1945 attack) and catches typos that 34 would not.
max_kts: 25.0
dives: false
silhouette: sumner     # her class's profile in silhouettes/silhouettes.yml (ONI 54-D)

map:
  title: USS Haynsworth (DD-700)
  intro: "Every position USS Haynsworth reported in her war diaries: exercises out of Pearl Harbor, Task Group 38.2's
    strikes on Formosa, Luzon and the South China Sea, the Tokyo strikes and Iwo Jima, Okinawa and the kamikaze hit
    of 6 April, then Ulithi, Eniwetok and Pearl Harbor on the way to repairs at Mare Island, and after them refresher training at San Diego, training-destroyer duty out of Treasure Island and the passage back to Pearl Harbor to October 1945. Transcribed from the "
  introLink: National Archives scans
  introEnd: . Click any point to see the page it came from.
  # fixes are three a day, so all the diaries are one record; open on Okinawa, where she was hit
  # (co: the change of command at 1840 on 14 Dec 1944, rg367-139832917/p02)
  periods:
    - { n: 1, name: War diaries, area: Pearl Harbor · Formosa · South China Sea · Tokyo · Iwo Jima · Okinawa · Mare Island · San Diego · San Francisco,
        co: Cdr. Robert Brodie Jr.; Cdr. S. N. Tackney; Cdr. J. E. Smith }
  home: [[126.5, 29.5], [134.5, 22.0]]
  ports:
    - { name: Pearl Harbor, lon: -157.97, lat: 21.35 }
    - { name: Ulithi, lon: 139.74, lat: 10.07 }
    - { name: Eniwetok, lon: 162.3, lat: 11.37 }
    - { name: Mare Island, lon: -122.27, lat: 38.07 }     # the standard position the diary rows use (README)
    - { name: San Diego, lon: -117.17, lat: 32.70 }
    - { name: Treasure Island, lon: -122.37, lat: 37.82 }
    - { name: Kahului, lon: -156.47, lat: 20.9 }
  places:
    - { name: OKINAWA, lon: 127.9, lat: 26.5 }
    - { name: KYUSHU, lon: 131.0, lat: 32.4 }
    - { name: FORMOSA, lon: 121.0, lat: 23.7 }
    - { name: SAKISHIMA, lon: 124.6, lat: 24.0 }
    - { name: PHILIPPINE SEA, lon: 134.5, lat: 21.0 }
    - { name: CAROLINE IS., lon: 146.0, lat: 7.8 }
    - { name: MARSHALL IS., lon: 168.0, lat: 7.5 }
  listTitle: War diaries
  daysLabel: Days covered
  pageNoun: war diary page
  docAlt: war diary
  labels: { air: Air contact, attack: Kamikaze hit, event: Logged event }
  counts: [[Kamikaze hits, attack], [Air contacts logged, air]]
  legend:
    - { cls: fix, text: War diary position }
    - { cls: air, text: Air contact (position assumed) }
    - { cls: attack, text: Kamikaze hit (position assumed) }
    - { cls: event, text: Logged event (position assumed), ifPresent: true }
