# Minesweeper No. 15 (W-15): her log of the night of 22-23 November 1944, convoy TAKA-206, as her battle report's
# 戦闘経過 (the course of the action) writes it: jacar:C08030607900 pp40-42, read on the scan. Hand-edited; fields in
# records/SCHEMA.md ("A ship's log"). One entry for each line the record times (or leaves untimed, `time` empty),
# in its order. Zone I (-9). `course` as written, converted from 北六五度東 to N 65° E; `speed` the record's word
# (原速 standard, 第一戦速 battle speed 1, 停止 stopped), its knots in ship.yml `speeds`; `helm` as written
# (取舵 port, 面舵 starboard, 一杯 hard over). A value read with doubt has `?`; a correction goes in `time_fix` with
# `fix_note`, never over the reading.
