# 5 March 1945, convoy NAKA-303 (Naha to Kagoshima), torpedoed by TILEFISH: Battle Report No. 7's 経過, jacar:C08030608100
# p9, read on the scan at 120 dpi
- date: 1945-03-05
  time: 104?
  zone: I
  helm: 面舵一杯
  speed: 第一戦速
  event: torpedo_wake
  original: >-
    ナカ三〇三船団護衛中悪石島ノ〇〇〇度五浬ニ於テ本艇ノ右一三〇度一五〇〇米ニ二番船杭州丸攻撃中ノ敵潜雷跡一本ヲ認メ面舵一杯
    配置ニ就ケ 一戦速 急ゲノ令
  translation: >-
    Escorting convoy NAKA-303, at 000° 5 miles from Akusekijima, sighted one torpedo wake from the enemy submarine
    attacking No. 2 ship Hangchow Maru, 130° to starboard, 1,500 m. Hard to starboard; battle stations, battle speed 1,
    "hurry"
  source: jacar:C08030608100
  page: p9
  note: The minutes' last figure is unclear (一〇四? ); before 1043
- date: 1945-03-05
  time: '1043'
  zone: I
  event: torpedo_wake
  original: 右六〇度一〇〇〇米附近ヨリ敵潜本艇ニ攻撃（魚雷四本）
  translation: The enemy submarine attacked us from about 60° to starboard, 1,000 m (four torpedoes)
  source: jacar:C08030608100
  page: p9
- date: 1945-03-05
  time: '1044'
  zone: I
  speed: 停止
  event: torpedoed
  original: >-
    魚雷二本艇底通過 一本艇尾通過 一本艇尾ニ命中 一二六番肋材附近ヨリ後部及爆雷飛散 九六番肋材ト九七番肋材トノ間ニ折レ 機械停止
    舵軸破壊航行不能トナル 第三兵員室ハ折損部ヨリ 第四兵員室ハ後部隔壁ヨリ大量浸水 同時ニ假爆雷庫第四兵員室火災發生 爆雷ニ引火
    時々火焔三百米ニ達シ船体後部沈下ヲ開始セリ
  translation: >-
    Two torpedoes passed under her bottom, one passed astern, one hit the stern: from about frame 126 aft she and her
    depth charges were blown apart; she broke between frames 96 and 97, the engines stopped and the rudder shaft was
    wrecked, and she could not steam. The No. 3 mess deck flooded through the break and No. 4 through its after
    bulkhead; at the same time fire broke out in the temporary depth-charge store and No. 4 mess deck, the charges
    caught, the flames at times reaching 300 m, and her stern began to settle
  source: jacar:C08030608100
  page: p9
  note: Her position at this minute is fixed by bearings on the islands (p30; positions.csv)
- date: 1945-03-05
  time: '1045'
  zone: I
  event: fire
  original: 火勢逐次強大トナリ爆雷爆發ノ算倍加ス 消防ポンプ移動ポンプ消火器及配食鍋ニ依ル散水等ニ依リ總員極力消火ニ努ム
  translation: >-
    The fire grew steadily and the chance of the depth charges exploding doubled; all hands fought it as hard as they
    could, with the fire pump, the portable pump, extinguishers and even the mess kettles
  source: jacar:C08030608100
  page: p9
# 5 March 1945, after the hit: the fire, the tow, the beaching on Suwanosejima (p10-p11, read on the scan at 115 dpi)
- date: 1945-03-05
  time: '1046'
  zone: I
  event: fire
  original: >-
    爆雷庫彈火薬庫注水 甲板上ノ彈薬爆雷輕質油等可燃物ヲ海中ニ投棄セリ
  translation: >-
    Flooded the depth-charge store and the magazine; threw the ammunition, depth charges, light oil and other things that would burn on deck into the sea
  source: jacar:C08030608100
  page: p10
  note: >-
    Before this line (p10, carried over from p9) she has Taian Maru (大安丸) take command of the convoy
- date: 1945-03-05
  time: '1047'
  zone: I
  original: >-
    機密圖書一部及負傷者便乗者ヲ播州丸大安丸ニ移乗セシム
  translation: >-
    Transferred part of the secret documents, the wounded and the passengers to Banshu Maru and Taian Maru
  source: jacar:C08030608100
  page: p10
- date: 1945-03-05
  time: '1146'
  zone: I
  event: fire
  original: >-
    火災鎮火セルモ第三第四兵員室浸水量急激ニ増加セルヲ以テ甲板上重量物ヲ海中ニ投棄浮力確保ニ努ムルモ猶後部漸次沈下シツツアリ …
  translation: >-
    The fire was out, but the flooding of Nos. 3 and 4 mess decks increased sharply; heavy gear on deck thrown overboard to keep her afloat, yet her stern went on settling …
  source: jacar:C08030608100
  page: p10
- date: 1945-03-05
  time: '1204'
  zone: I
  speed: 曳航
  event: rescue
  original: >-
    五一播州丸ニテ曳航セントスルモ天候漸次悪化シ波浪大ナルタメ長時間ノ曳航ニ耐ヘズト認メ應急作業ヲ施行セン爲諏訪瀬島切石泊地ニ向フ
  translation: >-
    No. 51 Banshu Maru tried to tow her, but the weather worsening and the seas high, she judged she could not stand a long tow, and made for Kiriishi anchorage on Suwanosejima to make emergency repairs
  source: jacar:C08030608100
  page: p10
  note: >-
    Taken in tow, as TILEFISH saw at 1320 K (1220 I): 'Escorts took cripple in tow and started him through SUWANOSE SUIDO'
- date: 1945-03-05
  time: '1406'
  zone: I
  original: >-
    曳航止ム
  translation: >-
    The tow ended
  source: jacar:C08030608100
  page: p10
- date: 1945-03-05
  time: '1409'
  zone: I
  original: >-
    右錨投錨
  translation: >-
    Dropped the starboard anchor
  source: jacar:C08030608100
  page: p10
- date: 1945-03-05
  time: '1415'
  zone: I
  original: >-
    風浪ノタメ右錨鎖切斷 左錨投錨
  translation: >-
    The starboard cable parted in the wind and sea; dropped the port anchor
  source: jacar:C08030608100
  page: p11
- date: 1945-03-05
  time: '1420'
  zone: I
  original: >-
    左錨切斷
  translation: >-
    The port cable parted
  source: jacar:C08030608100
  page: p11
- date: 1945-03-05
  time: '1426'
  zone: I
  event: beached
  original: >-
    風壓ノタメ切石泊地南西岸潮見崎ノ岩礁ニ船體後部觸礁次デ中部坐礁擱坐シタルガ高浪ノタメ斷エズ岩礁ニ船體激突 船體左右五〇度動搖 … 直チニ前部ニ注水ヲ命ジ顚覆ヲ防グ
  translation: >-
    Driven by the wind, her stern struck the reef of Shiomi-zaki on the south-west shore of Kiriishi anchorage, then she grounded amidships; the high seas drove her against the reef without a break and she rolled 50° each way … at once ordered the forward part flooded, and kept her from capsizing
  source: jacar:C08030608100
  page: p11
  note: >-
    Beached: TILEFISH saw her at 1605 K (1505 I) 'beached on southeast point of KIRUSHI anchorage'. No position written
- date: 1945-03-05
  time: '1530'
  zone: I
  original: >-
    依而機密圖書兵員一部ヲ同時五一播州丸及大安丸ニ移乗セシム
  translation: >-
    So transferred the secret documents and part of the crew to No. 51 Banshu Maru and Taian Maru
  source: jacar:C08030608100
  page: p11
- date: 1945-03-05
  time: '1720'
  zone: I
  event: torpedo_wake
  original: >-
    本艇ノ首ヨリ三十米附近ニ魚雷二本岩礁ニ命中爆發 五一播州丸大安丸附近掃蕩ニ向フ …
  translation: >-
    Two torpedoes struck the reef about 30 m from our bow and exploded; No. 51 Banshu Maru and Taian Maru went to sweep the area …
  source: jacar:C08030608100
  page: p11
  note: >-
    TILEFISH's Attack 3: fired at 1707 K (1607 I), the explosions seen about three minutes later. Her log writes 1720, 70 minutes later; the two clocks agreed within a minute at 1044 (Attack 2), so the difference is not a zone. Neither record's time is corrected
- date: 1945-03-05
  time: '1740'
  zone: I
  original: >-
    夜間ハ陸上ニ避退待機警戒セシム …
  translation: >-
    For the night, had the crew withdraw ashore and stand by on watch …
  source: jacar:C08030608100
  page: p11
