  heading: Minesweeper No. 15 (W-15) — September and November 1944
  intro: "Every position Minesweeper No. 15 wrote in her war diaries for two convoys: TAKA-909 from Keelung to Naha in
    September 1944, when BANG attacked it, and TAKA-206 on the night of 22-23 November 1944, when BANG, SHAD and REDFISH
    attacked it and she hunted them with depth charges; and 5 March 1945, convoy NAKA-303, when TILEFISH torpedoed her
    off the Tokara Islands. Transcribed from the "
  introLink: JACAR scans
  introEnd: . Click any point to see the page it came from.
  periods:
