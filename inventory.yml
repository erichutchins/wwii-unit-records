# What exists, where, and how far along it is: every war patrol report, war diary and unit record
# this dataset uses or plans to. Hand-edited (it started from what was on disk on 19 Oct 2026).
#
# status:  not-searched  not looked for yet
#          missing       looked for, not found
#          available     found, not transcribed
#          transcribed   in this repository
#          verified      checked against the scan by a second reader
#          mapped        transcribed and drawn on the site's pages
#          no-report     none exists (e.g. a boat lost on the patrol)
# nara:    National Archives catalog IDs of the folders or rolls the rows cite (titles in citations.json)
# files:   what has been transcribed for it
# first_fix / last_fix: the transcribed track's first and last fix (not the report's departure and arrival).
# Keys follow the hull numbers, as in other patrol datasets (SS-385 patrol 1 = SS-385-P01).

