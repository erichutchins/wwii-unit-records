op635:
  title: "Torpedoes Mark 14 and 23 Types, OP 635 (First Revision)"
  short: OP 635
  by: Bureau of Ordnance, Navy Department
  kind: reference
  of: us
  held: 24 March 1945 (with changes to 1948); online edition by the Maritime Park Association (maritime.org, formerly HNSA)
  url: https://maritime.org/doc/torpedo/index.htm
  rights: Public domain (U.S. government publication)
  cite: op635/p<page>      # printed page, e.g. op635/p13
