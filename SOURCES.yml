janac:
  title: "Japanese Naval and Merchant Shipping Losses During World War II by All Causes"
  by: The Joint Army-Navy Assessment Committee (JANAC), February 1947
  kind: assessment
  of: us
  held: >-
    HyperWar (ibiblio), a transcription with the printed page numbers marked; chapter 4 is the chronological list of
    merchant losses (pp. 29-99), chapter 6 the appendix of vessels sunk by each US submarine (its own pages 1-). A
    footnote on the lists' pages reads "*Probable Agent": an asterisk after the agent marks a credit JANAC held as
    probable, not certain. A derived spreadsheet (Unrestricted, George Mason University, 2018,
    https://unrestricted.omeka.net/items/show/24) drops the appendix's submarine names and the marine casualties;
    it is a finding aid only
  url: https://www.ibiblio.org/hyperwar/Japan/IJN/JANAC-Losses/index.html
  cite: >-
    janac:3/p<page> (chapter 3, the chronological list of naval losses, pp. 1-28), janac:4/p<page> (chapter 4, the
    chronological list of merchant losses) or janac:6/p<page> (chapter 6, the appendix)
  match: '^janac:([346])/p(\d+)$'
  link: https://www.ibiblio.org/hyperwar/Japan/IJN/JANAC-Losses/JANAC-Losses-{1}.html
  used_for: >-
    boats/*/patrol-N/claims.yml (the postwar credit for each sinking); secondary, a postwar
    assessment from US and Japanese records

wdr58:
  title: >-
    Submarine Report: Depth Charge, Bomb, Mine, Torpedo and Gunfire Damage Including Losses in Action, 7 December 1941
    to 15 August 1945 (War Damage Report No. 58)
  by: Preliminary Design Branch, Bureau of Ships, US Navy, 1 January 1949
  kind: assessment
  of: us
  held: >-
    HyperWar (ibiblio), a transcription by section, with the report's paragraph numbers (3-10, 15-12); the Navy
    Department Library holds the scan
  url: https://www.ibiblio.org/hyperwar/USN/rep/WDR/WDR58/index.html
  cite: >-
    wdr58:<section>/<paragraph> (wdr58:3/3-10, section III, paragraph 3-10), wdr58:15/fig15-2 (a figure), or
    wdr58:I/p<page> (Appendix I, the brief of each damage case, by the report's printed page)
  match: '^wdr58:(\d+|I|II|III)/(?:[\d-]+|fig[\d-]+|p\d+)$'
  link: https://www.ibiblio.org/hyperwar/USN/rep/WDR/WDR58/WDR58-{1}.html
  short: War Damage Report 58
  used_for: >-
    the Japanese depth charges, their pistols' settings and their damage at distance (section III), and what damage
    says of distance (section XV), for the depth figure and site/depthcharge.html; an assessment, the Bureau's
    reckoning after the war from the boats' reports
  note: >-
    It says itself that "present experimental and theoretical knowledge is still not sufficient to compute accurate
    damage versus distance relationships" (15-11): its distances are the Bureau's estimate, for 300 lb of TNT against
    the light-hulled boats (SS-284 and earlier), not a measurement

ntmj-o08:
  title: Japanese Depth Charges (Report O-08)
  by: US Naval Technical Mission to Japan, 16 December 1945
  kind: assessment
  of: us
  held: >-
    fischer-tropsch.org (reel JM-200-E, frames 0023-0034), also on Wikimedia Commons; a scan with no text layer
  url: https://www.fischer-tropsch.org/primary_documents/gvt_reports/USNAVY/USNTMJ%20Reports/USNTMJ-200E-0023-0034%20Report%200-08.pdf
  cite: ntmj-o08:p<page>
  match: '^ntmj-o08:p(\d+)$'
  link: https://www.fischer-tropsch.org/primary_documents/gvt_reports/USNAVY/USNTMJ%20Reports/USNTMJ-200E-0023-0034%20Report%200-08.pdf#page={1}
  short: NavTechJap O-08
  used_for: the Japanese depth charges as the mission examined them; not yet read page by page
  note: Found 12 Nov 2026; the depth figure and the explainer use War Damage Report 58 until this is read

ntmj-s24:
  title: Japanese Anti-Submarine Warfare (Report S-24)
  by: US Naval Technical Mission to Japan (Capt. A. Jackson, Jr., USNR, and Lt. Comdr. J. E. Miller), February 1946
  kind: assessment
  of: us
  held: >-
    fischer-tropsch.org (reel JM-200-I, frames 0244-0309), a scan with no text layer; the printed page is the PDF's
    page less 3
  url: https://www.fischer-tropsch.org/primary_documents/gvt_reports/USNAVY/USNTMJ%20Reports/USNTMJ-200I-0244-0309%20Report%20S-24.pdf
  cite: ntmj-s24:p<printed page>
  match: '^ntmj-s24:p(\d+)$'
  link: https://www.fischer-tropsch.org/primary_documents/gvt_reports/USNAVY/USNTMJ%20Reports/USNTMJ-200I-0244-0309%20Report%20S-24.pdf
  short: NavTechJap S-24
  used_for: >-
