# ── Derived, not an outside source ─────────────────────────────────────────────────────────────

grid:
  kind: derived
  title: Position computed from the row's own grid reference (tools/grid_ref.py)
  cite: grid
  match: '^grid$'

hand-placed:
  kind: derived
  title: Placed by hand on a modern map (a harbour, a camp); the row's note says where and why
  cite: hand-placed
  match: '^hand-placed$'

ams-l772:
  title: "Kyushu 1:50,000, Series L772 (sheets cited by number, e.g. 4242-III Kajiki)"
  by: U.S. Army Map Service (AMS), Corps of Engineers
  kind: reference
  of: us
  held: University of Texas Libraries, Perry-Castañeda Library Map Collection (OCLC 6594238)
  url: https://maps.lib.utexas.edu/maps/ams/japan/
  rights: Public domain (U.S. government work)
  cite: ams-l772:<sheet>      # e.g. ams-l772:4242-III
  match: '^ams-l772:(\d{4}-(?:I|II|III|IV))$'
  used_for: engagements/haynsworth-1945-04-06/positions.csv (airfields)
  note: >-
    Read from each sheet's margin: First Edition (AMS 1), 1943; Revised (AMS 2), 1945; Type F (AMS 3), 1945.
    Redrawn in 1945 from the Japanese Imperial Land Survey 1:25,000 and 1:50,000 sheets (Kajiki and Kokubu
    1936), planimetric detail partially revised from aerial photography of 1944-1945. Polyconic; the
    neatlines are the Japanese sheet lines, labelled 130°45'10.4" etc. (Tokyo datum, the old Japanese
    longitude corrected by 10.4"); the true minute ticks are printed beside them. 4242-II Kokubu
    (N3140-E13045), 4242-III Kajiki (N3140-E13030), 4341-III Shibushi (N3120-E13100), 4143-II Izumi
    (N3200-E13015; Type C AMS 3, 1945, from the Imperial Land Survey Izumi 1936), 4342-I Miyazaki (N3150-E13115;
    from Miyazaki 1937), 4141-II Kawanabe (N3120-E13015; from Kawanabe 1936),
    4342-III Miyakonojō (N3140-E13100; from Takajō 1937 and Miyakonojō 1937).

ams-l506:
  title: "Japan 1:250,000, Series L506 (sheets cited by number, e.g. NH 52-4 Kagoshima)"
  by: U.S. Army Map Service (AMS), Corps of Engineers
  kind: reference
  of: us
  held: University of Texas Libraries, Perry-Castañeda Library Map Collection (OCLC 6900707)
  url: https://maps.lib.utexas.edu/maps/ams/japan/
  rights: Public domain (U.S. government work)
  cite: ams-l506:<sheet>      # e.g. ams-l506:NH52-4
  match: '^ams-l506:(N[GHI]52-\d+)$'
  used_for: engagements/haynsworth-1945-04-06/positions.csv (airfields not on an available 1:50,000 sheet)
  note: >-
    Postwar: Edition 1-AMS, compiled 1952 from the 1945 Kyushu 1:50,000 and other sources, planimetry
    revised by photo-planimetric methods, printed 4-54. Transverse Mercator; graticule crosses every 15'.
    Shows the airfields as in use about 1952 (Kanoya as "Aux AB"), so a field on it is a postwar position.

url:
  kind: secondary
  title: A web page cited by its address (ship histories, catalog records)
  match: '^https?://\S+$'
  note: >-
    What kind of source a page is can't be told from its address, so a row cited this way is tagged as a later
    account read on the web. A record read on a web page (a scan on JACAR or in the National Archives catalog, a
    newspaper on Gallica) is cited in its archive's own form above, which carries the archive's kind and nationality.

sigterritoires-nwa-grid:
  title: "How to manage the NW Africa Grid projection with ArcGis and QGis"
  by: Atilio Francois, Blog GIS & Territories (sigterritoires.fr), 13 Aug 2018, updated 17 Oct 2018
  kind: reference
  url: https://www.sigterritoires.fr/index.php/en/how-to-manage-the-nw-africa-grid-projection-with-arcgis-and-qgis/
  rights: Web page, cited for the grid's parameters only
  cite: sigterritoires-nwa-grid
  match: '^sigterritoires-nwa-grid$'
  used_for: tools/grid_ref.py (nwa)
  note: >-
    Gives the British N.W. Africa grid as Lambert, Clarke 1880, lat_0 = lat_1 = 34 N, lon_0 0, k0 0.9994,
    false origin 1,000,000 E 500,000 N, metres. A secondary source: not checked against a War Office
    grid specification. It does not give the 100 km square lettering. A 1943 Tunis plan printed "British
    North West Africa Grid" with grid north 5 deg 41' E of true; this definition gives 5 deg 41' at Tunis.

ams-algeria-50k:
  title: "Algeria 1:50,000 (A.M.S. P741), 1941: sheets 93 Sétif, 94 St.-Arnaud, 95 Châteaudun du Rhumel, 96 Oued Athmenia, 118 Navarin, 119 St.-Donat, 120 Aïn M'lila, 121 Aïn Fakroun"
  by: Army Map Service, U.S. Army, 1941, from the French 1:50,000 sheets; North West Africa grid (1 km lines)
  kind: reference
  of: us
  held: University of Texas Libraries, Perry-Castañeda Library Map Collection (scans), mirrored on Wikimedia Commons (public domain)
  url: https://commons.wikimedia.org/wiki/Category:Maps_of_Algeria_by_the_United_States_Army_Map_Service
  rights: public domain (a U.S. government work)
  cite: ams-algeria-50k/<sheet>
  match: '^ams-algeria-50k/\d+$'
  used_for: >-
    army/stations.csv notes (Battery B's "Ouimene" sought, not found on these eight sheets, OCR'd with macOS Vision and
    checked by eye)

ams-italy-50k:
  title: "Italy 1:50,000 (G.S.G.S. 4229), the Army Map Service's printings, 1943-44"
  by: Geographical Section, General Staff (War Office), from the Italian IGM sheets; printed by the Army Map Service, U.S. Army; South Italy Zone grid
  kind: reference
  of: uk
  held: University of Texas Libraries, Perry-Castañeda Library Map Collection (scans), mirrored on Wikimedia Commons (public domain)
  url: https://commons.wikimedia.org/wiki/File:Map_by_the_US_Army_Map_Service_-_Caserta_-_italy_50k_-_txu-pclmaps-oclc-6540719-caserta-172-2.jpg
  rights: public domain (a U.S. government work)
  cite: ams-italy-50k/<sheet>, e.g. ams-italy-50k/172-II (Caserta)
  match: '^ams-italy-50k/\d+-[IV]+$'
  used_for: army/places.csv (La Fagianeria, read off sheet 172-II Caserta)

gsgs-italy-card:
  title: "Glossary and Reference Card for G.S.G.S. Maps of Italy (O.R. 1376)"
  by: War Office, March 1943
  kind: reference
  of: uk
  held: scan at borneo.name (Borneo maps collection)
  url: https://www.borneo.name/maps/GSGS/glossary_and_reference_card_for_GSGS_maps_of_Italy.pdf
  rights: Crown copyright, expired (published 1943)
  cite: gsgs-italy-card/p<page>, the PDF's page (1 the index to sheets, 2 the conventional signs, 3 the topographical terms and abbreviations)
  match: '^gsgs-italy-card/p[1-3]$'
  link: https://www.borneo.name/maps/GSGS/glossary_and_reference_card_for_GSGS_maps_of_Italy.pdf#page={1}
  used_for: "army/places.csv: the sheets' longitudes are on the meridian of Rome, 12° 27' 7.1\" E (p1); reading Italian map names and abbreviations (Mass.a = Masseria, p3)"

ams-italy-100k:
  title: "Italy 1:100,000 (G.S.G.S. 4164), the Army Map Service's printings, 1941-43"
  by: Geographical Section, General Staff (War Office), from the Italian IGM sheets; printed by the Army Map Service, U.S. Army; South Italy Zone grid (1 km lines)
  kind: reference
  of: uk
  held: University of Texas Libraries, Perry-Castañeda Library Map Collection (scans), mirrored on Wikimedia Commons (public domain)
  url: https://commons.wikimedia.org/wiki/File:Map_by_the_US_Army_Map_Service_-_Santa_Fiora_-_italy_100k_-_txu-pclmaps-oclc-6540635-santa-fiora-129-1941.jpg
  rights: public domain (a U.S. government work)
  cite: ams-italy-100k/<sheet>, e.g. ams-italy-100k/160 (Cassino)
  match: '^ams-italy-100k/\d+$'
  used_for: army/places.csv (Pimpinelli, read off sheet 160 Cassino; Campo Moro, sheet 129 Santa Fiora)

ams-algeria-200k:
  title: "Algeria 1:200,000 (G.S.G.S. 4180; A.M.S. P541), sheets 16 Sétif (2nd edition, War Office 1942) and 27 Batna (2nd GSGS edition 1942, AMS printing 1947)"
  by: War Office, Geographical Section, General Staff; Army Map Service, U.S. Army. Copied from French maps (1927, 1930) with revision from intelligence reports of 1941
  kind: reference
  of: uk
  held: University of Texas Libraries, Perry-Castañeda Library Map Collection (scans), mirrored on Wikimedia Commons (public domain)
  url: https://commons.wikimedia.org/wiki/Category:Maps_of_Algeria_by_the_United_States_Army_Map_Service
  rights: public domain (a U.S. government work; Commons marks it so)
  cite: ams-algeria-200k/<sheet>
  match: '^ams-algeria-200k/(16|27)$'
  used_for: army/places.csv (Fontaine-Chaude station, read off sheet 27 on the North West Africa grid)
  note: >-
    Printed with the North West Africa grid (purple, 10 km lines). The UT site itself is behind a bot check; the Commons
    copies are the same scans (txu-pclmaps-oclc-6543574-setif-16.jpg, -batna-27.jpg).

oss-967:
  title: "Algeria and Tunisia: Principal Highways and Landing Places (Map No. 967, Provisional Edition), 22 August 1942"
  short: OSS map 967
  by: Geography Division, Office of Strategic Services (O.S.S.); reproduced by the OSS Repro. Section
  kind: reference
  of: us
  held: Stanford University Libraries (G8241 .P2 1942 .U5)
  id: vs189tm5539
  url: https://purl.stanford.edu/vs189tm5539
  rights: public domain (Stanford University Libraries)
  cite: oss-967
  match: '^oss-967$'
  used_for: >-
    roads/oss967-primary.geojson (the primary roads, traced by tools/trace_roads.py); the road moves in
    army/routes.csv of Battery C, 62nd CA (AA) and the 67th CA (AA) medical detachment, Feb–Jun 1943; roads/oss967-landings.csv
    (its landing-place arrows, read by tools/oss967_landings.py)
  note: >-
    About 1:3,000,000; primary roads heavy, secondary thin, town rings. The printed 1-degree ticks don't
    agree with the drawing (fitted to them, towns land 11–36 km off; the 7°E tick on the lower edge is
    about 10 km out of line with the rest), so the scan is fitted to 33 of its town rings instead
    (roads/oss967-gcps.csv), 2nd-order polynomial: 3.2 km rms, 3.9 km leave-one-out, worst 12 km (Mascara).

loc-12ag:
  title: HQ Twelfth Army Group situation maps, 6 June 1944 – 26 July 1945 (to accompany the G-3 reports)
  short: 12th Army Group situation map
  by: HQ Twelfth Army Group, G-3; reproduced by the Engineer Reproduction Detachment, 12th Army Group
  kind: record
  of: us
  held: Library of Congress, Geography and Map Division (G5701.S7 svar .A4), World War II Military Situation Maps
  url: https://www.loc.gov/collections/world-war-ii-maps-military-situation-maps-from-1944-to-1945/
  rights: public domain (a U.S. government work; declassified under E.O. 12065, stamped on each sheet)
  cite: loc-12ag/<item>      # the item's id in the Library's address, e.g. loc-12ag/ict21276 (7 March 1945)
  match: '^loc-12ag/(ict\d+)$'
  link: https://www.loc.gov/resource/g5701s.{1}/
  used_for: >-
    fronts/: the front line traced (tools/trace_front.py) and the unit symbols read, one map a day (12ag-1945-03-07 to
    -17, every day: situations as of 1200, G-3 reports nos. 275-285), drawn on the engagement pages as the army
    group's picture; army/stations.csv: the 9th Armored Division's symbol, 12 January - 22 February 1945
  note: >-
    1:1,000,000 outline maps ("Europe (Air) Conical Orthomorphic"), one a day, the front line heavy and ticked on the
    map's own side, US and enemy units by the Army's symbols (enemy boxes hatched); from 10 March 1945 a list of the
    enemy divisions facing the Remagen bridgehead. The US units are the army group's own
    record of its divisions; the enemy's are its intelligence picture that day. The collection is catalogued in
    fronts/sitmaps.csv (tools/loc_sitmaps.py, from the Library's JSON API: 415 days, 6 June 1944 to 26 July 1945).
    The scans are JPEG 2000 on the Library's tile server
    (https://tile.loc.gov/storage-services/service/gmd/gmd5/g5701/g5701s/<item>.jp2), which answers without the bot
    check the www.loc.gov pages put up; its IIIF service serves any part of a sheet at any size.

nara-film:
  title: National Archives Catalog, moving images (one film reel or story per catalogue item)
  kind: record
  of: us
  held: U.S. National Archives and Records Administration (NARA), Motion Picture, Sound and Video Branch
  url: https://catalog.archives.gov/
  rights: Public domain (records of the U.S. government)
  cite: nara-film:<catalog ID>      # e.g. nara-film:75826 (428-NPC-1084)
  match: '^nara-film:(\d+)$'
  link: https://catalog.archives.gov/id/{1}
  used_for: film/clips.csv
  note: >-
    The catalogue gives each film a shot list and a production date, and most have the film itself as an MP4.
    The date is the catalogue's (when it was shot or received), not read off the film.

youtube:
  title: YouTube, an archive's own upload (the channels in film/channels.yml with tier archive)
  kind: press
  url: https://www.youtube.com/
  rights: Linked, not copied; each archive's own terms
  cite: youtube:<video id>      # e.g. youtube:N5q3UAIkc-o (British Pathé, film ID 1083.24)
  match: '^youtube:([A-Za-z0-9_-]{11})$'
  link: https://youtu.be/{1}
  used_for: film/clips.csv
  note: >-
    Only an archive's own channel is cited this way, with the archive's number in clips.csv's archive_id. A
    re-upload of a government film is a finding aid: cite the archive's catalogue item instead. A modern caption
    or narration added to an old film is the uploader's, not the film's.

nara-t1022-2099:
  title: Records of the German Navy, T-1022 roll 2099 (Naval Staff U-boat section, operation charts, Arctic and Mediterranean, 1942-44)
  by: Oberkommando der Kriegsmarine, Seekriegsleitung; filmed by the US Navy (ONI), 1946
  kind: record
  of: de
  held: NARA, RG 242, series "Copies of Records of the German Navy" (naId 315246058); microfilm publication T1022
  id: NAID 337684135
  url: https://catalog.archives.gov/id/337684135
  rights: Public domain (captured records; US government microfilm)
  cite: t1022-2099/f<frame>, e.g. t1022-2099/f0200 (1890 G, Mittelmeer westlicher Teil, situation of 13 XI 42)
  match: '^t1022-2099/f(\d{4})$'
  link: https://catalog.archives.gov/id/337684135?objectPage={1}
  used_for: reference/naval-grid/squares.csv (the Mediterranean grid squares, measured and read), guides/NAVAL-GRID.md
  note: >-
    The frame is the catalog's object page (the TIFF's number, T1022-2099-0NNNN.tif). Operation charts drawn on OKM
    Quadratkarten 1890 G, 1891 G and 1892 G, full scale and "Klein" (1:3,300,000), filmed in lettered sections.
    Frame 729 is a PDF of the whole roll; its OCR is the only text the catalog holds.

schmidt-marinequadrate:
  title: Die Marinequadratsysteme der deutschen Seestreitkräfte. Ein Werkstattbericht aus den Archiven (Stand 19.09.2026)
  by: Ulrich Schmidt
  kind: secondary
  of: de
  held: Zenodo
  id: doi:10.5281/zenodo.22848807
  url: https://doi.org/10.5281/zenodo.22848807
  rights: CC BY-NC-ND 4.0 (cite; don't copy the figures, whose rights lie with the archives named)
  cite: schmidt-mqs/p<page>, e.g. schmidt-mqs/p23
  match: '^schmidt-mqs/p(\d+)$'
  used_for: guides/NAVAL-GRID.md (the grid's structure, jump lines, the irregular CH and CJ, the OKM's instruction on chart 3001)
  note: >-
    Reconstructs the Kaiserliche Marine, Reichsmarine and Kriegsmarine grid systems from the charts in the
    Bundesarchiv (RM 6/KART) and NARA T-1022. Pages are the PDF's printed page numbers.

navalgrid:
  title: Naval Grid Calculator (method page)
  by: navalgrid.com
  kind: reference
  held: navalgrid.com (website)
  url: https://navalgrid.com
  rights: Website; cited, not copied
  cite: navalgrid
  match: '^navalgrid$'
  used_for: guides/NAVAL-GRID.md (the count and kinds of large squares; corner-coordinate storage on the Mercator chart)
  note: >-
    Read from a PDF of the method page saved 30 Oct 2026 (the site's certificate failed to the fetch tool). Its
    Mediterranean square data are not published on the page.

nara-t312:
  title: Records of German Field Commands, Armies (NARA microfilm publication T-312)
  by: German Army (Armeeoberkommandos); filmed for the National Archives
  kind: record
  of: de
  held: NARA, RG 242, series naId 12007587
  url: https://catalog.archives.gov/id/12007587
  rights: Public domain (captured records filmed by the U.S. government)
  cite: t312-<roll>/f<frame>, both four digits, e.g. t312-0090/f0003 (Bezugspunktkarte 1:100000, 4. Ausgabe, Section 5)
  match: '^t312-(\d{4})/f(\d{4})$'
  link: https://catalog.archives.gov/medialz/dc-metro/rg-242/12007587/T312-{1}/T312-{1}-{2}.jpg
  used_for: reference/bezugspunkte (the Bezugspunktkarte, roll 90, A.O.K. 10's attachments for March 1944, naId 333528157); guides/BEZUGSPUNKTE.md
  note: >-
    Frames are the catalog's file numbers (its objectPage). Rolls 88-90 have no OCR; rolls 91-92 (April-May 1944;
    roll 92 is naId 333531002) have.

nara-t314:
  title: Records of German Field Commands, Corps (NARA microfilm publication T-314)
  by: German Army (Generalkommandos); filmed for the National Archives
  kind: record
  of: de
  held: NARA, RG 242, series naId 12004195
  url: https://catalog.archives.gov/id/12004195
  rights: Public domain (captured records filmed by the U.S. government)
  cite: t314-<roll>/f<frame>, both four digits, e.g. t314-0539/f0590 (XIV Panzer Corps, Arko 414's interim report, 15.11.43)
  match: '^t314-(\d{4})/f(\d{4})$'
  link: https://catalog.archives.gov/medialz/dc-metro/rg-242/12004195/T314/T314-{1}/T314-{1}-0{2}.tif
  used_for: reference/bezugspunkte/anchors.csv (the XIV Panzer Corps' reports giving codes with places)
  note: >-
    The frame is the file number in the catalog's frame URL; the counter photographed on each frame differs by a few
    and drifts (roll 539: counter = file + 2). Roll 539 is catalogued in two parts (naIds 317013165, 317014666); the
    XIV Panzer Corps' tactical reports (Taktische Meldungen) are on rolls 539 (Nov 1943) and 543-544
    (Jan-Feb 1944); its daily diary text is not on rolls 538-549.

