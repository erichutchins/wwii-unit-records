# Every archive, series, book, site and dataset these records cite. Hand-edited.
#
# The rule for this repository: cite every source. Each transcribed row carries a citation in its
# `page`, `ref`, `source` or `map` column, written in one of the short forms below (`cite`), and
# tools/check_sources.py checks that every citation in every file resolves to an entry here.
# National Archives items are cited by catalog ID and page; check_sources.py --fetch looks up each
# item's title and series in the catalog and writes them to citations.json (generated).
#
# Fields: title, by (author or creator), held (archive or publisher), id (the source's own
# identifier), url, rights, cite (how rows cite it), match (a regex for `cite`; groups fill `link`),
# link (URL for one cited page), used_for, note. `kind: derived` marks a method rather than an
# outside source (a position worked out from a grid reference); its rows explain themselves.

# ── US records ─────────────────────────────────────────────────────────────────────────────────

nara-catalog:
  title: National Archives Catalog
  held: U.S. National Archives and Records Administration (NARA)
  url: https://catalog.archives.gov/
  rights: Public domain (records of the U.S. government)
  cite: rg<record group>-<catalog ID>/p<page>      # e.g. rg367-74802746/p05
  match: '^rg(\d+)-(\d+)/p(\d+)$'
  link: https://catalog.archives.gov/id/{2}?objectPage={3}
  note: >-
    The page is the catalog's object page (the scan's position in the item). The number after
    "rg" is the record group the item was filed under when it was transcribed; the catalog's own
    title and series for each item are in citations.json. The series are listed below.

nara-war-patrol-reports:
  title: U.S. Submarine War Patrol Reports, 1941–1945
  by: Office of the Chief of Naval Operations
  held: NARA, series 305243; microfilm publication M1752 (scans by Fold3)
  id: NAID 305243
  url: https://catalog.archives.gov/id/305243
  rights: Public domain
  used_for: boats/*/patrol-N/ (positions, depths, layers), engagements/*/notes.csv
  series_of: nara-catalog

nara-war-diaries:
  title: World War II War Diaries, Other Operational Records and Histories
  by: Office of the Chief of Naval Operations
  held: NARA, Record Group 38
  url: https://catalog.archives.gov/
  rights: Public domain
  used_for: ships/dd-700-haynsworth/ (USS Haynsworth's April 1945 war diary); ships/de-221-solar/ (USS Solar's war diaries, Sep 1944 - Oct 1945); commands/comsubpac/ (the submarine force's October 1944 war diary); seabees/ (source wardiary, voyages.csv, voyage_positions.csv)
  series_of: nara-catalog

nara-morning-reports:
  title: Morning Reports, 1912–1946 (Army companies, batteries and detachments)
  by: Adjutant General's Office
  held: NARA, Record Group 64, series 85713825 (online for January 1940 – December 1944)
  id: NAID 85713825
  url: https://catalog.archives.gov/id/85713825
  rights: Public domain
  used_for: army/stations.csv (source mr, regt, div)
  series_of: nara-catalog

nara-muster-rolls:
  title: Muster Rolls of U.S. Navy Ships, Stations, and Other Naval Activities, 1939–1949
  by: Bureau of Naval Personnel
  held: NARA, Record Group 24, series 594996
  id: NAID 594996
  url: https://catalog.archives.gov/id/594996
  rights: Public domain
  used_for: seabees/stations.csv (source muster); ships/dd-700-haynsworth/README.md (forwarding sheets, 1944)
  series_of: nara-catalog
  note: >-
    One file unit per ship or unit. Each quarter's roll lists every man on board; the monthly
    Reports of Changes list men received, transferred, re-rated, or who died. Places appear only on
    the forwarding sheet (often a code name, a Navy number, or "c/o FPO, San Francisco") and in the
    hospitals and bases men were sent to. Navy numbers are decoded with navy-numbers.

ncbhist:
  title: Naval Construction Battalion "Historical Information" sheets (one per battalion)
  by: Bureau of Yards and Docks (typed log cards, 1942–1945); scanned by the Navy Seabee Museum
  held: Naval History and Heritage Command, Navy Seabee Museum, Seabee unit histories
  url: https://www.history.navy.mil/content/history/museums/seabee/explore/seabee-unit-histories.html
  rights: Public domain (U.S. Navy)
  cite: ncbhist-<battalion, 3 digits>/p<PDF page>      # e.g. ncbhist-020/p2
  match: '^ncbhist-(\d{3})/p(\d+)$'
  link: https://www.history.navy.mil/content/dam/museums/Seabee/UnitListPages/NCB/{1}%20NCB.pdf#page={2}
  used_for: seabees/stations.csv (source ncbhist)
  note: >-
    A cover page, then the Bureau of Yards and Docks' typed cards: each battalion's embarkations
    and a dated log of its monthly reports and the letters and dispatches about it. Dates in the
    left margin are when the entry was logged, not when the event happened; the entry's own dates
    are used. The PDFs need a browser User-Agent to download.

bases:
  title: Building the Navy's Bases in World War II, vol. 2
  by: Bureau of Yards and Docks
  held: U.S. Government Printing Office, 1947; HyperWar transcription (ibiblio)
  url: https://www.ibiblio.org/hyperwar/USN/Building_Bases/
  rights: Public domain
  cite: bases-<chapter>      # e.g. bases-25 (the Solomons)
  match: '^bases-(\d+)$'
  link: https://www.ibiblio.org/hyperwar/USN/Building_Bases/bases-{1}.html
  used_for: seabees/stations.csv (source bases)

mcsol:
  title: Marines in the Central Solomons
  by: John N. Rentz, Historical Branch, Headquarters, U.S. Marine Corps
  held: 1952; HyperWar transcription (ibiblio)
  url: https://www.ibiblio.org/hyperwar/USMC/USMC-M-CSol/
  rights: Public domain
  used_for: seabees/stations.csv (source mcsol; cited by the chapter's URL)

navy-numbers:
  title: Navy Numbers (OPNAV 29-P1000, 1949), the fleet post office numbers of World War II bases
  by: Office of the Chief of Naval Operations
  held: Naval History and Heritage Command, online reading room
  url: https://www.history.navy.mil/research/library/online-reading-room/title-list-alphabetically/u/us-navy-abbreviations-of-ww2/navy-numbers.html
  rights: Public domain
  used_for: seabees/stations.csv notes (Navy 10 Aiea, 60 Russell Islands, 250 Munda, 3237 Eniwetok, 3245 Saipan, 3256 Okinawa)

ok45th:
  title: 45th Infantry Division unit histories and journals (the 106th AAA AW Bn's history and journal, July 1944 – May 1945; the 189th FA Bn's history)
  held: 45th Infantry Division Museum collection, Metropolitan Library System of Oklahoma County (ContentDM collection ok45th)
  url: https://cdm17494.contentdm.oclc.org/digital/collection/ok45th/
  rights: "Credit: Courtesy of 45th Infantry Division Museum and the Metropolitan Library System of Oklahoma County."
  cite: ok45th-<item ID>/p<page of the PDF>
  match: '^ok45th-(\d+)/p(\d+)$'
  link: https://cdm17494.contentdm.oclc.org/digital/collection/ok45th/id/{1}
  used_for: army/stations.csv (source btry, bn), army/actions.csv, engagements/neuburg-1945-04-26/

cabn106:
  title: Historical Records – 106th AAA AW Bn, December 1943 (file CABN-106-0.3)
  by: the battalion; filed by the War Department Records Branch, A.G.O., Historical Records Section
  held: >-
    NARA, RG 407 (WWII Operations Reports), file CABN-106-0.3, not online. A scan of the A.G.O. file
    copy (11 pages, declassified NND 735017) was posted to the ww2aircraft.net forum as
    "106th AA AW Bn (Henry Arnold cmding) Dec 43.pdf".
  id: CABN-106-0.3
  url: https://ww2aircraft.net/forum/attachments/106th-aa-aw-bn-henry-arnold-cmding-dec-43-pdf.576104/
  cite: cabn106-<yyyy-mm>/p<page of the scan>
  match: '^cabn106-(\d{4}-\d{2})/p(\d+)$'
  used_for: army/README.md (where the 106th's records after May 1945 should be)
  note: >-
    The same month as ok45th item 17545 but a fuller copy: it adds the S-2 summary (p5) and the daily
    action reports to the 35th AAA Brigade (pp6-10), and lacks the transmittal and casualty report.
    The file number is on p1 (margin) and the folder cover (p11).

aar3:
  title: After Action Report, Third US Army, 1 August 1944 – 9 May 1945, Vol. II, Staff Section Reports
  by: Headquarters, Third United States Army
  held: Google Books, full view
  id: Google Books ee9mAAAAMAAJ
  url: https://books.google.com/books?id=ee9mAAAAMAAJ
  rights: Public domain (U.S. government publication)
  cite: aar3/p<page of the downloaded PDF>
  match: '^aar3/p(\d+)$'
  used_for: army/stations.csv (source aar, div)

etoob:
  title: "Order of Battle of the United States Army, World War II: European Theater of Operations: Divisions"
  by: Office of the Theater Historian, Headquarters, U.S. Forces, European Theater (Paris, December 1945)
  held: >-
    U.S. Army Center of Military History, web edition (history.army.mil/documents/ETO-OB/, one page per
    division), now refused to scripts; read through the Internet Archive's copies
  id: CMH web edition, ETO-OB
  url: https://web.archive.org/web/20141231105407/http://www.history.army.mil/documents/ETO-OB/etoob-toc.htm
  rights: Public domain (U.S. government publication)
  cite: etoob-<division page, e.g. 9AD>/p<printed page>      # e.g. etoob-9AD/p502; p503-504 where the break isn't marked
  match: '^etoob-(\w+)/p(\d+)(?:-(\d+))?$'
  link: https://web.archive.org/web/20140115200945/http://www.history.army.mil/documents/ETO-OB/{1}-ETO.htm
  used_for: army/stations.csv (source div), army/relations.csv (assignments and attachments to corps and armies)
  note: >-
    Compiled at the end of the war by the theater's combat historians. For each division: command and
    staff, statistics, organic units, attachments and detachments with dates, its assignments and
    attachments to corps, armies and army groups by date, and its command posts by date. The web edition
    is the manuscript "with only those limited modifications required to adapt to the World Wide Web"; the
    printed page numbers are marked in it ("[page 502]"), and rows cite those. Inside a long table the web edition
    drops the breaks and lists them at its foot ("[pages 504 (through 6 Mar 45)-505]"); a row whose page that leaves
    uncertain cites the range (etoob-9AD/p503-504).

hist894:
  title: 894th Anti-Aircraft Artillery Automatic Weapons Battalion, History and Combat Diary, 1940–1945
  by: the battalion (mimeographed in Germany after V-E Day)
  held: A 2012 retyped copy with the original roll call; not online
  cite: hist894/p<page of the copy>
  match: '^hist894/p(\d+)$'
  used_for: army/stations.csv (source hist), the medical detachment's 1945 moves

gi9ad:
  title: "The 9th: The Story of the 9th Armored Division (G.I. Stories booklet, 1945)"
  held: Lone Sentry
  url: https://www.lonesentry.com/gi_stories_booklets/9tharmored/
  rights: Public domain (U.S. Army publication)
  cite: gi9ad
  match: '^gi9ad$'
  used_for: army/stations.csv (9th Armored Division positions)

eucmh60aib:
  title: "9th Armored Division, 60th Armored Infantry Battalion: After Action Reports, October 1944 - March 1945, as transcribed by EUCMH"
  by: The battalion's commanding officer (the reports are signed by its Lt Col); transcribed by EUCMH (European Center of Military History)
  held: >-
    EUCMH's web page (eucmh.be, 17 Apr 2018), a transcription of the battalion's monthly after action reports
    (original: NARA RG 407, WWII Operations Reports); the site is gone, so read through the Internet Archive's copy
    (cached at sources/etoob/eucmh-60aib-aar.html). Not checked against the original: a transcription, with
    its typing errors (some dates and place spellings are wrong or inconsistent within a report)
  url: https://web.archive.org/web/20190817132207/https://www.eucmh.be/2018/04/17/9th-armored-division-60-aib-aar-10-1944-03-1945/
  rights: Unit report (U.S. government record); the transcription is EUCMH's
  cite: eucmh60aib/<yyyy-mm>      # the month's report on that page, e.g. eucmh60aib/1945-02; the page has no page numbers
  match: '^eucmh60aib/(\d{4}-\d{2})$'
  link: https://web.archive.org/web/20190817132207/https://www.eucmh.be/2018/04/17/9th-armored-division-60-aib-aar-10-1944-03-1945/
  used_for: army/stations.csv (source uaar, the 60th Armored Infantry Battalion's own position)

wiki9ad:
  title: 9th Armored Division (United States)
  held: Wikipedia
  url: https://en.wikipedia.org/wiki/9th_Armored_Division_(United_States)
  rights: CC BY-SA 4.0
  cite: wiki9ad
  match: '^wiki9ad$'
  used_for: army/stations.csv (9th Armored Division positions); secondary

frupac:
  title: FRUPAC War Map Collection
  by: Fleet Radio Unit Pacific (FRUPAC)
  held: National Museum of the Pacific War, via the Portal to Texas History (University of North Texas Libraries)
  url: https://texashistory.unt.edu/explore/collections/FRUPAC/
  rights: CC BY-NC-ND. Linked and read in the zoom viewer, never copied.
  cite: metapth<ark ID>
  match: '^(metapth\d+)$'
  link: https://texashistory.unt.edu/ark:/67531/{1}/
  used_for: boats/ss-385-bang/patrol-N/frupac.csv

# ── French and Italian records ─────────────────────────────────────────────────────────────────

gallica:
  title: Gallica, the digital library of the Bibliothèque nationale de France (newspapers)
  held: Bibliothèque nationale de France
  url: https://gallica.bnf.fr/
  rights: Public domain (the 1940s Algerian dailies); free to view
  cite: gallica:<issue ark>, e.g. gallica:bpt6k75870445 (L'Écho d'Alger, 13 May 1943)
  match: '^gallica:(bpt6k\w+)(?:/f(\d+))?$'
  link: https://gallica.bnf.fr/ark:/12148/{1}
  used_for: army/actions.csv notes (L'Écho d'Alger on the Algiers raids of May 1943)
  note: >-
    Titles: L'Écho d'Alger (cb327596899, 1912–1955), L'Écho d'Oran (cb32759772v; none for 1941–42 or
    1944–45, and 1943 incomplete, without January or February), Oran-matin
    (cb32829421p; 1935–36 only); a title's issues by date are at https://gallica.bnf.fr/ark:/12148/<title ark>/date.
    Gallica's text export is the paper's OCR without page breaks, so an issue is cited by its ark until
    a page (/fN) is read on the image. The press in Algeria was censored in 1942–43.

lastampa:
  title: La Stampa (Turin), daily, the Internet Archive's mirror of the paper's historical archive
  held: La Stampa, Archivio Storico (archiviolastampa.it); mirrored at archive.org, one item per issue
  url: https://archive.org/search?query=lastampa_1943
  rights: Free to view
  cite: lastampa:<YYYY-MM-DD>/p<page>, e.g. lastampa:1943-01-22/p1 (Bulletin no. 971)
  match: '^lastampa:(\d{4}-\d{2}-\d{2})(?:/p(\d+))?$'
  link: https://archive.org/details/lastampa_{1}
  used_for: army/actions.csv notes (the Italian Supreme Command's bulletins and the German communiqués on the Algerian raids)
  note: >-
    Each issue prints the Italian Supreme Command's daily bulletin (issued the afternoon before, so
    "questa notte" is the night before that) and usually the German High Command's communiqué. They are
    the Axis side's claims, not facts. Under the Salò Republic from September 1943. The OCR runs the
    columns together: find the bulletin by its number, then read it on the page image.

skl-ktb:
  title: War Diary, German Naval Staff Operations Division (Kriegstagebuch der Seekriegsleitung, Teil A), 1943
  by: Seekriegsleitung; translated by the US Office of Naval Intelligence
  held: Internet Archive (the ONI translation, one item per volume)
  url: https://archive.org/details/wardiarygermann451943germ
  rights: Public domain (US government translation)
  cite: skl:<volume>/p<page>, e.g. skl:46/p38 (4 June 1943)
  match: '^skl:(\d+)/p(\d+)$'
  link: https://archive.org/details/wardiarygermann{1}1943germ
  used_for: army/actions.csv notes (the German side of the Algiers raids, May–June 1943)
  note: >-
    The Naval Staff's daily summary includes the Luftwaffe's operations it was told of, with numbers of aircraft and
    losses, but rarely the units. The link pattern holds for the 1943 volumes (45 = May, 46 = June).

alieuomini:
  title: Ali e Uomini (alieuomini.it), catalogue of Italian aircraft and their units
  url: https://www.alieuomini.it/
  rights: Free to view
  cite: alieuomini:<page slug>, e.g. alieuomini:piaggio_p_b,71
  match: '^alieuomini:(\S+)$'
  link: https://www.alieuomini.it/catalogo/dettaglio_catalogo/{1}.html
  used_for: army/actions.csv notes (the 274ª Squadriglia's P.108B raid on Oran, 20 Jan 1943)
  note: >-
    Secondary. Its P.108B page cites G. Garello, Il Piaggio P.108 (Bizzarri, 1973), Dimensione Cielo 6 (1974) and
    Monografie Aeronautiche Italiane 53/54 (1985); other web accounts likely go back to Garello, so they count once.

tna:
  title: The National Archives (UK), Kew
  held: The National Archives, Kew
  url: https://discovery.nationalarchives.gov.uk/
  rights: Crown copyright; the digitised AIR 27 files are free to download after signing in
  cite: tna:<reference>/p<page of the downloaded PDF>, e.g. tna:AIR 27/1027/38/p2
  match: '^tna:([A-Z]+ \d+/\d+(?:/\d+)?)(?:/p(\d+))?$'
  link: https://discovery.nationalarchives.gov.uk/results/r?_q={1}
  used_for: army/actions.csv notes (No. 153 Squadron RAF's operations record book, AIR 27/1027, on the Algiers raids)
  note: >-
    AIR 27 is the RAF squadrons' operations record books: Form 540 (summary of events) and Form 541 (detail of
    work carried out: each sortie's aircraft, crew, times and result). The page is the downloaded PDF's, not the
    book's own page number. Claims are the squadron's claims.

# ── Japanese records ───────────────────────────────────────────────────────────────────────────

jacar:
  title: Japan Center for Asian Historical Records (JACAR)
  by: National Archives of Japan; records of the National Institute for Defense Studies, Ministry of Defense
  url: https://www.jacar.archives.go.jp/
  rights: Free to view; cite the reference code
  cite: jacar:<reference code>, with the page in the row's page column
  match: '^jacar:(C\d{11})( p\d+)?$'
  link: https://www.jacar.archives.go.jp/das/image/{1}
  used_for: boats/*/patrol-N/japanese.csv, reference/jgrid/anchors.csv

sosho:
  title: 戦史叢書 (Senshi Sōsho, the official war history)
  by: 防衛庁防衛研修所戦史室 (War History Office, National Defense College)
  held: Asagumo Shimbunsha, 1966–1980
  cite: sosho:<volume>, with the page in the row's page column (vol. 56 is 海軍捷号作戦 2)
  match: '^sosho:(\d{3})$'
  used_for: reference/jgrid/anchors.csv

combinedfleet:
  title: Imperial Japanese Navy Page (combinedfleet.com), Tabular Records of Movement
  by: Bob Hackett, Sander Kingsepp and others
  url: http://www.combinedfleet.com/
  cite: combinedfleet:<page name>
  match: '^combinedfleet:(\S+)$'
  link: http://www.combinedfleet.com/{1}.htm
  used_for: boats/ss-385-bang/patrol-N/japanese.csv; secondary, compiled from Japanese and US records

irons:
  title: "Phalanx Against the Divine Wind: Protecting the Fast Carrier Task Force During World War 2"
  by: Martin Irons
  held: Merriam Press, 2017 (514 pp.)
  url: https://www.kamikazeimages.net/books/ships/haynsworth/index.htm
  cite: irons
  match: '^irons$'
  link: https://www.kamikazeimages.net/books/ships/haynsworth/index.htm
  chicago_note: "Martin Irons, *Phalanx Against the Divine Wind: Protecting the Fast Carrier Task Force During World War 2* (Merriam Press, 2017)"
  chicago_short: "Irons, *Phalanx*"
  used_for: engagements/haynsworth-1945-04-06/; secondary, quoting the ships' reports and the crew's letters and diaries.
    Rows cite it in Chicago short form ("Irons, Phalanx, 327–30"); most page numbers are not yet recorded

morison-v14:
  title: "History of United States Naval Operations in World War II, vol. 14: Victory in the Pacific, 1945"
  by: Samuel Eliot Morison
  held: Little, Brown, 1960; University of Illinois Press reprint (Google Books PfrgDPhLkqcC)
  url: https://books.google.com/books?id=PfrgDPhLkqcC
  cite: in notes, Morison, vol. 14, p. <page>
  used_for: ships/dd-700-haynsworth/ (16 Feb 1945 picket boats, p. 24 and n. 5); secondary

herder-siege:
  title: "The Naval Siege of Japan 1945: War Plan Orange Triumphant"
  by: Brian Lane Herder
  held: Osprey (Bloomsbury), 2020 (Google Books WD3JDwAAQBAJ)
  url: https://books.google.com/books?id=WD3JDwAAQBAJ
  cite: in notes, Herder, Naval Siege of Japan, p. <page>
  used_for: ships/dd-700-haynsworth/ (16 Feb 1945 picket boats, p. 26 captions to NARA 80-G-308577 and 80-G-308465); secondary

usshaynsworth-org:
  title: USS Haynsworth (DD-700) Association website (usshaynsworth.org), as archived
  by: the USS Haynsworth Association (crew photos, collections, memorials, newsletters)
  held: Internet Archive, Wayback Machine (the site itself is no longer online)
  url: https://web.archive.org/web/2026/http://usshaynsworth.org/
  rights: The Association's and the contributors' (photos lent by crew and families); cite and link, don't republish
  cite: haynsworth-org:<timestamp>/<path>      # e.g. haynsworth-org:20230208204038/dd700-photos/prisoners/prisoners.html
  match: '^haynsworth-org:(\d{4,14})/(\S+)$'
  link: https://web.archive.org/web/{1}/http://usshaynsworth.org/{2}
  used_for: ships/dd-700-haynsworth/ (16 Feb 1945 picket boats and the prisoners)
  note: >-
    Downloaded with tools/wayback.py into sources/wayback/usshaynsworth.org/ (not committed);
    manifest.tsv there gives each file's capture timestamp. Secondary: crew recollections and
    photos, mostly postwar (the ship served until 1970); dates and places in captions are checked
    against the ship's own records before they are used.

# ── Recognition plates (silhouettes/silhouettes.yml) ───────────────────────────────────────────

cincpac-105-45:
  title: "CINCPAC-CINCPOA Bulletin 105-45, Japanese Operational Aircraft (TAIC silhouettes)"
  by: Commander in Chief, U.S. Pacific Fleet and Pacific Ocean Areas
  held: April 1945 edition, Naval History and Heritage Command online reading room; July 1945 revision on HyperWar
  url: https://www.ibiblio.org/hyperwar/USN/ref/KYE/CINCPAC-105-45/
  rights: Public domain (U.S. government publication)
  used_for: silhouettes/silhouettes.yml (JUDY 33, July 1945 revision p. 23; DINAH 43, July 1945 revision pp. 43-44; ZEKE 52, April 1945 edition p. 1)

commons-p108:
  title: 'Piaggio P.108.svg: a three-view drawing of the Piaggio P.108B'
  by: Kaboldy (Wikimedia Commons user), 2013, "own work"
  held: Wikimedia Commons
  url: https://commons.wikimedia.org/wiki/File:Piaggio_P.108.svg
  rights: CC BY-SA 3.0 (https://creativecommons.org/licenses/by-sa/3.0); attribution required, adaptations share alike
  used_for: silhouettes/silhouettes.yml (p108; the traced silhouette is an adaptation and carries CC BY-SA 3.0)
  note: >-
    A modern drawing, not a wartime recognition plate, used because no plate of the P.108 was found (FM 30-30
    has none). Traced from the SVG's heavier outline strokes (detail lines, propeller discs and the antenna
    dropped; the outside flood-filled), then with tools/trace_silhouette.py. It prints no dimensions. The file page (read 28 Oct 2026)
    gives its source as "own work" and names no reference drawings, so its accuracy can't be traced further.

princeton-amsalger:
  title: Algeria, Alger and vicinity (uncontrolled mosaic), sheet 3 of 7, 1:13,040
  by: Army Map Service, U.S. Army, 1942 (aerial photography by the R.A.F., Jan 1942; revision from air photographs 8/41 and intelligence reports, 1941)
  held: Princeton University Library (scan), via its IIIF image server
  url: https://maps.princeton.edu/catalog/princeton-bk128c659
  rights: Princeton marks its WWII Army Map Service scans "No Known Copyright"; a U.S. government work
  cite: princeton-amsalger
  match: '^princeton-amsalger$'
  used_for: tools/grid_ref.py nwa (the grid's printed definition and the worked reference Mon Rouge = H743072); engagements/algiers-1943 landmarks
  note: >-
    Prints "N. W. Africa Zone Grid (Purple): Lambert Conical Orthomorphic, Clarke 1880, origin 34 N and Greenwich
    Meridian, false co-ordinates of origin 1,000,000 meters East, 500,000 meters North", and a worked example (Mon
    Rouge, letter H, reference H743072). Read 28 Oct 2026 at full resolution from
    https://iiif-cloud.princeton.edu/iiif/2/6a%2Fa6%2F7b%2F6aa67b79e33a47f88e983a25649de97e%2Fintermediate_file

fm-4-155:
  title: FM 4-155, Coast Artillery Field Manual, Antiaircraft Artillery, Reference Data (1940)
  by: War Department
  held: Internet Archive
  url: https://archive.org/details/FM_4_155_S_A_A_A_R_D_1940
