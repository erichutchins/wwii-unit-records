  title: Headquarters III Corps, After Action Report, March 1945 (narrative, G-2 report, engineer journal and other annexes)
  by: Headquarters, III Corps
  kind: record
  of: us
  held: >-
    A 134-page PDF scan of the typescript on the 284th Combat Engineers association's site. The original is
    presumably in NARA RG 407 (WWII Operations Reports), III Corps files; the scan doesn't say, and that isn't checked
  url: https://284thcombatengineers.com/documents/IIICorpsAARMar1945.pdf
  rights: Public domain (U.S. Army record)
  cite: iiicorps-aar-1945-03/p<page of the PDF>      # e.g. iiicorps-aar-1945-03/p72; the printed page goes in the row's note
  match: '^iiicorps-aar-1945-03/p(\d+)$'
  link: https://284thcombatengineers.com/documents/IIICorpsAARMar1945.pdf#page={1}
  short: III Corps AAR, March 1945
